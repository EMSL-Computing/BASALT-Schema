---
# =============================================================================
# Enzyme Activity   Ingest Validation Schema
# =============================================================================
# Source class:  EnzymeProduct (products.yaml)
# Analysis type: "enzyme" (lims_processed_data_schema.yaml AnalysisTypeEnum)
# Measure level: Single (no replicates)
# CSV output:    Beta_Glucosidase_ug_pNP_per_g_per_h, flag_beta_glucosidase
#                (soil_biochemical_properties_schema.yaml)
# Last Updated:  2026-02-25
# =============================================================================

id: https://w3id.org/MONet/analysis-api-schema/enzyme
name: enzyme_schema
title: MONet Enzyme Activity Ingest Schema
description: |-
  Ingest validation schema for EnzymeProduct.
  Describes the product_values payload for analysis_type = "enzyme".
  Currently covers beta-glucosidase only.  
license: MIT

prefixes:
  analysis_api_schema: https://w3id.org/MONet/analysis-api-schema/
  linkml: https://w3id.org/linkml/

default_prefix: enzyme_schema
default_range: string

imports:
  - linkml:types

enums:

  ProcessedDataFlagEnum:
    description: Mirrors processeddataflag in enums.yaml.
    permissible_values:
      Below_Detection:
      Below_Reporting_Limit:
      High_Background:
      Out_of_Range:
      Outlier:
      Data_not_available:
      Failed_QC:
      Insufficient_Material:

slots:

  flag:
    description: QC flag for this measurement.
    range: ProcessedDataFlagEnum
    required: false

classes:

  EnzymeProductValues:
    description: |-
      Enzyme activity product values. One record per core section.
    slots:
      - flag
    slot_usage:
      flag:
        description: |-
          QC flag for the enzyme activity measurement.
          CSV column: flag_beta_glucosidase
    attributes:

      beta_glucosidase_ug_pnp_per_g_per_h:
        description: |-
          Beta-glucosidase activity in µg para-nitrophenol (pNP) per gram dry soil per hour.
          Units: µg pNP g⁻¹ h⁻¹
          CSV column: Beta_Glucosidase_ug_pNP_per_g_per_h
        range: double
        required: false
        # minimum_value: 0   commented out; negative values possible in background-subtracted assays

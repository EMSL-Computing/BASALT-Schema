      flag_Bulk_density:
        description: |-
          Data quality flag for bulk density; blank if no flag. See Flag_Definitions.
          Source: BulkDensityProduct from canonical schema.
          Reported in: FY23, FY24, FY25.
        range: string
        required: false

      flag_TC:

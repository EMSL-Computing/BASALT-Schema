      # Not in the lab column sheet (Column_Descriptions.xlsx); kept as-is.
      Replicate:
        description: |-
          Replicate number for the sample (L1 data only).
          For analyses with technical replicates (biomass, nitrogen, phosphorus, WEOM, HClExtOM (formerly MAOM), GWC),

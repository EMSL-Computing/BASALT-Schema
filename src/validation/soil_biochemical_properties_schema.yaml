---
# =============================================================================
# Soil Biochemical Properties CSV Schema
# =============================================================================
# 
# CONTEXT and Purpose:
# - Documentation and communication tool for the Soil_BioChemical_properties.csv file generaetd by: the BASALT zip-download service (zip_download_blueprint.py)
# - Reference for understanding column names and units
# - NOT used for validation (no min/max constraints included)
# - Data levels: L2 (sample averages) or L1 (replicate-level data)
# - This schema is derived from the BASALT Schema as the source of truth https://emsl-computing.github.io/BASALT-Schema
# - Column names, descriptions, and units follow the lab column sheet
#   (docs/Column_Descriptions 1.xlsx, Biogeochemistry tab); units are UCUM codes
#   in unit.ucum_code
#
# This file should be updated when:
# - Column names are changed in zip_download_blueprint.py
# - New analytical methods/columns are added
# - Unit definitions or descriptions are updated in the canonical schema
##
# NOTES:
# - L1 data includes a "Replicate" column; L2 data does not
# - Some columns may be empty upon download if specific analyses were not performed
# - Flag columns indicate data quality concerns
#
# Last Updated: 2026-10-28
# =============================================================================

id: https://emsl-computing.github.io/BASALT-Schema/soil-biochemical-properties
name: soil_biochemical_properties
title: MONet Soil Biochemical Properties CSV Schema
description: |-
  Schema for the aggregated Soil_BioChemical_properties.csv file generated by the
  MONet Data Portal ZipDownloader. This file contains integrated soil biogeochemical
  analysis data across multiple analytical methods and measurements.
license: MIT

prefixes:
  basalt_schema: https://emsl-computing.github.io/BASALT-Schema/
  linkml: https://w3id.org/linkml/

default_prefix: soil_biochemical_properties
default_range: string

imports:
  - linkml:types

classes:
  
  SoilBioChemicalProperties:
    description: |-
      A row in the Soil_BioChemical_properties.csv file representing aggregated
      biogeochemical analysis results for a single soil sample. Each row combines
      data from multiple analytical methods (pH, texture, nutrients, biomass, etc.)
      into a unified record.
    attributes:
      Proposal_ID:
        description: |-
          Identifier of proposal, XXXXX.
          Reported in: FY23, FY24, FY25.
        range: integer
        required: true

      Sampling_Set:
        description: |-
          Sampling set.
          Reported in: FY23, FY24, FY25.
        range: integer
        required: true

      Core_Section:
        description: |-
          Top or bottom layer of each soil core, TOP or BTM.
          Reported in: FY23, FY24, FY25.
        range: string
        required: true

      Sample_Name:
        description: |-
          The combination of Proposal ID, Sampling set, and Core section.
          Example: 60881_1_B
          Reported in: FY23, FY24, FY25.
        range: string
        required: true

      Bulk_density_g_per_cm3:
        description: |-
          Bulk density (g per cm3 soil).
          Source: BulkDensityProduct.bulk_density from canonical schema.
          Reported in: FY23, FY24, FY25.
          Replicates: 1.
        range: double
        required: false
        unit:
          ucum_code: g/cm3

      Total_Carbon_percent:
        description: |-
          Total carbon content (weight percent).
          Source: ElementalAnalysisProduct.total_carbon from canonical schema.
          Reported in: FY23, FY24.
          Replicates: 1.
        range: double
        required: false
        unit:
          ucum_code: '%'

      Total_Nitrogen_percent:
        description: |-
          Total nitrogen content (weight percent).
          Source: ElementalAnalysisProduct.total_nitrogen from canonical schema.
          Reported in: FY23, FY24.
          Replicates: 1.
        range: double
        required: false
        unit:
          ucum_code: '%'

      Total_Sulfur_percent:
        description: |-
          Total sulfur content (weight percent).
          Source: ElementalAnalysisProduct.total_sulfur from canonical schema.
          Reported in: FY23.
          Replicates: 1.
        range: double
        required: false
        unit:
          ucum_code: '%'

      Beta_Glucosidase_ug_pNP_per_g_per_h:
        description: |-
          Beta-glucosidase activity (ug pNP per g soil per h).
          Source: EnzymeProduct.beta_glucosidase_ug_pnp_per_g_per_h from canonical schema.
          Reported in: FY23, FY24.
          Replicates: 1.
        range: double
        required: false
        unit:
          ucum_code: 'ug{pNP}/g/h'

      GWC_percent:
        description: |-
          Gravimetric water content (percent).
          Source: GWCMoistureProduct.gwc_percent from canonical schema.
          GWC = (wet_mass - dry_mass) / dry_mass x 100
          L2 data: average across replicates
          L1 data: individual replicate values
          Reported in: FY23, FY24, FY25.
          Replicates: 3.
        range: double
        required: false
        unit:
          ucum_code: '%'

      HClExtOM_TOC_mg_per_kg:
        description: |-
          HCl-extractable organic carbon content (mg C per kg soil).
          Source: HClExtOMProduct.total_organic_carbon from canonical schema.
          L2 data: average across replicates
          L1 data: individual replicate values
          Reported in: FY23, FY24.
          Replicates: 3.
        range: double
        required: false
        unit:
          ucum_code: 'mg{C}/kg'

      HClExtOM_TN_mg_per_kg:
        description: |-
          HCl-extractable total nitrogen content (mg N per kg soil).
          Source: HClExtOMProduct.total_nitrogen from canonical schema.
          L2 data: average across replicates
          L1 data: individual replicate values
          Reported in: FY23, FY24.
          Replicates: 3.
        range: double
        required: false
        unit:
          ucum_code: 'mg{N}/kg'

      Ca_meq_per_100g:
        description: |-
          Calcium content (milliequivalents per 100 grams of soil).
          Source: IonsAnalysisProduct.calcium from canonical schema.
          Reported in: FY23, FY24, FY25.
          Replicates: 1.
        range: double
        required: false
        unit:
          ucum_code: meq/(100.g)

      Mg_meq_per_100g:
        description: |-
          Magnesium content (milliequivalents per 100 grams of soil).
          Source: IonsAnalysisProduct.magnesium from canonical schema.
          Reported in: FY23, FY24, FY25.
          Replicates: 1.
        range: double
        required: false
        unit:
          ucum_code: meq/(100.g)

      Na_meq_per_100g:

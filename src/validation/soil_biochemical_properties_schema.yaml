---
# =============================================================================
# Soil Biochemical Properties CSV Schema
# =============================================================================
# 
# CONTEXT and Purpose:
# - Documentation and communication tool for the Soil_BioChemical_properties.csv file generaetd by: the BASALT zip-download service (zip_download_blueprint.py)
# - Reference for understanding column names and units
# - NOT used for validation (no min/max constraints included)
# - Data levels: L2 (sample averages) or L1 (replicate-level data)
# - This schema is derived from the BASALT Schema as the source of truth https://w3id.org/MONet/basalt-schema
# - and therefore column names are faithful to the canonical schema, not the zipdownloader as of last update
#
# This file should be updated when:
# - Column names are changed in zip_download_blueprint.py
# - New analytical methods/columns are added
# - Unit definitions or descriptions are updated in the canonical schema
# - the ion units meq_per_100g are currently out of step with the source of truth but this should be reconciled soon.
##
# NOTES:
# - L1 data includes a "Replicate" column; L2 data does not
# - Some columns may be empty upon download if specific analyses were not performed
# - Flag columns indicate data quality concerns
#
# Last Updated: 2026-01-21
# =============================================================================

id: https://w3id.org/MONet/basalt-schema/soil-biochemical-properties
name: soil_biochemical_properties
title: MONet Soil Biochemical Properties CSV Schema
description: |-
  Schema for the aggregated Soil_BioChemical_properties.csv file generated by the
  MONet Data Portal ZipDownloader. This file contains integrated soil biogeochemical
  analysis data across multiple analytical methods and measurements.
license: MIT

prefixes:
  basalt_schema: https://w3id.org/MONet/basalt-schema/
  linkml: https://w3id.org/linkml/

default_prefix: soil_biochemical_properties
default_range: string

imports:
  - linkml:types

classes:
  
  SoilBioChemicalProperties:
    description: |-
      A row in the Soil_BioChemical_properties.csv file representing aggregated
      biogeochemical analysis results for a single soil sample. Each row combines
      data from multiple analytical methods (pH, texture, nutrients, biomass, etc.)
      into a unified record.
    attributes:
      
      # Core Sample Identifiers
      Sample_Name:
        description: |-
          Composite identifier in format: {Proposal_ID}_{Sampling_Set}_{Core_Section}
          Example: 60881_1_B
          This serves as the primary sample identifier in the deliverable.
        range: string
        required: true
        
      Replicate:
        description: |-
          Replicate number for the sample (L1 data only).
          For analyses with technical replicates (biomass, nitrogen, phosphorus, WEOM, MAOM, GWC),
          this indicates which replicate measurement this row represents.
          Only present when l1_checked=True flag is set during download.
        range: integer
        required: false
        
      Proposal_ID:
        description: |-
          The 5-digit EMSL user proposal/project ID.
          Corresponds to the EMSL project under which the sample was collected and analyzed.
        range: integer
        required: true
        
      Sampling_Set:
        description: |-
          Identifier for the sampling set or campaign number.
          Groups samples collected together as part of the same sampling event or study.
        range: integer
        required: true
        
      Core_Section:
        description: |-
          The vertical section of the soil core from which this sample was taken.
          Common values: TOP, MID, BTM (top, middle, bottom sections of core).
          Typically represented as single letter: T, M, B.
        range: string
        required: true
      
      # pH Measurements (pHProduct)
      pH:
        description: |-
          Soil pH measurement (pH units).
          Source: pHProduct class from canonical schema.
        range: double
        required: false
      
      # Microbial Biomass (MicrobialBiomassProduct)
      MBC_mg_per_kg:
        description: |-
          Microbial Biomass Carbon in milligrams per kilogram of soil (mg/kg).
          Source: MicrobialBiomassProduct.mbc_id from canonical schema.
          L2 data: average across replicates
          L1 data: individual replicate values
        range: double
        required: false
        
      MBN_mg_per_kg:
        description: |-
          Microbial Biomass Nitrogen in milligrams per kilogram of soil (mg/kg).
          Source: MicrobialBiomassProduct.mbn_id from canonical schema.
          L2 data: average across replicates
          L1 data: individual replicate values
        range: double
        required: false
      
      # Ion Analysis (IonsAnalysisProduct)
      SO4_S_mg_per_kg:
        description: |-
          Sulfate-Sulfur (SO4-S) in milligrams per kilogram of soil (mg/kg).
          Source: IonsAnalysisProduct.sulfate_id from canonical schema.
        range: double
        required: false
        
      B_mg_per_kg:
        description: |-
          Boron (B) in milligrams per kilogram of soil (mg/kg).
          Source: IonsAnalysisProduct.boron_id from canonical schema.
        range: double
        required: false
        
      Zn_mg_per_kg:
        description: |-
          Zinc (Zn) in milligrams per kilogram of soil (mg/kg).
          Source: IonsAnalysisProduct.zinc_id from canonical schema.
        range: double
        required: false
        
      Mn_mg_per_kg:
        description: |-
          Manganese (Mn) in milligrams per kilogram of soil (mg/kg).
          Source: IonsAnalysisProduct.manganate_id from canonical schema.
        range: double
        required: false
        
      Cu_mg_per_kg:
        description: |-
          Copper (Cu) in milligrams per kilogram of soil (mg/kg).
          Source: IonsAnalysisProduct.copper_id from canonical schema.
        range: double
        required: false
        
      Fe_mg_per_kg:
        description: |-
          Iron (Fe) in milligrams per kilogram of soil (mg/kg).
          Source: IonsAnalysisProduct.iron_id from canonical schema.
        range: double
        required: false
        
      Ca_meq_per_100_g:
        description: |-
          Calcium (Ca) in milliequivalents per 100 grams of soil (meq/100g).
          Source: IonsAnalysisProduct.calcium_id from canonical schema.
        range: double
        required: false
        
      Mg_meq_per_100_g:
        description: |-
          Magnesium (Mg) in milliequivalents per 100 grams of soil (meq/100g).
          Source: IonsAnalysisProduct.magnesium_id from canonical schema.
        range: double
        required: false
        
      Na_meq_per_100_g:
        description: |-
          Sodium (Na) in milliequivalents per 100 grams of soil (meq/100g).
          Source: IonsAnalysisProduct.sodium_id from canonical schema.
        range: double
        required: false
        
      K_meq_per_100_g:
        description: |-
          Potassium (K) in milliequivalents per 100 grams of soil (meq/100g).
          Source: IonsAnalysisProduct.potassium_id from canonical schema.
        range: double
        required: false
        
      CEC_meq_per_100_g:
        description: |-
          Cation Exchange Capacity in milliequivalents per 100 grams (meq/100g).
          Source: IonsAnalysisProduct.cation_exchange_capacity_id from canonical schema.
        range: double
        required: false
      
      # Elemental Analysis (ElementalAnalysisProduct)
      Total_C_percent:
        description: |-
          Total Carbon as percentage of dry soil weight (%).
          Source: ElementalAnalysisProduct.total_carbon_id from canonical schema.
        range: double
        required: false
        
      Total_N_percent:
        description: |-
          Total Nitrogen as percentage of dry soil weight (%).
          Source: ElementalAnalysisProduct.total_nitrogen_id from canonical schema.
        range: double
        required: false
        
      Total_S_percent:
        description: |-
          Total Sulfur as percentage of dry soil weight (%).
          Source: ElementalAnalysisProduct.total_sulfur_id from canonical schema.
        range: double
        required: false
      
      # Nitrogen Analysis (NitrogenAnalysisProduct)
      NH4_N_mg_per_kg:
        description: |-
          Ammonium Nitrogen (NH4-N) in milligrams per kilogram of soil (mg/kg).
          Source: NitrogenAnalysisProduct.nh4_n_id from canonical schema.
          L2 data: average across replicates
          L1 data: individual replicate values
        range: double
        required: false
        
      NO3_N_mg_per_kg:
        description: |-
          Nitrate Nitrogen (NO3-N) in milligrams per kilogram of soil (mg/kg).
          Source: NitrogenAnalysisProduct.no3_n_id from canonical schema.
          L2 data: average across replicates
          L1 data: individual replicate values
        range: double
        required: false
      
      # Phosphorus Analysis (PhosphorusAnalysisProduct)
      PO4_P_mg_per_kg:
        description: |-
          Phosphate Phosphorus (PO4-P) in milligrams per kilogram of soil (mg/kg).
          Source: PhosphorusAnalysisProduct.phosphorus_id from canonical schema.
          L2 data: average across replicates
          L1 data: individual replicate values
        range: double
        required: false
        
      PO4_P_extraction:
        description: |-
          Extraction method used for phosphorus analysis.
          Source: PhosphorusAnalysisProduct.extraction_method from canonical schema.
        range: string
        required: false
      
      # Moisture Content (GWCMoistureProduct)
      GWC_percent:
        description: |-
          Gravimetric Water Content as percentage (%).
          Source: GWCMoistureProduct.gwc_percent_id from canonical schema.
          Ratio of water mass to dry soil mass, expressed as percentage.
          GWC = (wet_mass - dry_mass) / dry_mass x 100
          L2 data: average across replicates
          L1 data: individual replicate values
        range: double
        required: false
      
      # Water Extractable Organic Matter (WEOMProduct)
      WEOM_TOC_mg_per_kg:
        description: |-
          Water Extractable Organic Matter - Total Organic Carbon in mg/kg.
          Source: WEOMProduct.total_organic_carbon_id from canonical schema.
          L2 data: average across replicates
          L1 data: individual replicate values
        range: double
        required: false
        
      WEOM_TN_mg_per_kg:
        description: |-
          Water Extractable Organic Matter - Total Nitrogen in mg/kg.
          Source: WEOMProduct.total_nitrogen_id from canonical schema.
          L2 data: average across replicates
          L1 data: individual replicate values
        range: double
        required: false
      
      # Mineral Associated Organic Matter (Formerly MAOMProduct, renamed to HClExtOM)
      HClExtOM_TOC_mg_per_kg:
        description: |-
          Mineral Associated Organic Matter - Total Organic Carbon in mg/kg.
          Source: MAOMProduct.total_organic_carbon_id from canonical schema.
          L2 data: average across replicates
          L1 data: individual replicate values
        range: double
        required: false
        
      HClExtOM_TN_mg_per_kg:
        description: |-
          Mineral Associated Organic Matter - Total Nitrogen in mg/kg.
          Source: MAOMProduct.total_nitrogen_id from canonical schema.
          L2 data: average across replicates
          L1 data: individual replicate values
        range: double
        required: false
      
      # Texture Analysis (TextureProduct)
      Clay_percent:
        description: |-
          Clay content as percentage of soil by weight (%).
          Source: TextureProduct.clay_pct_id from canonical schema.
        range: double
        required: false
        
      Sand_percent:
        description: |-
          Sand content as percentage of soil by weight (%).
          Source: TextureProduct.sand_pct_id from canonical schema.
        range: double
        required: false
        
      Silt_percent:
        description: |-
          Silt content as percentage of soil by weight (%).
          Source: TextureProduct.silt_pct_id from canonical schema.
        range: double
        required: false
      
      # Enzyme Activity (EnzymeProduct)
      Beta_Glucosidase_ug_pNP_per_g_per_h:
        description: |-
          Beta-Glucosidase enzyme activity in micrograms para-nitrophenol per gram per hour (ug pNP/g/h).
          Source: EnzymeProduct.beta_glucosidase_ug_pnp_per_g_per_h_id from canonical schema.
        range: double
        required: false
      
      # Bulk Density (BulkDensityProduct)
      Bulk_density_g_per_cm3:
        description: |-
          Soil bulk density in grams per cubic centimeter (g/cm^3).
          Source: BulkDensityProduct.bulk_density_id from canonical schema.
        range: double
        required: false
      
      # Data Quality Flags
      flag_B:  
        description: |-
          Quality flag for Boron measurement.
          Source: IonsAnalysisProduct.flag_boron from canonical schema.
        range: string
        required: false
      
      flag_beta_glucosidase:  
        description: |-
          Quality flag for Beta-Glucosidase enzyme activity measurement.
          Source: EnzymeProduct.flag_enzyme from canonical schema.
        range: string
        required: false
      
      flag_Ca:  
        description: |-
          Quality flag for Calcium measurement.
          Source: IonsAnalysisProduct.flag_calcium from canonical schema.
        range: string
        required: false
      
      flag_CEC: 
        description: |-
          Quality flag for Cation Exchange Capacity measurement.
          Source: IonsAnalysisProduct.flag_cec from canonical schema.
        range: string
        required: false
      
      flag_Cu:  
        description: |-
          Quality flag for Copper measurement.
          Source: IonsAnalysisProduct.flag_copper from canonical schema.
        range: string
        required: false
      
      flag_density:
        description: |-
          Quality flag for bulk density measurement.
          Source: BulkDensityProduct from canonical schema.
        range: string
        required: false
      
      flag_Fe:  
        description: |-
          Quality flag for Iron measurement.
          Source: IonsAnalysisProduct.flag_iron from canonical schema.
        range: string
        required: false
      
      flag_GWC:
        description: |-
          Quality flag for Gravimetric Water Content measurement.
          Source: GWCMoistureProduct.gwc_flag from canonical schema.
        range: string
        required: false
      
      flag_HClExtOM_TN:  # Renamed from flag_MAOM_TN to match HClExtOM naming
        description: |-
          Quality flag for Mineral Associated Organic Matter - Total Nitrogen measurement.
          Source: MAOMProduct.flag_tn from canonical schema.
          Note: MAOM renamed to HClExtOM in schema to match analytical method.
        range: string
        required: false
      
      flag_HClExtOM_TOC:  # Renamed from flag_MAOM_TOC to match HClExtOM naming
        description: |-
          Quality flag for Mineral Associated Organic Matter - Total Organic Carbon measurement.
          Source: MAOMProduct.flag_toc from canonical schema.
          Note: MAOM renamed to HClExtOM in schema to match analytical method.
        range: string
        required: false
      
      flag_K:  
        description: |-
          Quality flag for Potassium measurement.
          Source: IonsAnalysisProduct.flag_potassium from canonical schema.
        range: string
        required: false
      
      flag_MBC:
        description: |-
          Quality flag for Microbial Biomass Carbon measurement.
          Source: MicrobialBiomassProduct.flag_mbc from canonical schema.
        range: string
        required: false
      
      flag_MBN:
        description: |-
          Quality flag for Microbial Biomass Nitrogen measurement.
          Source: MicrobialBiomassProduct.flag_mbn from canonical schema.
        range: string
        required: false
      
      flag_Mg:  
        description: |-
          Quality flag for Magnesium measurement.
          Source: IonsAnalysisProduct.flag_magnesium from canonical schema.
        range: string
        required: false
      
      flag_Mn:  
        description: |-
          Quality flag for Manganese measurement.
          Source: IonsAnalysisProduct.flag_manganate from canonical schema.
        range: string
        required: false
      
      flag_Na:  
        description: |-
          Quality flag for Sodium measurement.
          Source: IonsAnalysisProduct.flag_sodium from canonical schema.
        range: string
        required: false
      
      flag_nh4_n: 
        description: |-
          Quality flag for Ammonium Nitrogen measurement.
          Source: NitrogenAnalysisProduct.flag_nh4n from canonical schema.
        range: string
        required: false
      
      flag_no3_n: 
        description: |-
          Quality flag for Nitrate Nitrogen measurement.
          Source: NitrogenAnalysisProduct.flag_no3n from canonical schema.
        range: string
        required: false
      
      flag_pH:
        description: |-
          Quality flag for pH measurement.
          Source: pHProduct from canonical schema.
        range: string
        required: false
      
      flag_phosphorus:  
        description: |-
          Quality flag for Phosphate Phosphorus measurement.
          Source: PhosphorusAnalysisProduct.flag_phosphorus from canonical schema.
        range: string
        required: false
      
      flag_respiration:
        description: |-
          Quality flag for respiration measurement.
          Source: RespirationProduct from canonical schema.
        range: string
        required: false
      
      flag_SO4_S: 
        description: |-
          Quality flag for Sulfate-Sulfur measurement.
          Source: IonsAnalysisProduct.flag_sulfate from canonical schema.
        range: string
        required: false
      
      flag_texture:
        description: |-
          Quality flag for texture measurement.
          Source: TextureProduct (sand/silt/clay) from canonical schema.
        range: string
        required: false
      
      flag_tkn:
        description: |-
          Quality flag for elemental analysis measurement.
          Source: ElementalAnalysisProduct from canonical schema.
        range: string
        required: false
      
      flag_total_bases:
        description: |-
          Quality flag for IonsAnalysisProduct measurement.
          Source: IonsAnalysisProduct from canonical schema.
        range: string
        required: false
      
      flag_total_carbon:  
        description: |-
          Quality flag for Total Carbon measurement.
          Source: ElementalAnalysisProduct.flag_total_carbon from canonical schema.
        range: string
        required: false
      
      flag_total_nitrogen:  
        description: |-
          Quality flag for Total Nitrogen measurement.
          Source: ElementalAnalysisProduct.flag_total_nitrogen from canonical schema.
        range: string
        required: false
      
      flag_total_sulfur:  
        description: |-
          Quality flag for Total Sulfur measurement.
          Source: ElementalAnalysisProduct.flag_total_sulfur from canonical schema.
        range: string
        required: false
      
      flag_WEOM_TN:
        description: |-
          Quality flag for Water Extractable Organic Matter - Total Nitrogen measurement.
          Source: WEOMProduct.flag_tn from canonical schema.
        range: string
        required: false
      
      flag_WEOM_TOC:
        description: |-
          Quality flag for Water Extractable Organic Matter - Total Organic Carbon measurement.
          Source: WEOMProduct.flag_toc from canonical schema.
        range: string
        required: false
      
      flag_Zn:  
        description: |-
          Quality flag for Zinc measurement.
          Source: IonsAnalysisProduct.flag_zinc from canonical schema.
        range: string
        required: false
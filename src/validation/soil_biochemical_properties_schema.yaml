          Source: PhosphorusAnalysisProduct.phosphorus from canonical schema.
          L2 data: average across replicates
          L1 data: individual replicate values
          Reported in: FY23, FY24, FY25.
          Replicates: FY23: 3; FY24: 1 to 3; FY25: 1.
        range: double
        required: false
        unit:
          ucum_code: 'mg{P}/kg'

      pH:
        description: |-
          Soil pH.
          Source: pHProduct class from canonical schema.
          Reported in: FY23, FY24, FY25.
          Replicates: 1.
        range: double
        required: false
        unit:
          ucum_code: '[pH]'

      Respiration_CO2_C_ug_per_g:
        description: |-
          Potential soil respiration measured as cumulative microbial CO2-C production
          over a 24-hour burst incubation (ug CO2-C per g dried soil).
          Source: RespirationProduct.respiration_co2_c_ug_per_g from canonical schema.
          Reported in: FY25.
          Replicates: 1.
        range: double
        required: false
        unit:
          ucum_code: 'ug{CO2-C}/g'

      Sand_percent:

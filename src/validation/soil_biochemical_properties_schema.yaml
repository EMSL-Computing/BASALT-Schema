        range: string
        required: false

      flag_HClExtOM_TN:
        description: |-
          Data quality flag for HCl-extractable total nitrogen; blank if no flag. See
          Flag_Definitions.
          Source: HClExtOMProduct.flag_tn from canonical schema.
          Reported in: FY23, FY24.
        range: string
        required: false

      flag_Ca:
        description: |-
          Data quality flag for calcium; blank if no flag. See Flag_Definitions.
          Source: IonsAnalysisProduct.flag_calcium from canonical schema.
          Reported in: FY23, FY24, FY25.

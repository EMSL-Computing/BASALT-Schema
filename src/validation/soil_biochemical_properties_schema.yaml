        range: string
        required: false

      flag_Cu:
        description: |-
          Data quality flag for copper; blank if no flag. See Flag_Definitions.
          Source: IonsAnalysisProduct.flag_copper from canonical schema.
          Reported in: FY23, FY24, FY25.
        range: string

        range: string
        required: false

      flag_HClExtOM_TOC:
        description: |-
          Data quality flag for HCl-extractable organic carbon; blank if no flag. See
          Flag_Definitions.
          Source: HClExtOMProduct.flag_toc from canonical schema.

          Source: IonsAnalysisProduct.cation_exchange_capacity from canonical schema.
          Reported in: FY23.
          Replicates: 1.
        range: double
        required: false
        unit:
          ucum_code: meq/(100.g)

      SO4_S_mg_per_kg:
        description: |-
          Sulfate sulfur content (mg S per kg soil).

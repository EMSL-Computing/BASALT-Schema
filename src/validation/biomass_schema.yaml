---
# =============================================================================
# Microbial Biomass   Ingest Validation Schema
# =============================================================================
# Source class:  MicrobialBiomassProduct (products.yaml)
# Analysis type: "biomass" (lims_processed_data_schema.yaml AnalysisTypeEnum)
# Measure level: Replicate-capable (rep slot in operational schema)
# CSV output:    MBC_mg_per_kg, MBN_mg_per_kg, flag_MBC, flag_MBN
#                (soil_biochemical_properties_schema.yaml)
#
# NOTE: operational schema carries separate mbc_avg / mbn_avg fields and
#       corresponding flag_avg fields for replicate averages   included here
#       so ingest can carry both replicate values and pre-computed averages.
# Last Updated:  2026-03-16
# =============================================================================

id: https://EMSL-Computing.github.io/BASALT-Schema/biomass
name: biomass_schema
title: MONet Microbial Biomass Ingest Schema
description: |-
  Ingest validation schema for MicrobialBiomassProduct.
  Describes the product_values payload for analysis_type = "biomass".
  
  Covers Microbial Biomass Carbon (MBC) and Microbial Biomass Nitrogen (MBN)
  measured by chloroform fumigation-extraction.
license: MIT

prefixes:
  basalt_schema: https://EMSL-Computing.github.io/BASALT-Schema/
  linkml: https://w3id.org/linkml/

default_prefix: biomass_schema
default_range: string

imports:
  - linkml:types

enums:

  ProcessedDataFlagEnum:
    description: Mirrors processeddataflag in enums.yaml.
    permissible_values:
      Below_Detection:
      Below_Reporting_Limit:
      High_Background:
      Out_of_Range:
      Outlier:
      Data_not_available:
      Failed_QC:
      Insufficient_Material:

slots:

  flag_mbc:
    description: QC flag for MBC measurement.
    range: ProcessedDataFlagEnum
    required: false

  flag_mbn:
    description: QC flag for MBN measurement.
    range: ProcessedDataFlagEnum
    required: false

classes:

  BiomassProductValues:
    description: |-
      Microbial biomass product values (MBC and MBN).
      Replicate-level data when replicate field is present in CoreSectionData.
      The operational schema also stores pre-computed replicate averages (mbc_avg, mbn_avg).
    slots:
      - flag_mbc
      - flag_mbn
    slot_usage:
      flag_mbc:
        description: |-
          QC flag for the MBC measurement.
          CSV column: flag_MBC.
      flag_mbn:
        description: |-
          QC flag for the MBN measurement.
          CSV column: flag_MBN.
    attributes:

      mbc:
        description: |-
          Microbial Biomass Carbon (MBC) in mg/kg dry soil.
          CSV column: MBC_mg_per_kg.
          Minimum value: 0
        range: double
        required: false
        # minimum_value: 0

      mbn:
        description: |-
          Microbial Biomass Nitrogen (MBN) in mg/kg dry soil.
          CSV column: MBN_mg_per_kg.
          Minimum value: 0
        range: double
        required: false
        # minimum_value: 0

      mbc_avg:
        description: |-
          Pre-computed average MBC across replicates (mg/kg).
          Stored in operational schema
        range: double
        required: false

      mbn_avg:
        description: |-
          Pre-computed average MBN across replicates (mg/kg).
          Stored in operational schema
        range: double
        required: false

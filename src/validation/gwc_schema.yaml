---
# =============================================================================
# Gravimetric Water Content (GWC)   Ingest Validation Schema
# =============================================================================
# Source class:  GWCMoistureProduct (products.yaml)
# Analysis type: "gwc" (lims_processed_data_schema.yaml AnalysisTypeEnum)
# Measure level: Replicate-capable (rep slot in operational schema)
# CSV output:    GWC_percent, flag_GWC (soil_biochemical_properties_schema.yaml)
# Last Updated:  2026-03-16
# =============================================================================

id: https://w3id.org/MONet/basalt-schema/gwc
name: gwc_schema
title: MONet Gravimetric Water Content Ingest Schema
description: |-
  Ingest validation schema for GWCMoistureProduct.
  Describes the product_values payload for analysis_type = "gwc".
  
  GWC = (wet_mass − dry_mass) / dry_mass × 100
  Expressed as a percentage of dry soil mass.
license: MIT

prefixes:
  basalt_schema: https://w3id.org/MONet/basalt-schema/
  linkml: https://w3id.org/linkml/

default_prefix: gwc_schema
default_range: string

imports:
  - linkml:types

enums:

  ProcessedDataFlagEnum:
    description: Mirrors processeddataflag in enums.yaml.
    permissible_values:
      Below_Detection:
      Below_Reporting_Limit:
      High_Background:
      Out_of_Range:
      Outlier:
      Data_not_available:
      Failed_QC:
      Insufficient_Material:

slots:

  flag:
    description: QC flag for this measurement.
    range: ProcessedDataFlagEnum
    required: false

classes:

  GWCProductValues:
    description: |-
      Gravimetric water content product values.
      Replicate-level data when replicate field is present in CoreSectionData.
    slots:
      - flag
    slot_usage:
      flag:
        description: |-
          QC flag for the GWC measurement.
          CSV column: flag_GWC
    attributes:

      gwc:
        description: |-
          Gravimetric water content (%).
          GWC = (wet_mass − dry_mass) / dry_mass × 100
          CSV column: GWC_percent
          NOTE: can theoretically exceed 100% for highly organic or saturated soils.
        range: double
        required: false
        # minimum_value: 0   not enforced; organic soils can exceed expected range

---
# =============================================================================
# HYPROP / Hydraulic Properties Schema
# =============================================================================
#
# CONTEXT and Purpose:
# - Validation schema for HydraulicPropertiesProduct   soil hydraulic parameters
# - One row per core section; four attributes are the four VGM model parameters
# - Covers the INGEST contract: what gets POSTed to the API and stored as a product
#
# Last Updated: 2026-02-25
# =============================================================================

id: https://w3id.org/MONet/basalt-schema/hydraulic-properties
name: hydraulic_properties_schema
title: MONet HYPROP / Hydraulic Properties Schema
description: |-
  Validation schema for HydraulicPropertiesProduct   soil hydraulic parameters
  derived from HYPROP evaporation-experiment data.
  
  The four attributes are the four Van Genuchten Model (VGM) parameters.
  
  This file documents the ingest contract for rapid validation.
  The operational HydraulicPropertiesProduct class lives in the main schema.
license: MIT

prefixes:
  basalt_schema: https://w3id.org/MONet/basalt-schema/
  linkml: https://w3id.org/linkml/

default_prefix: hydraulic_properties_schema
default_range: string

imports:
  - linkml:types

enums:

  ProcessedDataFlagEnum:
    description: Mirrors processeddataflag in enums.yaml.
    permissible_values:
      Below_Detection:
      Below_Reporting_Limit:
      High_Background:
      Out_of_Range:
      Outlier:
      Data_not_available:
      Failed_QC:
      Insufficient_Material:

slots:

  flag:
    description: QC flag for this measurement.
    range: ProcessedDataFlagEnum
    required: false

classes:

  HydraulicPropertiesProduct:
    description: |-
      Soil hydraulic parameters. One record per core section; the four attributes are the four VGM model
      parameters. Proposal_ID, sampling_set, and core_section are inherited from
      the parent LIMSProcessedData envelope (see lims_processed_data_schema.yaml).
    slots:
      - flag
    slot_usage:
      flag:
        description: |-
          QC flag for the entire VGM fit (e.g. missing sample, failed QC, poor convergence).
          Applied to the record as a whole rather than to individual parameters.
    attributes:
 
      alpha:
        description: |-
          Van Genuchten shape parameter alpha (units: 1/cm).
          Controls the inverse of the air-entry suction.
        # minimum_value: 0
        range: double
        required: false

      n:
        description: |-
          Van Genuchten pore-size distribution index n (dimensionless; n > 1).
          Controls the slope of the water-retention curve.
        # minimum_value: 1 (strictly greater than 1 for physical validity)
        range: double
        required: false

      theta_r:
        description: |-
          Residual volumetric water content theta_r (units: cm³ cm⁻³).
          The water content at which liquid conductivity approaches zero.
        # minimum_value: 0
        # maximum_value: < theta_s
        range: double
        required: false

      theta_s:
        description: |-
          Saturated volumetric water content theta_s (units: cm³ cm⁻³ × 10⁻³).
          Approximates total porosity under saturated conditions.
        # minimum_value: 0
        # maximum_value: 1
        range: double
        required: false

---
id: https://w3id.org/MONet/basalt-schema/zip_download
name: basalt-schema-zip-download
title: Basalt Schema - Zip Download
description: |-
  Zip download-related classes for Basalt.
license: MIT
see_also:
  - https://MONet.github.io/basalt-schema
  - https://github.com/pnnl/analysis-api

prefixes:
  basalt_schema: https://w3id.org/MONet/basalt-schema/

default_prefix: basalt_schema
default_range: string

imports:
  - linkml:types

classes:

  zipDownload:
    description: |-
      A zip download record, capturing the details of a zip file download event.
    attributes:
      id:
        identifier: true
        range: uuid
      time:
        range: datetime
        required: true
      user:
        range: string
        required: true
      files:
        range: integer
        required: true
      packages:
        range: string

id: https://emsl-computing.github.io/BASALT-Schema/products
name: basalt-schema-products
title: BASALT Schema - Products
description: |-
  Data products generated from lab analyses and data processing workflows.
license: CC0-1.0

prefixes:
  basalt_schema: https://emsl-computing.github.io/BASALT-Schema/elements/
  linkml: https://w3id.org/linkml/

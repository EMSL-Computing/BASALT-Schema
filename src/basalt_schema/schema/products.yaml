  ElementalAnalysisProduct:
    is_a: ProcessedData
    description: |-
      Elemental analysis product, typically derived via combustion or similar instrument.
      Individual QC flags for each measurement using ProcessedDataFlag enum.
    slots:
      - measure_type
    attributes:
      total_carbon:
        description: Total carbon content (weight percent).
        range: double
        unit:
          ucum_code: '%'
      total_nitrogen:
        description: Total nitrogen content (weight percent).
        range: double
        unit:
          ucum_code: '%'
      total_kjeldahl_nitrogen:
        range: double
      total_sulfur:
        description: Total sulfur content (weight percent).
        range: double
        unit:
          ucum_code: '%'
      flag_total_carbon:
        description: Data quality flag for total carbon; blank if no flag.
        range: ProcessedDataFlag
      flag_total_nitrogen:
        description: Data quality flag for total nitrogen; blank if no flag.
        range: ProcessedDataFlag
      flag_tkn:
        range: ProcessedDataFlag
      flag_total_sulfur:

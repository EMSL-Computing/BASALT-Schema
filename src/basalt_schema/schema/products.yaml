        range: double
      pore_diameter_min:
        range: double
      pore_diameter_max:
        range: double
      pore_diameter_mean:
        range: double
      pore_diameter_median:
        range: double
      pore_diameter_variance:
        range: double
      pore_volume_mean:
        range: double
      total_pore_volume:
        range: double
      permeability_x:
        range: double
      flow_rate_x:
        range: double
      tortuosity_x:
        range: double
      permeability_y:
        range: double
      flow_rate_y:
        range: double
      tortuosity_y:
        range: double
      permeability_z:
        range: double
      flow_rate_z:
        range: double
      tortuosity_z:
        range: double

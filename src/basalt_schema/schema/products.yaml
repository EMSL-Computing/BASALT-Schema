id: https://w3id.org/MONet/basalt-schema/products
name: basalt-schema-products
title: BASALT Schema - Products
description: |-
  Enumerated values used throughout the BASALT Schema
license: MIT

prefixes:
  basalt_schema: https://w3id.org/MONet/basalt-schema/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
default_prefix: basalt_schema

imports:
  - linkml:types
  - enums
  - basalt_schema
  - slots

classes:

  BulkDensityProduct:
    is_a: ProcessedData
    description: |-
      Bulk density analysis product, typically derived via oven-drying and weighing of a known volume of soil.
      One row per sample with columns for bulk density and QC flag.
    slots:
      - measure_type
    attributes:
      bulk_density_id:
        range: QuantityValue
      flag:
        range: ProcessedDataFlag

  ElementalAnalysisProduct:
    is_a: ProcessedData
    description: |-
      Elemental analysis product, typically derived via combustion or similar instrument.
      One row per sample with columns for total carbon, total nitrogen, total Kjeldahl nitrogen, and total sulfur.
      Individual QC flags for each measurement using ProcessedDataFlag enum.
    slots:
      - measure_type
    attributes:
      total_carbon_id:
        range: QuantityValue
      total_nitrogen_id:
        range: QuantityValue
      total_kjeldahl_nitrogen_id:
        range: QuantityValue
      total_sulfur_id:
        range: QuantityValue
      flag_total_carbon:
        range: ProcessedDataFlag
      flag_total_nitrogen:
        range: ProcessedDataFlag
      flag_tkn:
        range: ProcessedDataFlag
      flag_total_sulfur:
        range: ProcessedDataFlag

  EnzymeProduct:
    is_a: ProcessedData
    description: |-
      Enzyme activity analysis product, typically derived via colorimetric assay of soil extracts.
      One row per sample with columns for beta-glucosidase activity and QC flag.
    slots:
      - measure_type
    attributes:
      beta_glucosidase_ug_pnp_per_g_per_h_id:
        range: QuantityValue
      flag:
        range: ProcessedDataFlag

  GWCMoistureProduct:
    is_a: ProcessedData
    description: |-
      Gravimetric water content (GWC) analysis product, typically derived via oven-drying and weighing of a known mass of soil.
      One row per sample with columns for GWC and QC flag.
    slots:
      - measure_type
    attributes:
      gwc_percent_id:
        range: QuantityValue
      flag:
        range: ProcessedDataFlag

  
  HydraulicPropertiesProduct:
    is_a: ProcessedData
    description: >-
      Soil hydraulic parameters derived from HYPROP evaporation-experiment data. One row per core section; the four
      attributes are the four VGM model parameters.  Proposal_ID, sampling_set,
      and core_section are inherited from the parent processedData record.
    slots:
      - measure_type
    attributes:
      alpha:
        description: >-
          Van Genuchten shape parameter alpha (1/cm). Controls the inverse of the
          air-entry suction; typically fitted by HYPROP-FIT or similar software.
        range: double
      n:
        description: >-
          Van Genuchten pore-size distribution index n (dimensionless, n > 1).
          Controls the slope of the water-retention curve.
        range: double
      theta_r:
        description: >-
          Residual volumetric water content theta_r (cm3 cm). The water content
          at which liquid conductivity approaches zero.
        range: double
      theta_s:
        description: >-
          Saturated volumetric water content theta_s (cm3 cm e-3). Approximates
          total porosity under saturated conditions.
        range: double
      flag:
        description: QC flag for the entire VGM fit (e.g. missing sample, failed QC).
        range: ProcessedDataFlag
      
  IonsAnalysisProduct:
    is_a: ProcessedData
    description: |-
      Ions analysis product, typically derived via ICP-OES or similar instrument.
      One row per sample with columns for each ion measured.
      Individual QC flags for each ion using ProcessedDataFlag enum.
    slots:
      - measure_type
    attributes:
      sulfate_id:
        range: QuantityValue
      boron_id:
        range: QuantityValue
      zinc_id:
        range: QuantityValue
      manganate_id:
        range: QuantityValue
      copper_id:
        range: QuantityValue
      iron_id:
        range: QuantityValue
      calcium_id:
        range: QuantityValue
      magnesium_id:
        range: QuantityValue
      sodium_id:
        range: QuantityValue
      potassium_id:
        range: QuantityValue
      total_bases_id:
        range: QuantityValue
      cation_exchange_capacity_id:
        range: QuantityValue
      flag_sulfate:
        range: ProcessedDataFlag
      flag_boron:
        range: ProcessedDataFlag
      flag_zinc:
        range: ProcessedDataFlag
      flag_manganate:
        range: ProcessedDataFlag
      flag_copper:
        range: ProcessedDataFlag
      flag_iron:
        range: ProcessedDataFlag
      flag_calcium:
        range: ProcessedDataFlag
      flag_magnesium:
        range: ProcessedDataFlag
      flag_sodium:
        range: ProcessedDataFlag
      flag_potassium:
        range: ProcessedDataFlag
      flag_total_bases:
        range: ProcessedDataFlag
      flag_cec:
        range: ProcessedDataFlag

  MAOMProduct:
    description: |-
      Mineral-Associated Organic Matter (MAOM) analysis product, typically derived via HCl extraction and TOC/TN measurement.
      One row per sample with columns for total organic carbon and total nitrogen.
      Individual QC flags for each measurement using ProcessedDataFlag enum. TO BE RENAMED TO HClExtOMProduct
    slots:
      - measure_type
      - replicate
    attributes:
      id:
        identifier: true
        range: ProcessedData
      total_organic_carbon_id:
        range: QuantityValue
      total_organic_carbon_avg:
        range: double
      total_nitrogen_id:
        range: QuantityValue
      total_nitrogen_avg:
        range: double
      flag_toc:
        range: ProcessedDataFlag
      flag_tn:
        range: ProcessedDataFlag
      flag_toc_avg:

    attributes:
      flag:
        description: Data quality flag for pH; blank if no flag.
        range: ProcessedDataFlag

  XRayDataProduct:
    is_a: ProcessedData
    abstract: true
    description: |-
      Abstract base class for X-ray analytical data products.
      Inherits S3 storage metadata and sample linkage from dataProduct via ProcessedData.

      Concrete subclasses:
        - XCTProduct: pore geometry and flow properties (X-ray computed tomography)
        - XRFElementalProduct: elemental concentrations
        - XRDPhaseProduct: mineral phases
        - XASLCFProduct: linear combination fitting results

      Common patterns:
        - s3_key points to the raw or processed X-ray data file in MinIO
        - summary_metrics provides lightweight queryable summaries:
            XCT: {"connected_pores":1842, "total_pore_volume":3.2e6, "tortuosity_z":1.47}
            XRF: {"Ni_mg_kg":45.3, "Pb_mg_kg":8.2, "As_mg_kg":12.1}
            XRD: {"quartz_percent":42, "albite_percent":18, "kaolinite_percent":31}
            XAS: {"r_factor":0.000975, "lcf_type":"XANES", "n_standards":3}
        - direct outputs may not have a processing link (XRF typical)
        - computational outputs should use a typed processing reference slot
          (XRD Rietveld refinement, XAS LCF fitting)


  # ---------------------------------------------------------------------------
  # XCTProduct   X-ray Computed Tomography Pore/Flow Data
  # ---------------------------------------------------------------------------
  XCTProduct:
    is_a: XRayDataProduct
    description: |-
      X-ray computed tomography (XCT) analysis product for pore geometry and flow properties of intact soil cores.
    slots:
      - measure_type
    attributes:
      roi_x_voxel:
        description: >-
          Size of the region of interest (ROI) along the X-axis (voxel). FY23 reported
          ROI dimensions as a single ROI_volume_voxel value (x by y by z).
        range: double
        unit:
          ucum_code: '{voxel}'
      roi_y_voxel:
        description: Size of the region of interest (ROI) along the Y-axis (voxel).
        range: double
        unit:
          ucum_code: '{voxel}'
      roi_z_voxel:
        description: Size of the region of interest (ROI) along the Z-axis (voxel).
        range: double
        unit:
          ucum_code: '{voxel}'
      voxel_size_mm_per_voxel:
        description: Linear voxel size, i.e. scan resolution (mm per voxel).
        range: double
        unit:
          ucum_code: 'mm/{voxel}'
      porosity_percent:
        description: >-
          Total pore volume as a percentage of total ROI (soil) volume (percent). FY23
          column: total_pore_volume_percent.
        range: double
        unit:
          ucum_code: '%'
      connected_pores_fraction:
        description: >-
          Connected pore volume as a fraction of total ROI (soil) volume, i.e. connected
          porosity (fraction, 0 to 1).
        range: double
        unit:
          ucum_code: '1'
      pore_connectivity_percent:
        description: >-
          Connected pore volume as a percentage of total pore volume (percent). FY23
          column: connected_pores_percent.
        range: double
        unit:
          ucum_code: '%'
      pore_equivalent_diameter_min_mm:
        description: >-
          Minimum pore equivalent diameter (diameter of a sphere with the same volume as
          the pore) (mm). FY23 column: pore_diameter_min_mm.
        range: double
        unit:
          ucum_code: mm
      pore_equivalent_diameter_max_mm:
        description: >-
          Maximum pore equivalent diameter (mm). FY23 column: pore_diameter_max_mm.
        range: double
        unit:
          ucum_code: mm
      pore_equivalent_diameter_mean_mm:
        description: >-
          Mean pore equivalent diameter (mm). FY23 column: pore_diameter_mean_mm.
        range: double
        unit:
          ucum_code: mm
      pore_equivalent_diameter_median_mm:
        description: >-
          Median pore equivalent diameter (mm). FY23 column: pore_diameter_median_mm.
        range: double
        unit:
          ucum_code: mm
      pore_equivalent_diameter_variance_mm2:
        description: >-
          Variance of pore equivalent diameter (mm2). FY23 column:
          pore_diameter_variance_mm2.
        range: double
        unit:
          ucum_code: mm2
      pore_volume_min_mm3:
        description: Minimum individual pore volume (mm3).
        range: double
        unit:
          ucum_code: mm3
      pore_volume_max_mm3:
        description: Maximum individual pore volume (mm3).
        range: double
        unit:
          ucum_code: mm3
      pore_volume_mean_mm3:
        description: Mean individual pore volume (mm3).
        range: double
        unit:
          ucum_code: mm3
      pore_volume_median_mm3:
        description: Median individual pore volume (mm3).
        range: double
        unit:
          ucum_code: mm3
      pore_volume_variance_mm6:
        description: Variance of individual pore volume (mm6).
        range: double
        unit:
          ucum_code: mm6
      pore_area_min_mm2:
        description: Minimum individual pore surface area (mm2).
        range: double
        unit:
          ucum_code: mm2
      pore_area_max_mm2:
        description: Maximum individual pore surface area (mm2).
        range: double
        unit:
          ucum_code: mm2
      pore_area_mean_mm2:
        description: Mean individual pore surface area (mm2).
        range: double
        unit:
          ucum_code: mm2
      pore_area_median_mm2:
        description: Median individual pore surface area (mm2).
        range: double
        unit:
          ucum_code: mm2
      pore_area_variance_mm4:
        description: Variance of individual pore surface area (mm4).
        range: double
        unit:
          ucum_code: mm4
      permeability_x_um2:
        description: >-
          Absolute permeability of the pore network model along the X-axis (um2).
        range: double
        unit:
          ucum_code: um2
      flow_rate_x_mm3_per_sec:
        description: >-
          Volumetric flow rate through the pore network along the X-axis (mm3 per
          second).
        range: double
        unit:
          ucum_code: mm3/s
      tortuosity_x:
        description: Tortuosity of the soil column along the X-axis (ratio).
        range: double
        unit:
          ucum_code: '1'
      permeability_y_um2:
        description: >-
          Absolute permeability of the pore network model along the Y-axis (um2).
        range: double
        unit:
          ucum_code: um2
      flow_rate_y_mm3_per_sec:
        description: >-
          Volumetric flow rate through the pore network along the Y-axis (mm3 per
          second).
        range: double
        unit:
          ucum_code: mm3/s
      tortuosity_y:
        description: Tortuosity of the soil column along the Y-axis (ratio).
        range: double
        unit:
          ucum_code: '1'
      permeability_z_um2:
        description: >-
          Absolute permeability of the pore network model along the Z-axis (um2).
        range: double
        unit:
          ucum_code: um2
      flow_rate_z_mm3_per_sec:
        description: >-
          Volumetric flow rate through the pore network along the Z-axis (mm3 per
          second).
        range: double
        unit:
          ucum_code: mm3/s
      tortuosity_z:
        description: Tortuosity of the soil column along the Z-axis (ratio).
        range: double
        unit:
          ucum_code: '1'
      flag_xct:
        description: Data quality flag for XCT pore summary metrics; blank if no flag.
        range: ProcessedDataFlag


  # ---------------------------------------------------------------------------
  # XRFElementalProduct   X-ray Fluorescence Elemental Data
  # ---------------------------------------------------------------------------

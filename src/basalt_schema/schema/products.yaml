  BulkDensityProduct:
    is_a: ProcessedData
    description: |-
      Bulk density analysis product, typically derived via oven-drying and weighing of a known volume of soil.
    slots:
      - measure_type
    attributes:
      bulk_density:
        description: Bulk density (g per cm3 soil).
        range: double
        unit:
          ucum_code: g/cm3
      flag:
        description: Data quality flag for bulk density; blank if no flag.
        range: ProcessedDataFlag


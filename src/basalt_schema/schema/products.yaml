  GWCMoistureProduct:
    is_a: ProcessedData
    description: |-
      Gravimetric water content (GWC) analysis product, typically derived via oven-drying and weighing of a known mass of soil.
    slots:
      - measure_type
    attributes:
      gwc_percent:
        description: Gravimetric water content (percent).
        range: double
        unit:
          ucum_code: '%'
      flag:
        description: Data quality flag for gravimetric water content; blank if no flag.
        range: ProcessedDataFlag

  
  HydraulicPropertiesProduct:
    is_a: ProcessedData
    description: >-
      Soil hydraulic parameters derived from HYPROP evaporation-experiment data. The four
      attributes are the four VGM model parameters.  Proposal_ID, sampling_set,
      and core_section are inherited from the parent processedData record.
    slots:
      - measure_type
    attributes:
      alpha:
        description: >-
          van Genuchten scale parameter, inversely proportional to mean pore diameter
          (per cm). Typically fitted by HYPROP-FIT or similar software.
        range: double
        unit:
          ucum_code: /cm
      n:
        description: >-
          van Genuchten parameter that describes the pore-size distribution of the soil
          (dimensionless, n > 1). Controls the slope of the water-retention curve.
        range: double
        unit:
          ucum_code: '1'
      theta_r:
        description: >-
          Residual volumetric water content from HYPROP soil water retention model (cm3
          water per cm3 soil). The water content at which liquid conductivity approaches
          zero.
        range: double
        unit:
          ucum_code: cm3/cm3
      theta_s:
        description: >-
          Saturated volumetric water content from HYPROP soil water retention model (cm3
          water per cm3 soil). Approximates total porosity under saturated conditions.
        range: double
        unit:
          ucum_code: cm3/cm3
      flag:
        description: >-
          Data quality flag for HYPROP water retention parameters; blank if no flag.
        range: ProcessedDataFlag
      
  IonsAnalysisProduct:

---
id: https://w3id.org/MONet/basalt-schema/study
name: basalt-schema-study
title: BASALT Schema - Study
description: |-
  Study-related classes for BASALT.
license: MIT
see_also:
  - https://MONet.github.io/basalt-schema
  - https://github.com/mkapur-pnnl/basalt-schema

prefixes:
  basalt_schema: https://w3id.org/MONet/basalt-schema/

default_prefix: basalt_schema
default_range: string

imports:
  - linkml:types
  - slots
  - enums


classes:

  Study:
    description: |-
      A study or research project, typically associated with a proposal and a set of experiments.
      A study may have multiple participants, each with different roles, and may be associated with
      one or more campaigns. The study may also have associated DOIs and funding sources.
    slots:
      - external_identifiers
    attributes:
      id:
        identifier: true
        range: uuid
      # campaign_id:
      #   range: campaign
        #required: true
        # description: Reference to the campaign this study belongs to
      # could also be part_of_campaign: or something like that
      project_id:
        range: integer # like 60880
        required: true
      title:
        range: string
        description: The title of the study/proposal.
      name:
        range: string
        required: true
        description: Short name or code for the study.
      proposal_abstract:
        range: string
        description: The abstract submitted with the research proposal.
      description:
        range: string
        description: study objectives and scope
      # participant_name: # TODO not quite correct
      #   range: string
      #   array: {}
      #   required: true
      has_participants:
        range: ProjectParticipant
        multivalued: true
        description: Links to a record of a person and their roles for this study.
      principal_investigator:
        range: PersonValue
        required: true
      collaborating_institution: # could combine with ProcessingInstitutionEnum
        range: string
      project_status:
        range: ProjectStatusEnum
      project_start:
        range: datetime
      project_end:
        range: datetime
      associated_dois:
        range: DOI
        multivalued: true
        description: A list of DOIs associated with this study
      funding_sources:
        range: DOI
        multivalued: true
      # associated dois and funding sources may be redundant if they're both
      # just gonna link to EMSL award DOIs
    slot_usage:
      - external_identifiers:
          description: List of project- or study-level identifiers (e.g., GOLD study ID) representing this project.

  ProjectParticipant:
    description: A record of a person and their role on an EMSL project.
    attributes:
      id:
        identifier: true
        range: uuid
      role:
        range: NexusRoleEnum
        required: true
        description: The role of the contributor in the study (e.g., data analysis, writing).
      person:
        range: PersonValue
        required: true
        description: The person who contributed to the study.
  
  DOI:
    description: A digital object identifier (DOI) representing a persistent link to a digital resource.
    attributes:
      doi_value:
        required: true
        range: uriorcurie
      doi_category:
        range: DoiCategoryEnum
        description: The resource type the corresponding doi resolves to
      doi_provider:
        range: DoiProviderEnum
        description: The authority, or organization, the DOI is associated with.


id: https://emsl-computing.github.io/BASALT-Schema/sample-processing
name: basalt-schema-sample-processing
title: Sample processing subclasses for BASALT
description: |
  Sample processing subclasses for BASALT.
license: MIT
prefixes:
  basalt_schema: https://emsl-computing.github.io/BASALT-Schema/elements/
  linkml: https://w3id.org/linkml/
default_prefix: basalt_schema
imports:
  - linkml:types
  - basalt_schema

slots:
  
  substances_used:
    range: PortionOfSubstance
    multivalued: true
    description: The substances used in the process.
    todos: is it possible to have this be multivalued?
  
  starting_mass_mg:
    range: float
    description: The mass of sample or analyte used in the first step of the process, in milligrams.
  
  final_mass_mg:
    range: float
    description: The mass of sample or analyte in the processedSample resulting from this activity.

  final_vol_ml:
    range: float
    description: The volume of sample resulting from this activity, in milliliters.

  final_concentration_mg_per_ml:
    range: float
    description: The concentration of the sample or analyte in the processedSample resulting from this activity, in milligrams per milliliter.

classes:

  StandardSampleProcessing:
    is_a: SampleProcessing
    description: >-
      A concrete SampleProcessing subclass for well-documented standard protocols that
      are used repeatedly and whose internal steps are not worth modelling individually.
      It adds no attributes of its own: everything it needs is the inherited in_protocol
      pointer to a SampleProcessingProtocol, which carries the protocol URL and version.

      This is not an escape hatch from the chained representation -- it is a chain of
      length one. It produces the same two ProcessingSampleLink rows (one input_sample,
      one output_sample) at step_number 1 that any other step produces, so downstream
      queries and provenance traversal never have to branch on which of the two
      modelling styles was used, and a protocol can be upgraded from standard to
      fully-stepped later without migrating anything that reads it.

  SampleProcessingProtocol:
    description: >-
      A sample processing protocol: the recipe, not an execution of it. This is the
      single home for protocol_url and protocol_version anywhere in sample processing;
      no SampleProcessing subclass stores them directly. Type-level, so many runs and
      many samples reference the same record. For "which steps actually ran together",
      see SampleProcessingRun.
    slots:
      - name
      - description
      - protocol_url
      - protocol_version
    attributes:
      id:
        identifier: true
        range: uuid

  SampleProcessingRun:
    description: >-
      One concrete execution of a sample processing chain: the instance-level counterpart
      to SampleProcessingProtocol. It is a pure grouping token, deliberately holding no
      protocol or sample data of its own, so there is nothing here that can contradict
      the steps or the edges.

      Every ProcessingSampleLink in one chain carries the same in_run. This is what makes
      "all steps in this chain" a single indexed query on one concrete table, and it is
      what gives step_number something to be a position within.

      A run may cover several starting samples (a PoolingProcess run) or produce several
      final analytes (a FractionationProcess run), which is why the run rather than a
      single "starting sample" pointer is the grouping key -- an ancestor column would be
      ambiguous the moment anything is pooled.
    slots:
      - name
      - description
    attributes:
      id:
        identifier: true
        range: uuid

  ChemicalConversionProcess: 
    is_a: SampleProcessing 
    description: >-
      A chemical conversion process used in sample preparation. A process that 
      results in the interconversion of chemical species by a reaction to 
      transform the reagents into products.
    slots:
      - duration_min
      - temperature_celsius
      - substances_used
    attributes:
      chemical_conversion_category:
        range: ChemicalConversionCategoryEnum
        description: The category of chemical conversion process.
      digestion_method:
        range: DigestionMethodEnum
        description: Named digestion method applied, when the category is protease_cleavage.
      enrichment_type:
        range: EnrichmentTypeEnum
        description: Type of enrichment performed, when this process is an enrichment step.
      labeling_method:
        range: LabelingMethodEnum
        description: Chemical labeling strategy applied in this process (e.g., TMT).

  Extraction:
    is_a: SampleProcessing 
    description: >-
      The removal and isolation of a desired analyte from other material 
      in a sample.
    slots:
      - substances_used
      - starting_mass_mg
    attributes:
      extraction_target:
        range: AnalyteCategoryEnum
        multivalued: true
        description: The target analyte(s) or compound class(es) for the extraction process.
      extraction_method:
        range: ExtractionMethodEnum
        description: Named extraction method applied (e.g., MPLEx, bead beating, TCA/Acetone).

  FiltrationProcess:
    is_a: SampleProcessing
    description: >-
      The process of segregation of phases; e.g. the separation of suspended
      solids from a liquid or gas, usually by forcing a carrier gas or liquid through
      a porous medium.
    slots:
      - container_size_ml
      - container_type
      - filter_material
      - filter_pore_size_um
      - is_pressurized
      - separation_method
      - volume_ml
    slot_usage:
      volume_ml:
        description: The volume of the sample that was filtered, in milliliters.

  FractionationProcess:
    is_a: SampleProcessing
    description: >
      A fractionation process (e.g., off-line high pH fractionation, SCX, etc.) that splits
      an input sample into multiple fractions for downstream LC-MS/MS.
    slots:
      - lims_protocol_instance_id
      
  NormalizationProcess:
    is_a: SampleProcessing
    description: >-
      A process that adjusts sample amounts (e.g., protein mass or volume)
      to a common level across samples, prior to downstream processing.
    attributes:
      normalization_method:
        range: NormalizationMethodEnum
        description: The strategy used for normalization (equal mass, equal volume, etc.).
      target_mass_mg:
        range: float
        description: >-
          Target volume of analyte per sample after normalization, 
          in milligrams, if appropriate. Otherwise fill out target_vol_ul.
      target_vol_ul:
        range: float
        description: >-
          Target volume of analyte per sample after normalization, 
          in microliters, if appropriate. Otherwise fill out target_mass_mg.

  PoolingProcess:
    is_a: SampleProcessing
    description: >-
      A laboratory pooling process that physically mixes multiple input samples
      into a single pooled processed sample for downstream analysis.
      Typically corresponds to the L7 "Sample Pooling" / "Pooling" protocols.
    slots:
      - final_mass_mg
      - final_vol_ml

  PortionOfSubstance:
    description: A portion of a substance with specific characteristics.
    slots:
      - volume_ml
    attributes:
      known_as:
        range: ChemicalEntityEnum
        description: Common name or identifier for the substance.
      substance_role:
        range: SubstanceRoleEnum
        description: The role or function of the substance in the context of its use.
      source_concentration_mg_per_ml:
        range: float
        description: >-
          Concentration of the substance before it is added to the experiment, 
          in milligrams per milliliter.
      final_concentration_mg_per_ml:
        range: float
        description: >-
          Concentration of the substance in the combined tube/experimental 
          container after everything in this step is added, in milligrams 
          per milliliter.

  ProteinQuantification:
    is_a: SampleProcessing
    description: >-
      A protein quantification assay (e.g., Coomassie or BCA) performed on a sample
      to determine protein concentration prior to downstream processing.
    slots:
      - lims_protocol_instance_id
      - final_concentration_mg_per_ml
    attributes:
      protein_assay_type:
        range: ProteinAssayTypeEnum
        required: true
        description: The type of protein assay (Coomassie, BCA, etc.).

  ResuspensionProcess:
    is_a: SampleProcessing
    description: >-
      Resuspension of an analyte (e.g., drying and resolubilizing peptides in LC buffer).
    slots:
      - lims_protocol_instance_id
      - final_vol_ml
      - substances_used

  SolidPhaseExtractionProcess:
    is_a: SampleProcessing
    description: >-
      A solid phase extraction (SPE) step (e.g., C18 desalting) performed as sample preparation.
    slots:
      - lims_protocol_instance_id
      - uses_chromatography
      
  SubsamplingProcess:
    is_a: SampleProcessing
    description: >-
      A laboratory subsampling process that takes a portion of an existing 
      sample and produces a derived (processed) sample for downstream 
      analysis. (Separating a sample aliquot from the starting material for 
      downstream activity.)
    slots:
      - final_mass_mg
      - final_vol_ml


- chromatography_configurations:
  - id: chromatography_uuid
    name: MONet_LCMS_HILIC
    description: MONet standard liquid chromatography configuration for LCMS analyses
    column: ACQUITY UPLC BEH HILIC
    column_dimensions: 2.1 x 100 mm
    column_manufacturer: Waters
    chromatography_type: liquid_chromatography
    stationary_phase: BEH-HILIC
    temperature_celsius: 50
    duration_min: 12
    flow_rate_ul_min: 300
    injection_volume_ul: 3


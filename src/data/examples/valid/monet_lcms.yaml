# Example of records representing LCMS analysis for MONet samples
# Based on information provided in https://pnnl.sharepoint.com/sites/EMSL/Shared%20Documents/Forms/AllItems.aspx?id=%2Fsites%2FEMSL%2FShared%20Documents%2FManagement%20%26%20Operations%2FUser%20Program%2FMONet%2FLC%2DMS%2FFinal%20MONet%20protocols

- samples:
  - id: sample_uuid
    name: 65432_1_EX
    description: Soil sample from corn field
    emsl_activity: emsl_activity_uuid1
    lims_barcode: 123456789
    analysis_type: metabolome
    depth: 0-10 cm
    lat_lon: 40, -105.5

- sample_processing_activities:
  - id: subsampling_process_1_uuid
    name: 65432_1_EX_TOP_soil_subsampling
    description: Subsampling soil from the top part of core 65432_1_EX for LCMS analysis.
    in_protocol: sample_processing_protocol_uuid
    final_mass_mg: 6000

  - id: subsampling_process_2_uuid
    name: 65432_1_EX_BTM_soil_subsampling
    description: Subsampling soil from the bottom part of core 65432_1_EX for LCMS analysis.
    in_protocol: sample_processing_protocol_uuid
    final_mass_mg: 6000

  - id: extraction_1_uuid
    name: 65432_1_EX_TOP_lcms_extraction
    description: Extraction of metabolites from 65432_1_EX_TOP for LCMS analysis.
    substances_used: 
      - known_as: water
        substance_role: solvent
        volume_ml: 6
      - known_as: methanol
        substance_role: solvent
        volume_ml: 24
    starting_mass_mg: 6000 # soil mass subsampled above
    extraction_target: metabolite
    extraction_method: other
    in_protocol: sample_processing_protocol_uuid

  - id: extraction_2_uuid
    name: 65432_1_EX_BTM_lcms_extraction
    description: Extraction of metabolites from 65432_1_EX_BTM for LCMS analysis.
    substances_used: 
      - known_as: water
        substance_role: solvent
        volume_ml: 6
      - known_as: methanol
        substance_role: solvent
        volume_ml: 24
    starting_mass_mg: 6000 # soil mass subsampled above
    extraction_target: metabolite
    extraction_method: other
    in_protocol: sample_processing_protocol_uuid

  - id: filtration_process_1_uuid
    name: 65432_1_EX_TOP_filter_extract
    description: Filtration of H2O/MeOH extracted metabolites from 65432_1_EX_TOP
    container_size_ml: 
    container_type: tube
    filter_material: polyethersulfone
    filter_pore_size_um: 0.45
    is_pressurized: true
    separation_method: syringe filtration
    volume_ml: 30
    in_protocol: sample_processing_protocol_uuid

  - id: filtration_process_2_uuid
    name: 65432_1_EX_BTM_filter_extract
    description: Filtration of H2O/MeOH extracted metabolites from 65432_1_EX_BTM
    container_size_ml: 
    container_type: tube
    filter_material: polyethersulfone
    filter_pore_size_um: 0.45
    is_pressurized: true
    separation_method: syringe filtration
    volume_ml: 30
    in_protocol: sample_processing_protocol_uuid

  - id: subsampling_process_3_uuid
    name: 65432_1_EX_TOP_extract_subsampling
    description: Subsampling of H2O/MeOH extracted metabolites from 65432_1_EX_TOP
    in_protocol: sample_processing_protocol_uuid
    final_mass_mg:
    final_vol_ml: 15

  - id: subsampling_process_4_uuid
    name: 65432_1_EX_BTM_extract_subsampling
    description: Subsampling of H2O/MeOH extracted metabolites from 65432_1_EX_BTM
    in_protocol: sample_processing_protocol_uuid
    final_mass_mg:
    final_vol_ml: 15

  - id: resuspension_process_1_uuid
    name: 65432_1_EX_TOP_resusp
    description: Resuspension of 65432_1_TOP extracts for LCMS analysis.
    in_protocol: sample_processing_protocol_uuid
    final_mass_mg:
    final_vol_ml: 0.1

  - id: resuspension_process_2_uuid
    name: 65432_1_EX_BTM_resusp
    description: Resuspension of 65432_1_BTM extracts for LCMS analysis.
    in_protocol: sample_processing_protocol_uuid
    final_mass_mg:
    final_vol_ml: 0.1
    substances_used:
      - known_as: water
        substance_role: solvent
        volume_ml: 0.1

  - id: filtration_process_3_uuid
    name: 65432_1_EX_TOP_resusp_filter
    description: Filtration of resuspended 65432_1_TOP extracts before instrument loading.
    container_size_ml: 
    container_type: 96-well filter plate
    filter_material: PTFE
    filter_pore_size_um: 0.2
    is_pressurized: true
    separation_method: plate vacuum
    volume_ml: 0.1
    in_protocol: sample_processing_protocol_uuid

  - id: filtration_process_4_uuid
    name: 65432_1_EX_BTM_resusp_filter
    description: Filtration of resuspended 65432_1_BTM extracts before instrument loading.
    container_size_ml: 
    container_type: 96-well filter plate
    filter_material: PTFE
    filter_pore_size_um: 0.2
    is_pressurized: true
    separation_method: plate vacuum
    volume_ml: 0.1
    in_protocol: sample_processing_protocol_uuid


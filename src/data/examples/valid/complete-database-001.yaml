    sample_name: "CORN_FIELD_001_REP_A"
    proposal_id: 12345
    sampling_set: "Midwest_Agricultural_2024"
    sample_base_type: "processed_sample"
    processed_sample_type: "replicate"
    rep: 1
    
  - id: "https://example.org/processed_samples/CORE_001_MID"

    name: "Agricultural soil sample"
    description: "Surface soil from corn field"
    sample_name: "CORN_FIELD_001"
    proposal_id: 12345
    sampling_set: "Midwest_Agricultural_2024"
    sample_base_type: "sample"
    sampling_activity_id: "https://example.org/activities/ACT_001"
    sample_type: "soil"
    soil_type: "surface_layer"
    guid_source: "Laboratory generated"
    
  - id: "https://example.org/samples/SAMPLE_002"
    name: "Forest soil sample"

# Example of records representing an ICP-MS workflow for critical minerals
# and materials (CMM) analysis of soil samples. (UCMM campaign)
#
# One starting soil sample is split into two subsamples: one goes through
# microwave digestion (total recoverable elements), the other goes through
# DTPA extraction (plant-available elements). Both resulting solutions are run
# on the same ICP-MS instrument/configuration and processed independently,
# producing one CMMDigestionProduct and one CMMExtractionProduct.

- samples:
  - id: sample_uuid
    name: 65432_1_EX
    description: Soil sample from corn field
    emsl_activity: emsl_activity_uuid1
    lims_barcode: 123456789
    analysis_type: cmm
    depth: 0-10 cm
    lat_lon: 40, -105.5

- sample_processing_activities:
  - id: subsampling_digestion_uuid
    name: 65432_1_EX_cmm_digestion_subsampling
    description: Subsampling soil from 65432_1_EX for microwave acid digestion prior to ICP-MS analysis of total recoverable elements.
    in_protocol: sample_processing_protocol_1_uuid
    final_mass_mg: 250

  - id: subsampling_extraction_uuid
    name: 65432_1_EX_cmm_extraction_subsampling
    description: Subsampling soil from 65432_1_EX for DTPA extraction prior to ICP-MS analysis of plant-available elements.
    in_protocol: sample_processing_protocol_2_uuid
    final_mass_mg: 2000

  - id: digestion_uuid
    name: 65432_1_EX_cmm_digestion
    description: Microwave digestion of the 65432_1_EX soil subsample for total recoverable trace element analysis by ICP-MS.
    substances_used:
      - known_as: nitric_acid
        substance_role: solvent
        volume_mL: 6
    chemical_conversion_category: microwave_digestion
    protein_digestion_method:
    enrichment_type:
    labeling_method:
    duration_min: 20
    temperature_celsius: 210
    in_protocol: sample_processing_protocol_1_uuid

  - id: cmm_extraction_uuid
    name: 65432_1_EX_cmm_dtpa_extraction
    description: DTPA extraction of the 65432_1_EX soil subsample for plant-available trace element analysis by ICP-MS.
    substances_used:
      - known_as: DTPA
        substance_role: solvent
        volume_mL: 20
      - known_as: water
        substance_role: solvent
        volume_mL: 5
    starting_mass_mg: 2000 # soil mass subsampled above
    extraction_target:
      - cmm
    extraction_method: DTPA
    in_protocol: sample_processing_protocol_2_uuid

- sample_processing_grouping:
  - id: sample_processing_protocol_1_uuid
    name: MONet CMM ICP-MS digestion protocol
    description: MONet CMM ICP-MS digestion protocol
    protocol_url: email_from_tom.com
    protocol_version: 1.0.0

  - id: sample_processing_protocol_2_uuid
    name: MONet CMM ICP-MS extraction protocol
    description: MONet CMM ICP-MS extraction protocol
    protocol_url: email_from_tom.com
    protocol_version: 1.0.0

  - id: sample_processing_run_1_uuid
    name: MONet CMM ICP-MS digestion prep
    description: CMM ICP-MS digestion prep for 65432_1_EX soil sample

  - id: sample_processing_run_2_uuid
    name: MONet CMM ICP-MS extraction prep
    description: CMM ICP-MS extraction prep for 65432_1_EX soil sample

  - id: processing_sample_link_uuid_1
    processing_id: subsampling_digestion_uuid
    step_number: 1
    role: input_sample
    sample_id: sample_uuid
    in_run: sample_processing_run_1_uuid

  - id: processing_sample_link_uuid_2
    processing_id: subsampling_digestion_uuid
    step_number: 1
    role: output_sample
    sample_id: processed_sample_1_uuid
    in_run: sample_processing_run_1_uuid

  - id: processing_sample_link_uuid_3
    processing_id: subsampling_extraction_uuid
    step_number: 1
    role: input_sample
    sample_id: sample_uuid
    in_run: sample_processing_run_2_uuid

  - id: processing_sample_link_uuid_4
    processing_id: subsampling_extraction_uuid
    step_number: 1
    role: output_sample
    sample_id: processed_sample_2_uuid
    in_run: sample_processing_run_2_uuid

  - id: processing_sample_link_uuid_5
    processing_id: cmm_digestion_uuid
    step_number: 2
    role: input_sample
    sample_id: processed_sample_1_uuid
    in_run: sample_processing_run_1_uuid

  - id: processing_sample_link_uuid_6
    processing_id: cmm_digestion_uuid
    step_number: 2
    role: output_sample
    sample_id: processed_sample_3_uuid
    in_run: sample_processing_run_1_uuid

  - id: processing_sample_link_uuid_7
    processing_id: cmm_extraction_uuid
    step_number: 2
    role: input_sample
    sample_id: processed_sample_2_uuid
    in_run: sample_processing_run_2_uuid

  - id: processing_sample_link_uuid_8
    processing_id: cmm_extraction_uuid
    step_number: 2
    role: output_sample
    sample_id: processed_sample_4_uuid
    in_run: sample_processing_run_2_uuid


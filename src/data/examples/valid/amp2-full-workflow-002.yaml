# ============================================================================
# amp2-full-workflow-002.yaml
#
# Simulated AMP2 dataset for ingestion testing against the BASALT schema.
# Generated from src/basalt_schema/schema/ (media_strain_culture_plate.yaml,
# organism.yaml, sample_classes.yaml, slots.yaml, enums.yaml).
#
# Scope
#   15 AMP2UserSample records mapped many-to-one onto 8 organism records,
#   each carried through the full AMP2 lab workflow
#     StrainPurity -> StockCulturePreparation -> PreCultureGrowth ->
#     ExperimentalCulture -> AMP2PlateSetupActivity
#   then read for OD600 every 2 hours for 24 hours (13 timepoints) on
#   three plates: two 96-well and one 384-well.
#
# WHERE THE SAMPLE ID LIVES  (read this first)
#   The submitter's sample is an `amp2_user_samples` record.
#     .id   is the primary key, e.g. "urn:amp2:sample:AMP2-0003".
#           Every FK in this file points at THIS value.
#     .name is the human-readable name the submitter wrote on the tube,
#           e.g. "PP_0055-R1". It is a label, never a foreign key.
#   The strain/biological identity is a SEPARATE record in `organisms`,
#   reached via amp2_user_samples[].organism_ref. Several samples may
#   share one organism (PP_0055 has three), so an organism id can never
#   stand in for a sample id.
#   Downstream, AMP2WellMetadata.sample_id in `plate_setup_activities`
#   holds the amp2_user_samples[].id of whatever went into that well,
#   even though what was physically pipetted is the experimental_culture
#   processed sample derived from it. Follow processing_sample_links to
#   walk the physical chain; follow well.sample_id to answer "whose
#   sample is in this well".
#   00_sample_identity_crosswalk.csv in the sibling directory lays the
#   whole chain out one row per sample.
#
# Structural notes
#   * processing_sample_links is the SINGLE source of truth for which
#     samples an activity consumed and produced (ProcessingSampleLink:
#     sample_base_id, processing_id, step_number, role). Activities
#     deliberately do NOT repeat input/output ids inline.
#   * organism replaces the retired Strain class; ORGANISM records carry
#     strain_identifier, genotype_segment_*, component_*, trait,
#     phenotype, trophic_level, pathogenicity, propagation.
#   * StrainPurity is a pass/fail QC gate and emits no processed sample,
#     per media_strain_culture_plate.yaml.
#   * oxygen_relationship is the canonical slot name (oxygen_status is an
#     alias).
#
# Deliberate data conditions (all schema-valid; none are schema violations)
#   * AMP2-0013 fails its first purity streak (contaminant_strains set),
#     is re-streaked, and completes the workflow.
#   * AMP2-P002 t=10h: the read was aborted mid-plate. The
#     AMP2DataGenerationActivity exists with read_status "aborted" and
#     NO AMP2ODProduct, so that plate has 12 products, not 13.
#   * AMP2-P003 t=14h: condensation over the YPD quadrant (rows I-P,
#     columns 13-24) -- 96 wells flagged "failed" at saturated values.
#   * AMP2-P001 well D07 is flagged "contaminated" from t=12h onward.
#   * Eight scattered wells are flagged "outlier" at single timepoints.
#   * Wild-type KT2440 (urn:amp2:organism:KT2440-WT) leaves trait,
#     phenotype, strain_mutation and modification_method null on purpose.
# ============================================================================

dataset:
  id: "urn:amp2:dataset:amp2-full-workflow-002"
  name: "AMP2 full-workflow growth screen 002"
  description: "15 user samples, 8 organisms, 7 media batches, 3 plates (2 x 96-well, 1 x 384-well), OD600 every 2 h for 24 h."
  emsl_activity: "AMP2 FY26 microbial growth screen"
  schema_source: "src/basalt_schema/schema/media_strain_culture_plate.yaml"
  counts:
    organisms: 8
    amp2_user_samples: 15
    media_preparations: 7
    culture_growth_activities: 60
    plate_setup_activities: 3
    wells_total: 576
    data_generation_activities: 39
    od_products: 38
    well_readings: 7392
    processing_sample_links: 146


# plate_setup_activities  (class: AMP2PlateSetupActivity)
#   media_ref is the plate-level default. A well whose media_ref is null
#   inherits it; a non-null well media_ref overrides it for that well only.
#   well_metadata entries are AMP2WellMetadata (embedded, not a table).
# ---------------------------------------------------------------------------
plate_setup_activities:
  - id: "urn:amp2:activity:plate-setup-AMP2-P001"
    activity_type: "AMP2PlateSetupActivity"
    name: "AMP2-P001 plate setup"

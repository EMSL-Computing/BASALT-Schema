---
id: https://w3id.org/MONet/analysis-api-schema
name: processed_data
title: MONet Analysis API Processed Data Return Types
description: |-
  LinkML-based schema for MONet soil analysis api processed data types that are currently created and returned
  without a schema within Flask API endpoints 
license: MIT
# see_also:
#   - https://MONet.github.io/analysis-api-schema
#   - https://github.com/pnnl/analysis-api

prefixes:
  analysis_api_schema: https://w3id.org/MONet/analysis-api-schema/
  # linkml: https://w3id.org/linkml/
  # schema: http://schema.org/
  # qudt: http://qudt.org/schema/qudt/
  # unit: http://qudt.org/vocab/unit/
  # uuid: https://w3id.org/uuid/

default_prefix: analysis_api_processed_data
default_range: string

imports:
  - linkml:types

classes:

  

  pH:
    attributes:
      # proposal_id
      # core_section
      # ph

      id:
        identifier: true
        range: uuid
        description: Unique identifier for the campaign
      campaign_name:
        range: string
        required: true
        description: Short name or code for the campaign
      campaign_year:
        range: integer
        description: Primary year associated with the campaign
      display_name:
        range: string
        description: Human-readable display name for the campaign
      description:
        range: string
        description: Detailed description of the campaign objectives and scope

---
# =============================================================================
# Soil Biochemical Properties CSV Schema
# =============================================================================
# 
# CONTEXT and Purpose:
# - Documentation and communication tool for the Soil_BioChemical_properties.csv file generaetd by: analysis-api/web/analysisapi/blueprints/zip_download_blueprint.py
# - Reference for understanding column names and units
# - NOT used for validation (no min/max constraints included)
# - Data levels: L2 (sample averages) or L1 (replicate-level data)
# - This schema is derived from the MONet Analysis API Schema as the source of truth https://w3id.org/MONet/analysis-api-schema
# - and therefore column names are faithful to the canonical schema, not the zipdownloader as of last update
#
# TODO:
# This file should be updated when:
# - Column names are changed in zip_download_blueprint.py
# - New analytical methods/columns are added
# - Unit definitions or descriptions are updated in the canonical schema
# - the ion units meq_per_100g are currently out of step with the source of truth but this should be reconciled soon.
##
# NOTES:
# - L1 data includes a "Replicate" column; L2 data does not
# - Some columns may be empty upon download if specific analyses were not performed
# - Flag columns indicate data quality concerns
#
# Last Updated: 2026-01-21
# =============================================================================

id: https://w3id.org/MONet/analysis-api-schema/soil-biochemical-properties
name: soil_biochemical_properties
title: MONet Soil Biochemical Properties CSV Schema
description: |-
  Schema for the aggregated Soil_BioChemical_properties.csv file generated by the
  MONet Data Portal ZipDownloader. This file contains integrated soil biogeochemical
  analysis data across multiple analytical methods and measurements.
license: MIT

prefixes:
  analysis_api_schema: https://w3id.org/MONet/analysis-api-schema/
  linkml: https://w3id.org/linkml/

default_prefix: soil_biochemical_properties
default_range: string

imports:
  - linkml:types

classes:
  
  SoilBioChemicalProperties:
    description: |-
      A row in the Soil_BioChemical_properties.csv file representing aggregated
      biogeochemical analysis results for a single soil sample. Each row combines
      data from multiple analytical methods (pH, texture, nutrients, biomass, etc.)
      into a unified record.
    attributes:
      
      # Core Sample Identifiers
      Sample_Name:
        description: |-
          Composite identifier in format: {Proposal_ID}_{Sampling_Set}_{Core_Section}
          Example: 60881_1_B
          This serves as the primary sample identifier in the deliverable.
        range: string
        required: true
        
      Replicate:
        description: |-
          Replicate number for the sample (L1 data only).
          For analyses with technical replicates (biomass, nitrogen, phosphorus, WEOM, MAOM, GWC),
          this indicates which replicate measurement this row represents.
          Only present when l1_checked=True flag is set during download.
        range: integer
        required: false
        
      Proposal_ID:
        description: |-
          The 5-digit EMSL user proposal/project ID.
          Corresponds to the EMSL project under which the sample was collected and analyzed.
        range: string
        required: true
        
      Sampling_Set:
        description: |-
          Identifier for the sampling set or campaign number.
          Groups samples collected together as part of the same sampling event or study.
        range: string
        required: true
        
      Core_Section:
        description: |-
          The vertical section of the soil core from which this sample was taken.
          Common values: TOP, MID, BTM (top, middle, bottom sections of core).
          Typically represented as single letter: T, M, B.
        range: string
        required: true
      
      # pH Measurements (pHProduct)
      pH:
        description: |-
          Soil pH measurement (pH units).
          Source: pHProduct class from canonical schema.
          Represents soil acidity/alkalinity on the standard pH scale (0-14).
        range: double
        required: false
      
      # Microbial Biomass (MicrobialBiomassProduct)
      MBC_mg_per_kg:
        description: |-
          Microbial Biomass Carbon in milligrams per kilogram of soil (mg/kg).
          Source: MicrobialBiomassProduct.mbc_id from canonical schema.
          Represents the amount of carbon contained in living soil microorganisms.
          L2 data: average across replicates
          L1 data: individual replicate values
        range: double
        required: false
        
      MBN_mg_per_kg:
        description: |-
          Microbial Biomass Nitrogen in milligrams per kilogram of soil (mg/kg).
          Source: MicrobialBiomassProduct.mbn_id from canonical schema.
          Represents the amount of nitrogen contained in living soil microorganisms.
          L2 data: average across replicates
          L1 data: individual replicate values
        range: double
        required: false
      
      # Ion Analysis (IonsAnalysisProduct)
      SO4_S_mg_per_kg:
        description: |-
          Sulfate-Sulfur (SO4-S) in milligrams per kilogram of soil (mg/kg).
          Source: IonsAnalysisProduct.sulfate_id from canonical schema.
          Represents plant-available sulfur in sulfate form.
        range: double
        required: false
        
      B_mg_per_kg:
        description: |-
          Boron (B) in milligrams per kilogram of soil (mg/kg).
          Source: IonsAnalysisProduct.boron_id from canonical schema.
          Essential micronutrient for plant growth.
        range: double
        required: false
        
      Zn_mg_per_kg:
        description: |-
          Zinc (Zn) in milligrams per kilogram of soil (mg/kg).
          Source: IonsAnalysisProduct.zinc_id from canonical schema.
          Essential micronutrient for plant growth and enzyme function.
        range: double
        required: false
        
      Mn_mg_per_kg:
        description: |-
          Manganese (Mn) in milligrams per kilogram of soil (mg/kg).
          Source: IonsAnalysisProduct.manganate_id from canonical schema.
          Essential micronutrient involved in photosynthesis and enzyme activation.
        range: double
        required: false
        
      Cu_mg_per_kg:
        description: |-
          Copper (Cu) in milligrams per kilogram of soil (mg/kg).
          Source: IonsAnalysisProduct.copper_id from canonical schema.
          Essential micronutrient for plant development and disease resistance.
        range: double
        required: false
        
      Fe_mg_per_kg:
        description: |-
          Iron (Fe) in milligrams per kilogram of soil (mg/kg).
          Source: IonsAnalysisProduct.iron_id from canonical schema.
          Essential nutrient for chlorophyll synthesis and enzyme systems.
        range: double
        required: false
        
      Ca_meq_per_100_g:
        description: |-
          Calcium (Ca) in milliequivalents per 100 grams of soil (meq/100g).
          Source: IonsAnalysisProduct.calcium_id from canonical schema.
          Major nutrient and structural component of cell walls.
        range: double
        required: false
        
      Mg_meq_per_100_g:
        description: |-
          Magnesium (Mg) in milliequivalents per 100 grams of soil (meq/100g).
          Source: IonsAnalysisProduct.magnesium_id from canonical schema.
          Central atom in chlorophyll molecule and enzyme activator.
        range: double
        required: false
        
      Na_meq_per_100_g:
        description: |-
          Sodium (Na) in milliequivalents per 100 grams of soil (meq/100g).
          Source: IonsAnalysisProduct.sodium_id from canonical schema.
          Can affect soil structure and plant salt tolerance.
        range: double
        required: false
        
      K_meq_per_100_g:
        description: |-
          Potassium (K) in milliequivalents per 100 grams of soil (meq/100g).
          Source: IonsAnalysisProduct.potassium_id from canonical schema.
          Major nutrient essential for water regulation and enzyme activation.
        range: double
        required: false
        
      CEC_meq_per_100_g:
        description: |-
          Cation Exchange Capacity in milliequivalents per 100 grams (meq/100g).
          Source: IonsAnalysisProduct.cation_exchange_capacity_id from canonical schema.
          Measure of soil's ability to hold and exchange cations (positively charged ions).
          Higher CEC indicates greater nutrient retention capacity.
        range: double
        required: false
      
      # Elemental Analysis (ElementalAnalysisProduct)
      Total_C_percent:
        description: |-
          Total Carbon as percentage of dry soil weight (%).
          Source: ElementalAnalysisProduct.total_carbon_id from canonical schema.
          Includes both organic and inorganic carbon fractions.
        range: double
        required: false
        
      Total_N_percent:
        description: |-
          Total Nitrogen as percentage of dry soil weight (%).
          Source: ElementalAnalysisProduct.total_nitrogen_id from canonical schema.
          Includes organic nitrogen and mineral nitrogen forms.
        range: double
        required: false
        
      Total_S_percent:
        description: |-
          Total Sulfur as percentage of dry soil weight (%).
          Source: ElementalAnalysisProduct.total_sulfur_id from canonical schema.
          Total sulfur content across all chemical forms.
        range: double
        required: false
      
      # Nitrogen Analysis (NitrogenAnalysisProduct)
      NH4_N_mg_per_kg:
        description: |-
          Ammonium Nitrogen (NH4-N) in milligrams per kilogram of soil (mg/kg).
          Source: NitrogenAnalysisProduct.nh4_n_id from canonical schema.
          Plant-available nitrogen in ammonium form.
          L2 data: average across replicates
          L1 data: individual replicate values
        range: double
        required: false
        
      NO3_N_mg_per_kg:
        description: |-
          Nitrate Nitrogen (NO3-N) in milligrams per kilogram of soil (mg/kg).
          Source: NitrogenAnalysisProduct.no3_n_id from canonical schema.
          Plant-available nitrogen in nitrate form.
          L2 data: average across replicates
          L1 data: individual replicate values
        range: double
        required: false
      
      # Phosphorus Analysis (PhosphorusAnalysisProduct)
      PO4_P_mg_per_kg:
        description: |-
          Phosphate Phosphorus (PO4-P) in milligrams per kilogram of soil (mg/kg).
          Source: PhosphorusAnalysisProduct.phosphorus_id from canonical schema.
          Plant-available phosphorus extracted by the method specified in PO4_P_extraction.
          L2 data: average across replicates
          L1 data: individual replicate values
        range: double
        required: false
        
      PO4_P_extraction:
        description: |-
          Extraction method used for phosphorus analysis.
          Source: PhosphorusAnalysisProduct.extraction_method from canonical schema.
          Common methods: Bray P1, Mehlich-3, Olsen, etc.
          Extraction method affects measured P values and interpretation.
        range: string
        required: false
      
      # Moisture Content (GWCMoistureProduct)
      GWC_percent:
        description: |-
          Gravimetric Water Content as percentage (%).
          Source: GWCMoistureProduct.gwc_percent_id from canonical schema.
          Ratio of water mass to dry soil mass, expressed as percentage.
          GWC = (wet_mass - dry_mass) / dry_mass × 100
          L2 data: average across replicates
          L1 data: individual replicate values
        range: double
        required: false
      
      # Water Extractable Organic Matter (WEOMProduct)
      WEOM_TOC_mg_per_kg:
        description: |-
          Water Extractable Organic Matter - Total Organic Carbon in mg/kg.
          Source: WEOMProduct.total_organic_carbon_id from canonical schema.
          Readily soluble organic carbon that can be extracted with water.
          Represents the most labile and bioavailable carbon fraction.
          L2 data: average across replicates
          L1 data: individual replicate values
        range: double
        required: false
        
      WEOM_TN_mg_per_kg:
        description: |-
          Water Extractable Organic Matter - Total Nitrogen in mg/kg.
          Source: WEOMProduct.total_nitrogen_id from canonical schema.
          Readily soluble organic nitrogen that can be extracted with water.
          L2 data: average across replicates
          L1 data: individual replicate values
        range: double
        required: false
      
      # Mineral Associated Organic Matter (MAOMProduct)
      MAOM_TOC_mg_per_kg:
        description: |-
          Mineral Associated Organic Matter - Total Organic Carbon in mg/kg.
          Source: MAOMProduct.total_organic_carbon_id from canonical schema.
          Organic carbon bound to soil minerals, representing stabilized carbon fraction.
          MAOM is more resistant to decomposition than particulate organic matter.
          L2 data: average across replicates
          L1 data: individual replicate values
        range: double
        required: false
        
      MAOM_TN_mg_per_kg:
        description: |-
          Mineral Associated Organic Matter - Total Nitrogen in mg/kg.
          Source: MAOMProduct.total_nitrogen_id from canonical schema.
          Organic nitrogen bound to soil minerals.
          L2 data: average across replicates
          L1 data: individual replicate values
        range: double
        required: false
      
      # Texture Analysis (TextureProduct)
      Clay_percent:
        description: |-
          Clay content as percentage of soil by weight (%).
          Source: TextureProduct.clay_pct_id from canonical schema.
          Particle size < 0.002 mm (< 2 micrometers).
          Clay particles have large surface area and high cation exchange capacity.
        range: double
        required: false
        
      Sand_percent:
        description: |-
          Sand content as percentage of soil by weight (%).
          Source: TextureProduct.sand_pct_id from canonical schema.
          Particle size 0.05-2.0 mm (50-2000 micrometers).
          Sand particles provide soil structure and drainage.
        range: double
        required: false
        
      Silt_percent:
        description: |-
          Silt content as percentage of soil by weight (%).
          Source: TextureProduct.silt_pct_id from canonical schema.
          Particle size 0.002-0.05 mm (2-50 micrometers).
          Silt has moderate water and nutrient retention properties.
        range: double
        required: false
      
      # Enzyme Activity (EnzymeProduct)
      Beta_Glucosidase_ug_pNP_per_g_per_h:
        description: |-
          Beta-Glucosidase enzyme activity in micrograms para-nitrophenol per gram per hour (μg pNP/g/h).
          Source: EnzymeProduct.beta_glucosidase_ug_pnp_per_g_per_h_id from canonical schema.
          Enzyme involved in cellulose degradation and carbon cycling.
          Activity level indicates microbial decomposition potential.
        range: double
        required: false
      
      # Bulk Density (BulkDensityProduct)
      Bulk_density_g_per_cm3:
        description: |-
          Soil bulk density in grams per cubic centimeter (g/cm³).
          Source: BulkDensityProduct.bulk_density_id from canonical schema.
          Mass of dry soil per unit volume, indicator of soil compaction.
          Typical range: 1.0-1.8 g/cm³ for mineral soils.
          Lower values indicate higher porosity and organic matter content.
        range: double
        required: false
      
      # Data Quality Flags
      # Note: Flag columns are dynamically added based on which analyses have quality concerns
      # Flag naming pattern: flag_{measurement_name} or {MeasurementName}_flag
      # Flag values typically indicate: outliers, detection limits, procedural issues, etc.
      # Specific flag columns and values vary by analysis type and are documented in Column_Descriptions.xlsx


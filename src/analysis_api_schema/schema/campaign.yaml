---
id: https://w3id.org/MONet/analysis-api-schema/campaign
name: analysis-api-schema-campaign
title: MONet Analysis API Campaign Schema
description: |-
  LinkML-based schema for MONet soil analysis data management and metadata enrichment.
  This schema defines the data models for samples, processed samples, site metadata,
  and enrichment providers used in the MONet Analysis API.
license: MIT
# see_also:
  # - https://MONet.github.io/analysis-api-schema
  # - https://github.com/pnnl/analysis-api

prefixes:
  analysis_api_schema: https://w3id.org/MONet/analysis-api-schema/

default_prefix: analysis_api_schema
default_range: string

imports:
  - linkml:types

classes:
  campaign:
    description: |-
      A research campaign that encompasses one or more studies.
      Campaigns are organizational units, typically lasting a single fiscal year beginning in FY26, that group related studies together.
    attributes:
      id:
        identifier: true
        range: uuid
        description: Unique identifier for the campaign
      campaign_name:
        range: string
        required: true
        description: Short name or code for the campaign
      campaign_year:
        range: integer
        description: Primary year associated with the campaign
      display_name:
        range: string
        description: Human-readable display name for the campaign
      description:
        range: string
        description: Detailed description of the campaign objectives and scope

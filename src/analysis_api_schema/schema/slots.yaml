  petroleum_hydrocarb:
    description: 'Concentration of petroleum hydrocarbon (Unit: umol/L)'
    pattern: ^\d+(\.\d+)?\s*umol/L$
    range: string
    title: petroleum hydrocarbon

  ph:
    description: pH measurement of the sample or liquid portion of sample or aqueous
      phase of the fluid
    range: number
    title: pH

  ph_adjustment:
    description: Whether the entity was pH-adjusted
    range: boolean
    required: false

  ph_meth:
    description: Reference or method used in determining ph of the sample
    range: string
    title: pH method

  ph_regm:
    description: Information about treatment involving exposure of plants to varying
      levels of pH of the growth media, treatment regimen including how many times the
      treatment was repeated, how long each treatment lasted, and the start and end time
      of the entire treatment; can include multiple regimen
    range: string
    title: pH regimen

  ph_target:
    description: Target pH value (required if ph_adjustment is true)
    range: float
    required: false

  phaeopigments:
    description: 'Concentration of phaeopigments; can include multiple phaeopigments
      separated by a `;` (Unit: mg/cm3)'
    pattern: ^\d+(\.\d+)?\s*mg/cm3(;\s*\d+(\.\d+)?\s*mg/cm3)*$
    range: string
    title: phaeopigments

  phenotype:
    description: |-
      Observable characteristics of the biological entity.
      Example: "aprimycin resistance, gene knockdown dCas12a construct"
    range: string
  phosphate:
    description: 'Concentration of phosphate (Unit: umol/L)'
    pattern: ^\d+(\.\d+)?\s*umol/L$
    range: string
    title: phosphate

  phosplipid_fatt_acid:
    description: Concentration of phospholipid fatty acids; can include multiple values
      separated by `;`. Provide the phospholipid fatty acids followed by the measurement
      value ({phospholipid fatty acid name}{value} {unit})
    range: string
    title: phospholipid fatty acid

  photochemical_exposure:
    description: "This term is used to describe a chemical reaction caused by absorption of ultraviolet (wavelength from 100 to 400 nm), visible light (400-750 nm), or infrared radiation (750-2500 nm)"
    range: PhotochemicalExposureEnum
    title: photochemical exposure

  photon_flux:
    description: Measurement of photon flux. Provide value and unit, any unit is valid.
    pattern: ^\d+(\.\d+)?\s*[\w\s/]+$
    range: string
    title: photon flux

  plant_age:
    description: Age of plant at the time of sampling. Must provide unit
    pattern: ^\d+(\.\d+)?\s*\w+$
    range: string
    title: plant age

  plant_common_name:
    description: Common name of the plant.
    range: string
    title: plant common name

  plant_disease_stat:
    description: List of diseases with which the plant has been diagnosed; can include
      multiple diagnoses.
    range: string
    title: plant disease status

  plant_dry_mass:
    description: 'Measurement of dry mass. (Unit: kg or g)'
    pattern: ^\d+(\.\d+)?\s*(kg|g)$
    range: string
    title: plant dry mass

  plant_genotype:
    description: Observed genotype of the plant
    range: string
    title: plant genotype

  plant_growth_med:
    description: Specification of the media for growing the plants or tissue cultured
      samples e.g. soil, aeroponic, hydroponic, in vitro, solid culture medium, in vitro,
      liquid culture medium. Value is required to be a subclass from the PECO ontology (http://purl.bioontology.org/ontology/PECO). The value should be formatted as the name of the media followed by the PECO identifier in brackets, e.g. aeroponic plant growth media exposure [PECO:0001073]
    pattern: ^_*\s*[a-zA-Z\s]+\[PECO:\d+\]$
    range: string
    title: plant growth medium

  plant_product:
    description: Substance produced by the plant where the sample was obtained from
    range: string
    title: plant product

  plant_sex:
    description: Sex of the reproductive parts on the whole plant.
    range: PlantSexEnum
    title: plant sex

  plant_struc:
    description: Name of plant structure the sample was obtained from; for Plant Ontology
      (PO) (v releases/2017-12-14) terms see http://purl.bioontology.org/ontology/PO
      e.g. petiole epidermis (PO_0000051). If an individual flower is sampled the sex
      of it can be recorded here.
    range: PlantStructureEnum
    title: plant structure

  plant_taxid:
    description: NCBI taxon ID of the plant from https://www.ncbi.nlm.nih.gov/taxonomy
    range: string
    title: plant taxonomy identifier

  plant_wet_mass:
    description: 'Measurement of wet mass. (Unit: kg or g)'
    pattern: ^\d+(\.\d+)?\s*(kg|g)$
    range: string
    title: plant wet mass

  plate_average:
    description: Mean measurement across all sample wells (excludes blanks)
    range: float
    todos: units

  plate_barcode:
    description: Physical barcode on plate (if different from UUID)
    range: string

  plate_lot:
    description: Manufacturer lot number for Biolog EcoPlate QC
    range: string

  plate_reader_model:
    description: Instrument model used for reading (e.g. "BioTek Epoch2")
    range: string
    todos: harmonize with existing Instrument modelling

  plate_type:
    description: Vendor and model of plate (e.g. "Greiner_96well_flat_bottom", "Biolog_EcoPlate")
    range: string
    required: true

  polarity:
    description: Polarity setting used in the mass spectrometry method
    range: PolarityEnum
    required: true

  porosity:
    description: 'Porosity of deposited sediment is volume of voids divided by the
      total volume of sample. (Unit: percent)'
    pattern: ^\d+(\.\d+)?\s*percent$
    range: string
    title: porosity

  potassium:
    description: 'Concentration of potassium in the sample (Unit: mg/L)'
    pattern: ^\d+(\.\d+)?\s*(mg/L|ppm)$
    range: string
    title: potassium

  pre_treatment:
    description: the process of pre-treatment removes materials that can be easily collected
      from the raw wastewater
    range: string
    title: pre-treatment

  preparation_date:
    description: Date the stock culture or entity was prepared
    range: date

  pressure:
    description: 'Pressure to which the sample is subject, in atmospheres (Unit: atm)'
    pattern: ^\d+(\.\d+)?\s*atm$
    range: string
    title: pressure

  pressure_control:
    description: 'Measurment of pressure applied to the sample during experimentation
      (Unit: Pa)'
    pattern: ^\d+(\.\d+)?\s*Pa$
    range: string
    title: pressure control

  previous_land_use:
    description: Previous land use and dates
    range: string
    title: previous land use

  previous_land_use_meth:
    description: Reference or method used in determining previous land use and dates
    range: string
    title: previous land use method

  primary_prod:
    description: Measurement of primary production generally measured as isotope uptake. Provide value and unit, any unit is valid.
    pattern: ^\d+(\.\d+)?\s*[\w\s/]+$
    range: string
    title: primary production

  primary_treatment:
    description: the process to produce both a generally homogeneous liquid capable
      of being treated biologically and a sludge that can be separately treated or processed
    range: string
    title: primary treatmentz

  priority_order:
    description: Indicate the run order priority of your samples
    range: number
    title: priority order

  produced_by_ms_run:
    description: a reference to the data generation activity that produced instrument data
    range: MassSpectrometryDataGenerationActivity
  
  produced_by_sequencing_activity:
    description: Link back to the NucleotideSequencing activity that produced this data.
    range: NucleotideSequencing

  product_name:
    description: Provide the name of the product used to create the synthetic material.
    range: string
    title: product name

  production_method:
    description: A DOI or description of how the compound was produced, if the commercially
      purchased material was altered
    range: string
    title: production method

  profile_position:
    description: Cross-sectional position in the hillslope where sample was collected.
      Sample area position in relation to surrounding areas
    range: SlopeProfilePositionEnum
    title: profile position

  project:
    title: Project
    alias:
      - study
      - study_id
      - project_id
      - proposal
      - proposal_id
    description: |-
      Identifier for the user project associated with the entity or activity. 
    range: integer
    todos:
      - should this be an ID? CURIE can use the one NMDC has https://bioregistry.io/reference/emsl.project:60141 where emsl.project is the CURIE prefix

  propagation:
    description: |-
      Propagation characteristics (e.g., lytic/lysogenic for phages, 
      incompatibility group for plasmids).
    range: string
  protocol_url:
    description: URL pointing to the protocol used in the activity, if applicable.
    range: string

  protocol_version:
    description: Version of the protocol used in the activity, if applicable.
    range: string

  provider_name:
    range: ControlledTermValue
    description: Provider class (e.g., JGI, SeqCenter) using ontology terms where possible

  purchased_material_type:
    description: Discriminator for purchasedMaterial subtype (e.g. 'media', 'strain')
    range: string
    required: true

  radiation_regm:
    description: Information about treatment involving exposure of plant or a plant
      part to a particular radiation regimen; should include the radiation type, amount
      or intensity administered, treatment regimen including how many times the treatment
      was repeated, how long each treatment lasted, and the start and end time of the
      entire treatment; can include multiple radiation regimens
    range: string
    title: radiation regimen

  rainfall_regm:
    description: Information about treatment involving an exposure to a given amount
      of rainfall, treatment regimen including how many times the treatment was repeated,
      how long each treatment lasted, and the start and end time of the entire treatment;
      can include multiple regimens
    range: string
    title: rainfall regimen

  raw_fasta_url:
    range: string
    description: URL of raw FASTA file, if available from provider

  reactor_type:
    description: anaerobic digesters can be designed and engineered to operate using
      a number of different process configurations, such as batch or continuous, mesophilic,
      high solid or low solid, and single stage or multistage
    range: string
    title: reactor type

  redox_potential:
    description: 'Redox potential measured relative to a hydrogen cell indicating oxidation
      or reduction potential (Unit: mV)'
    pattern: ^\d+(\.\d+)?\s*mV$
    range: string
    title: redox potential

  ref_biomaterial:
    description: Primary publication if isolated before genome publication; otherwise
      primary genome report.
    range: string
    title: reference for biomaterial
  
  replicate:
    description: The replicate number of the sample or measurement, if applicable.
    range: integer
    todos: reconcile replicate modelling

  replicate_bio:
    description: The biological replicate number of the sample, if applicable.
    range: integer
    todos: reconcile replicate modelling

  replicate_number:
    description: The replicate number of the sample, if applicable. Included for compatibility with submission schema.
    range: integer
    todos: reconcile replicate modelling

  replicate_tech:
    description: The technical replicate number of the sample or measurement, if applicable.
    range: integer
    todos: reconcile replicate modelling

  resolution:
    range: MassSpecResolutionEnum
    required: true

  results_from_ms_processing:
    description: a reference to the mass spec data processing activity that produced this data product
    range: MassSpectrometryDataProcessingActivity

  root_cond:
    description: Relevant rooting conditions such as field plot size, sowing density,
      container dimensions, number of plants per container.
    range: string
    title: rooting conditions

  root_med_carbon:
    description: 'Source of organic carbon in the culture rooting medium. Provide as {carbon source}, {value}{unit}. Can be multivalued, separated by ;. Preferred unit mg/L.'
    range: string
    title: rooting medium carbon

  root_med_macronutr:
    description: Measurement of the culture rooting medium macronutrients (NP K Ca Mg S). Can be multivalued separated by ;. e.g. KH2PO4 170 mg/L
    range: string
    title: rooting medium macronutrients

  root_med_micronutr:
    description: Measurement of the culture rooting medium micronutrients (Fe Mn Zn B Cu Mo). Can be multivalued separated by ;. e.g. H3BO3 6.2 mg/L
    range: string
    title: rooting medium micronutrients

  root_med_ph:
    description: pH measurement of the culture rooting medium.
    range: number
    title: rooting medium pH

  root_med_regl:
    description: Growth regulators in the culture rooting medium such as cytokinins,
      auxins, gybberellins, abscisic acid. Can be multivalued separated by ;. e.g. Naphthaleneacetic
      Acid 0.5 mg/L
    range: string
    title: rooting medium regulators

  root_med_solid:
    description: Specification of the solidifying agent in the culture rooting medium.
    range: string
    title: rooting medium solidifier

  root_med_suppl:
    description: Organic supplements of the culture rooting medium such as vitamins,
      amino acids, organic acids, antibiotics, activated charcoal. Can be multivalued separated
      by ;. e.g. nicotinic acid 0.5 mg/L
    range: string
    title: rooting medium organic supplement

  s3_base_url:
    range: string

  s3_bucket:
    range: string

  s3_key:
    description: MinIO/S3 object key; required for all data products
    range: string
    required: true

  salinity:
    description: 'Salinity is the total concentration of all dissolved salts in
      a sample. While salinity can be measured by a complete chemical analysis, this
      method is difficult and time consuming. More often it is instead derived from
      the conductivity measurement. This is known as practical salinity. These derivations
      compare the specific conductance of the sample to a salinity standard such
      as seawater (Unit: practical salinity unit or percent)'
    pattern: ^\d+(\.\d+)?\s*(practical salinity unit|percent)$
    range: string
    title: salinity

  salinity_method:
    description: Method used to determine sample salinity
    range: string
    title: salinity method

  salt_regm:
    description: Information about treatment involving use of salts as supplement to
      liquid and soil growth media; should include the name of salt, amount administered,
      treatment regimen including how many times the treatment was repeated, how long
      each treatment lasted, and the start and end time of the entire treatment; can
      include multiple salt regimens.
    range: string
    title: salt regimen

  samp_capt_status:
    description: Reason for the sample
    range: string
    title: sample capture status

  samp_dis_stage:
    description: Stage of the disease at the time of sample collection e.g. inoculation,
      penetration, infection, growth and reproduction, dissemination of pathogen.
    range: string
    title: sample disease stage

  samp_store_temp:
    description: The temperature at which your samples should be stored upon arrival.
      This field is NOT multivalued. If selecting other add the `other_samp_store_temp`
      attribute to provide additional detail.
    range: SampStoreTempEnum
    title: sample storage temperature
    aliases:
      - sample_storage_temperature
      - storage_temperature

  sample_collected:
    description: This refers to the TOTAL amount of sample collected from the experiment.
      NOT the amount sent to EMSL or collected for a specific analysis. Provide value
      and unit, any unit is valid
    pattern: ^\d+(\.\d+)?\s*[\w\s/]+$
    range: string
    title: sample collected

  sample_collection_dev:
    description: The device used to collect an environmental sample. Include dimensions
      of device if applicable
    range: string
    title: sample collection device

  sample_collection_method:
    description: The method used to collect an environmental sample. This can be a citation or description.
    range: string
    title: sample collection method

  sample_end_time:
    description: 'Time of when the sample collection ends. Required format: HH:MM:SS
      in 24-hour time format. Don''t forget the seconds! (Unit: hh:mm:ss or HH:MM:SS)'
    pattern: ^[12]\d{3}(?:(?:-(?:0[1-9]|1[0-2]))(?:-(?:0[1-9]|[12]\d|3[01]))?)?$
    range: string
    title: sample end time

  sample_id:
    description: Link back to the originating sample
    range: Sample
    required: false
  
  sample_link:
    range: string
    description: >-
      'A unique identifier to assign parent-child subsample or sibling samples.
      This is relevant when a sample or other material was used to generate the new
      sample. This field allows multiple entries separated by ; (Examples: Soil collected
      from the field will link with the soil used in an incubation. The soil a plant
      was grown in links to the plant sample. An original culture sample was transferred
      to a new vial and generated a new sample)'
    todos: 
    - EMSL and NMDC both need better modelling for this

  sample_name:
    description: |-
      Sample name/identifier. 
      NOTE: This is typically an alias for the inherited 'name' slot on Sample classes.
      Defined separately for compatibility with source data files using 'sample_name' column headers.
    range: string
    aliases:
      - samp_name

  sample_processing:
    description: A brief description of any processing applied to the sample during
      or after retrieving the sample from environment or a link to the relevant protocol(s)
      performed.
    range: string
    title: sample processing

  sample_start_time:
    description: 'Time of when the sample collection starts. Required format: HH:MM:SS
      in 24-hour time format. Don''t forget the seconds! (Unit: hh:mm:ss or HH:MM:SS)'
    pattern: ^(0[0-9]|1[0-9]|2[0-3]):([0-5][0-9]):([0-5][0-9])\s*(hh:mm:ss|HH:MM:SS)$
    range: string
    title: sample start time

  sample_type:
    description: 'Requires a standardized ontology term to describe what your sample
      is. Please search for your sample type via Ontology Lookup Sevice at https://www.ebi.ac.uk/ols4/ '
    pattern: ^_*\s*[a-zA-Z\-]+\s\[[a-zA-Z]+:\d+\]$
    range: string
    title: sample type
  
  sampled_at_site:
    range: Site
    description: Reference to the site where the sample was collected. This is a FK to the Site class, which contains detailed metadata about the sampling location.
  
  sampled_during:
    range: SamplingActivity
    description: Reference to the sampling activity during which this sample was collected. This is a FK to the SamplingActivity class, which contains metadata about the sampling event, such as date, device, method.
  
  sampled_portion:
    range: SamplePortionEnum
    description: The portion of the original sample used in creating this processed sample (e.g., "interlayer", "supernatant", "pellet").

  sampling_duration:
    description: 'The difference between sample start and sample end time in seconds.
      (Unit: s)'
    pattern: ^\d+(\.\d+)?\s*s$
    range: string
    title: sampling duration

  sampling_set:
    title: sampling set
    description: |-
      Sampling set number for grouping related samples collected together.
      This is a user-defined sequential integer that can be used to link samples collected
      in the same sampling event or campaign.
    range: integer

  sealing_method:
    description: How the plate is sealed (e.g. "BreathEasy_membrane", "adhesive_film")
    range: string

  season_environment:
    description: Treatment involving an exposure to a particular season (e.g. Winter,
      summer, rabi, rainy etc.) treatment regimen including how many times the treatment
      was repeated how long each treatment lasted and the start and end time of the
      entire treatment
    range: string
    title: season environment

  season_precpt:
    description: 'The average of all seasonal precipitation values known or an estimated
      equivalent value derived by such methods as regional indexes or Isohyetal maps.
      (Unit: mm)'
    pattern: ^\d+(\.\d+)?\s*mm$
    range: string
    title: mean seasonal precipitation

  season_temp:
    description: 'Mean seasonal temperature (Unit: C)'
    pattern: ^-?\d+(\.\d+)?\s*C$
    range: string
    title: mean seasonal temperature

  second_blh:
    description: 'Second boundary layer height candidate (meters) (Unit: m)'
    range: number
    title: second boundary layer height

  second_blh_quality:
    description: Quality index for second boundary layer height candidate (-999 if no
      candidate)
    range: string
    title: second boundary layer height quality

  second_cbh:
    description: 'Second cloud base (meters) or highest received signal in vertical
      visibility (meters) (-999 if no cloud base or vertical visibility) (Unit: m)'
    range: number
    title: second cloud base height

  secondary_treatment:
    description: the process for substantially degrading the biological content of the
      sewage
    range: string
    title: secondary treatment

  sediment_type:
    description: Information about the sediment type based on major constituents
    range: SedimentTypeEnum
    title: sediment type

  sequence_order:
    description: |-
      Integer ordering within a temporal series for the same analyte.
      Lower = earlier in series. Use when acquisition_time alone is insufficient.

      DDL: ALTER TABLE "DataGenerationActivity"
             ADD COLUMN sequence_order INTEGER;
    range: integer
    required: false

  setup_date:
    description: When the plate was physically set up
    range: datetime
    required: true

  setup_instrument:
    description: Automated liquid handler (e.g. "Hamilton_STAR") or "manual"
    range: string

  setup_operator_id:
    description: Person who set up the plate
    range: PersonValue

  sewage_type:
    description: type of wastewater treatment plant as municipial or industrial
    range: string
    title: sewage type

  shipped_sample_size:
    description: |-
      Size/volume of the sample as shipped.
      Example: "1 mL"
    range: string
  sieving:
    description: Collection design of pooled samples and/or sieve size and amount of
      sample sieved
    range: string
    title: sieving

  silicate:
    description: 'Concentration of silicate (Unit: umol/L)'
    pattern: ^\d+(\.\d+)?\s*umol/L$
    range: string
    title: silicate

  size_frac_low:
    description: Refers to the mesh/pore size used to pre-filter/pre-sort the sample.
      Materials larger than the size threshold are excluded from the sample
    range: string
    title: size fraction lower threshold

  size_frac_up:
    description: Refers to the mesh/pore size used to retain the sample. Materials smaller
      than the size threshold are excluded from the sample
    range: string
    title: size fraction upper threshold

  slope_aspect:
    description: 'The direction a slope faces. While looking down a slope use a compass
      to record the direction you are facing (degrees); e.g. 315 degrees. This measure
      provides an indication of sun and wind exposure that will influence soil temperature
      and evapotranspiration. (Unit: degrees)'
    pattern: ^\d+(\.\d+)?\s*degrees$
    range: string
    title: slope aspect

  slope_gradient:
    description: 'Commonly called ''slope''. The angle between ground surface and a
      horizontal line (in percent). This is the direction that overland water would
      flow. This measure is usually taken with a hand level meter or clinometer. (Unit:
      percent)'
    pattern: ^\d+(\.\d+)?\s*percent$
    range: string
    title: slope gradient

  sludge_retent_time:
    description: the time activated sludge remains in reactor
    range: string
    title: sludge retention time

  sodium:
    description: 'Sodium concentration in the sample (Unit: ug/mL)'
    pattern: ^\d+(\.\d+)?\s*ug/mL$
    range: string
    title: sodium

  soil_horizon:
    title: soil horizon
    description: Specific layer in the land area which measures parallel to the soil surface and possesses physical characteristics which differ from the layers above and beneath.
    exact_mappings:
      - MIXS:0001082
    range: SoilHorizonEnum

  soil_sample_type:
    title: soil type
    description: The specific type of soil sample (e.g. soil core, surface layer).
    range: SoilSampleTypeEnum
    todos: 
      - this is a GSC slot but it's not constrined by an enum, it's a string. where did this come from?
      - BJM 060626 - clarified this slot and enum name from 'soil_type' but I'm still not sure we need it. it is populated in the current database though.
  
  soil_texture:
    description: The relative proportion of different grain sizes of mineral particles
      in a soil as described using a standard system; express as decimal percent sand
      (50 um to 2 mm) silt (2 um to 50 um) and clay (<2 um) with optional textural name
      (e.g. sand:0.20 silt:0.25 clay:0.55 description:silty clay loam).
    pattern: ^(\w+:0\.\d+ )*description:[A-Za-z ]+$
    range: string
    title: soil texture

  soil_type:
    description: Soil series name or other lower-level classification
    range: SoilTypeEnum
    title: soil type

  soil_type_meth:
    description: Reference or method used in determining soil series name or other lower-level
      classification
    range: string
    title: soil type method

  solar_irradiance:
    description: 'Solar irradiance is the power per unit area (surface power density)
      received from the Sun in the form of electromagnetic radiation in the wavelength
      range of the measuring instrument. (Unit: kW/m2/d or erg/cm2/s'
    pattern: ^\d+(\.\d+)?\s*(kW/m2/d|erg/cm2/s)$
    range: string
    title: solar irradiance

  soluble_inorg_mat:
    description: concentration of substances such as ammonia, road-salt, sea-salt, cyanide,
      hydrogen sulfide, thiocyanates, thiosulfates, etc.
    range: string
    title: soluble inorganic material

  soluble_org_mat:
    description: concentration of substances such as urea, fruit sugars, soluble proteins,
      drugs, pharmaceuticals, etc.
    range: string
    title: soluble organic material

  soluble_react_phosp:
    description: 'Concentration of soluble reactive phosphorus. (Unit: umol/L or
      mg/L or ppm)'
    pattern: ^\d+(\.\d+)?\s*(umol/L|mg/L|ppm)$
    range: string
    title: soluble reactive phosphorus

  source_mat_id:
    description: A unique identifier assigned to an original material sample collected
      or to any derived sub-samples. The source material should be listed as a sample
      to inform details about parent material relationship.
    range: string
    title: source material identifier

  specific_host:
    description: If there is a host involved please provide its taxid (or environmental
      if not actually isolated from the dead or alive host - i.e. a pathogen could be
      isolated from a swipe of a bench etc) and report whether it is a laboratory or
      natural host
    range: string
    title: host specific name

  standing_water_regm:
    description: Treatment involving an exposure to standing water during a plant's
      life span; types can be flood water or standing water, treatment regimen including
      how many times the treatment was repeated, how long each treatment lasted, and the
      start and end time of the entire treatment; can include multiple regimens
    range: string
    title: standing water regimen

  start_date_inc:
    description: |-
      Start date of incubation for the sample.
    range: date
  stationary_phase:
    description: Description of the stationary phase used in the chromatography method (e.g., column type)
    range: string

  sterilization_method:
    description: Method used to sterilize the entity (autoclave, filter, UV, etc.)
    range: SterilizationMethodEnum
    required: false

  storage_condition:
    title: storage condition
    description: The storage condition of the sample. This field is NOT multivalued. If selecting other add the `other_storage_condt` attribute to provide additional detail.
    range: StorageConditionEnum
    exact_mappings:
      - MIXS:0000327
    aliases:
      - samp_store_cond
      - storage_cond
      - storage_condt
  
  storage_condition_other:
    description: Free-text field for storage conditions when 'storage_condition' is 'other'
    range: string
    aliases:
      - other_storage_condt
      - storage_condt_other
  
  storage_location:
    range: string
    description: The physical or digital location where the processed sample is stored (e.g., freezer location, database ID).

  storage_temperature:
    description: |-
      Storage temperature for the sample (e.g., "-80 C", "4 C").
    range: string

  strain_description:
    description: |-
      Free text description of the strain, including modification details.
      Example: "AG5577-pJE2165 with CRISPRi guide array targeting PP_0055"
    range: string
    aliases:
      - strain_desc
      - strain_notes

  strain_identifier:
    description: |-
      Primary human-readable strain/entity identifier (e.g., "KT2440_pTE314", "PP_0055").
      NOT the database UUID - that is the BiologicalEntity.id attribute.
    range: string
    aliases:
      - strain_id
      - strain_name

  strain_mutation:
    description: |-
      Primary genetic modification or plasmid carried (e.g., "pTE314").
      For complex constructs, use genotype_segment_* and component_* slots.
    range: string

  strain_name:
    description: Provide a unique name to identify transformed strain lines.
    range: string
    title: strain name
    
  strain_ref:
    description: FK reference to a Strain purchasedMaterial used in the activity
    range: Strain
    required: false

  strain_source:
    description: |-
      Source institution, collection, or derivation note for the biological entity.
      Examples: "PNNL", "ATCC", "engineered from KT2440"
    range: string
    aliases:
      - source_institution
      - strain_origin

  strain_type:
    description: |-
      Type of strain/organism (bacterial, fungal, archaeal, etc.)
    range: StrainTypeEnum
    aliases:
      - organism_type

  subspecf_gen_lin:
    description: Information about the genetic distinctness of the sequenced organism
      below the subspecies level, e.g. serovar, serotype, biotype, ecotype, or any relevant
      genetic typing schemes like Group I plasmid. Supply both the lineage name and
      the lineage rank separated by a colon, e.g. biovar:abc123
    range: string
    title: subspecific genetic lineage

  sulfate:
    description: 'Concentration of sulfate in the sample. (Unit: umol/L or mg/L or ppm)'
    pattern: ^\d+(\.\d+)?\s*(umol/L|mg/L|ppm)$
    range: string
    title: sulfate
    
  sulfide:
    description: 'Concentration of sulfide in the sample. (Unit: umol/L or mg/L or ppm)'
    pattern: ^\d+(\.\d+)?\s*(umol/L|mg/L|ppm)$
    range: string
    title: sulfide

  summary_metrics:
    description: |-
      Lightweight per-product summary for common queries that avoid full file download.
      Direction: structured key-value pairs; per-type schemas TBD:
        ecoplate:  well-level absorbance summaries (position, timepoint, absorbance)
        xrf:       per-element concentration results + QC flag
        lcms:      feature count, identification count, MSI-2 fraction
      Interim DB storage: JSONB column retained until formal typed class exists.
    range: string
    required: false
    todos:
      - make this inined/multivalued?

  suspend_part_matter:
    description: 'Concentration of suspended particulate matter. (Unit: mg/L)'
    pattern: ^\d+(\.\d+)?\s*(mg/L)$
    range: string
    title: suspended particulate matter

  suspend_solids:
    description: concentration of substances including a wide variety of material such
      as silt, decaying plant and animal matter, etc; can include multiple substances
    range: string
    title: suspended solids

  synth_env_assembly:
    description: Describes how the synthetic environments parts are contained and assembled
    range: string
    title: synthetic environment assembly

  synth_env_design:
    description: The design of the synthetic environment that was created for experimentation
    range: SyntheticEnvironmentEnum
    title: synthetic environment design

  synth_env_design_method:
    description: A citation for how the synthetic environment was designed
    range: string
    title: synthetic environment design method

  synth_env_material:
    description: Describes the fabrication material used to create the synthetic environment
      and what the structure is made of
    range: string
    title: synthetic environment material

  synth_env_treatment:
    description: Describes any treatments that are built into the synthetic environment
    range: string
    title: synthetic environment treatment

  synth_instrument:
    description: The instrumentation used to synthesize the material sample.
    range: string
    title: synthesizing instrument

  synth_process:
    description: Provide the citation or describe the method of synthesis.
    range: string
    title: synthesis process

  synth_reagents:
    description: The reagents used in the material synthesis
    range: string
    title: synthesis reagents

  synth_start_date:
    description: Provide the date the sample was transferred to the synthetic environment.
      Formatted as YYYY-MM-DD
    pattern: ^[12]\d{3}(?:(?:-(?:0[1-9]|1[0-2]))(?:-(?:0[1-9]|[12]\d|3[01]))?)?$
    range: string
    title: synthetic environment start date

  target_strain:
    description: Target strain identifier for purity checks
    range: string
    todos: should this point to the Strain class?

  taxonomy_id:
    description: |-
      NCBI taxon ID for the organism.
    range: string
    aliases:
      - ncbi_taxon_id
      - taxon_id

  temp:
    description: 'Temperature of the sample at the time of sampling. (Units: C)'
    pattern: ^-?\d+(\.\d+)?\s*C$
    range: string
    title: temperature

  temperature_celsius:
    description: Temperature at which the method/process/activity was performed
    range: float

  temperature_exposure:
    description: The range of temperatures at which it is safe to store a label that
      has been applied to a substrate. Provided by iMet
    range: string
    title: temperature exposure

  tertiary_treatment:
    description: the process providing a final treatment stage to raise the effluent
      quality before it is discharged to the receiving environment
    range: string
    title: tertiary treatment

  texture_meth:
    description: Reference or method used in determining soil texture
    range: string
    title: texture method

  third_blh:
    description: 'Third boundary layer height candidate (meters) (Unit: m)'
    range: number
    title: third boundary layer height

  third_blh_quality:
    description: Quality index for third boundary layer height candidate (-999 if no
      candidate)
    range: string
    title: third boundary layer height quality

  tidal_stage:
    description: Stage of tide
    range: TidalStageEnum
    title: tidal stage

  tillage:
    description: Note method(s) used for tilling
    range: TillageEnum
    title: tillage

  timepoint_label:
    description: |-
      Human-readable timepoint label for repeated-measurement series.
      Examples: "t=0", "t=24h", "t=48h".
      Lives on concrete analysis/product subclasses, NOT on base DataGenerationActivity
    range: string
    required: true

  tiss_cult_growth_med:
    description: Description of plant tissue culture growth media used
    range: string
    title: tissue culture growth media

  tot_carb:
    description: Total carbon content. Provide value and unit, any unit is valid
    pattern: ^\d+(\.\d+)?\s*[\w\s/]+$
    range: string
    title: total carbon content

  tot_depth_water_col:
    description: 'Measurement of total depth of water column (Unit: m)'
    pattern: ^\d+(\.\d+)?\s*m$
    range: string
    title: total depth of water column

  tot_diss_nitro:
    description: 'Total dissolved nitrogen concentration reported as nitrogen measured
      by: total dissolved nitrogen = NH4 + NO3NO2 + dissolved organic nitrogen. (Unit: ug/L)'
    pattern: ^\d+(\.\d+)?\s*(ug/L)$
    range: string
    title: total dissolved nitrogen

  tot_inorg_nitro:
    description: 'Total inorganic nitrogen content. (Unit: ug/L)'
    pattern: ^\d+(\.\d+)?\s*(ug/L)$
    range: string
    title: total inorganic nitrogen

  tot_nitro:
    description: 'Total nitrogen concentration of water samples calculated by: total
      nitrogen = total dissolved nitrogen + particulate nitrogen. Can also be measured
      without filtering reported as nitrogen. (Unit: ug/L or umol/L or mg/L)'
    pattern: ^\d+(\.\d+)?\s*(ug/L|umol/L|mg/L)$
    range: string
    title: total nitrogen

  tot_nitro_cont_meth:
    description: Reference or method used in determining the total nitrogen
    range: string
    title: total nitrogen content method

  tot_nitro_content:
    description: Total nitrogen content of the sample. Provide value and unit any unit
      is valid
    pattern: ^\d+(\.\d+)?\s*[\w\s/]+$
    range: string
    title: total nitrogen content

  tot_org_c_meth:
    description: Reference or method used in determining total organic carbon
    range: string
    title: total organic carbon method

  tot_org_carb:
    description: 'Total organic carbon content. Provided as gram of Carbon per kg of
      your sample material. (Unit: g C/kg)'
    pattern: ^\d+(\.\d+)?\s*g C/kg$
    range: string
    title: total organic carbon

  tot_part_carb:
    description: 'Total particulate carbon content. (Unit: ug/L or umol/L)'
    pattern: ^\d+(\.\d+)?\s*(ug/L|umol/L)$
    range: string
    title: total particulate carbon

  tot_phosp:
    description: 'Total phosphorus concentration in the sample calculated by: total
      phosphorus = total dissolved phosphorus + particulate phosphorus. (Unit: ug/L
      or umol/L)'
    pattern: ^\d+(\.\d+)?\s*(ug/L|umol/L)$
    range: string
    title: total phosphorus

  tot_phosphate:
    description: total amount or concentration of phosphate
    range: string
    title: total phosphate

  total_amount_ug:
    range: float
    description: Total amount of analyte in micrograms

  trait:
    description: |-
      Trait category for the biological entity.
      Example: "Bacterial Resistance", "Other"
    range: string
  treatment_type:
    description: Type of treatment applied in experimental culture growth
    range: string

  trophic_level:
    description: |-
      Trophic level of the organism (autotroph, heterotroph, etc.)
    range: TrophicLevelEnum
  turbidity:
    description: Measure of the amount of cloudiness or haziness in water caused by
      individual particles. Provide value and unit any unit is valid.
    pattern: ^\d+(\.\d+)?\s*[\w\s/]+$
    range: string
    title: turbidity

  uninoculated_mean:
    description: Mean measurement of uninoculated control wells (baseline for Ecoplate)
    range: float
    todos: units

  uses_calibration:
    description: >- 
      Reference to the raw data file from the standard which was run with a batch of samples that was used as calibration for this data processing workflow run.
    range: MassSpectrometryStandardRun

  uses_chromatography:
    description: Points to a record of the chromatography used to introduce samples for the mass spectrometry run.
    range: ChromatographyConfiguration

  uses_ms_configuration:
    description: Points to a record of the configuration used for the mass spectrometry run.
    range: MassSpectrometryConfiguration
    required: true

  uses_raw_ms_data:
    range: MassSpectrometryInstrumentData
    description: >-
      The raw data file, output by a mass spectrometer, that was analyzed in 
      this data processing workflow run.

  version:
    description: String indicating the version of the software or protocol
    range: string
    required: true

  volatile_org_comp:
    description: Volatile organic compounds are organic chemicals that have a high vapour
      pressure at room temperature.
    range: string
    title: volatile organic compounds

  volume_ml:
    description: Volume of the entity in milliliters
    range: float

  volume_uL:
    range: float
    description: Volume of the entity in microliters

  wastewater_type:
    description: the origin of wastewater such as human waste rainfall storm drains
      etc.
    range: string
    title: wasterwater type

  water_content:
    description: Water content measurement. Provide value and unit any unit is valid
    pattern: ^\d+(\.\d+)?\s*[\w\s/]+$
    range: string
    title: water content

  water_content_meth:
    description: Reference or method used in determining the water content of soil
    range: string
    title: water content method

  water_current:
    description: Measurement of magnitude and direction of flow within a fluid.
      Provide value and unit, any unit is valid.
    pattern: ^\d+(\.\d+)?\s*[\w\s/]+$
    range: string
    title: water current

  water_temp_regm:
    description: Information about treatment involving an exposure to water with varying
      degree of temperature, treatment regimen including how many times the treatment
      was repeated, how long each treatment lasted, and the start and end time of the
      entire treatment; can include multiple regimens
    range: string
    title: water temperature regimen

  watering_regm:
    description: Information about treatment involving an exposure to watering frequencies,
      treatment regimen including how many times the treatment was repeated, how long
      each treatment lasted, and the start and end time of the entire treatment; can
      include multiple regimens
    range: string
    title: watering regimen

  wavelength_nm:
    description: Measurement wavelength in nanometres (e.g. 590 Ecoplate, 610 AMP2 OD)
    range: integer
    required: true

  weather:
    description: The state of the atmosphere at a given time and place with respect
      to variables such as temperature, moisture, wind velocity, and barometric pressure.
    range: string
    title: weather

  well_metadata:
    description: |-
      Structured per-well metadata array. Format varies by activity subclass:
        AMP2:     AMP2WellMetadata instances (position, volumes, replicate_group)
        Ecoplate: EcoplateWellMetadata instances (position, carbon_source, treatment, volumes)
    range: WellMetadata
    multivalued: true
    inlined_as_list: true
    todos:
      - decide how to represent in backend (normalized child table with FK to PlateSetupActivity, array column, or other)

  well_readings:
    description: |-
      Structured per-well measurement data array.
      Lightweight summary for SQL queries without full file download.
      Raw data still accessible via processedData.s3_key in MinIO.
      typed via LinkML inlined class.
    range: WellReading
    multivalued: true
    inlined_as_list: true
    todos:
      - decide how to represent in backend (normalized child table with FK to PlateSetupActivity, array column, or other)


  wind_direction:
    description: Direction of the wind on the day of sampling. Collected via anemometer.
      Provide cardinal direction.
    range: CardinalDirectionEnum
    title: wind direction

  wind_speed:
    description: Wind speed describes how fast the air is moving past a certain point
      during sampling time. Collected via anemometer. Provide value and unit, any unit is valid.
    pattern: ^\d+(\.\d+)?\s*[\w\s/]+$
    range: string
    title: wind speed
    
  within_17_oz:
    description: Indicate if samples were collected during the local afternoon time
    range: string
    title: Within 17 Oz

  workflow_steps:
    description: |-
      Per-run workflow parameters. Previously annotated TODO JSONB in schema.
      Direction: structured key-value pairs keyed by workflow type.
      Schema for allowed keys TBD per workflow type before full implementation.
  
    range: string
    required: false



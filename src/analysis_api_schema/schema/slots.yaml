---
id: https://w3id.org/MONet/analysis-api-schema/slots
name: analysis-api-schema-slots
title: Slot definitions for the MONet Analysis API Schema
description: |-
  Slot definitions for analysis-api-schema in one file for better 
  maintainability and reusability.
license: MIT
see_also:
  - https://MONet.github.io/analysis-api-schema
  - https://github.com/pnnl/analysis-api

default_range: string

imports:
  - linkml:types

slots:

  # id: is left as an attribute with range: uuid and identifier: true
  # everywhere, for now, for (some kind of database reason).

  additional_information:
    range: string
    description: Additional information pertaining to these data, including SP Project ID and Taxon OID

  aerosol_type:
    description: The type or method of aerosol collection
    range: AerosolTypeEnum
    required: true

  agitation_speed_rpm:
    description: Agitation/shaking speed in RPM (0 for static)
    range: integer

  air_temp_regm:
    title: air temperature regime
    description: Information about treatment involving an exposure to varying temperatures; should include the temperature, treatment regimen including how many times the treatment was repeated, how long each treatment lasted, and the start and end time of the entire treatment; can include different temperature regimens
    range: string
    exact_mappings:
      - MIXS:0000551

  analyte_category:
    description: omics type for easier search, optional
    range: AnalyteCategoryEnum

  analytic:
    range: string
    required: true
    todos: what does this mean

  annotation_database:
    description: Primary annotation database used (e.g., IMG, KEGG)
    range: AnnotationDatabaseEnum
    required: false

  aq:
    range: numeric
    todos: what is this supposed to mean

  average_well_color_development:
    description: Average Well Color Development (AWCD) metric for Ecoplate
    range: float
    todos: units

  biotic_relationship:
    title: observed biotic relationship
    description: The biotic relationship of the sample, such as symbiotic or free-living
    range: BioticRelationshipEnum
    exact_mappings:
      - MIXS:0000016
    aliases:
      - samp_biotic_relationship

  blank_mean:
    description: Mean measurement of uninoculated control wells
    range: float
    todos: units

  chem_administration:
    title: chemical administration
    description: List of chemical compounds administered to the host or site where sampling occurred, and when (e.g. Antibiotics, n fertilizer, air filter); can include multiple compounds. For chemical entities of biological interest ontology (chebi) (v 163), http://purl.bioontology.org/ontology/chebi
    range: string
    exact_mappings:
      - MIXS:0000751

  chromatography_type:
    description: Type of chromatography used in the method (e.g., GC, LC)
    range: ChromatographyTypeEnum
    required: true

  collection_mode:
    range: MSModeEnum

  column:
    range: string
    required: true

  commercial_media_catalog:
    description: |-
      Reference to commercial media catalog entry if applicable.
      Required if media_formulation is 'commercial', otherwise null.
    range: string

  container_type:
    description: Physical container used for the culture (flask, tube, plate, etc.)
    range: string

  contaminant_strains:
    description: Known or detected contaminant strains (if any)
    range: string

  core_section:
    title: core section
    description: The section of the core.
    examples:
      - value: TOP
      - value: MID
      - value: BTM
    range: string

  creation_date:
    description: Date the entity or preparation was created
    range: date

  cv_percent:
    description: Coefficient of variation across technical replicates
    range: float

  dd_ms2_resolution:
    range: double
    required: true

  description:
    title: description
    description: Human-readable description for the entity or activity
    range: string

  duration_min:
    description: how long something took, in minutes
    range: float

  email:
    range: string
    description: A contactable email address associated with a person or institution.

  emsl_activity:
    description: |-
      Nullable string linking a samplingActivity to a named EMSL activity or
      campaign (e.g., 'AMP2', 'MONet_FY26'). Optional for historical records
      predating activity tracking.
    range: string
    todos:
      - Is sampling activity where we want to capture this?
    required: false

  exposure_sensitivity:
    description: Sensitivity the entity has if exposed (e.g. light-sensitive, oxygen-sensitive)
    range: string
    multivalued: true

  fid:
    range: double

  file_curie:
    description: an identifier for a file that resolves to the file's accessible location
    range: string

  filesize:
    range: integer

  gene_family:
    description: Gene family or marker used for the phylogeny (e.g., 16S, ITS)
    range: string
    required: false

  growth_time:
    description: |-
      Total growth time for the culture.
      Required for ExperimentalCulture activities.
    range: string

  has_output:
    title: has output
    description: Output entity produced by an activity
    range: string
    todos: I'm not sure we are going to use this, given our plan to only point 'upstream' from dataProduct to the generating activity, and not have activities point to their outputs. Do we need this slot?

  iat:
    range: double

  incubation_time_hours:
    description: Incubation duration in hours
    range: float

  injection:
    description: Type of injection used in the mass spectrometry method
    range: string
    required: true

  inspection_method:
    description: Method used to inspect or verify purity (visual, sequencing, etc.)
    range: string

  ionization:
    description: Type of ionization used in the mass spectrometry method
    range: IonizationEnum
    required: true

  isolation_window:
    range: string
    required: true

  latitude:
    title: latitude
    description: Latitude coordinate of the sampling site in WSG 84 format.
    range: double

  lims_barcode:
    description: LIMS barcode identifier
    range: string
    required: false

  location:
    range: string
    required: true
    todos: what does this mean

  longitude:
    title: longitude
    description: Longitude coordinate of the sampling site in WSG 84 format.
    range: double

  loop_count:
    range: string
    required: true

  mass_range:
    range: double

  md5checksum:
    range: string

  measure_type:
    range: ProductMeasureType
    description: >-
      Whether the measurement recorded is a single measurement, one of a set of 
      replicate measurements, or an average of several replicate measurements.

  measurement_type:
    description: Type of plate measurement (optical_density, fluorescence, flow_cytometry)
    range: string

  media_additions:
    description: |-
      Additional components added to the media (antibiotics, inducers, etc.).
      Examples: "100 ug/mL ampicillin", "1 mM IPTG"
    range: string
    multivalued: true

  media_formulation:
    description: Formulation method of the media (manual mix, commercial, etc.)
    range: FormulationEnum

  media_recipe:
    description: |-
      Reference or description of recipe used to prepare media.
      Examples: "M9 media with 1% Glucose", "rich media with 10% LB and 90% glycerol"
    range: string

  media_ref:
    description: |-
      FK reference to a prepared media processedSample used in the activity.
      Maps to Montana's growth_medium (on CultureGrowth) and media_id
      (on plate setup).  Points to processedSample(type=prepared_media)
      produced by an upstream MediaPreparation activity.
    range: ProcessedSample
    required: false

  media_type:
    description: |-
      Purpose/context of the media preparation.
      Examples: strain_purity, stock_culture, pre_culture, rich_media.
    range: MediaTypeEnum

  method:
    range: string
    todos: what does this mean

  mg_workflow_step:
    description: Metagenomics workflow step that produced this product (e.g., MagsAnalysis)
    range: MetagenomicsSteps
    required: false

  mobile_phases:
    description: Description of the mobile phases used in the chromatography method (e.g., solvents, gradients)
    range: string

  ms_raw_file_type:
    description: the filetype of the mass spectrometry instrument data
    range: MSRawFileTypeEnum

  name:
    description: Human-readable name for the entity or activity.
    range: string
    required: true

  oxygen_relationship:
    title: oxygen relationship
    description: The relationship of the sample to oxygen, such as aerobic or anaerobic.
    range: OxygenStatusEnum
    exact_mappings:
      - MIXS:0000015
    alias: oxygen_status

  parent_workflow_id:
    description: |-
      Self-referential FK to the preceding DataProcessingActivity in a chain.
      NULL -> first (or standalone) step.
      Non-null -> this execution directly follows parent_workflow_id.
      Enables single-hop chaining queries; full traversal via linkage_cache.

      DDL: ALTER TABLE "DataProcessingActivity"
             ADD COLUMN parent_workflow_id UUID
             REFERENCES "DataProcessingActivity"(id);
    range: DataProcessingActivity
    required: false

  ph_adjustment:
    description: Whether the entity was pH-adjusted
    range: boolean
    required: false

  ph_target:
    description: Target pH value (required if ph_adjustment is true)
    range: float
    required: false

  plate_average:
    description: Mean measurement across all sample wells (excludes blanks)
    range: float
    todos: units

  plate_barcode:
    description: Physical barcode on plate (if different from UUID)
    range: string

  plate_lot:
    description: Manufacturer lot number for Biolog EcoPlate QC
    range: string

  plate_reader_model:
    description: Instrument model used for reading (e.g. "BioTek Epoch2")
    range: string
    todos: harmonize with existing Instrument modelling

  plate_type:
    description: Vendor and model of plate (e.g. "Greiner_96well_flat_bottom", "Biolog_EcoPlate")
    range: string
    required: true

  polarity:
    description: Polarity setting used in the mass spectrometry method
    range: PolarityEnum
    required: true

  preparation_date:
    description: Date the stock culture or entity was prepared
    range: date

  produced_by_ms_run:
    description: a reference to the data generation activity that produced instrument data
    range: MassSpectrometryDataGenerationActivity

  project:
    title: Project
    alias:
      - study
      - study_id
      - project_id
      - proposal
      - proposal_id
    description: |-
      Identifier for the user project associated with the entity or activity. 
    range: integer
    todos:
      - should this be an ID? CURIE can use the one NMDC has https://bioregistry.io/reference/emsl.project:60141 where emsl.project is the CURIE prefix

  provider_name:
    range: ControlledTermValue
    description: Provider class (e.g., JGI, SeqCenter) using ontology terms where possible

  purchased_material_type:
    description: Discriminator for purchasedMaterial subtype (e.g. 'media', 'strain')
    range: string
    required: true

  raw_fasta_url:
    range: string
    description: URL of raw FASTA file, if available from provider

  replicate:
    description: The replicate number of the sample or measurement, if applicable.
    range: integer

  resolution:
    range: double
    required: true

  results_from_ms_processing:
    description: a reference to the mass spec data processing activity that produced this data product
    range: MassSpectrometryDataProcessingActivity

  s3_base_url:
    range: string

  s3_bucket:
    range: string

  s3_key:
    description: MinIO/S3 object key; required for all data products
    range: string
    required: true

  sample_id:
    description: Link back to the originating sample
    range: Sample
    required: false

  sample_name:
    range: string

  sampling_set:
    title: sampling set
    description: |-
      Sampling set number for grouping related samples collected together.
      This is a user-defined integer that can be used to link samples collected
      in the same sampling event or campaign.
    range: integer

  scan_range:
    range: string
    required: true

  sealing_method:
    description: How the plate is sealed (e.g. "BreathEasy_membrane", "adhesive_film")
    range: string

  sequence_order:
    description: |-
      Integer ordering within a temporal series for the same analyte.
      Lower = earlier in series. Use when acquisition_time alone is insufficient.

      DDL: ALTER TABLE "DataGenerationActivity"
             ADD COLUMN sequence_order INTEGER;
    range: integer
    required: false

  facility:
    description: Synchrotron facility name (e.g. APS, SSRL, NSLS-II)
    range: string

  beamline:
    description: Beamline identifier (e.g. 20-BM, 20-ID)
    range: string

  ring_energy_gev:
    description: Storage ring energy in GeV
    range: float

  ring_current_ma:
    description: Storage ring current in mA at scan start
    range: float

  insertion_device:
    description: Insertion device description (wiggler, undulator, bending magnet)
    range: string

  element:
    description: Target element (e.g. Fe, Mn, Cu)
    range: string

  edge:
    description: Absorption edge measured (e.g. K, L1, L3)
    range: string

  reference_material:
    description: Reference standard material name
    range: string

  sample_type:
    description: Sample type descriptor (e.g. powder, solution, thin_film)
    range: string

  sample_format:
    description: Physical sample format (e.g. pellet, paste)
    range: string

  sample_holder:
    description: Holder/position identifier (e.g. 1002_1)
    range: string

  sample_temperature_k:
    description: Sample temperature in Kelvin
    range: float

  sample_orientation_deg:
    description: Sample orientation angle in degrees
    range: float

  sample_detector_distance_mm:
    description: Sample-to-detector distance in mm
    range: float

  sample_doi:
    description: DOI or persistent identifier for the sample
    range: string

  crystal:
    description: Monochromator crystal material (e.g. Si)
    range: string

  crystal_cut:
    description: Crystal reflection (e.g. 111, 311)
    range: string

  crystal_detune_pct:
    description: Crystal detuning percentage for harmonic rejection
    range: float

  mono_angle_deg:
    description: Monochromator Bragg angle in degrees (Crystal_Phi)
    range: float

  mono_2nd_xtal_mm:
    description: Second crystal gap position in mm (Crystal_Gap)
    range: float

  mono_energy_motor_ev:
    description: Monochromator energy from motor encoder in eV
    range: float

  mono_energy_encoder_ev:
    description: Monochromator energy from independent encoder in eV
    range: float

  mirror_angle_mrad:
    description: M0 mirror angle in mrad
    range: float

  m0_coating:
    description: M0 mirror coating material (e.g. Rh, Pt)
    range: string

  m0_cutoff_kev:
    description: M0 mirror X-ray cutoff energy in keV
    range: float

  m1_coating:
    description: M1 mirror coating material
    range: string

  inhutch_mirror_coating:
    description: In-hutch focusing mirror coating material
    range: string

  inhutch_mirror_cutoff_kev:
    description: In-hutch mirror cutoff energy in keV
    range: float

  slit_size_h_um:
    description: Horizontal slit size in microns
    range: float

  slit_size_v_um:
    description: Vertical slit size in microns
    range: float

  slit_center_h:
    description: Horizontal slit center position (mm)
    range: float

  slit_center_v:
    description: Vertical slit center position (mm)
    range: float

  beam_attenuation_um:
    description: Attenuator thickness in microns
    range: float

  beam_attenuation_material:
    description: Attenuator material (e.g. Al)
    range: string

  sweep_number:
    description: 1-based sweep index within the measurement session
    range: integer

  scan_subtype:
    description: Scan type, energy (XAS) or motor (alignment)
    range: XASScanSubtype

  positioner:
    description: Primary positioner name (e.g. Mono Energy)
    range: string

  e0_ev:
    description: Absorption edge energy E0 in eV
    range: float

  n_points:
    description: Number of scan points
    range: integer

  n_data_rows:
    description: Number of data rows in the file
    range: integer

  x_first:
    description: First positioner value in the scan (eV or mm)
    range: float

  x_last:
    description: Last positioner value in the scan (eV or mm)
    range: float

  scan_bounds:
    description: Scan boundary string as written in file header
    range: string

  scan_steps:
    description: Step sizes string as written in file header
    range: string

  integration_times:
    description: Integration times string as written in file header
    range: string

  kwgt:
    description: k-weighting exponent used in EXAFS region
    range: float

  scan_time_sec:
    description: Total scan duration in seconds
    range: integer

  scan_datetime:
    description: Date and time at scan start
    range: datetime

  fy_electronics:
    description: Fluorescence detector electronics model (e.g. XMAP12B)
    range: string

  fy_channel_num:
    description: Number of active fluorescence detector channels
    range: integer

  fy_element:
    description: Target element detected by fluorescence detector (e.g. Fe)
    range: string

  fy_transition:
    description: X-ray transition detected (e.g. Ka, Kb)
    range: string

  user_comment:
    description: Free-text user comment from scan header
    range: string

  amp_index:
    description: 1-based amplifier index (aligns with Amplifier_Gain_N)
    range: integer

  signal_name:
    description: Signal channel name (e.g. I0, It, Iref)
    range: string

  gain:
    description: Amplifier gain value
    range: float

  gain_unit:
    description: Gain unit as written in file (e.g. nA/V, pA/V)
    range: string

  voltage_start:
    description: Analog input voltage at scan start (V)
    range: float

  voltage_end:
    description: Analog input voltage at scan end (V)
    range: float

  motor_index:
    description: 1-based motor index (aligns with Motor_N_Pos)
    range: integer

  motor_name:
    description: Motor name (e.g. Disp_V_polycold)
    range: string

  pv:
    description: EPICS process variable name (e.g. 20bm:m28)
    range: string

  position:
    description: Motor position value at scan start
    range: float

  col_index:
    description: 1-based column index (aligns with Analog_In_Signal_Type_N)
    range: integer

  col_name:
    description: Detector column name (e.g. XMAP12B:FeKa_Sum)
    range: string

  row_num:
    description: 1-based row index within the sweep file
    range: integer

  row_val:
    description: Representative value at this scan point
    range: float

  chamber_index:
    description: Ion chamber index (1=I0, 2=It, 3=Iref)
    range: integer

  gas_index:
    description: 1-based gas component index within the chamber mixture
    range: integer

  gas_name:
    description: Fill gas name (e.g. Nitrogen, Helium, Argon)
    range: string

  chamber_length_mm:
    description: Physical ion chamber length in mm
    range: float

  pressure_bar:
    description: Gas fill pressure in bar
    range: float

  xas_filename:
    description: Measurement filename stem linking LCF results to source XAS data
    range: string

  lcf_type:
    description: LCF analysis subtype, XANES or EXAFS
    range: XASLCFType

  run_label:
    description: Analysis run variant label extracted from filename
    range: string

  fit_label:
    description: Iteration label for EXAFS fits extracted from filename
    range: string

  analysis_code:
    description: Athena internal code from the .lcf filename
    range: string

  sample_nor_file:
    description: Normalised spectrum filename recorded in the LCF header
    range: string

  fit_range_min:
    description: Lower bound of fit range (eV for XANES, A^-1 for EXAFS)
    range: float

  fit_range_max:
    description: Upper bound of fit range (eV for XANES, A^-1 for EXAFS)
    range: float

  fit_range_unit:
    description: Unit of fit range (eV for XANES, A^-1 for EXAFS)
    range: string

  n_data_points:
    description: Number of data points included in the fit
    range: integer

  n_variables:
    description: Number of free variables in the fit
    range: integer

  n_standards:
    description: Number of reference standards used in the linear combination
    range: integer

  weights_sum_to_1:
    description: Whether component weights were constrained to sum to 1.0
    range: string

  weights_bounded:
    description: Whether component weights were bounded between 0 and 1
    range: string

  e0_shift_used:
    description: Whether an overall E0 energy shift was applied
    range: string

  noise_added:
    description: Statistical noise added to data before fitting (0 if none)
    range: float

  r_factor:
    description: R-factor goodness-of-fit statistic
    range: float

  chi_square:
    description: Chi-square statistic from the LCF fit
    range: float

  reduced_chi_square:
    description: Reduced chi-square statistic
    range: float

  weights_sum:
    description: Actual sum of fitted component weights
    range: float

  std_index:
    description: 1-based index of the reference standard in the fit
    range: integer

  std_name:
    description: Reference standard name as written in the Athena project
    range: string

  weight:
    description: Fitted weight (fraction) for this standard component
    range: float

  species_name:
    description: Chemical species or oxidation state name from the LCF report
    range: string

  proportion:
    description: Species proportion in sample (fraction 0-1)
    range: float

  uncertainty:
    description: Uncertainty on the species proportion (fraction)
    range: float

  x_val:
    description: Positioner value at this data point (energy in eV or k in A^-1)
    range: float

  data_val:
    description: Measured normalised spectrum value at this point
    range: float

  fit_val:
    description: LCF fitted curve value at this point
    range: float

  residual:
    description: Fit residual at this point (data_val - fit_val)
    range: float

  produced_by_xas_run:
    description: Reference to the XAS data generation activity that produced this raw file
    range: XASDataGenerationActivity

  uses_xas_raw_data:
    description: Raw XAS instrument data inputs consumed by this LCF processing activity
    range: XASInstrumentData
    multivalued: true
    inlined_as_list: false

  results_from_xas_processing:
    description: Reference to the XAS LCF processing activity that produced this processed product
    range: XASLCFDataProcessingActivity

  setup_date:
    description: When the plate was physically set up
    range: datetime
    required: true

  setup_instrument:
    description: Automated liquid handler (e.g. "Hamilton_STAR") or "manual"
    range: string

  setup_operator_id:
    description: Person who set up the plate
    range: PersonValue

  soil_horizon:
    title: soil horizon
    description: Specific layer in the land area which measures parallel to the soil surface and possesses physical characteristics which differ from the layers above and beneath.
    exact_mappings:
      - MIXS:0001082
    range: SoilHorizonEnum

  soil_type:
    title: soil type
    description: The specific type of soil sample
    range: SoilTypeEnum
    todos: 
      - this is a GSC slot but it's not constrined by an enum, it's a string. where did this come from?

  stationary_phase:
    description: Description of the stationary phase used in the chromatography method (e.g., column type)
    range: string

  sterilization_method:
    description: Method used to sterilize the entity (autoclave, filter, UV, etc.)
    range: SterilizationMethodEnum
    required: false

  storage_condition:
    title: storage condition
    description: The storage condition of the sample, such as temperature or preservation method.
    range: StorageConditionEnum
    exact_mappings:
      - MIXS:0000327
    aliases:
      - samp_store_cond
      - storage_cond
      - storage_condt

  storage_temperature:
    description: Storage temperature for the entity (e.g. "4 C", "-80 C")
    range: string

  strain_identifier:
    description: |-
      External human-readable strain identifier (e.g. "KT2440_pTE314").
      NOT the database UUID   that is the Strain.id attribute.
    range: string
    required: true

  strain_mutation:
    description: Genetic modification or plasmid carried (e.g. "pTE314")
    range: string

  strain_ref:
    description: FK reference to a Strain purchasedMaterial used in the activity
    range: Strain
    required: false

  strain_source:
    description: Source institution or collection (e.g. "PNNL", "ATCC")
    range: string

  strain_type:
    description: Type of strain (bacterial, fungal, etc.)
    range: string

  summary_metrics:
    description: |-
      Lightweight per-product summary for common queries that avoid full file download.
      Direction: structured key-value pairs; per-type schemas TBD:
        ecoplate:  well-level absorbance summaries (position, timepoint, absorbance)
        xrf:       per-element concentration results + QC flag
        lcms:      feature count, identification count, MSI-2 fraction
      Interim DB storage: JSONB column retained until formal typed class exists.

      DDL: ALTER TABLE "processedData"
             ADD COLUMN summary_metrics JSONB;   -- interim; formal key-value schema TBD
    range: string
    required: false

  target_strain:
    description: Target strain identifier for purity checks
    range: string
    todos: should this point to the Strain class?

  temperature_celsius:
    description: Temperature at which the method/process/activity was performed
    range: float

  timepoint_label:
    description: |-
      Human-readable timepoint label for repeated-measurement series.
      Examples: "t=0", "t=24h", "t=48h".
      Lives on concrete analysis/product subclasses, NOT on base DataGenerationActivity
      (per core-planB decision).
    range: string
    required: true

  treatment_type:
    description: Type of treatment applied in experimental culture growth
    range: string

  uninoculated_mean:
    description: Mean measurement of uninoculated control wells (baseline for Ecoplate)
    range: float
    todos: units

  uses_calibration:
    description: >- 
      Reference to the raw data file from the standard which was run with a batch of samples that was used as calibration for this data processing workflow run.
    range: MassSpectrometryStandardRun

  uses_chromatography:
    description: Points to a record of the chromatography used to introduce samples for the mass spectrometry run.
    range: ChromatographyConfiguration

  uses_ms_configuration:
    description: Points to a record of the configuration used for the mass spectrometry run.
    range: MassSpectrometryConfiguration
    required: true

  version:
    description: String indicating the version of the software or protocol
    range: string
    required: true

  volume_ml:
    description: Volume of the entity in milliliters
    range: float

  wavelength_nm:
    description: Measurement wavelength in nanometres (e.g. 590 Ecoplate, 610 AMP2 OD)
    range: integer
    required: true

  well_metadata:
    description: |-
      Structured per-well metadata array. Format varies by activity subclass:
        AMP2:     AMP2WellMetadata instances (position, volumes, replicate_group)
        Ecoplate: EcoplateWellMetadata instances (position, carbon_source, treatment, volumes)
      Stored as JSONB in the database; typed via LinkML inlined classes.
    range: WellMetadata
    multivalued: true
    inlined_as_list: true

  well_readings:
    description: |-
      Structured per-well measurement data array.
      Lightweight summary for SQL queries without full file download.
      Raw data still accessible via processedData.s3_key in MinIO.
      Stored as JSONB in the database; typed via LinkML inlined class.
    range: WellReading
    multivalued: true
    inlined_as_list: true

  workflow_steps:
    description: |-
      Per-run workflow parameters. Previously annotated TODO JSONB in schema.
      Direction: structured key-value pairs keyed by workflow type.
      Schema for allowed keys TBD per workflow type before full implementation.
      Interim DB storage: JSONB column retained.
    range: string
    required: false
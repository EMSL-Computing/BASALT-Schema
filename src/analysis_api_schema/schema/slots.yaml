---
id: https://w3id.org/MONet/analysis-api-schema/slots
name: analysis-api-schema-slots
title: Slot definitions for the MONet Analysis API Schema
description: |-
  Slot definitions for analysis-api-schema in one file for better 
  maintainability and reusability.
license: MIT
see_also:
  - https://MONet.github.io/analysis-api-schema
  - https://github.com/pnnl/analysis-api

default_range: string

imports:
  - linkml:types

slots:

  # id: is left as an attribute with range: uuid and identifier: true
  # everywhere, for now, for (some kind of database reason).


  # id: is left as an attribute with range: uuid and identifier: true
  # everywhere, for now, for (some kind of database reason).

  acquisition_strategy:
    range: MassSpectrometryAcquisitionStrategyEnum
    description: The acquisition strategy used in the mass spectrometry run.

  additional_information:
    range: string
    description: Additional information pertaining to these data, including SP Project ID and Taxon OID

  aerosol_type:
    range: AerosolTypeEnum
    required: true

  agitation_speed_rpm:

    range: integer
  
  agrochem_addition:
    range: string
    title: agrochemical additions

  air_temp_regm:
    title: air temperature regimen
    description: Information about treatment involving an exposure to varying temperatures; should include the temperature, treatment regimen including how many times the treatment was repeated, how long each treatment lasted, and the start and end time of the entire treatment; can include different temperature regimens
    range: string
    exact_mappings:
      - MIXS:0000551

  al_sat:
    description: Aluminum saturation (esp. For tropical soils)
    range: string
    title: aluminum saturation

  al_sat_meth:
    description: Reference or method used in determining Al saturation
    range: string
    title: aluminum saturation method

  alkalinity:
    description: 'The ability of a solution to neutralize acids to the equivalence
      point of carbonate or bicarbonate (Unit: mg/L or meq/L)'
    pattern: ^\d+(\.\d+)?\s*(mg|meq)/L$
    range: string
    title: alkalinity

  alkalinity_method:
    description: Method used for alkalinity measurement
    range: string
    title: alkalinity method

  alkyl_diethers:
    description: Concentration of alkyl diethers. Provide value and unit, any unit is
      valid
    pattern: ^\d+(\.\d+)?\s*[\w\s/]+$
    range: string
    title: alkyl diethers

  alt:
    description: >-
      Heights of objects such as airplanes, space shuttles, rockets, atmospheric balloons and heights of places such as atmospheric layers and clouds. It is used to measure the height of an object which is above the earth's surface. In this context, the altitude measurement is the vertical distance between the earth's surface above sea level and the sampled position in the air. For ARM this can be a range. (Unit: m)
    pattern: '^\d+(\.\d+)?m(?:-\d+(\.\d+)?m)?$'
    range: string
    title: altitude

  aminopept_act:
    description: 'Measurement of aminopeptidase activity (Unit: mol/L/h)'
    pattern: '^\d+(\.\d+)?\s*mol/L/h$'
    range: string
    title: aminopeptidase activity
    
  ammonium:
    description: 'Concentration of ammonium in the sample. (Units: umol/L or mg/Liter
      or ppm)'
    pattern: '^\d+(\.\d+)?\s*(umol/L|mg/L|ppm)$'
    range: string
    title: ammonium

  analysis_type:
    description: |-
      The type(s) of analysis planned for this sample.
    range: string
  analyte_category:
    description: omics type for easier search, optional
    range: AnalyteCategoryEnum

  analytic:
    range: string
    required: true
    todos: what does this mean

  ances_data:
    description: Information about either pedigree or other ancestral information description
    range: string
    title: ancestral data

  annotation_database:
    description: Primary annotation database used (e.g., IMG, KEGG)
    range: AnnotationDatabaseEnum
    required: false

  annual_precpt:
    description: 'The average of all annual precipitation values known or an estimated
      equivalent value derived by such methods as regional indexes or Isohyetal maps.
      (Unit: mm)'
    pattern: '^\d+(\.\d+)?\s*mm$'
    range: string
    title: mean annual precipitation

  annual_temp:
    description: 'Mean annual temperature (Unit: C)'
    pattern: '^-?\d+(\.\d+)?\s*C$'
    range: string
    title: mean annual temperature

  antibiotic_regm:
    description: Information about treatment involving antibiotic administration; should
      include the name of antibiotic, amount administered, treatment regimen including
      how many times the treatment was repeated, how long each treatment lasted, and the
      start and end time of the entire treatment; can include multiple antibiotic regimens
    range: string
    title: antibiotic regimen

  aq:
    range: numeric
    todos: what is this supposed to mean

  atmospheric_data:
    description: Measurement of atmospheric data; can include multiple data
    range: string
    title: atmospheric data

  average_well_color_development:
    description: Average Well Color Development (AWCD) metric for Ecoplate
    range: float
    todos: units

  bac_prod:
    description: Bacterial production in the water column measured by isotope uptake. Provide value and unit, any unit is valid. 
    pattern: ^\d+(\.\d+)?\s*[\w\s/]+$
    range: string
    title: bacterial production

  bac_resp:
    description: Measurement of bacterial respiration in the water column. Provide value and unit,any unit is valid.
    pattern: ^\d+(\.\d+)?\s*[\w\s/]+$
    range: string
    title: bacterial respiration

  bacteria_carb_prod:
    description: Measurement of bacterial carbon production. Provide value and unit, any unit is valid
    pattern: ^\d+(\.\d+)?\s*[\w\s/]+$
    range: string
    title: bacterial carbon production

  biochem_oxygen_dem:
    description: a measure of the relative oxygen-depletion effect of a waste contaminant
    range: string
    title: biochemical oxygen demand

  biol_stat:
    description: The level of genome modification.
    range: BiolStatEnum
    title: biological status

  biological_entity_ref:
    description: |-
      FK reference to a BiologicalEntity representing the biological identity
      strain, isolate, engineered construct) that this sample or activity
      is associated with.
    range: BiologicalEntity
    required: false
    aliases:
      - strain_ref
      - strain_id


  biotic_regm:
    description: Information about treatment(s) involving use of biotic factors such
      as bacteria, viruses, or fungi.
    range: string
    title: biotic regimen

  biotic_relationship:
    title: observed biotic relationship
    description: >-
      Description of relationship(s) between the subject organism and other
      organism(s) it is associated with. E.g. parasite on species X; mutualist with
      species Y. The target organism is the subject of the relationship and the other
      organism(s) is the object
    range: BioticRelationshipEnum
    exact_mappings:
      - MIXS:0000016
    aliases:
      - samp_biotic_relationship
  
  bishomohopanol:
    description: 'Concentration of bishomohopanol. (Unit: ug/L or ug/g)'
    pattern: ^\d+(\.\d+)?\s*(ug/L|ug/g)$
    range: string
    title: bishomohopanol

  blank_mean:
    description: Mean measurement of uninoculated control wells
    range: float
    todos: units
  
  bromide:
    description: 'Concentration of bromide (Unit: ppm)'
    pattern: ^\d+(\.\d+)?\s*ppm$
    range: string
    title: bromide

  bulk_elect_conductivity:
    description: 'Electrical conductivity is a measure of the bulk soil ability to carry
      electric current which is mostly dictated by the chemistry of and amount of soil
      water. (Unit: mS/cm)'
    pattern: ^\d+(\.\d+)?\s*mS/cm$
    range: string
    title: bulk electrical conductivity

  calcium:
    description: 'Concentration of calcium in the sample (Unit: mg/L or umol/L or ppm)'
    pattern: ^\d+(\.\d+)?\s*(mg/L|umol/L|ppm)$
    range: string
    title: calcium

  calibration_data:
    description: Reference to the raw instrument data file used for calibration
    range: MassSpectrometryInstrumentData

  calibration_standard:
    description: The reference standard used for calibration
    range: PurchasedMaterial

  calibration_target:
    description: The measurement being calibrated
    range: CalibrationTargetEnum

  carb_dioxide:
    description: 'Amount of carbon dioxide measured in the air the day of sampling.
      (Unit: umol/L or ppm)'
    pattern: ^\d+(\.\d+)?\s*(umol/L|ppm)$
    range: string
    title: carbon dioxide

  carb_monoxide:
    description: 'Amount of carbon monoxide measured in the air the day of sampling.
      (Unit: umol/L or ppm)'
    pattern: ^\d+(\.\d+)?\s*(umol/L|ppm)$
    range: string
    title: carbon monoxide

  carb_nitro_ratio:
    description: Ratio of amount or concentrations of carbon to nitrogen.
    range: string
    title: carbon nitrogen ratio

  cas:
    description: A unique numerical identifier assigned by the Chemical Abstract Service
      (CAS), a division of the American Chemical Society, to chemical compounds, polymers,
      biological sequences, mixtures, and alloys.
    range: string
    title: CAS number
    aliases:
      - CAS

  cbi:
    description: |-
      Controlled Biological Information flag (yes/no).
      Indicates if the sample is subject to CBI restrictions.
    range: boolean
  chem_administration:
    title: chemical administration
    description: List of chemical compounds administered to the host or site where sampling occurred, and when (e.g. Antibiotics, n fertilizer, air filter); can include multiple compounds. For chemical entities of biological interest ontology (chebi) (v 163), http://purl.bioontology.org/ontology/chebi
    range: string
    exact_mappings:
      - MIXS:0000751

  chem_mutagen:
    description: Treatment involving use of mutagens; should include the name of mutagen,
      amount administered, treatment regimen, including how many times the treatment was
      repeated, how long each treatment lasted, and the start and end time of the entire
      treatment; can include multiple mutagen regimens
    range: string
    title: chemical mutagen

  chem_oxygen_dem:
    description: a measure of the relative oxygen-depletion effect of a waste contaminant
    range: string
    title: chemical oxygen demand

  chloride:
    description: 'Concentration of chloride in the sample (Unit: mg/L or ppm)'
    pattern: ^\d+(\.\d+)?\s*(mg/L|ppm)$
    range: string
    title: chloride

  chlorophyll:
    description: 'Concentration of chlorophyll (Unit: mg/m3 or ug/L)'
    pattern: ^\d+(\.\d+)?\s*(mg/m3|ug/L)$
    range: string
    title: chlorophyll

  chromatography_type:
    description: Type of chromatography used in the method (e.g., GC, LC)
    range: ChromatographyCategoryEnum
    required: true

  collection_date:
    description: |-
      The date the sample was collected or received.
    range: date
  collection_mode:
    description: The collection mode for the mass spectrometry data (e.g., profile, centroid)
    range: MassSpectrumCollectionModeEnum
  
  collection_time:
    description: 'The time of sampling as an instance (single point). Required format:
      HH:MM:SS in 24-hour time format. Don''t forget the second! (Unit: hh:mm:ss or
      HH:MM:SS)'
    pattern: ^(0[0-9]|1[0-9]|2[0-3]):([0-5][0-9]):([0-5][0-9])\s*(hh:mm:ss|HH:MM:SS)$
    range: string
    title: collection time

  color_code:
    description: Color indicates the max altitude.
    range: ColorCodeEnum
    title: color code

  column:
    description: The name or identifier of the chromatography column used.
    range: string

  column_dimensions:
    range: string
    description: Dimensions of the chromatography column used in the process.

  column_manufacturer:
    range: string
    description: Name of the institution that manufactured the chromatography column.

  commercial_media_catalog:
    description: |-
      Reference to commercial media catalog entry if applicable.
      Required if media_formulation is 'commercial', otherwise null.
    range: string
  
  component_description:
    description: |-
      Description of the genetic component's function.
      Example: "d-Cfp1 to block gene expression", "recognition sequence for guide RNA processing"
    range: string
  component_name:
    description: |-
      Name of the genetic component.
      Examples: "dCas12a", "4_sgRNAs"
    range: string
  compound_name:
    description: The name of the purchased material. A substance formed by chemical
      union of two or more elements or ingredients in definite proportion by weight.
    range: string
    title: compound name

  concentration_ug_per_uL:
    range: float
    description: Concentration of the substance in micrograms per microliter.
  
  condition_received:
    description: |-
      The condition of the sample when received.
      Examples: "good", "damaged", "thawed"
    range: string
  conduc:
    description: Electrical conductivity of water. Provide value and unit, any unit is valid.
    pattern: ^\d+(\.\d+)?\s*[\w\s/]+$
    range: string
    title: conductivity

  confirmed_receipt:
    description: |-
      Whether receipt of the sample was confirmed.
    range: boolean
  construct_component:
    description: |-
      Type of construct component.
      Examples: "Gene", "Recognition Sequence"
    range: string
  container_type:
    description: Physical container used for the culture (flask, tube, plate, etc.)
    range: string

  contaminant_strains:
    description: Known or detected contaminant strains (if any)
    range: string

  core_section:
    title: core section
    description: The section of the core.
    examples:
      - value: TOP
      - value: MID
      - value: BTM
    range: string

  creation_date:
    description: Date the entity or preparation was created
    range: date

  crop_rotation:
    description: Whether or not crop is rotated, and if yes, rotation schedule
    range: string
    title: crop rotation

  cult_root_med:
    description: Name or reference for the hydroponic or in vitro culture rooting medium;
      can be the name of a commonly used medium or reference to a specific medium, e.g.
      Murashige and Skoog medium. If the medium has not been formally published use
      the rooting medium descriptors.
    range: string
    title: culture rooting medium

  cur_land_use:
    description: 'Present state of sample site. This slot is NOT multivalued. Valid
      entries: badlands, cities, conifers, crop trees, farmstead, gravel, hardwoods, hayland,
      horticultural plants, industrial areas, intermixed, marshlands, meadows, mines, quarries,
      mudflats, oil waste, pastureland, permanent snow or ice, rainforest, rangeland, roads,
      railroads, rock, row crops, saline seeps, salt flats, sand, shrub crops, shrub land, small
      grains, successional shrub land, swamp, tropical, tundra, vegetable crops, vine crops'
    range: CurLandUseEnum
    title: current land use

  cur_vegetation:
    description: Vegetation classification from one or more standard classification
      systems, or agricultural crop
    range: string
    title: current vegetation

  cur_vegetation_meth:
    description: Reference or method used in vegetation classification
    range: string
    title: current vegetation method

  cv_percent:
    description: Coefficient of variation across technical replicates
    range: float

  date_received:
    description: |-
      The date the sample was received.
    range: date
    aliases:
      - received_date
      - reception_date

  dd_ms2_resolution:
    description: Data-dependent MS2 resolution setting used in the mass spectrometry method
    range: double
    required: true
  
  density:
    description: 'Density of the sample, which is its mass per unit volume (aka volumetric
      mass density) (Unit: g/m3 or g/cm3)'
    pattern: ^\d+(\.\d+)?\s*(g/m3|g/cm3)$
    range: string
    title: density

  depth:
    description: 'The vertical distance below local surface. For sediment or soil samples,
      depth is measured from sediment or soil surface respectively. Depth is required
      to be reported as an interval for subsurface samples. (Units: m)'
    pattern: ^\d+(\.\d+)?(-\d+(\.\d+)?)?\s*m$
    range: string
    title: depth

  description:
    title: description
    description: Human-readable description for the entity or activity
    range: string

  diether_lipids:
    description: 'Concentration of diether lipids; can include multiple types of diether
      lipids (Unit: ng/L)'
    pattern: ^\d+(\.\d+)?\s*ng/L$
    range: string
    title: diether lipids

  diss_carb_dioxide:
    description: 'Concentration of dissolved carbon dioxide in the sample or liquid
      portion of the sample (Unit: umol/L or mg/L)'
    pattern: ^\d+(\.\d+)?\s*(umol|mg)/L$
    range: string
    title: dissolved carbon dioxide

  diss_hydrogen:
    description: 'Concentration of dissolved hydrogens (Unit: umol/L)'
    pattern: '^\d+(\.\d+)?\s*umol/L$'
    range: string
    title: dissolved hydrogen

  diss_inorg_carb:
    description: 'Dissolved inorganic carbon concentration in the sample, typically measured
      after filtering the sample using a 0.45 micrometer filter (Unit:  ug/L or mg/L
      or ppm)'
    pattern: ^\d+(\.\d+)?\s*(ug/L|mg/L|ppm)$
    range: string
    title: dissolved inorganic carbon

  diss_inorg_nitro:
    description: 'Concentration of dissolved inorganic nitrogen. (Unit: ug/L or umol/L)'
    pattern: ^\d+(\.\d+)?\s*(umol/L|ug/L)$
    range: string
    title: dissolved inorganic nitrogen

  diss_inorg_phosp:
    description: Concentration of dissolved inorganic phosphorus in the sample. Provide value and unit, any unit is valid.
    pattern: ^\d+(\.\d+)?\s*[\w\s/]+$
    range: string
    title: dissolved inorganic phosphate

  diss_org_carb:
    description: 'Concentration of dissolved organic carbon in the sample, liquid portion
      of the sample, or aqueous phase of the fluid. (Unit:  umol/L or mg/L)'
    pattern: ^\d+(\.\d+)?\s*(umol/L|mg/L)$
    range: string
    title: dissolved organic carbon

  diss_org_nitro:
    description: 'Dissolved organic nitrogen concentration measured as: total dissolved
      nitrogen - NH4 - NO3 - NO2. Provide value and unit, any unit is valid'
    pattern: ^\d+(\.\d+)?\s*[\w\s/]+$
    range: string
    title: dissolved organic nitrogen

  diss_oxygen:
    description: 'Concentration of dissolved oxygen. (Unit: umol/kg or mg/L)'
    pattern: ^\d+(\.\d+)?\s*(umol/kg|mg/L)$
    range: string
    title: dissolved oxygen

  donor_organism:
    description: |-
      Source organism for genetic components.
      Example: "Streptomyces tenebrarius (aprR), synthetic (Jungle express promoter)"
    range: string
  down_par:
    description: Visible waveband radiance and irradiance measurements in the water column. Provide value and unit, any unit is valid.
    pattern: ^\d+(\.\d+)?\s*[\w\s/]+$
    range: string
    title: downward PAR

  drainage_class:
    description: Drainage classification from a standard system such as the USDA system
    range: DrainageClassEnum
    title: drainage class

  duration_min:
    description: how long something took, in minutes
    range: float

  efficiency_percent:
    description: percentage of volatile solids removed from the anaerobic digestor
    range: string
    title: efficiency percent
    
  elev:
    description: 'Elevation of the sampling site is its height above a fixed reference
      point, most commonly the mean sea level. Elevation is mainly used when referring
      to points on the earth''s surface. (Unit: m).'
    pattern: ^\d+(\.\d+)?\s*m$
    range: string
    title: elevation

  email:
    range: string
    description: A contactable email address associated with a person or institution.

  emsl_activity:
    description: |-
      Nullable string linking a Sample or SamplingActivity to a named EMSL activity or
      campaign (e.g., 'AMP2', 'MONet_FY26'). Optional for historical records
      predating activity tracking.
    range: string
    todos:
      - Is sampling activity where we want to capture this?
    required: false

  emulsions:
    description: amount or concentration of substances such as paints, adhesives, mayonnaise,
      hair colorants, emulsified oils, etc.; can include multiple emulsion types
    range: string
    title: emulsions

  encoded_traits:
    description: |-
      Key traits encoded by genetic elements, such as antibiotic resistance 
      or xenobiotic degradation phenotypes for plasmids.
    range: string
  env_broad_scale:
    description: >-
      'Report the major environmental system the sample or specimen came
      from. The system identified should have a coarse spatial grain to provide the
      general environmental context of where the sampling was done (e.g. in the desert
      or a rainforest). We recommend using subclasses of EnvO''s biome class: http://purl.obolibrary.org/obo/ENVO_00000428.
      EnvO documentation about how to use the field: https://github.com/EnvironmentOntology/envo/wiki/Using-ENVO-with-MIxS'
    pattern: ^_*\s*[a-zA-Z\s]+\[ENVO:\d+\]$
    range: string
    title: broad-scale environmental context

  env_local_scale:
    description: >-
      'Report the entity which are in your sample or specimens local vicinity
      and which you believe have significant causal influences on your sample or specimen.
      Please use terms that are present in ENVO and which are of smaller spatial grain
      than your entry for env_broad_scale.If needed, request new terms on the ENVO tracker
      identified here: http://www.obofoundry.org/ontology/envo.html'
    pattern: ^_*\s*[a-zA-Z\s]+\[ENVO:\d+\]$
    range: string
    title: local environmental context

  env_medium:
    description: >-
      'Report the environmental material immediately surrounding the sample
      or specimen at the time of sampling. We recommend using subclasses of ''environmental
      material'' (http://purl.obolibrary.org/obo/ENVO_00010483). EnvO documentation
      about how to use the field: https://github.com/EnvironmentOntology/envo/wiki/Using-ENVO-with-MIxS.'
    pattern: ^_*\s*[a-zA-Z\s]+\[ENVO:\d+\]$
    range: string
    title: environmental medium

  experimental_factor:
    description: >-
      Experimental factors are essentially the variable aspects of an experiment
      design which can be used to describe an experiment or set of experiments in an
      increasingly detailed manner. This field accepts ontology terms from Experimental
      Factor Ontology (EFO) and/or Ontology for Biomedical Investigations (OBI). For
      a browser of EFO (v 2.95) terms please see http://purl.bioontology.org/ontology/EFO;
      for a browser of OBI (v 2018-02-12) terms please see http://purl.bioontology.org/ontology/OBI
    range: string
    title: experimental factor

  experimental_factor_other:
    description: Other details about your sample that you feel can't be accurately represented
      in the available columns.
    range: string
    title: other experimental factor

  exposure_sensitivity:
    description: Sensitivity the entity has if exposed (e.g. light-sensitive, oxygen-sensitive)
    range: string
    multivalued: true
  
  external_identifiers:
    description: List of external identifiers associated with this entity or activity.
    range: uriorcurie
    multivalued: true

  extraction_method:
    description: >-
      If you (the user) performed an extraction preparation or processing before
      sending the sample to EMSL, what was it? This is only applicable when sending an
      'analytical sample'. See README for more details on types of samples.
    range: string
    title: extraction method

  extreme_event:
    description: 'Unusual physical events that may have affected microbial populations.
      Format: YYYY-MM-DD'
    pattern: ^[12]\d{3}(?:(?:-(?:0[1-9]|1[0-2]))(?:-(?:0[1-9]|[12]\d|3[01]))?)?$
    range: string
    title: extreme event

  fao_class:
    description: Soil classification from the FAO World soil distribution from International
      Soil Reference and Information Centre (ISRIC). The list of available soil classifications
      can be found at https://www.isric.org/explore/world-soil-distribution
    range: FAOClassEnum
    title: FAO soil taxonomy classification

  fertilizer_regm:
    description: Information about treatment involving the use of fertilizers; should
      include the name of fertilizer, amount administered, treatment regimen including
      how many times the treatment was repeated, how long each treatment lasted, and the
      start and end time of the entire treatment; can include multiple fertilizer regimens
    range: string
    title: fertilizer regimen

  fid:
    description: Free induction decay
    range: double
    todos: is this a setting or a result?

  file_curie:
    description: an identifier for a file that resolves to the file's accessible location
    range: string

  filesize:
    range: integer

  filter_method:
    description: Type of filter used or how the sample was filtered
    range: string
    title: filter method

  fire:
    description: 'Historical and/or physical evidence of fire. Format: YYYY-MM-DD'
    pattern: ^[12]\d{3}(?:(?:-(?:0[1-9]|1[0-2]))(?:-(?:0[1-9]|[12]\d|3[01]))?)?$
    range: string
    title: fire

  first_blh:
    description: 'First boundary layer height candidate (meters) (Unit: m)'
    range: number
    title: first boundary layer height

  first_blh_quality_index:
    description: Quality index for first boundary layer height candidate (-999 if no
      candidate)
    range: string
    title: first boundary layer height quality

  first_cbh:
    description: 'First cloud base (meters) or vertical visibility (meters) (-999 if
      no cloud base or vertical visibility) (Unit: m)'
    range: number
    title: first cloud base height

  flooding:
    description: 'Historical and/or physical evidence of flooding. Format: YYYY-MM-DD'
    pattern: ^[12]\d{3}(?:(?:-(?:0[1-9]|1[0-2]))(?:-(?:0[1-9]|[12]\d|3[01]))?)?$
    range: string
    title: flooding

  flow_rate_ul_min:
    range: float
    description: Flow rate of the mobile phase, in microliters per minute.
  
  fluor:
    description: Raw or converted fluorescence of water. Provide value and unit, any unit is valid.
    pattern: ^\d+(\.\d+)?\s*[\w\s/]+$
    range: string
    title: fluorescence

  fragmentation:
    description: fragmentation technique used in the mass spectrometry run
    range: FragmentationEnum

  fungicide_regm:
    description: Information about treatment involving use of fungicides; should include
      the name of fungicide, amount administered, treatment regimen including how many
      times the treatment was repeated, how long each treatment lasted, and the start
      and end time of the entire treatment; can include multiple fungicide regimens
    range: string
    title: fungicide regimen

  gaseous_environment:
    description: Use of conditions with differing gaseous environments; should include
      the name of gaseous compound, amount administered, treatment duration, interval, and
      total experimental duration; can include multiple gaseous environment regimens
    range: string
    title: gaseous environment

  gaseous_substances:
    description: amount or concentration of substances such as hydrogen sulfide carbon
      dioxide methane etc.; can include multiple substances
    range: string
    title: gaseous substances

  gene_family:
    description: Gene family or marker used for the phylogeny (e.g., 16S, ITS)
    range: string
    required: false


id: https://w3id.org/MONet/analysis-api-schema/metaproteomics
name: analysis-api-schema-metaproteomics
title: Metaproteomics additions for MONet Analysis API
description: |
  Standalone metaproteomics schema fragment for MONet. This version is designed
  to validate independently even if other imported schema fragments contain errors.
  It provides the MetaproteomicsAnalysis class (NMDC-aligned by class_uri) and a
  specific DataProcessingActivity abstraction, linking upstream to AnalysisActivity.
license: MIT

prefixes:
  analysis_api_schema: https://w3id.org/MONet/analysis-api-schema/
  linkml: https://w3id.org/linkml/
  nmdc: https://w3id.org/nmdc/
  xsd: http://www.w3.org/2001/XMLSchema#

default_prefix: analysis_api_schema
default_range: string

imports:
  - linkml:types
  #- analysis_api_schema

types:
  uuid:
    uri: xsd:string
    base: string

enums:

  ChemicalConversionCategoryEnum:
    permissible_values:
      addition:
        text: addition
      substitution:
        text: substitution
      acid_base:
        text: acid_base
      reduction_oxidation:
        text: reduction_oxidation
      combustion:
        text: combustion
      decomposition:
        text: decomposition
      protease_cleavage:
        text: protease_cleavage
        description: an enzymatic cleavage which relies on an enzyme with protease activity
          to act on proteins and to produce polypeptides (protein fragments).
        meaning: OBI:0600056

  DigestionMethodEnum:
    description: Named protein digestion methods used in sample preparation.
    permissible_values:
      urea:
        text: urea
        description: Urea-based in-solution digestion.
      s_trap:
        text: s_trap
        description: S-Trap-based digestion.
      fasp:
        text: fasp
        description: Filter-Aided Sample Preparation (FASP) digestion.
      other:
        text: other
        description: Other digestion method not otherwise specified.

  EnrichmentTypeEnum:
    description: Type of targeted peptide or protein enrichment performed.
    permissible_values:
      phosphopeptide:
        text: phosphopeptide
        description: Enrichment of phosphopeptides.
      acetyl_peptide:
        text: acetyl_peptide
        description: Enrichment of acetylated peptides.
      ubiquitin_peptide:
        text: ubiquitin_peptide
        description: Enrichment of ubiquitinated peptides or diGly-modified peptides.
      other:
        text: other
        description: Other enrichment type not otherwise specified.

  ExtractionMethodEnum:
    description: The named extraction method or workflow applied to the sample.
    permissible_values:
      mplex:
        text: mplex
        description: MPLEx (Metabolite, Protein, and Lipid Extraction) protocol.
      bead_beating:
        text: bead_beating
        description: Bead beating mechanical lysis and extraction.
      tca_acetone_precipitation:
        text: tca_acetone_precipitation
        description: TCA/Acetone protein precipitation.
      cell_lysis_s_trap:
        text: cell_lysis_s_trap
        description: Cell lysis and S-Trap extraction.
      other:
        text: other
        description: Other extraction method not otherwise specified.

  LabelingMethodEnum:
    description: The chemical labeling strategy applied to peptides or proteins.
    permissible_values:
      tmt:
        text: tmt
        description: Tandem Mass Tag (TMT) isobaric labeling.
      itraq:
        text: itraq
        description: iTRAQ isobaric labeling.
      label_free:
        text: label_free
        description: No chemical labeling (label-free quantification).
      other:
        text: other
        description: Other labeling method not otherwise specified.

  MassSpectrometryAcquisitionStrategyEnum:
    permissible_values:
      data_independent_acquisition:
        text: data_independent_acquisition
        description: Data independent mass spectrometer acquisition method wherein the
          full mass range is fragmented. Examples of such an approach include MS^E, AIF,
          and bbCID.
        aliases:
        - DIA
        - data independent acquisition from dissociation of full mass range
        exact_mappings:
        - MS:1003227
      data_dependent_acquisition:
        text: data_dependent_acquisition
        description: Mass spectrometer data acquisition method wherein MSn spectra are
          triggered based on the m/z of precursor ions detected in the same run.
        aliases:
        - DDA
        exact_mappings:
        - MS:1003221
      full_scan_only:
        text: full_scan_only
        description: Mass spectrometer data acquisition method wherein only MS1 data are
          acquired.
        aliases:
        - MS

  MetaproteomicsAnalysisCategoryEnum: 
    description: The category of metaproteomics analysis being performed.
    permissible_values:
      matched_metagenome:
        description: A metaproteomics analysis matched to a metagenome from the same biosample.
      in_silico_metagenome:
        description: A metaproteomics analysis matched to an in silico generated metagenome.

  NormalizationMethodEnum:
    description: The strategy used to normalize sample amounts or intensities.
    permissible_values:
      equal_mass:
        text: equal_mass
        description: Normalization to an equal total protein mass per sample.
      equal_volume:
        text: equal_volume
        description: Normalization by volume.
      spike_in_standard:
        text: spike_in_standard
        description: Normalization using an internal spike-in standard.
      other:
        text: other
        description: Other normalization approach not otherwise specified.

  ProteinAssayTypeEnum:
    description: Type of protein quantification assay performed.
    permissible_values:
      coomassie:
        text: coomassie
        description: Coomassie (Bradford-like) protein assay.
      bca:
        text: bca
        description: Bicinchoninic Acid (BCA) protein assay.
      other:
        text: other
        description: Other protein assay not otherwise specified.

  SubstanceRoleEnum:
    description: The role or function of the substance in the context of its use.
    permissible_values:
      buffer:
        text: buffer
        description: Maintains the pH of the solution within a specific range to stabilize
          analytes or reactions.
        meaning: CHEBI:35225
      acid:
        text: acid
        description: Donates a proton or accepts an electron pair in a chemical reaction.
        meaning: CHEBI:37527
      base:
        text: base
        description: Accepts a proton or donates an electron pair in a chemical reaction.
        meaning: CHEBI:22695
      ms_proteolytic_enzyme:
        text: ms_proteolytic_enzyme
        description: Enzyme that catalyzes the hydrolysis of proteins and is used in mass
          spectrometry based proteomics
        meaning: MS:1002986
      solvent:
        text: solvent
        description: Dissolves the sample or reagents to facilitate reactions or extraction.
        meaning: CHEBI:46787
      surfactant:
        text: surfactant
        description: Reduces surface tension and aids in the solubilization of substances.
        meaning: CHEBI:35195
      derivatizing_agent:
        text: derivatizing_agent
        description: Chemically modifies analytes to improve detection or separation.
      solubilizing_agent:
        text: solubilizing_agent
 
classes:

  CalibrationProtocol: 
    description: Protocol details for calibration used in mass spectrometry process.
    attributes:
      id:
        identifier: true
        range: uuid
      calibration_standard:
        range: CalibrationStandardEnum
        description: the reference standard(s) used for calibration
      calibration_target:
        range: CalibrationTargetEnum
        description: the target measurement of the calibration
      internal_calibration:
        range: boolean
        description: whether internal calibration was used, if false, external calibration was used

  ChemicalConversionProcess: 
    is_a: Activity 
    description: A chemical conversion process used in mass spectrometry sample preparation. A process that results in the interconversion of chemical species by a reaction to transform the reagents into products.
    attributes:
      duration:
        range: QuantityValue
        description: Total time taken to complete the chemical conversion process.
      chemical_conversion_category:
        range: ChemicalConversionCategoryEnum
        description: The category of chemical conversion process.
      digestion_method:
        range: DigestionMethodEnum
        description: Named digestion method applied, when the category is protease_cleavage.
      enrichment_type:
        range: EnrichmentTypeEnum
        description: Type of enrichment performed, when this process is an enrichment step.
      has_input:
        range: Sample
        multivalued: true
        description: The input portion(s) of substance(s) used in the chemical conversion process.
      has_output:
        range: ProcessedSample
        multivalued: true
        description: The output portion(s) of substance(s) generated from the chemical conversion process.
      labeling_method:
        range: LabelingMethodEnum
        description: Chemical labeling strategy applied in this process (e.g., TMT).
      substances_used:
        range: PortionOfSubstance
        multivalued: true
        description: The portion(s) of substance(s) used in the chemical conversion process.
      temperature:
        range: QuantityValue
        description: Temperature at which the chemical conversion process was performed.

  ChromatographyProtocol: #MassSpectrometry related configuration class. maps to NMDC ChromatographyConfiguration
    description: Protocol details for chromatography used in mass spectrometry process.
    attributes:
      id:
        identifier: true
        range: uuid
      column_dimensions:
        range: string
        description: Dimensions of the chromatography column used in the process.
      column_manufacturer:
        range: string
      column_temp_celsius:
        range: QuantityValue
        description: Temperature of the chromatography column in degrees Celsius.
      chromatographic_category:
        range: ChromatographyCategoryEnum
        description: The type of chromatography used in a process.
      flow_rate_ul_min:
        range: QuantityValue
        description: Flow rate of the mobile phase in microliters per minute.
      injection_volume_ul:
        range: float
      protocol_id:
        range: uuid
        required: true
        description: Unique identifier for the chromatography protocol.
      stationary_phase:
        range: StationPhaseEnum
        description: Description of the stationary phase used in the chromatography.    
      total_run_time_min:
        range: float

  Extraction:
    is_a: Activity
    description: 
    attributes:
      extraction_targets:
        range: ExtractionTargetEnum
        multivalued: true
        description: The target analyte(s) or compound class(es) for the extraction process.
      extraction_method:
        range: ExtractionMethodEnum
        description: Named extraction method applied (e.g., MPLEx, bead beating, TCA/Acetone).
        todos: restrict so that can't use unknown
      has_input:
        range: Sample
        multivalued: true
        description: The input sample(s) used in the extraction process.
      has_output:
        range: ProcessedSample
        multivalued: true
        description: The output processed sample(s) generated from the extraction process.
      input_mass:
        range: QuantityValue
        description: Total mass of material/sample used as input for the extraction process.
      substances_used:
        range: PortionOfSubstance
        multivalued: true
        description: The portion(s) of substance(s) used in the extraction process.
      type:
        range: uriorcurie
        required: true
        description: the class_uri of the class that has been instantiated.
      
  FractionationProcess:
    is_a: Activity
    description: >
      A fractionation process (e.g., off-line high pH fractionation, SCX, etc.) that splits
      an input sample into multiple fractions for downstream LC-MS/MS.
    attributes:
      has_input:
        range: ProcessedSample
        multivalued: true
        required: true
        description: Processed sample(s) before fractionation.
      has_output:
        range: ProcessedSample
        multivalued: true
        required: true
        description: Fractionated processed sample(s) generated by this process.
      lims_protocol_instance_id:
        range: integer
        description: Optional L7 protocol_instance backing this fractionation step.

  MassSpectrometry:
    is_a: Activity
    description: NMDC MassSpectrometry planned process / Instrument run.
    attributes:
      alternative_identifiers:
        range: string
        multivalued: true
        description: A list of alternative identifiers for the entity
      analyte_category:
        range: MassSpectrometryEnum
        description: The type of analyte(s) that were measured in the data generation process  
      associated_studies:
        range: Study
        multivalued: true
        description: Studies associated with this mass spectrometry run.
      eluent_introduction_category:
        range: EluentIntroductionCategoryEnum
        description: A high-level categorization for how the processed sample is introduced into a mass spectrometer.
      has_chromatography_configuration:
        #range: ChromatographyConfiguration
        range: ChromatographyProtocol
        description: The identifier of the associated MassSpectrometryConfiguration.
      has_input:
        range: Sample
        multivalued: true
        description: An input to a process.
      has_mass_spectrometry_configuration:
        #range: MassSpectrometryConfiguration
        range: MassSpecProtocol
        description: The identifier of the associated MassSpectrometryConfiguration.
      has_output:
        range: DataObject
        multivalued: true
        description: Output raw data files (DataObject). An output from a process
      Instrument_used:
        range: Instrument
        multivalued: true
        description: What Instrument was used during DataGeneration or MaterialProcessing
      lims_protocol_instance_id:     # ADDED optional linkage to L7 protocol_instance
        range: integer
        description: L7 protocol_instance_id backing this MS run, if known.
      mod_date:
        range: datetime
        description: The last date on which the database information was modified
      type:
        range: uriorcurie
        required: true
        description: Should be nmdc:MassSpectrometry

  MassSpecProtocol:
    description:  
      MS Instrument configuration. Maps to NMDC MassSpectrometryConfiguration.
      Reusable protocol entity - many acquisitions reference same config.
      Core parameters in typed attributes for queryability.
      Linked to activities via Used(role=mass_spectrometry_configuration).
    attributes:
      id:
        identifier: true
        range: uuid
        required: true
      fragmentation_modes:
        description: Fragmentation techniques
        range: FragmentedNodesEnum
        multivalued: true
      Instrument_entity_id:
        description: FK to Instrument entity
        range: Instrument
      ionization_source:
        range: IonizationSourceEnum
        description: The ionization source used to introduce processed samples into a mass spectrometer
      mass_analyzers:
        range: MassAnalyzerEnum
        description: The type(s) of mass analyzers used in the mass spectrometry protocol (e.g., TOF, Orbitrap).
      mass_range_max:
        range: float
      mass_range_min:
        range: float
      mass_spectrometry_acquisition_strategy:
        range: MassSpectrometryAcquisitionStrategyEnum
        description: Strategy used for data acquisition in mass spectrometry (e.g., DDA, DIA).
      mass_spectrum_collection_modes:
        description: Spectrum collection modes
        range: MassSpectrumCollectionModeEnum
        multivalued: true
      polarity_mode:
        range: PolarityModeEnum
        description: the polarity of which ions are generated and detected
      protocol_id:
        range: uuid
        required: true
      resolution_categories:
        range: ResolutionCategoryEnum
        multivalued: true
        description: The relative resolution at which spectra were collected.
      
  MetaproteomicsAnalysis:
    is_a: DataProcessingActivity
    description: NMDC-aligned MetaproteomicsAnalysis processing run layered onto MONet internal standards.
    attributes:
      has_input:
        range: DataObject
        multivalued: true
        description: Input samples used in the metaproteomics analysis.
      has_output:
        range: DataObject
        multivalued: true
        description: Output data objects generated from the metaproteomics analysis.
      lims_task_instance_id:          
        range: integer
        description: L7 task_instance_id for the metaproteomics workflow, if known.
      metaproteomics_analysis_category:
        range: MetaproteomicsAnalysisCategoryEnum
        required: true
        description: The category of metaproteomics analysis being performed.
      type:
        range: uriorcurie
        required: true
        description: the class_uri of the class that has been instantiated
      version:
        range: string
        description: Version of the metaproteomics analysis pipeline used.
      was_informed_by:
        range: MassSpectrometry
        description: Reference to the analysis activity that informed this metaproteomics analysis.
      
  MobilePhaseSegment: #maps to NMDC MobilePhaseSegment array
    description: A segment of the mobile phase used in chromatography during mass spectrometry.
    attributes:
      id:
        identifier: true
        range: uuid
      concentration_unit:
        range: string
        description: Unit of concentration for the substance in the mobile phase during this segment.
      concentration_value:
        range: QuantityValue
        description: Concentration of the substance in the mobile phase during this segment.
      duration_min:
        range: QuantityValue
        description: The elapsed time of an activity.
      name:
        range: string
        required: true
        description: Human-readable name of the mobile phase segment.
      protocolid:
        identifier: true
        range: uuid
      segment_order:
        range: integer
        description: The order of this segment in the overall chromatography protocol.
      substance_name:
        range: string
        description: Name of the substance making up this segment of the mobile phase.
      
  NormalizationProcess:
    is_a: Activity
    description: >
      A process that adjusts sample amounts (e.g., protein mass or volume)
      to a common level across samples, prior to downstream processing.
    attributes:
      has_input:
        range: ProcessedSample
        multivalued: true
        required: true
        description: Processed sample(s) before normalization.
      has_output:
        range: ProcessedSample
        multivalued: true
        required: true
        description: Processed sample(s) after normalization.
      normalization_method:
        range: NormalizationMethodEnum
        description: The strategy used for normalization (equal mass, equal volume, etc.).
      target_amount:
        range: QuantityValue
        description: Target amount (mass or volume) per sample after normalization.

  PoolingProcess:
    is_a: Activity
    description: >
      A laboratory pooling process that physically mixes multiple input samples
      into a single pooled processed sample for downstream analysis.
      Typically corresponds to the L7 "Sample Pooling" / "Pooling" protocols.
    attributes:
      has_input:
        range: Sample
        multivalued: true
        required: true
        description: The parent sample(s) that are pooled together.
      has_output:
        range: ProcessedSample
        multivalued: false
        required: true
        description: The pooled processed sample generated by the pooling process.
      mass:
        range: QuantityValue
        description: Total mass or volume of material pooled, if recorded.
      substances_used:
        range: PortionOfSubstance
        multivalued: true
        description: Reagents used during pooling (e.g., buffer, solvent).

  PortionOfSubstance:
    description: A portion of a substance with specific characteristics.
    attributes:
      Known_as:
        range: ChemicalEntityEnum
        description: Common name or identifier for the substance.
      substance_role:
        range: SubstanceRoleEnum
        description: The role or function of the substance in the context of its use.
      volume:
        range: QuantityValue
        description: The volume of the portion of the substance.

  ProteinAssay:
    is_a: Activity
    description: >
      A protein quantification assay (e.g., Coomassie or BCA) performed on a sample
      to determine protein concentration prior to downstream processing.
    attributes:
      has_input:
        range: ProcessedSample
        multivalued: true
        required: true
        description: Processed sample(s) on which the protein assay was performed.
      has_output:
        range: ProcessedSample
        multivalued: true
        required: true
        description: Processed sample(s) after the assay; typically the same physical material with updated concentration.
      lims_protocol_instance_id:
        range: integer
        description: Optional L7 protocol_instance backing this BCA assay.
      measured_concentration:
        range: QuantityValue
        description: Measured protein concentration for the assayed sample.
      protein_assay_type:
        range: ProteinAssayTypeEnum
        required: true
        description: The type of protein assay (Coomassie, BCA, etc.).

  ResuspensionProcess:
    is_a: Activity
    description: >
      A resuspension step (e.g., drying and resolubilizing peptides in LC buffer)
      before LC-MS/MS injection.
    attributes:
      has_input:
        range: ProcessedSample
        multivalued: true
        required: true
        description: Dried or concentrated peptide samples before resuspension.
      has_output:
        range: ProcessedSample
        multivalued: true
        required: true
        description: Resuspended samples ready for LC-MS/MS injection.
      lims_protocol_instance_id:
        range: integer
        description: Optional L7 protocol_instance backing this resuspension step.

  SolidPhaseExtractionProcess:
    is_a: Activity
    description: >
      A solid phase extraction (SPE) step (e.g., C18 desalting) performed as sample preparation.
    attributes:
      chromatography_protocol:
        range: ChromatographyProtocol
        description: Chromatography configuration used for the SPE step (C18, SPE).
      has_input:
        range: ProcessedSample
        multivalued: true
        required: true
      has_output:
        range: ProcessedSample
        multivalued: true
        required: true
      lims_protocol_instance_id:
        range: integer
        description: Optional L7 protocol_instance backing this SPE/C18 step.
      
  SubSamplingProcess:
    is_a: Activity
    description: A laboratory subsampling process that takes a portion of an existing sample
      and produces a derived (processed) sample for downstream analysis. (Separating a sample aliquot from the starting material for downstream activity.)
    attributes:
      has_input:
        range: Sample
        multivalued: true
        required: true
        description: The parent sample(s) used as input to subsampling.
      has_output:
        range: ProcessedSample
        multivalued: true
        required: true
        description: The processed sample(s) generated by subsampling.
      mass:
        range: QuantityValue
        description: Mass of material subsampled (e.g., 30 g).

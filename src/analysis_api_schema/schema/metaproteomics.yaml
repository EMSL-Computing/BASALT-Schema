      sample_name:
        range: string
      s3_base_url:
        range: string
      s3_bucket:
        range: string
      s3_key:
        range: string
        required: true
      version:
        range: string
  
  ProcessedSample:
    description: Portion/aliquot derived for downstream activity
    is_a: Sample
    attributes:
      concentration_ug_per_uL:
        range: float
        description: Concentration of the processed sample in micrograms per microliter, if applicable.
      derived_from:
        range: Sample
        description: Parent sample this was derived from (L7 generation)
      fraction_label:
        range: string
        description: Label / index of the fraction (e.g., "F1", "F2", "Fraction_03").
      lims_resource_id: # optional link back to L7 sample resource_id
        range: integer
      sampled_portion:
        range: SamplePortionEnum
      storage_location:
        range: string
      total_amount_ug:
        range: float
      volume_uL:
        range: float

  ProteinAssay:
    is_a: Activity
    description: >
      A protein quantification assay (e.g., Coomassie or BCA) performed on a sample
      to determine protein concentration prior to downstream processing.
    attributes:
      has_input:
        range: ProcessedSample
        multivalued: true
        required: true
        description: Processed sample(s) on which the protein assay was performed.
      has_output:
        range: ProcessedSample
        multivalued: true
        required: true
        description: Processed sample(s) after the assay; typically the same physical material with updated concentration.
      lims_protocol_instance_id:
        range: integer
        description: Optional L7 protocol_instance backing this BCA assay.
      measured_concentration:
        range: QuantityValue
        description: Measured protein concentration for the assayed sample.
      protein_assay_type:
        range: ProteinAssayTypeEnum
        required: true
        description: The type of protein assay (Coomassie, BCA, etc.).
    
  Protocol:
    description: A documented protocol or standard operating procedure (SOP) used in a process.
    attributes:
      id:
        identifier: true
        range: uuid
      description:
        range: string
        description: Description of the protocol.
      name:
        range: string
        required: true
        description: Human-readable name of the protocol.
      url:
        range: string
        description: URL link to the protocol document or resource.

  
  ResuspensionProcess:

id: https://w3id.org/MONet/analysis-api-schema/metagenomics
name: metagenomics
title: Metagenomics additions for MONet Analysis API
description: |
  Lightweight LinkML fragment for metagenomics products. This file defines
  minimal product classes that point to top-level zips/tars stored in MinIO.
  The detailed per-bin modeling (magBin) can be removed later but has relationship with workflowExecutionActivity
license: MIT

prefixes:
  analysis_api_schema: https://w3id.org/MONet/analysis-api-schema/
  linkml: https://w3id.org/linkml/
default_prefix: analysis_api_schema

imports:
  - linkml:types
  - analysis_api_schema

# Reusable attributes for metagenomics product provenance
# Note: Using top-level 'attributes' rather than 'slots' aligns with LinkML 1.2+ conventions
# and the schema's migration effort to standardize on attributes terminology
attributes:
  provider_name:
    range: controlledTermValue
    description: "Provider class (e.g., JGI, SeqCenter) using ontology terms where possible"
  raw_fasta_url:
    range: string
    description: "URL of raw FASTA file, if available from provider"
  additional_information:
    range: string
    description: "Additional information pertaining to these data, including SP Project ID and Taxon OID"

classes:
  # Top-level product for binning results (one zip/tar per project/sample)
  Metagenomics_BinningProduct:
    description: "Top-level archive (zip/tar) for binning results stored in MinIO"
    attributes:
      id:
        identifier: true
        range: processedData
        description: "Identifier referencing the canonical ProcessedData / MetaGenomicsProduct row (contains S3 pointer)"
      workflow_step:
        range: metagenomicssteps
        description: "Optional: enumerated workflow step that produced the product (e.g., MagsAnalysis)"
      sample_id:
        range: sample
        description: "Link back to the originating sample (nullable)"
      provider_name:  # Inherited from top-level attributes
      raw_fasta_url:  # Inherited from top-level attributes
      additional_information:  # Inherited from top-level attributes


  # Top-level product for functional annotation results (zip/tar)
  Metagenomics_AnnotationProduct:
    description: "Top-level archive for annotation outputs (points to MinIO)"
    attributes:
      id:
        identifier: true
        range: processedData
        description: "Identifier referencing the canonical ProcessedData / MetaGenomicsProduct row (contains S3 pointer)"
      workflow_step:
        range: metagenomicssteps
      sample_id:
        range: sample
      annotation_database:
        range: annotationdatabasetype
        description: "Optional: primary annotation database used"
      provider_name:  # Inherited from top-level attributes
      raw_fasta_url:  # Inherited from top-level attributes
      additional_information:  # Inherited from top-level attributes 


  # Top-level product for gene-based phylogeny outputs (zip/tar)
  Metagenomics_GenePhylogenyProduct:
    description: "Top-level archive for gene phylogeny outputs (points to MinIO)"
    attributes:
      id:
        identifier: true
        range: processedData
        description: "Identifier referencing the canonical ProcessedData / MetaGenomicsProduct row (contains S3 pointer)"
      workflow_step:
        range: metagenomicssteps
      sample_id:
        range: sample
      gene_family:
        range: string
        description: "Optional gene family or marker used for the phylogeny"
      provider_name:  # Inherited from top-level attributes
      raw_fasta_url:  # Inherited from top-level attributes
      additional_information:  # Inherited from top-level attributes 


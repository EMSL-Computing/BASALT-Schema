id: https://w3id.org/MONet/analysis-api-schema/metagenomics
name: analysis-api-schema-metagenomics
title: Metagenomics additions for MONet Analysis API
description: |
  Metagenomics product and workflow classes for the MONet Analysis API.

  Inheritance hierarchy (all is_a chains):
    dataProduct (abstract)
      └── processedData
            └── MetagenomicsProduct  (abstract, MR: metagenomics)
                  ├── Metagenomics_AnnotationProduct
                  ├── Metagenomics_BinningProduct
                  └── Metagenomics_GenePhylogenyProduct

    DataProcessingActivity (abstract)
      └── MetagenomicsDataProcessingActivity

  Each product class carries only its type-specific slots; shared S3/file slots
  are inherited from dataProduct via processedData via MetagenomicsProduct.
license: MIT

prefixes:
  analysis_api_schema: https://w3id.org/MONet/analysis-api-schema/
  linkml: https://w3id.org/linkml/
default_prefix: analysis_api_schema

imports:
  - linkml:types
  - analysis_api_schema
  - slots

classes:

  # new - from metaproteomics.yaml - NucleotideSequencing activity class
  NucleotideSequencing:
    is_a: DataGenerationActivity
    description: A lab activity in which DNA or RNA that was extracted from a sample is sequenced. 
    slots:
      - nucleotide_sequencing_category  # e.g., amplicon, shotgun
      - external_identifiers
    slot_usage:
      - external_identifiers:
          description: List of external identifiers (e.g., GOLD sequencing project, NCBI BioProject) associated with this sequencing activity.
  
  # new - followup from metaproteomics.yaml - a nucleotide specific instrument
  # data class that is not abstract

  NucleotideSequencingInstrumentData:
    is_a: InstrumentData
    description: Data generated by a nucleotide sequencing instrument (e.g., raw FASTQ files).
    slots:
      - produced_by_sequencing_activity

  # ============================================================================
  # (NEW ABSTRACT) MetagenomicsProduct
  # Middle tier in the dataProduct -> processedData -> MetagenomicsProduct chain.
  # Carries slots common to all three metagenomics sub-types so they do not
  # need to be repeated on each concrete class.
  # ============================================================================
  MetagenomicsProduct:
    is_a: ProcessedData
    abstract: true
    description: |-
      Abstract base for all metagenomics data products.
      Inherits S3/file slots from dataProduct (via processedData is_a chain).
      Concrete sub-types (Annotation, Binning, GenePhylogeny) use is_a to inherit
      and add only their type-specific slots.
    slots:
      - mg_workflow_step
      - sample_id
      - provider_name
      - raw_fasta_url
      - additional_information


  # ============================================================================
  # (CHANGED) Metagenomics_AnnotationProduct
  # Previously used id: range processedData pattern; now uses is_a inheritance.
  # Type-specific slot: annotation_database.
  # ============================================================================
  Metagenomics_AnnotationProduct:
    is_a: MetagenomicsProduct
    description: |-
      Top-level archive for functional annotation outputs (zip/tar stored in MinIO).
      Inherits all MetagenomicsProduct and dataProduct slots.
    slots:
      - annotation_database  # primary annotation database (e.g., IMG, KEGG)


  # ============================================================================
  # (CHANGED) Metagenomics_BinningProduct
  # Previously used id: range processedData pattern; now uses is_a inheritance.
  # No type-specific slots beyond what MetagenomicsProduct provides.
  # ============================================================================
  Metagenomics_BinningProduct:
    is_a: MetagenomicsProduct
    description: |-
      Top-level archive (zip/tar) for binning results stored in MinIO.
      Inherits all MetagenomicsProduct and dataProduct slots.
    # No additional type-specific slots.


  # ============================================================================
  # (CHANGED) Metagenomics_GenePhylogenyProduct
  # Previously used id: range processedData pattern; now uses is_a inheritance.
  # This is a sub-sub-class: is_a MetagenomicsProduct -> is_a processedData -> is_a dataProduct.
  # Type-specific slot: gene_family.
  # ============================================================================
  Metagenomics_GenePhylogenyProduct:
    is_a: MetagenomicsProduct
    description: |-
      Top-level archive for gene-based phylogeny outputs (zip/tar stored in MinIO).
      Inherits all MetagenomicsProduct and dataProduct slots.
    slots:
      - gene_family  # gene family or marker used for phylogeny (e.g., 16S, ITS)


  # ============================================================================
  # (NEW) MetagenomicsDataProcessingActivity
  # Concrete subclass of DataProcessingActivity (now abstract in MR1).
  # Carries no additional unique slots beyond the parent; represents a typed
  # workflow record so that DataProcessingActivity can remain abstract.
  # ============================================================================
  MetagenomicsDataProcessingActivity:
    is_a: DataProcessingActivity
    description: |-
      Concrete metagenomics workflow run. Inherits all DataProcessingActivity
      slots including parent_workflow_id (chain link) and workflow_steps
      (key-value, schema TBD). Specific workflow step type is captured via the
      inherited type attribute (string); expected values: 
      'metagenomics_annotation', 'metagenomics_binning', 'metagenomics_phylogeny'.
    # No additional type-specific slots beyond DataProcessingActivity.


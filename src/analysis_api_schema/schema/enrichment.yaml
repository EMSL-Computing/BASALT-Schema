---
id: https://w3id.org/MONet/analysis-api-schema/enrichment
name: analysis-api-schema-enrichment
title: MONet Analysis API - Metadata Enrichment Schema
description: |-
  Schema for external metadata provider enrichment including site metadata and climate data
license: MIT

prefixes:
  analysis_api_schema: https://w3id.org/MONet/analysis-api-schema/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  qudt: http://qudt.org/schema/qudt/
  unit: http://qudt.org/vocab/unit/
default_prefix: analysis_api_schema
default_range: string

imports:
  - linkml:types
  - samples

## This file can go away?

classes:

  SiteMetadata:
    is_a: NamedThing
    description: Site-level metadata record for a given provider (e.g., NASA POWER)
    slots:
      - cache_key
      - latitude
      - longitude
      - provider
      - enriched_at
      - created_at
      - updated_at
      - nasa_climate_data
    slot_usage:
      cache_key:
        description: Spatial cache key for efficient lookups
        range: string
        required: true
      latitude:
        description: Geographic latitude coordinate
        range: float
        minimum_value: -90.0
        maximum_value: 90.0
        required: true
      longitude:
        description: Geographic longitude coordinate
        range: float
        minimum_value: -180.0
        maximum_value: 180.0
        required: true
      provider:
        description: The metadata provider name (e.g., 'NASA_POWER', 'WorldClim')
        range: string
        required: true
      enriched_at:
        description: Timestamp when enrichment was performed
        range: datetime
        required: true
      created_at:
        description: Timestamp when record was created
        range: datetime
        required: true
      updated_at:
        description: Timestamp when record was last updated
        range: datetime
        required: false
      nasa_climate_data:
        description: NASA POWER climate data for this site
        range: NASAClimateData
        required: false

  NASAClimateData:
    description: Climate data from NASA POWER service
    slots:
      - nasa_mean_annual_temp_c
      - nasa_mean_annual_precip_mm
      - nasa_max_annual_temp_c
      - nasa_min_annual_temp_c
      - nasa_mean_wind_speed_ms
      - nasa_mean_relative_humidity_pct
      - nasa_frost_days_per_year
      - nasa_mean_dew_point_c
      - nasa_mean_vapor_pressure_kpa
      - nasa_mean_surface_pressure_kpa
      - nasa_mean_shortwave_radiation_wm2
      - nasa_mean_longwave_radiation_wm2
    slot_usage:
      nasa_mean_annual_temp_c:
        description: Mean annual temperature from NASA POWER
        range: QuantityValue
        required: false
      nasa_mean_annual_precip_mm:
        description: Mean annual precipitation from NASA POWER
        range: QuantityValue
        required: false
      nasa_max_annual_temp_c:
        description: Maximum annual temperature from NASA POWER
        range: QuantityValue
        required: false
      nasa_min_annual_temp_c:
        description: Minimum annual temperature from NASA POWER
        range: QuantityValue
        required: false
      nasa_mean_wind_speed_ms:
        description: Mean wind speed from NASA POWER
        range: QuantityValue
        required: false
      nasa_mean_relative_humidity_pct:
        description: Mean relative humidity from NASA POWER
        range: QuantityValue
        required: false
      nasa_frost_days_per_year:
        description: Number of frost days per year from NASA POWER
        range: QuantityValue
        required: false
      nasa_mean_dew_point_c:
        description: Mean dew point temperature from NASA POWER
        range: QuantityValue
        required: false
      nasa_mean_vapor_pressure_kpa:
        description: Mean vapor pressure from NASA POWER
        range: QuantityValue
        required: false
      nasa_mean_surface_pressure_kpa:
        description: Mean surface pressure from NASA POWER
        range: QuantityValue
        required: false
      nasa_mean_shortwave_radiation_wm2:
        description: Mean shortwave radiation from NASA POWER
        range: QuantityValue
        required: false
      nasa_mean_longwave_radiation_wm2:
        description: Mean longwave radiation from NASA POWER
        range: QuantityValue
        required: false

  WorldClimData:
    description: Climate data from WorldClim service (placeholder for future implementation)
    slots:
      - worldclim_bio1
      - worldclim_bio12
    slot_usage:
      worldclim_bio1:
        description: WorldClim BIO1 - Annual Mean Temperature
        range: QuantityValue
        required: false
      worldclim_bio12:
        description: WorldClim BIO12 - Annual Precipitation
        range: QuantityValue
        required: false

  ElevationData:
    description: Elevation data from various providers
    slots:
      - elevation_m
      - elevation_source
    slot_usage:
      elevation_m:
        description: Elevation in meters above sea level
        range: QuantityValue
        required: false
      elevation_source:
        description: Source of elevation data
        range: string
        required: false

  # Container classes for collections
  SiteMetadataCollection:
    tree_root: true
    description: A collection of site metadata records
    slots:
      - site_metadata_entries
    slot_usage:
      site_metadata_entries:
        description: Collection of site metadata records
        range: SiteMetadata
        multivalued: true
        inlined: true

slots:
  # Existing slots from samples are inherited
  
  # QuantityValue slots
  numeric_value:
    description: The numeric value of a quantity
    range: float
    required: false

  unit_code:
    description: The unit code (e.g., 'Cel', 'mm', 'kPa')
    range: string
    required: false

  unit_name:
    description: The human-readable unit name
    range: string
    required: false

  # SiteMetadata slots
  cache_key:
    description: Spatial cache key for efficient lookups
    range: string
    required: false

  latitude:
    description: Geographic latitude coordinate
    range: float
    minimum_value: -90.0
    maximum_value: 90.0
    required: false

  longitude:
    description: Geographic longitude coordinate
    range: float
    minimum_value: -180.0
    maximum_value: 180.0
    required: false

  provider:
    description: The metadata provider name
    range: string
    required: false

  enriched_at:
    description: Timestamp when enrichment was performed
    range: datetime
    required: false

  created_at:
    description: Timestamp when record was created
    range: datetime
    required: false

  updated_at:
    description: Timestamp when record was last updated
    range: datetime
    required: false

  nasa_climate_data:
    description: NASA POWER climate data
    range: NASAClimateData
    required: false

  # NASA POWER climate slots
  nasa_mean_annual_temp_c:
    description: Mean annual temperature from NASA POWER
    range: QuantityValue
    required: false

  nasa_mean_annual_precip_mm:
    description: Mean annual precipitation from NASA POWER
    range: QuantityValue
    required: false

  nasa_max_annual_temp_c:
    description: Maximum annual temperature from NASA POWER
    range: QuantityValue
    required: false

  nasa_min_annual_temp_c:
    description: Minimum annual temperature from NASA POWER
    range: QuantityValue
    required: false

  nasa_mean_wind_speed_ms:
    description: Mean wind speed from NASA POWER
    range: QuantityValue
    required: false

  nasa_mean_relative_humidity_pct:
    description: Mean relative humidity from NASA POWER
    range: QuantityValue
    required: false

  nasa_frost_days_per_year:
    description: Number of frost days per year from NASA POWER
    range: QuantityValue
    required: false

  nasa_mean_dew_point_c:
    description: Mean dew point temperature from NASA POWER
    range: QuantityValue
    required: false

  nasa_mean_vapor_pressure_kpa:
    description: Mean vapor pressure from NASA POWER
    range: QuantityValue
    required: false

  nasa_mean_surface_pressure_kpa:
    description: Mean surface pressure from NASA POWER
    range: QuantityValue
    required: false

  nasa_mean_shortwave_radiation_wm2:
    description: Mean shortwave radiation from NASA POWER
    range: QuantityValue
    required: false

  nasa_mean_longwave_radiation_wm2:
    description: Mean longwave radiation from NASA POWER
    range: QuantityValue
    required: false

  # WorldClim slots (placeholder)
  worldclim_bio1:
    description: WorldClim BIO1 - Annual Mean Temperature
    range: QuantityValue
    required: false

  worldclim_bio12:
    description: WorldClim BIO12 - Annual Precipitation
    range: QuantityValue
    required: false

  # Elevation slots
  elevation_m:
    description: Elevation in meters above sea level
    range: QuantityValue
    required: false

  elevation_source:
    description: Source of elevation data
    range: string
    required: false

  # Collection slots
  site_metadata_entries:
    description: Collection of site metadata records
    range: SiteMetadata
    multivalued: true
    required: false
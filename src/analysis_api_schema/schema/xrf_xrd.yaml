id: https://w3id.org/MONet/analysis-api-schema/xrf-xrd
name: analysis-api-schema-xrf-xrd
title: XRF/XRD X-ray Analysis for MONet Analysis API
description: |
  X-ray analytical methods (XRF elemental analysis and XRD mineralogical analysis)
  for the MONet Analysis API.
  
  Data format: Wide format (one row per sample) with individual columns for each
  element/mineral measured, matching the pattern established by IonsAnalysisProduct
  and other multi-analyte products in the schema.

  Inheritance hierarchy (all is_a chains):
    
    dataGenerationActivity (abstract)
      └── XRaydataGenerationActivity (abstract, MR: xrf_xrd) 
            ├── XRFdataGenerationActivity
            └── XRDdataGenerationActivity
    
    dataProduct (abstract)
      └── processedData
            └── XRayDataProduct (abstract, MR: xrf_xrd)
                  ├── XRFElementalProduct
                  └── XRDPhaseProduct

  Data flow patterns:
    
    XRF (direct instrument output, no computational workflow):
      processedSample(soil replicate)
        -> XRFdataGenerationActivity
            protocol_url: vendor SOP or EMSL internal protocol
            instrument_id -> instrument (e.g., Rigaku ZSX Primus IV)
        -> [no dataProcessingActivity needed for direct output]
        -> XRFElementalProduct (one row per sample, wide format with 27 element columns)
            summary_metrics: {"Ni_mg_kg":45.3, "Pb_mg_kg":8.2}
            s3_key: "xrf/raw/sample_001_spectrum.csv"
            Columns: cl_mg_per_kg, v_mg_per_kg, cr_mg_per_kg, ni_mg_per_kg, ... (27 elements)
                     flag_cl, flag_v, flag_cr, ... (27 flags using ProcessedDataFlag)
    
    XRD (may include computational refinement):
      processedSample(soil replicate, ground powder)
        -> XRDdataGenerationActivity
        -> [optional] dataProcessingActivity(type='xrd_rietveld_refinement')
            if computational refinement is performed
        -> XRDPhaseProduct (one row per sample, wide format with 10 mineral columns)
            summary_metrics: {"quartz_percent":42, "albite_percent":18}
            s3_key: "xrd/raw/sample_001_diffractogram.xy"
            Columns: quartz_percent, albite_percent, microcline_percent, ... (10 minerals)
                     flag_quartz, flag_albite, ... (10 flags using ProcessedDataFlag)

  Future extensibility:
    The XRaydataGenerationActivity abstract class can accommodate additional X-ray methods
    such as X-ray computed tomography (XCT) if needed.

  Integration notes:
    - XRaydataGenerationActivity classes -> paste into analysis_api_schema.yaml classes section
    - XRayDataProduct classes -> paste into products.yaml classes section
    - New enum values -> add to enums.yaml as noted in comments below
    - Shared slots -> already defined in analysis_api_schema.yaml (inherited via is_a)

license: MIT

prefixes:
  analysis_api_schema: https://w3id.org/MONet/analysis-api-schema/
  linkml: https://w3id.org/linkml/
default_prefix: analysis_api_schema

imports:
  - linkml:types
  - analysis_api_schema
  - enums
  - slots

# =============================================================================
# CLASSES — dataGenerationActivity subclasses
# -> PASTE THESE INTO analysis_api_schema.yaml classes section
# =============================================================================

classes:

  # ---------------------------------------------------------------------------
  # (NEW ABSTRACT CLASS) XRaydataGenerationActivity
  # Abstract parent for all X-ray analytical methods.
  # Concrete subclasses: XRFdataGenerationActivity, XRDdataGenerationActivity
  # Future: XCTdataGenerationActivity (X-ray computed tomography) could be added here
  # ---------------------------------------------------------------------------
  XRaydataGenerationActivity:
    is_a: dataGenerationActivity
    abstract: true
    description: |-
      Abstract base class for X-ray analytical methods including XRF (elemental)
      and XRD (mineralogical) analysis. Inherits acquisition_time, instrument_id,
      protocol_url, analyte_id, and other core metadata from dataGenerationActivity.
      
      Concrete subclasses define method-specific measurement parameters.
      Future X-ray methods (e.g., XCT) can extend this class.
      
      Shared patterns:
        - Direct instrument output (no computational workflow) is typical for XRF
        - XRD may optionally link to dataProcessingActivity for Rietveld refinement
        - protocol_url should link to vendor SOP or EMSL internal protocol documentation
    # Inherits from dataGenerationActivity:
    #   - id (uuid identifier)
    #   - type (routemethod enum — NEW VALUES: xrf_analysis, xrd_analysis)
    #   - analyte_id (FK to processedSample)
    #   - acquisition_time (datetime, required)
    #   - instrument_id (FK to instrument)
    #   - protocol_url (string)
    #   - instrument_operator_id (FK to personValue)
    #   - sequence_order (integer, for temporal series)
    #   - version (string)
    #   - name (string)
    # No additional attributes needed at this abstract level.


  # ---------------------------------------------------------------------------
  # XRFdataGenerationActivity — Concrete X-ray Fluorescence
  # ---------------------------------------------------------------------------
  XRFdataGenerationActivity:
    is_a: XRaydataGenerationActivity
    description: |-
      X-ray Fluorescence (XRF) elemental analysis activity.
      
      XRF measures elemental composition by detecting characteristic X-ray emissions
      from a sample bombarded with high-energy X-rays. Typical output: concentrations
      of 10-30 elements per sample (Ni, Pb, As, Cr, Fe, Ca, K, etc.).
      
      Data product: XRFElementalProduct (one row per element per sample)
      
      Workflow pattern: Direct instrument output (no computational processing step)
        processedSample -> XRFdataGenerationActivity -> XRFElementalProduct (workflow_id = NULL)
      
      Protocol information: Stored externally; link via protocol_url attribute.
      Example protocol parameters (stored in external SOP or dataProcessingActivity
      if computational correction is needed):
        - Beam voltage (kV), beam current (mA)
        - Measurement duration (seconds)
        - Matrix correction method (fundamental parameters, empirical)
        - Calibration date
        - Operator ID
      
      Required enum additions to enums.yaml:
        routemethod:
          xrf_analysis:  # Add to routemethod permissible_values
    # type field (inherited) should be set to 'xrf_analysis'
    # instrument_id should point to XRF instrument (e.g., Rigaku, Bruker)


  # ---------------------------------------------------------------------------
  # XRDdataGenerationActivity — Concrete X-ray Diffraction
  # ---------------------------------------------------------------------------
  XRDdataGenerationActivity:
    is_a: XRaydataGenerationActivity
    description: |-
      X-ray Diffraction (XRD) mineralogical analysis activity.
      
      XRD identifies crystalline mineral phases by measuring diffraction patterns.
      Output: mineral phase names and quantitative abundances (weight %).
      
      Data product: XRDPhaseProduct (one row per mineral phase per sample)
      
      Workflow patterns:
        1. Direct/semi-quantitative: 
             processedSample -> XRDdataGenerationActivity -> XRDPhaseProduct (workflow_id = NULL)
        2. With Rietveld refinement (computational):
             processedSample -> XRDdataGenerationActivity -> 
             dataProcessingActivity(type='xrd_rietveld_refinement') -> 
             XRDPhaseProduct (workflow_id = refinement WEA)
      
      Protocol information: Stored externally; link via protocol_url attribute.
      Example protocol parameters (stored in external SOP or dataProcessingActivity):
        - Diffractometer geometry (Bragg-Brentano, Debye-Scherrer)
        - X-ray tube type (Cu, Co, Mo)
        - Scan range (2-theta degrees), step size
        - Refinement software (HighScore Plus, GSAS-II, FullProf)
        - R-factor, GOF (goodness of fit)
      
      Required enum additions to enums.yaml:
        routemethod:
          xrd_analysis:  # Add to routemethod permissible_values
    # type field (inherited) should be set to 'xrd_analysis'
    # instrument_id should point to XRD instrument (e.g., Bruker D8, Rigaku MiniFlex)


# =============================================================================
# CLASSES — dataProduct subclasses
# -> PASTE THESE INTO products.yaml classes section
# =============================================================================

  # ---------------------------------------------------------------------------
  # (NEW ABSTRACT CLASS) XRayDataProduct
  # Abstract parent for all X-ray data products.
  # Concrete subclasses: XRFElementalProduct, XRDPhaseProduct
  # ---------------------------------------------------------------------------
  XRayDataProduct:
    is_a: processedData
    abstract: true
    description: |-
      Abstract base class for X-ray analytical data products.
      Inherits S3 storage metadata and sample linkage from dataProduct via processedData.
      
      Concrete subclasses:
        - XRFElementalProduct: elemental concentrations (one row per sample)
        - XRDPhaseProduct: mineral phases (one row per sample)
      
      Common patterns:
        - s3_key points to raw spectrum/diffractogram file in MinIO
        - summary_metrics (JSONB) provides lightweight queryable summaries:
            XRF: {"Ni_mg_kg":45.3, "Pb_mg_kg":8.2, "As_mg_kg":12.1}
            XRD: {"quartz_percent":42, "albite_percent":18, "kaolinite_percent":31}
        - workflow_id is NULL for direct instrument output (XRF typical)
        - workflow_id links to dataProcessingActivity for computational processing (XRD Rietveld)
    # Inherits from processedData via dataProduct:
    #   - id (uuid identifier)
    #   - name (string, required)
    #   - s3_key (string, required) — path to raw data file
    #   - s3_bucket, s3_base_url
    #   - filesize, md5checksum
    #   - project, sampling_set, core_section, sample_name
    #   - summary_metrics (JSONB, lightweight queryable data)
    #   - lims_barcode, version
    #   - type (from product enum — NEW VALUES: XRFElementalProduct, XRDPhaseProduct)
    #   - workflow_id (FK to dataProcessingActivity, nullable)


  # ---------------------------------------------------------------------------
  # XRFElementalProduct — X-ray Fluorescence Elemental Data
  # ---------------------------------------------------------------------------
  XRFElementalProduct:
    is_a: XRayDataProduct
    description: |-
      X-ray Fluorescence (XRF) elemental concentration data.
      One row per sample with columns for each element measured.
      
      Follows the wide-format pattern established by IonsAnalysisProduct.
      Element concentrations in mg/kg (parts per million dry weight basis) as float values.
      Individual QC flags for each element using ProcessedDataFlag enum.
      
      Relationship to core tables:
        - id: FK -> processedData.id (1:1 linkage)
        - processedData.type = 'XRFElementalProduct'
        - processedData.workflow_id = NULL (direct acquisition; no computational WEA)
        - processedData.summary_metrics = {"Ni_mg_kg":45.3, "Pb_mg_kg":8.2, ...}
        - processedData.s3_key = path to raw spectrum or calibrated CSV in MinIO
      
      Standard XRF element panel (27 elements):
        Trace metals: Cl, V, Cr, Ni, Cu, Zn, Ga, As, Se, Br, Rb, Sr, Y, Nb, Mo,
                      Ag, Cd, In, Sn, Sb, Cs, Ba, La, Ce, Pb, Th, U
      
      Required enum additions to enums.yaml:
        product:
          XRFElementalProduct:  # Add to product permissible_values
    slots:
      - measure_type
    attributes:
      # --- Element concentrations in mg/kg (float) ---
      cl_mg_per_kg:
        description: Chlorine concentration in mg/kg
        range: float
      v_mg_per_kg:
        description: Vanadium concentration in mg/kg
        range: float
      cr_mg_per_kg:

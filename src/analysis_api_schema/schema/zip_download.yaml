---
id: https://w3id.org/MONet/analysis-api-schema/zip_download
name: analysis-api-schema-zip-download
title: MONet Analysis API - Zip Download
description: |-
  Zip download-related classes for the MONet Analysis API.
license: MIT
see_also:
  - https://MONet.github.io/analysis-api-schema
  - https://github.com/pnnl/analysis-api

prefixes:
  analysis_api_schema: https://w3id.org/MONet/analysis-api-schema/

default_prefix: analysis_api_schema
default_range: string

imports:
  - linkml:types

classes:

  zipDownload:
    description: |-
      A zip download record, capturing the details of a zip file download event.
    attributes:
      id:
        identifier: true
        range: uuid
      time:
        range: datetime
        required: true
      user:
        range: string
        required: true
      files:
        range: integer
        required: true
      packages:
        range: string

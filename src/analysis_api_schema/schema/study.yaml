---
id: https://w3id.org/MONet/analysis-api-schema/study
name: analysis-api-schema-study
title: MONet Analysis API - Study
description: |-
  Study-related classes for the MONet Analysis API.
license: MIT
see_also:
  - https://MONet.github.io/analysis-api-schema
  - https://github.com/pnnl/analysis-api

prefixes:
  analysis_api_schema: https://w3id.org/MONet/analysis-api-schema/

default_prefix: analysis_api_schema
default_range: string

imports:
  - linkml:types
  - slots


classes:

  study:
    attributes:
      id:
        identifier: true
        range: uuid
      # campaign_id:
      #   range: campaign
        #required: true
        # description: Reference to the campaign this study belongs to
      participant_name: # TODO not quite correct
        range: string
        array: {}
        required: true
      principal_investigator:
      collaborating_institution:
      project_status:
        range: projectstatus
      project_start:
        # range: date
        range: datetime
      project_end:
        # range: date
        range: datetime
      proposal_title:
      proposal_abstract:
      project_id:
        # range: project_id # like 60880
        required: true

enums:
  projectstatus:
    permissible_values:
      STARTED:
      COMPLETED:
      CLOSED:
      EXTENDED:
      ACCEPTED:
      WITHDRAWN:
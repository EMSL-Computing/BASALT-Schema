id: https://w3id.org/MONet/analysis-api-schema/value-tables
name: analysis-api-schema-value-tables
title: MONet Analysis API - Value Tables
description: value tables
license: MIT

prefixes:
  analysis_api_schema: https://w3id.org/MONet/analysis-api-schema/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
default_prefix: analysis_api_schema

imports:
  - linkml:types
  - slots

classes:
  timestampValue:
    slots:
      - description
    attributes:
      id:
        identifier: true
        range: string
      description:
        range: string
      has_raw_value:
        range: string

  textValue:
    slots:
      - description
    attributes:
      id:
        identifier: true
        range: string
      language:
        range: string
      has_raw_value:
        range: string

  softwareControlledTermValue:
    slots:
      - name
      - description
      - version
    attributes:
      id:
        identifier: true
        range: string
      has_raw_value:
        range: string

  controlledTermValue:
    slots:
      - description
    attributes:
      id:
        identifier: true
        range: string
      description:
        range: string
      has_raw_value:
        range: string

  personValue:
    slots:
      - email
    attributes:
      id:
        identifier: true
        range: uuid
      first_name:
        range: string
        required: true
      last_name:
        range: string
        required: true
      middle_initial:
        range: string
      orcid:
        range: string
      profile_image_url:
        range: string
      websites:
        range: string # TODO ARRAY
    unique_keys:
      personValue_email_key:
        unique_key_slots:
          - email

  quantityValue:
    slots:
      - description
    description: A quantity value with numeric value and optional unit
    attributes:
      id:
        identifier: true
        range: uuid
      has_value_unit:
      has_unit:
        description: The human-readable unit name
      has_numeric_value:
        description: The numeric value of the quantity
        range: double
      has_minimum_numeric_value:
        range: numeric
      has_maximum_numeric_value:
        range: numeric
      has_raw_value:

  conditioningValue:
    attributes:
      id:
        identifier: true
        range: string
      source_material:
        range: string
      instrument:
        range: string
      gas:
        range: string
      pressure:
        range: string
      has_raw_value:
        range: string
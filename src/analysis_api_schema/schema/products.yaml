        range: QuantityValue
      mbc_avg:
        range: double
      mbn_id:
        range: QuantityValue
      mbn_avg:
        range: double
      flag_mbc:
        range: ProcessedDataFlag
      flag_mbn:
        range: ProcessedDataFlag
      flag_mbc_avg:
        range: ProcessedDataFlag
      flag_mbn_avg:
        range: ProcessedDataFlag

  NitrogenAnalysisProduct:
    is_a: ProcessedData
    description: |-
      Nitrogen analysis product, typically derived via colorimetric assay of soil extracts.
      Individual QC flags for each measurement using ProcessedDataFlag enum.
    slots:
      - measure_type
      - replicate
    attributes:
      no3_n_id:
        range: QuantityValue
      no3_n_avg:
        range: double
      nh4_n_id:
        range: QuantityValue
      nh4_n_avg:
        range: double
      flag_no3n:
        range: ProcessedDataFlag
      flag_nh4n:
        range: ProcessedDataFlag
      flag_no3n_avg:
        range: ProcessedDataFlag
      flag_nh4n_avg:
        range: ProcessedDataFlag

  PhosphorusAnalysisProduct:
    is_a: ProcessedData
    description: |-
      Phosphorus analysis product, typically derived via colorimetric assay of soil extracts.
      Individual QC flags for each measurement using ProcessedDataFlag enum.
    slots:
      - measure_type
      - replicate
    attributes:
      extraction_method:
        range: string
      phosphorus_id:
        range: QuantityValue
      phosphorus_avg:
        range: double
      flag:

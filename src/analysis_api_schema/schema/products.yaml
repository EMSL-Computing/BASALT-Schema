id: https://w3id.org/MONet/analysis-api-schema/enums
name: analysis-api-schema-enums
title: MONet Analysis API - Enumerations
description: |-
  Enumerated values used throughout the MONet Analysis API schema
license: MIT

prefixes:
  analysis_api_schema: https://w3id.org/MONet/analysis-api-schema/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
default_prefix: analysis_api_schema

imports:
  - linkml:types
  - enums
  - analysis_api_schema

slots:
  measure_type:
    range: productmeasuretype
  rep:
    range: numeric
  aq:
    range: numeric

classes:

  BulkDensityProduct:
    is_a: processedData
    slots:
      - measure_type
    attributes:
      bulk_density_id:
        range: quantityValue
      flag:
        range: processeddataflag

  ElementalAnalysisProduct:
    is_a: processedData
    slots:
      - measure_type
    attributes:
      total_carbon_id:
        range: quantityValue
      total_nitrogen_id:
        range: quantityValue
      total_kjeldahl_nitrogen_id:
        range: quantityValue
      total_sulfur_id:
        range: quantityValue
      flag_total_carbon:
        range: processeddataflag
      flag_total_nitrogen:
        range: processeddataflag
      flag_tkn:
        range: processeddataflag
      flag_total_sulfur:
        range: processeddataflag

  EnzymeProduct:
    is_a: processedData
    slots:
      - measure_type
    attributes:
      beta_glucosidase_ug_pnp_per_g_per_h_id:
        range: quantityValue
      flag:
        range: processeddataflag

  GWCMoistureProduct:
    is_a: processedData
    slots:
      - measure_type
    attributes:
      gwc_percent_id:
        range: quantityValue
      flag:
        range: processeddataflag

  
  HydraulicPropertiesProduct:
    is_a: processedData
    description: >-
      Soil hydraulic parameters derived from HYPROP evaporation-experiment data. One row per core section; the four
      attributes are the four VGM model parameters.  Proposal_ID, sampling_set,
      and core_section are inherited from the parent processedData record.
    slots:
      - measure_type
    attributes:
      alpha:
        description: >-
          Van Genuchten shape parameter alpha (1/cm). Controls the inverse of the
          air-entry suction; typically fitted by HYPROP-FIT or similar software.
        range: double
      n:
        description: >-
          Van Genuchten pore-size distribution index n (dimensionless, n > 1).
          Controls the slope of the water-retention curve.
        range: double
      theta_r:
        description: >-
          Residual volumetric water content theta_r (cm3 cm). The water content
          at which liquid conductivity approaches zero.
        range: double
      theta_s:
        description: >-
          Saturated volumetric water content theta_s (cm3 cm e-3). Approximates
          total porosity under saturated conditions.
        range: double
      flag:
        description: QC flag for the entire VGM fit (e.g. missing sample, failed QC).
        range: processeddataflag
      
  IonsAnalysisProduct:
    is_a: processedData
    slots:
      - measure_type
    attributes:

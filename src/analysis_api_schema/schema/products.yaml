      boron_id:
        range: quantityValue
      zinc_id:
        range: quantityValue
      manganate_id:
        range: quantityValue
      copper_id:
        range: quantityValue
      iron_id:
        range: quantityValue
      calcium_id:
        range: quantityValue
      magnesium_id:
        range: quantityValue
      sodium_id:
        range: quantityValue
      potassium_id:
        range: quantityValue
      total_bases_id:
        range: quantityValue
      cation_exchange_capacity_id:
        range: quantityValue
      flag_sulfate:
        range: processeddataflag
      flag_boron:
        range: processeddataflag
      flag_zinc:
        range: processeddataflag
      flag_manganate:
        range: processeddataflag
      flag_copper:
        range: processeddataflag
      flag_iron:
        range: processeddataflag
      flag_calcium:
        range: processeddataflag
      flag_magnesium:
        range: processeddataflag
      flag_sodium:

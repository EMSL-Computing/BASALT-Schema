  TomographyProduct:
    description: |-
      Soil tomography analysis product, typically derived via X-ray computed tomography (XCT) or similar instrument.
    is_a: ProcessedData
    slots:
      - measure_type
    attributes:
      roi_volume_voxel:
        range: double
      voxel_size:
        range: double
      connected_pores:
        range: double
      pore_diameter_min:
        range: double
      pore_diameter_max:
        range: double
      pore_diameter_mean:
        range: double
      pore_diameter_median:
        range: double
      pore_diameter_variance:
        range: double
      pore_volume_mean:
        range: double
      total_pore_volume:
        range: double
      permeability_x:
        range: double
      flow_rate_x:
        range: double
      tortuosity_x:
        range: double
      permeability_y:
        range: double
      flow_rate_y:
        range: double
      tortuosity_y:
        range: double
      permeability_z:
        range: double
      flow_rate_z:
        range: double
      tortuosity_z:
        range: double
      flag_xct:
        # range: ProcessedDataFlag
        range: string

  WEOMProduct:
    description: |-
      Water Extractable Organic Matter (WEOM) analysis product, typically derived via Shimadzu TOC-L or similar instrument.
      Individual QC flags for each measurement using ProcessedDataFlag enum.
    slots:
      - measure_type
      - replicate
    attributes:
      id:
        identifier: true
        range: ProcessedData
      total_organic_carbon_id:
        range: QuantityValue
      total_organic_carbon_avg:
        range: double
      total_nitrogen_id:
        range: QuantityValue
      total_nitrogen_avg:
        range: double
      flag_toc:

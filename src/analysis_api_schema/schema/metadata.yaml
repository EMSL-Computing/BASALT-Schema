id: https://w3id.org/MONet/analysis-api-schema/enums
name: analysis-api-schema-enums
title: MONet Analysis API - Enumerations
description: |-
  Enumerated values used throughout the MONet Analysis API schema
license: MIT

prefixes:
  analysis_api_schema: https://w3id.org/MONet/analysis-api-schema/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
default_prefix: analysis_api_schema

imports:
  - linkml:types
  - value_tables

slots:
  # (ADDED MR1) Nullable EMSL activity/campaign scoping slot for samplingActivity.
  # Replaces the previously planned campaign FK approach. Managed as a plain
  # validated string consistent with how proposal_id is handled today.
  # Optionally validated at the application layer against campaign.yaml for UI.
  # DDL: ALTER TABLE "samplingActivity" ADD COLUMN emsl_activity VARCHAR(128);
  emsl_activity:
    description: |-
      Nullable string linking a samplingActivity to a named EMSL activity or
      campaign (e.g., 'AMP2', 'MONet_FY26'). Optional for historical records
      predating activity tracking.
    range: string
    required: false

classes:

  # (CHANGED MR1) samplingActivity is now ABSTRACT per PI guidance.
  # Concrete subclasses (e.g. soil, aerosol — see below) use is_a: samplingActivity.
  # New slot: emsl_activity for EMSL activity/campaign scoping.
  samplingActivity:
    abstract: true
    slots:
      - emsl_activity  # [ADDED] replaces planned campaign FK approach
    attributes:
      id:
        identifier: true
        range: uuid
      study_id:
        range: study
        required: true
      type:
        range: samplingactivitytype
        required: true
      sample_name: # 60881_1_C2

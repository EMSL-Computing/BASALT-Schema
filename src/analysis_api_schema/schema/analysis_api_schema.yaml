---
id: https://w3id.org/MONet/analysis-api-schema
name: analysis-api-schema
title: MONet Analysis API Schema
description: |-
  LinkML-based schema for MONet soil analysis data management and metadata enrichment.
  This schema defines the data models for samples, processed samples, site metadata,
  and enrichment providers used in the MONet Analysis API.
license: MIT
see_also:
  - https://MONet.github.io/analysis-api-schema
  - https://github.com/pnnl/analysis-api

prefixes:
  analysis_api_schema: https://w3id.org/MONet/analysis-api-schema/
  # linkml: https://w3id.org/linkml/
  # schema: http://schema.org/
  # qudt: http://qudt.org/schema/qudt/
  # unit: http://qudt.org/vocab/unit/
  # uuid: https://w3id.org/uuid/

default_prefix: analysis_api_schema
default_range: string

# =============================================================================
# GLOBAL SLOTS
# Non-identifier fields that are shared across multiple classes or promoted
# from inline attributes to support the dataProduct inheritance hierarchy.
# UUID identifier fields remain as class-level attributes (identifier: true).
# =============================================================================

slots:

  # --- dataProduct base slots (promoted from processedData attributes) ---
  name:
    description: Human-readable name for the data product
    range: string
    required: true

  proposal_id:
    description: 5-digit EMSL user proposal/project ID
    range: integer

  sampling_set:
    range: integer

  core_section:
    range: string

  sample_name:
    range: string

  s3_base_url:
    range: string

  s3_bucket:
    range: string

  s3_key:
    description: MinIO/S3 object key; required for all data products
    range: string
    required: true

  filesize:
    range: integer

  md5checksum:
    range: string

  # --- shared utility slots promoted from processedData inline attributes ---
  lims_barcode:
    description: LIMS barcode identifier
    range: string
    required: false

  version:
    description: Version string; shared by processedData, analysisActivity, workflowExecutionActivity
    range: string
    required: false

  # --- workflowExecutionActivity: new chain-link slot ---
  parent_workflow_id:
    description: |-
      Self-referential FK to the preceding workflowExecutionActivity in a chain.
      NULL  → first (or standalone) step.
      Non-null → this execution directly follows parent_workflow_id.
      Enables single-hop chaining queries; full traversal via linkage_cache.

      DDL: ALTER TABLE "workflowExecutionActivity"
             ADD COLUMN parent_workflow_id UUID
             REFERENCES "workflowExecutionActivity"(id);
    range: uuid
    required: false

  # --- workflowExecutionActivity: JSONB direction change ---
  workflow_steps:
    description: |-
      Per-run workflow parameters. Previously annotated TODO JSONB in schema.
      Direction: structured key-value pairs keyed by workflow type.
      Schema for allowed keys TBD per workflow type before full implementation.
      Interim DB storage: JSONB column retained.
    range: string   # interim placeholder — will reference typed key-value class; schema TBD
    required: false

  # --- analysisActivity: temporal ordering ---
  sequence_order:
    description: |-
      Integer ordering within a temporal series for the same analyte.
      Lower = earlier in series. Use when acquisition_time alone is insufficient.

      DDL: ALTER TABLE "analysisActivity"
             ADD COLUMN sequence_order INTEGER;
    range: integer
    required: false

  # --- processedData: compact queryable summary ---
  summary_metrics:
    description: |-
      Lightweight per-product summary for common queries that avoid full file download.
      Direction: structured key-value pairs; per-type schemas TBD:
        ecoplate:  well-level absorbance summaries (position, timepoint, absorbance)
        xrf:       per-element concentration results + QC flag
        lcms:      feature count, identification count, MSI-2 fraction
      Interim DB storage: JSONB column retained until formal typed class exists.

      DDL: ALTER TABLE "processedData"
             ADD COLUMN summary_metrics JSONB;   -- interim; formal key-value schema TBD
    range: string   # interim placeholder — will reference typed key-value class; schema TBD
    required: false

imports:
  - linkml:types
  - enums
  - value_tables
  # - metagenomics
  - metadata
  - methods
  - products
  - administration
  - campaign
  - study
  - zip_download
  # - linkage_cache   # MR2: uncomment when linkage_cache.yaml is added
  # - enrichment # todo have not reviewed fully

classes:

  # ---------------------------------------------------------------------------
  # (NEW ABSTRACT CLASS) dataProduct — MR1
  # Abstract base for any data artifact accessible in S3 storage.
  # processedData inherits via is_a. Future sitePhoto and similar file-based
  # products will also inherit here. No direct database table.
  # ---------------------------------------------------------------------------
  dataProduct:
    abstract: true
    description: |-
      Abstract base class for raw or processed data accessible in S3 storage.
      Carries S3-pointer and sample-linkage slots shared across product types.
      processedData and future sitePhoto extend this via is_a.
      No direct database table — subclasses map to tables.
    slots:
      - name
      - proposal_id
      - sampling_set
      - core_section
      - sample_name
      - s3_base_url
      - s3_bucket
      - s3_key
      - filesize
      - md5checksum
    attributes:
      id:
        identifier: true
        range: uuid
        required: true


  sampleBase:
    attributes:
      id:
        identifier: true
        range: uuid
      sample_name: # "60881_1_TOP_1"
        description: The human readable name for the sample
      proposal_id:
        description: The 5 digit project ID assigned to an EMSL user proposal/project
        range: integer
      sampling_set: # "1"
      sample_base_type:
        description: The name of the sample set if the sample is a part of a set of samples processed together
        range: samplebasetype
        required: true

  sample:
    description: A physical sample collected from the environment
    attributes:
      id:
        identifier: true
        range: sampleBase
      sampling_activity_id:
        description: Reference to the sampling activity that collected this sample
        range: samplingActivity
        required: true
      type:
        description: The type of sample (soil, aerosol, etc.)
        range: sampletype
        required: false
      guid_source:
        description: Indicate the source of the GUID that you have provided for your samples
      other_guid_source:
        description: Please specify if other GUID source
  
  soil_sample:
    description: A soil sample with specific soil-related properties
    attributes:
      id:
        range: sample
        identifier: true
      soil_type:
        description: The specific type of soil sample
        range: soiltype
        required: true

  aerosol_sample:
    description: An aerosol sample with specific aerosol-related properties
    attributes:
      id:
        range: sample
        identifier: true
      aerosol_type:
        description: The type or method of aerosol collection
        range: aerosoltype
        required: true

  processedSample:
    description: A sample that has undergone processing or analysis
    attributes:
      id:
        identifier: true
        range: sampleBase
      processed_sample_type:
        description: The type of processed sample
        range: processedsampletype
        required: true

  coreSection:
    description: A section of a core sample (TOP, MID, BTM)
    attributes:
      id:
        identifier: true
        range: processedSample
      core_section:
        description: The section of the core (e.g. TOP, MID, BTM)
        range: coresectionenum
        required: true

  replicate:
    description: A replicate or aliquot of a sample
    attributes:
      id:
        identifier: true
        range: processedSample
      rep:
        description: The replicate (or aliquot) number
        range: integer
        required: true

  # (CHANGED MR1) processedData now inherits from dataProduct via is_a.
  # Inherited slots: name, proposal_id, sampling_set, core_section, sample_name,
  # s3_base_url, s3_bucket, s3_key, filesize, md5checksum, id.
  # Retained as attributes: type (class-specific product enum range), workflow_id.
  # New slots: summary_metrics, lims_barcode, version.
  processedData:
    is_a: dataProduct
    description: A data product generated by a workflow execution.
    slots:
      - summary_metrics  # [ADDED] key-value product summary, per-type schema TBD
      - lims_barcode     # [PROMOTED] from inline attribute
      - version          # [PROMOTED] from inline attribute
    attributes:
      # id inherited from dataProduct
      type:
        # NOTE: type stays as an attribute — class-specific range (product enum)
        # cannot be a single global slot without range polymorphism support.
        range: product
        required: true
      workflow_id:
        range: workflowExecutionActivity


  # (CHANGED MR1) analysisActivity is now ABSTRACT.
  # Concrete per-method-type subclasses (e.g. EcoplateAnalysisActivity,
  # AMP2AnalysisActivity in companion files) use is_a: analysisActivity and
  # add method-specific slots (including timepoint_label where needed).
  # New slot: sequence_order. version promoted to global slot.
  # NOTE: Will be renamed DataGenerationActivity in the full Prov-O refactor.
  analysisActivity:
    abstract: true
    slots:
      - sequence_order   # [ADDED] integer ordering within a temporal series
      - version          # [PROMOTED] from inline attribute
    attributes:
      id:
        identifier: true
        range: uuid
      type:
        range: routemethod
      analyte_id:
        range: processedSample
      name:
        range: string
      acquisition_time:
        range: datetime
        required: true
      instrument_id:
        range: instrument
      protocol_url:
        range: string
      instrument_operator_id:
        range: personValue

  instrumentData:
    attributes:
      id:
        identifier: true
        range: uuid
      analysis_activity_id:
        range: analysisActivity
      description:
        range: string
        required: true
      alternative_identifiers:
        range: string # TODO ARRAY
      compression_type:
        range: string
      file_size_bytes:
        range: integer
      md5_checksum:
        range: string
      name:
        range: string
        required: true
      type:
        range: string
      url:
        range: string
      was_generated_by:
        range: string
      file_type:
        range: filetype
      version:
        range: string

  # (CHANGED MR1) workflowExecutionActivity is now ABSTRACT.
  # Concrete per-type subclasses (e.g. MetagenomicsWorkflowExecutionActivity in
  # metagenomics.yaml) use is_a: workflowExecutionActivity.
  # New slot: parent_workflow_id (chain link). workflow_steps direction updated.
  # version promoted to global slot.
  # NOTE: Will be renamed DataProcessingActivity in the full Prov-O refactor.
  workflowExecutionActivity:
    abstract: true
    slots:
      - parent_workflow_id  # [ADDED] self-referential chain link
      - workflow_steps      # [CHANGED] key-value direction; schema TBD (was # TODO JSONB)
      - version             # [PROMOTED] from inline attribute
    attributes:
      id:
        identifier: true
        range: uuid
      raw_data_id:
        range: instrumentData
        required: true
      description:
        range: string
      ended_at_time:
        range: datetime
      git_url:
        range: string
        required: true
      name:
        range: string
      started_at_time:
        range: datetime
        required: true
      type:
        range: string
        required: true
      used_id:
        range: softwareControlledTermValue
      execution_resource:
        range: executionresourcetype

  alternativeIdentifier:
    attributes:
      id:
        identifier: true
        range: uuid
      alternate_id:
        range: string
        required: true
      alternate_identifier_type:
        range: alternateidentifiertype
        required: true


  ecoregion:
    attributes:
      domain_id:
        identifier: true
        range: integer
      domain_name:
        range: string
        required: true

  functionalAnnotationIdentifier:
    attributes:
      id:
        identifier: true
        range: uuid
      functional_identifier:
        range: string
        required: true
      database:
        range: annotationdatabasetype
        required: true


  instrument:
    attributes:
      id:
        identifier: true
        range: uuid
      name:
        range: string
        required: true
      alternative_names:
        range: string # TODO ARRAY
      vendor:
        range: vendorenum
      model:
        range: modelenum
      instrument_parameters:
        range: string # TODO JSON

  metaboliteQuantification:
    attributes:
      id:
        identifier: true
        range: uuid
      description:
        range: string
      alternative_identifiers:
        range: string
      highest_similarity_score:
        range: integer
      metabolite_quantified:
        range: string

  ontologyClass:
    attributes:
      id:
        identifier: true
        range: uuid
      description:
        range: string
      alternative_identifiers:
        range: string
      name:
        range: string

  peptideQuantification:
    attributes:
      id:
        identifier: true
        range: uuid
      description:
        range: string
      all_proteins:
        range: string
      best_protein:
        range: string
      min_q_value:
        range: numeric
      peptide_sequence:
        range: string
      peptide_spectral_count:
        range: integer
      peptide_sum_masic_abundance:
        range: numeric

  containerType:
    attributes:
      id:
        identifier: true
        range: uuid
      description:
        range: string
      was_generated_by:
        range: string
      container_type:
        range: containertypeenum
      container_size_id:
        range: quantityValue

  custodian:
    attributes:
      id:
        identifier: true
        range: uuid
      person_id:
        range: personValue

  instrument_alt_id:
    attributes:
      id:
        identifier: true
        range: alternativeIdentifier
      instrument_alt_id_provider:
        range: instrumentaltidprovider
      instrument_id:
        range: instrument
        required: true

  labDevice:
    attributes:
      id:
        identifier: true
        range: uuid
      description:
        range: string
      device_type:
        range: devicetypeenum
      activity_time_id:
        range: quantityValue
      activity_speed_id:
        range: quantityValue

  # (CHANGED MR1) sampleProcessing is now ABSTRACT per PI guidance.
  # Concrete protocol-specific subclasses use is_a: sampleProcessing.
  # processing_steps noted TODO JSONB — direction change to key-value is deferred.
  sampleProcessing:
    abstract: true
    attributes:
      id:
        identifier: true
        range: uuid
      analysis_type:
        range: routemethod
      method_name:
        range: methodname
      processing_steps:
        range: string # TODO JSONB — key-value direction deferred; schema TBD
        required: true
      url:
        range: string
      version:
        range: string

  processingSampleLink:
    attributes:
      id:
        identifier: true
        range: uuid
      sample_base_id:
        identifier: true
        range: sampleBase
        required: true
      processing_id:
        identifier: true
        range: sampleProcessing
        required: true
      step_number:
        identifier: true
        range: integer
        required: true
      role:
        identifier: true
        range: samplerole
        required: true
      version:
        range: string
    unique_keys:
      unique_sample_process_step:
        unique_key_slots:
          - sample_base_id
          - processing_id
          - step_number
          - role

  instrumentCustodian:
    attributes:
      instrument_id:
        range: instrument
        required: true
      custodian_id:
        range: custodian
        required: true


  workflowExecutionFunctionalAnnotation:
    attributes:
      workflow_id:
        range: workflowExecutionActivity
        required: true
      functional_annotation_id:
        range: functionalAnnotationIdentifier
        required: true
      count:
        range: numeric


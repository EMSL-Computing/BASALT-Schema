---
id: https://w3id.org/MONet/analysis-api-schema
name: analysis-api-schema
title: MONet Analysis API Schema
description: |-
  LinkML-based schema for MONet soil analysis data management and metadata enrichment.
  This schema defines the data models for samples, processed samples, site metadata,
  and enrichment providers used in the MONet Analysis API.
license: MIT
see_also:
  - https://MONet.github.io/analysis-api-schema
  - https://github.com/pnnl/analysis-api

prefixes:
  analysis_api_schema: https://w3id.org/MONet/analysis-api-schema/
  # linkml: https://w3id.org/linkml/
  # schema: http://schema.org/
  # qudt: http://qudt.org/schema/qudt/
  # unit: http://qudt.org/vocab/unit/
  # uuid: https://w3id.org/uuid/

default_prefix: analysis_api_schema
default_range: string

# =============================================================================
# GLOBAL SLOTS
# Non-identifier fields that are shared across multiple classes or promoted
# from inline attributes to support the dataProduct inheritance hierarchy.
# UUID identifier fields remain as class-level attributes (identifier: true).
# =============================================================================

slots:

  # --- dataProduct base slots (promoted from processedData attributes) ---
  name:
    description: Human-readable name for the data product
    range: string
    required: true

  proposal_id:
    description: 5-digit EMSL user proposal/project ID
    range: integer

  sampling_set:
    range: integer

  core_section:
    range: string

  sample_name:
    range: string

  s3_base_url:
    range: string

  s3_bucket:
    range: string

  s3_key:
    description: MinIO/S3 object key; required for all data products
    range: string
    required: true

  filesize:
    range: integer

  md5checksum:
    range: string

 

  # --- shared utility slots promoted from processedData inline attributes ---
  lims_barcode:
    description: LIMS barcode identifier
    range: string
    required: false

  version:
    description: Version string; shared by processedData, analysisActivity, workflowExecutionActivity
    range: string
    required: false

  # --- workflowExecutionActivity: new chain-link slot ---
  parent_workflow_id:
    description: |-
      Self-referential FK to the preceding workflowExecutionActivity in a chain.
      NULL  -> first (or standalone) step.
      Non-null -> this execution directly follows parent_workflow_id.
      Enables single-hop chaining queries; full traversal via linkage_cache.

      DDL: ALTER TABLE "workflowExecutionActivity"
             ADD COLUMN parent_workflow_id UUID
             REFERENCES "workflowExecutionActivity"(id);
    range: uuid
    required: false

  # --- workflowExecutionActivity: JSONB direction change ---
  workflow_steps:
    description: |-
      Per-run workflow parameters. Previously annotated TODO JSONB in schema.
      Direction: structured key-value pairs keyed by workflow type.
      Schema for allowed keys TBD per workflow type before full implementation.
      Interim DB storage: JSONB column retained.
    range: string   # interim placeholder — will reference typed key-value class; schema TBD
    required: false

  # --- analysisActivity: temporal ordering ---
  sequence_order:
    description: |-
      Integer ordering within a temporal series for the same analyte.
      Lower = earlier in series. Use when acquisition_time alone is insufficient.

      DDL: ALTER TABLE "analysisActivity"
             ADD COLUMN sequence_order INTEGER;
    range: integer
    required: false

  # --- processedData: compact queryable summary ---
  summary_metrics:
    description: |-
      Lightweight per-product summary for common queries that avoid full file download.
      Direction: structured key-value pairs; per-type schemas TBD:
        ecoplate:  well-level absorbance summaries (position, timepoint, absorbance)
        xrf:       per-element concentration results + QC flag
        lcms:      feature count, identification count, MSI-2 fraction
      Interim DB storage: JSONB column retained until formal typed class exists.

      DDL: ALTER TABLE "processedData"
             ADD COLUMN summary_metrics JSONB;   -- interim; formal key-value schema TBD
    range: string   # interim placeholder — will reference typed key-value class; schema TBD
    required: false

  # --- dataProduct: provenance link ---
  was_generated_by:
    description: |-
      Reference to the activity that generated this data product.
      Range is overridden per subclass via slot_usage:
        processedData   -> workflowExecutionActivity
        instrumentData  -> analysisActivity
    required: false   # nullable — not all products have a tracked generating activity

imports:
  - linkml:types
  - enums
  - value_tables
  - sample_classes
  - metadata
  - methods
  - products
  - administration
  - study
  - zip_download
  - media_strain_culture_plate
  - metagenomics
  # - linkage_cache   # MR2: uncomment when linkage_cache.yaml is added
  # - enrichment # todo have not reviewed fully

classes:

  # ---------------------------------------------------------------------------
  # (NEW ABSTRACT CLASS) dataProduct — MR1
  # Abstract base for any data artifact accessible in S3 storage.
  # processedData inherits via is_a. Future sitePhoto and similar file-based
  # products will also inherit here. No direct database table.
  # ---------------------------------------------------------------------------
  dataProduct:
    abstract: true
    description: |-
      Abstract base class for raw or processed data accessible in S3 storage.
      Carries S3-pointer and sample-linkage slots shared across product types.
      processedData and future sitePhoto extend this via is_a.
      No direct database table — subclasses map to tables.
    slots:
      - name
      - proposal_id # TODO do we need these, can the API handle queries, also change to project_id?
      - sampling_set # TODO do we need these, can the API handle queries?
      - core_section
      - sample_name
      - s3_base_url
      - s3_bucket
      - s3_key
      - filesize
      - md5checksum
      - was_generated_by
    attributes:
      id:
        identifier: true
        range: uuid
        required: true

  replicate: # can we remove this?
    description: A replicate or aliquot of a sample
    attributes:
      id:
        identifier: true
        range: ProcessedSample
      rep:
        description: The replicate (or aliquot) number
        range: integer
        required: true

  # (CHANGED MR1) processedData now inherits from dataProduct via is_a.
  # Inherited slots: name, proposal_id, sampling_set, core_section, sample_name,
  # s3_base_url, s3_bucket, s3_key, filesize, md5checksum, id.
  # Retained as attributes: type (class-specific product enum range), workflow_id.
  # New slots: summary_metrics, lims_barcode, version.
  processedData:
    is_a: dataProduct
    description: A data product generated by a workflow execution.
    slots:
      - summary_metrics  # [ADDED] key-value product summary, per-type schema TBD
      - lims_barcode     # [PROMOTED] from inline attribute
      - version          # [PROMOTED] from inline attribute
    slot_usage:
      was_generated_by:
        range: workflowExecutionActivity
        required: false
    attributes:
      # id inherited from dataProduct
      type:
        # NOTE: type stays as an attribute — class-specific range (product enum)
        # cannot be a single global slot without range polymorphism support.
        range: product
        required: true

  instrumentData:
    is_a: dataProduct
    slot_usage:
      was_generated_by:
        range: analysisActivity
        required: false
    attributes:
      description:
        range: string
        required: true
      alternative_identifiers:
        range: string # TODO ARRAY
      compression_type:
        range: string
      type:
        range: string
      file_type:
        range: filetype
      version:
        range: string

  sitePhoto:
    is_a: dataProduct
    attributes:
      type:
        range: sitephototype

  # analysisActivity is now ABSTRACT.
  # Concrete per-method-type subclasses (e.g. EcoplateAnalysisActivity,
  # AMP2AnalysisActivity in companion files) use is_a: analysisActivity and
  # add method-specific slots (including timepoint_label where needed).
  # New slot: sequence_order. version promoted to global slot.
  # NOTE: Will be renamed DataGenerationActivity.
  analysisActivity:
    abstract: true
    slots:
      - sequence_order   # [ADDED] integer ordering within a temporal series
      - version          # [PROMOTED] from inline attribute
    attributes:
      id:
        identifier: true
        range: uuid
      type:
        range: routemethod
      analyte_id:
        range: ProcessedSample
      name:
        range: string
      acquisition_time:
        range: datetime
        required: true
      instrument_id:
        range: instrument
      protocol_url:
        range: string
      instrument_operator_id:
        range: personValue

  # workflowExecutionActivity is ABSTRACT.
  # Concrete per-type subclasses (e.g. MetagenomicsWorkflowExecutionActivity in
  # metagenomics.yaml) use is_a: workflowExecutionActivity.
  # New slot: parent_workflow_id (chain link). workflow_steps direction updated.
  # version promoted to global slot.

  workflowExecutionActivity:
    abstract: true
    slots:
      - parent_workflow_id  # self-referential chain link
      - workflow_steps      # key-value direction; schema TBD (was # TODO JSONB)
      - version            
    attributes:
      id:
        identifier: true
        range: uuid
      type:
        range: string
        required: true
      raw_data_id:
        range: instrumentData
        required: false # subclassed activities handle this explicitly
      description:
        range: string
      started_at_time:
        range: datetime
        required: true
      ended_at_time:
        range: datetime
      software_url:
        range: string
      software_version:
        range: string
      software_poc:
        range: string
      #git_url:
      #  range: string
      # required: true
      #name:
      #  range: string
      #used_id:
      #  range: softwareControlledTermValue
      execution_resource:
        range: executionresourcetype

  alternativeIdentifier:
    attributes:
      id:
        identifier: true
        range: uuid
      alternate_id:
        range: string
        required: true
      alternate_identifier_type:
        range: alternateidentifiertype
        required: true


  ecoregion:
    attributes:
      domain_id:
        identifier: true
        range: integer
      domain_name:
        range: string
        required: true

  functionalAnnotationIdentifier:
    attributes:
      id:
        identifier: true
        range: uuid
      functional_identifier:
        range: string
        required: true
      database:
        range: annotationdatabasetype
        required: true


  instrument:
    attributes:
      id:
        identifier: true
        range: uuid
      name:
        range: string
        required: true
      alternative_names:
        range: string # TODO ARRAY
      vendor:
        range: vendorenum
      model:
        range: modelenum
      instrument_parameters:
        range: string # TODO JSON

  metaboliteQuantification:
    attributes:
      id:
        identifier: true
        range: uuid
      description:
        range: string
      alternative_identifiers:
        range: string
      highest_similarity_score:
        range: integer
      metabolite_quantified:
        range: string

  ontologyClass:
    attributes:
      id:
        identifier: true
        range: uuid
      description:
        range: string
      alternative_identifiers:
        range: string
      name:
        range: string

  peptideQuantification:
    attributes:
      id:
        identifier: true
        range: uuid
      description:
        range: string
      all_proteins:
        range: string
      best_protein:
        range: string
      min_q_value:
        range: numeric
      peptide_sequence:
        range: string
      peptide_spectral_count:
        range: integer
      peptide_sum_masic_abundance:
        range: numeric

  containerType:
    attributes:
      id:
        identifier: true
        range: uuid
      description:
        range: string
      was_generated_by:
        range: string
      container_type:
        range: containertypeenum
      container_size_id:
        range: quantityValue

  custodian:
    attributes:
      id:
        identifier: true
        range: uuid
      person_id:
        range: personValue

  instrument_alt_id:
    attributes:
      id:
        identifier: true
        range: alternativeIdentifier
      instrument_alt_id_provider:
        range: instrumentaltidprovider
      instrument_id:
        range: instrument
        required: true

  labDevice:
    attributes:
      id:
        identifier: true
        range: uuid
      description:
        range: string
      device_type:
        range: devicetypeenum
      activity_time_id:
        range: quantityValue
      activity_speed_id:
        range: quantityValue

  # (CHANGED MR1) sampleProcessing is now ABSTRACT per PI guidance.
  # Concrete protocol-specific subclasses use is_a: sampleProcessing.
  # processing_steps noted TODO JSONB — direction change to key-value is deferred.
  sampleProcessing:
    abstract: true
    attributes:
      id:
        identifier: true
        range: uuid
      analysis_type:
        range: routemethod
      method_name:
        range: methodname
      processing_steps:
        range: string # TODO JSONB — key-value direction deferred; schema TBD
        required: true
      url:
        range: string
      version:
        range: string

  processingSampleLink:
    attributes:
      id:
        identifier: true
        range: uuid
      sample_base_id:
        identifier: true
        range: Sample
        required: true
      processing_id:
        identifier: true
        range: sampleProcessing
        required: true
      step_number:
        identifier: true
        range: integer
        required: true
      role:
        identifier: true
        range: samplerole
        required: true
      version:
        range: string
    unique_keys:
      unique_sample_process_step:
        unique_key_slots:
          - sample_base_id
          - processing_id
          - step_number
          - role

  instrumentCustodian:
    attributes:
      instrument_id:
        range: instrument
        required: true
      custodian_id:
        range: custodian
        required: true


  workflowExecutionFunctionalAnnotation:
    attributes:
      workflow_id:
        range: workflowExecutionActivity
        required: true
      functional_annotation_id:
        range: functionalAnnotationIdentifier
        required: true
      count:
        range: numeric

  # ---------------------------------------------------------------------------
  # (NEW ABSTRACT CLASS) XRayAnalysisActivity
  # Abstract parent for all X-ray analytical methods.
  # Concrete subclasses: XRFAnalysisActivity, XRDAnalysisActivity
  # Future: XCTAnalysisActivity (X-ray computed tomography) could be added here
  # ---------------------------------------------------------------------------
  XRayAnalysisActivity:
    is_a: analysisActivity
    abstract: true
    description: |-
      Abstract base class for X-ray analytical methods including XRF (elemental)
      and XRD (mineralogical) analysis. Inherits acquisition_time, instrument_id,
      protocol_url, analyte_id, and other core metadata from analysisActivity.
      
      Concrete subclasses define method-specific measurement parameters.
      Future X-ray methods (e.g., XCT) can extend this class.
      
      Shared patterns:
        - Direct instrument output (no computational workflow) is typical for XRF
        - XRD may optionally link to workflowExecutionActivity for Rietveld refinement
        - protocol_url should link to vendor SOP or EMSL internal protocol documentation

  # ---------------------------------------------------------------------------
  # XRFAnalysisActivity — Concrete X-ray Fluorescence
  # ---------------------------------------------------------------------------
  XRFAnalysisActivity:
    is_a: XRayAnalysisActivity
    description: |-
      X-ray Fluorescence (XRF) elemental analysis activity.
      
      XRF measures elemental composition by detecting characteristic X-ray emissions
      from a sample bombarded with high-energy X-rays. Typical output: concentrations
      of 10-30 elements per sample (Ni, Pb, As, Cr, Fe, Ca, K, etc.).
      
      Data product: XRFElementalProduct (one row per element per sample)
      
      Workflow pattern: Direct instrument output (no computational processing step)
        processedSample -> XRFAnalysisActivity -> XRFElementalProduct (workflow_id = NULL)
      
      Protocol information: Stored externally; link via protocol_url attribute.
      Example protocol parameters (stored in external SOP or workflowExecutionActivity
      if computational correction is needed):
        - Beam voltage (kV), beam current (mA)
        - Measurement duration (seconds)
        - Matrix correction method (fundamental parameters, empirical)
        - Calibration date
        - Operator ID
      
      Required enum additions to enums.yaml:
        routemethod:
          xrf_analysis:  # Add to routemethod permissible_values
    attributes:
      id:
        identifier: true
        range: analysisActivity
        required: true
    # type field (inherited) should be set to 'xrf_analysis'
    # instrument_id should point to XRF instrument (e.g., Rigaku, Bruker)


  # ---------------------------------------------------------------------------
  # XRDAnalysisActivity — Concrete X-ray Diffraction
  # ---------------------------------------------------------------------------
  XRDAnalysisActivity:
    is_a: XRayAnalysisActivity
    description: |-
      X-ray Diffraction (XRD) mineralogical analysis activity.
      
      XRD identifies crystalline mineral phases by measuring diffraction patterns.
      Output: mineral phase names and quantitative abundances (weight %).
      
      Data product: XRDPhaseProduct (one row per mineral phase per sample)
      
      Workflow patterns:
        1. Direct/semi-quantitative: 
             processedSample -> XRDAnalysisActivity -> XRDPhaseProduct (workflow_id = NULL)
        2. With Rietveld refinement (computational):
             processedSample -> XRDAnalysisActivity -> 
             workflowExecutionActivity(type='xrd_rietveld_refinement') -> 
             XRDPhaseProduct (workflow_id = refinement WEA)
      
      Protocol information: Stored externally; link via protocol_url attribute.
      Example protocol parameters (stored in external SOP or workflowExecutionActivity):
        - Diffractometer geometry (Bragg-Brentano, Debye-Scherrer)
        - X-ray tube type (Cu, Co, Mo)
        - Scan range (2-theta degrees), step size
        - Refinement software (HighScore Plus, GSAS-II, FullProf)
        - R-factor, GOF (goodness of fit)
      
      Required enum additions to enums.yaml:
        routemethod:
          xrd_analysis:  # Add to routemethod permissible_values
    attributes:
      id:
        identifier: true
        range: analysisActivity
        required: true
    # type field (inherited) should be set to 'xrd_analysis'
    # instrument_id should point to XRD instrument (e.g., Bruker D8, Rigaku MiniFlex)
---
id: https://w3id.org/MONet/analysis-api-schema
name: analysis-api-schema
title: MONet Analysis API Schema
description: |-
  LinkML-based schema for MONet soil analysis data management and metadata enrichment.
  This schema defines the data models for samples, processed samples, site metadata,
  and enrichment providers used in the MONet Analysis API.
license: MIT
see_also:
  - https://MONet.github.io/analysis-api-schema
  - https://github.com/pnnl/analysis-api

prefixes:
  analysis_api_schema: https://w3id.org/MONet/analysis-api-schema/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  qudt: http://qudt.org/schema/qudt/
  unit: http://qudt.org/vocab/unit/
  uuid: https://w3id.org/uuid/
default_prefix: analysis_api_schema
default_range: string

imports:
  - linkml:types
  - enums
  - samples  
  - enrichment

classes:
  # Root container for the MONet Analysis API schema
  Database:
    tree_root: true
    description: Root container for all MONet analysis data including samples, processed samples, and site metadata
    slots:
      - samples
      - processed_samples
      - site_metadata_collection
    slot_usage:
      samples:
        description: Collection of all samples
        range: Sample
        multivalued: true
        inlined_as_list: true
      processed_samples:
        description: Collection of processed samples
        range: ProcessedSample
        multivalued: true
        inlined_as_list: true
      site_metadata_collection:
        description: Collection of site metadata records
        range: SiteMetadata
        multivalued: true
        inlined_as_list: true

slots:
  # Root-level collection slots
  samples:
    description: Collection of all samples in the database
    range: Sample
    multivalued: true
    required: false

  processed_samples:
    description: Collection of all processed samples in the database
    range: ProcessedSample
    multivalued: true
    required: false

  site_metadata_collection:
    description: Collection of site metadata records in the database
    range: SiteMetadata
    multivalued: true
    required: false

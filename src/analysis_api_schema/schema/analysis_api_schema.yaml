---
id: https://w3id.org/MONet/analysis-api-schema
name: analysis-api-schema
title: MONet Analysis API Schema
description: |-
  LinkML-based schema for MONet soil analysis data management and metadata enrichment.
  This schema defines the data models for samples, processed samples, site metadata,
  and enrichment providers used in the MONet Analysis API.
license: MIT
see_also:
  - https://MONet.github.io/analysis-api-schema
  - https://github.com/pnnl/analysis-api

prefixes:
  analysis_api_schema: https://w3id.org/MONet/analysis-api-schema/
  # linkml: https://w3id.org/linkml/
  # schema: http://schema.org/
  # qudt: http://qudt.org/schema/qudt/
  # unit: http://qudt.org/vocab/unit/
  # uuid: https://w3id.org/uuid/

default_prefix: analysis_api_schema
default_range: string

# IMPORTANT UUID's DONT EXIST
# types:
#   uuid:
#     base: string

imports:
  - linkml:types
  - enums
  # - enrichment # todo have not reviewed fully

classes:
  study:
    attributes:
      id:
        identifier: true
        range: uuid
      participant_name:
      principal_investigator:
      collaborating_institution:
      project_status:
        # range: projectstatus
      project_start:
        # range: date
        range: datetime
      project_end:
        # range: date
        range: datetime
      proposal_title:
      proposal_abstract:
      project_id:
        # range: project_id # like 60880

  quantityValue:
    description: A quantity value with numeric value and optional unit
    attributes:
      id:
        identifier: true
        range: uuid
      description:
      has_value_unit:
      has_unit:
        description: The human-readable unit name
      has_numeric_value:
        description: The numeric value of the quantity
        range: double
      has_minimum_numeric_value:
        range: decimal
      has_maximum_numeric_value:
        range: decimal
      has_raw_value:

  geolocationValue:
    attributes:
      id:
        identifier: true
        range: uuid
      description:
      has_raw_value:
      latitude:
        range: decimal
      longitude:
        range: decimal
      type:
      was_generated_by:

  samplingActivity:
    attributes:
      id:
        identifier: true
        range: uuid
      study_id:
        range: study
      type:
        range: samplingactivitytype
      sample_name: # 60881_1_C2
      lims_barcode:
      alt_id:
        range: uuid
      elev_id:
        range: quantityValue
      lat_lon_id:
        range: geolocationValue
      growth_facil:
        range: growthfacilityenum
      other_growth_facil:
      other_storage_condt:
      oxygen_relationship:
        range: oxygenstatusenum
      sample_store_temp:
        range: samplestoretemp
      samp_biotic_relationship:
        range: sampbioticenum
      storage_condt:
        range: storagecondtenum
      air_temp_regm:
      chem_administration:
      collection_date:
        range: datetime
      collection_time:
        range: datetime
      env_broad_scale_other:
      env_local_scale_other:
      env_medium_other:
      experimental_factor:
      experimental_factor_other:
      extraction_method:
      extreme_event:
        range: datetime
      gaseous_environment:
      geo_loc_name:
      humidity_regm:
      isotope_exposure:
      light_regm:
      link_addit_analys:
      method_development:
      microbial_biomass_c_meth:
      microbial_biomass_meth:
      microbial_biomass_n_meth:
      misc_param:
      neon_plot_id:
      non_microb_biomass_method:
      other_sample_store_temp:
      other_treatment:
      ph:
        range: double
      ph_meth:
      salinity:
        range: double
      salinity_method:
      sample_collected:
      sample_collection_dev:
      sample_collection_method:
      sample_end_time:
        range: datetime
      sample_processing:
      sample_start_time:
        range: datetime
      season_environment:
      shipped_sample_size:
      sieving:
      start_date_inc:
        range: datetime
      tot_nitro_cont_meth:
      tot_org_c_meth:
      watering_regm:

  sampleBase:
    attributes:
      id:
        identifier: true
        range: uuid
      sample_name: # "60881_1_TOP_1"
        description: The human readable name for the sample
      proposal_id:
        description: The 5 digit project ID assigned to an EMSL user proposal/project
        range: integer
      sampling_set: # "1"
      sample_base_type:
        description: The name of the sample set if the sample is a part of a set of samples processed together
        range: samplebasetype
        required: true

  sample:
    description: A physical sample collected from the environment
    attributes:
      id:
        identifier: true
        range: sampleBase
      sampling_activity_id:
        description: Reference to the sampling activity that collected this sample
        range: samplingActivity
        required: true
      type:
        description: The type of sample (soil, aerosol, etc.)
        range: sampletype
        required: false
      guid_source:
        description: Indicate the source of the GUID that you have provided for your samples
      other_guid_source:
        description: Please specify if other GUID source
  
  soil_sample:
    description: A soil sample with specific soil-related properties
    attributes:
      id:
        range: uuid # TODO
        identifier: true
      soil_type:
        description: The specific type of soil sample
        range: soiltype
        required: true

  aerosol_sample:
    description: An aerosol sample with specific aerosol-related properties
    attributes:
      id:
        range: uuid # TODO
        identifier: true
      aerosol_type:
        description: The type or method of aerosol collection
        range: aerosoltype
        required: true

  processedSample:
    description: A sample that has undergone processing or analysis
    attributes:
      id:
        identifier: true
        range: sampleBase
      processed_sample_type:
        description: The type of processed sample
        range: processedsampletype
        required: true

  coreSection:
    description: A section of a core sample (TOP, MID, BTM)
    attributes:
      id:
        identifier: true
        range: processedSample
      core_section:
        description: The section of the core (e.g. TOP, MID, BTM)
        range: coresectionenum
        required: true

  replicate:
    description: A replicate or aliquot of a sample
    attributes:
      id:
        identifier: true
        range: processedSample
      rep:
        description: The replicate (or aliquot) number
        range: integer
        required: true
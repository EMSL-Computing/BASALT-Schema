---
id: https://w3id.org/MONet/analysis-api-schema
name: analysis-api-schema
title: MONet Analysis API Schema
description: |-
  LinkML-based schema for MONet soil analysis data management and metadata enrichment.
  This schema defines the data models for samples, processed samples, site metadata,
  and enrichment providers used in the MONet Analysis API.
license: MIT
see_also:
  - https://MONet.github.io/analysis-api-schema
  - https://github.com/pnnl/analysis-api

prefixes:
  analysis_api_schema: https://w3id.org/MONet/analysis-api-schema/
  # linkml: https://w3id.org/linkml/
  # schema: http://schema.org/
  # qudt: http://qudt.org/schema/qudt/
  # unit: http://qudt.org/vocab/unit/
  # uuid: https://w3id.org/uuid/

default_prefix: analysis_api_schema
default_range: string

imports:
  - linkml:types
  - enums
  - value_tables
  - metagenomics
  - metadata
  - methods
  - products
  - administration
  # - enrichment # todo have not reviewed fully

classes:
  campaign:
    description: |-
      A research campaign that encompasses one or more studies.
      Campaigns are organizational units, typically lasting a single fiscal year beginning in FY26, that group related studies together.
    attributes:
      id:
        identifier: true
        range: uuid
        description: Unique identifier for the campaign
      campaign_name:
        range: string
        required: true
        description: Short name or code for the campaign
      campaign_year:
        range: integer
        description: Primary year associated with the campaign
      display_name:
        range: string
        description: Human-readable display name for the campaign
      description:
        range: string
        description: Detailed description of the campaign objectives and scope

  study:
    attributes:
      id:
        identifier: true
        range: uuid
      campaign_id:
        range: campaign
        #required: true
        description: Reference to the campaign this study belongs to
      participant_name: # TODO not quite correct
        range: string
        array: {}
        required: true
      principal_investigator:
      collaborating_institution:
      project_status:
        range: projectstatus
      project_start:
        # range: date
        range: datetime
      project_end:
        # range: date
        range: datetime
      proposal_title:
      proposal_abstract:
      project_id:
        # range: project_id # like 60880
        required: true



  samplingActivity:
    attributes:
      id:
        identifier: true
        range: uuid
      study_id:
        range: study
        required: true
      type:
        range: samplingactivitytype
        required: true
      sample_name: # 60881_1_C2
        required: true
      lims_barcode:
      alt_id:
        range: quantityValue
      elev_id:
        range: quantityValue
      lat_lon_id:
        range: geolocationValue
      growth_facil:
        range: growthfacilityenum
      other_growth_facil:
      other_storage_condt:
      oxygen_relationship:
        range: oxygenstatusenum
      sample_store_temp:
        range: samplestoretemp
      samp_biotic_relationship:
        range: sampbioticenum
      storage_condt:
        range: storagecondtenum
      air_temp_regm:
      chem_administration:
      collection_date:
        range: datetime
      collection_time:
        range: datetime
      env_broad_scale_other:
      env_local_scale_other:
      env_medium_other:
      experimental_factor:
      experimental_factor_other:
      extraction_method:
      extreme_event:
        range: datetime
      gaseous_environment:
      geo_loc_name:
      humidity_regm:
      isotope_exposure:
      light_regm:
      link_addit_analys:
      method_development:
      microbial_biomass_c_meth:
      microbial_biomass_meth:
      microbial_biomass_n_meth:
      misc_param:
      neon_plot_id:
      non_microb_biomass_method:
      other_sample_store_temp:
      other_treatment:
      ph:
        range: double
      ph_meth:
      salinity:
        range: double
      salinity_method:
      sample_collected:
      sample_collection_dev:
      sample_collection_method:
      sample_end_time:
        range: datetime
      sample_processing:
      sample_start_time:
        range: datetime
      season_environment:
      shipped_sample_size:
      sieving:
      start_date_inc:
        range: datetime
      tot_nitro_cont_meth:
      tot_org_c_meth:
      watering_regm:

  sampleBase:
    attributes:
      id:
        identifier: true
        range: uuid
      sample_name: # "60881_1_TOP_1"
        description: The human readable name for the sample
      proposal_id:
        description: The 5 digit project ID assigned to an EMSL user proposal/project
        range: integer
      sampling_set: # "1"
      sample_base_type:
        description: The name of the sample set if the sample is a part of a set of samples processed together
        range: samplebasetype
        required: true

  sample:
    description: A physical sample collected from the environment
    attributes:
      id:
        identifier: true
        range: sampleBase
      sampling_activity_id:
        description: Reference to the sampling activity that collected this sample
        range: samplingActivity
        required: true
      type:
        description: The type of sample (soil, aerosol, etc.)
        range: sampletype
        required: false
      guid_source:
        description: Indicate the source of the GUID that you have provided for your samples
      other_guid_source:
        description: Please specify if other GUID source
  
  soil_sample:
    description: A soil sample with specific soil-related properties
    attributes:
      id:
        range: sample
        identifier: true
      soil_type:
        description: The specific type of soil sample
        range: soiltype
        required: true

  aerosol_sample:
    description: An aerosol sample with specific aerosol-related properties
    attributes:
      id:
        range: sample
        identifier: true
      aerosol_type:
        description: The type or method of aerosol collection
        range: aerosoltype
        required: true

  processedSample:
    description: A sample that has undergone processing or analysis
    attributes:
      id:
        identifier: true
        range: sampleBase
      processed_sample_type:
        description: The type of processed sample
        range: processedsampletype
        required: true

  coreSection:
    description: A section of a core sample (TOP, MID, BTM)
    attributes:
      id:
        identifier: true
        range: processedSample
      core_section:
        description: The section of the core (e.g. TOP, MID, BTM)
        range: coresectionenum
        required: true

  replicate:
    description: A replicate or aliquot of a sample
    attributes:
      id:
        identifier: true
        range: processedSample
      rep:
        description: The replicate (or aliquot) number
        range: integer
        required: true

  processedData:
    attributes:
      id:
        identifier: true
        range: uuid
      type:
        range: product
        required: true
      name:
        range: string
        required: true
      proposal_id:
        range: string
      sampling_set:
        range: integer
      core_section:
        range: string
      sample_name:
        range: string
      s3_base_url:
        range: string
      s3_bucket:
        range: string
      s3_key:
        range: string
        required: true
      filesize:
        range: integer
      md5checksum:
        range: string
      workflow_id:
        range: workflowExecutionActivity
      lims_barcode:
        range: string
      version:
        range: string


  analysisActivity:
    attributes:
      id:
        identifier: true
        range: uuid
      type:
        range: routemethod
      analyte_id:
        range: processedSample
      name:
        range: string
      acquisition_time:
        range: datetime
        required: true
      instrument_id:
        range: instrument
      protocol_url:
        range: string
      instrument_operator_id:
        range: personValue
      version:
        range: string

  instrumentData:
    attributes:
      id:
        identifier: true
        range: uuid
      analysis_activity_id:
        range: analysisActivity
      description:
        range: string
        required: true
      alternative_identifiers:
        range: string # TODO ARRAY
      compression_type:
        range: string
      file_size_bytes:
        range: integer
      md5_checksum:
        range: string
      name:
        range: string
        required: true
      type:
        range: string
      url:
        range: string
      was_generated_by:
        range: string
      file_type:
        range: filetype
      version:
        range: string

  workflowExecutionActivity:
    attributes:
      id:
        identifier: true
        range: uuid
      raw_data_id:
        range: instrumentData
        required: true
      description:
        range: string
      ended_at_time:
        range: datetime
      git_url:
        range: string
        required: true
      name:
        range: string
      started_at_time:
        range: datetime
        required: true
      type:
        range: string
        required: true
      used_id:
        range: softwareControlledTermValue
      execution_resource:
        range: executionresourcetype
      workflow_steps:
        range: string # TODO JSONB
      version:
        range: string

  alternativeIdentifier:
    attributes:
      id:
        identifier: true
        range: uuid
      alternate_id:
        range: string
        required: true
      alternate_identifier_type:
        range: alternateidentifiertype
        required: true


  ecoregion:
    attributes:
      domain_id:
        identifier: true
        range: integer
      domain_name:
        range: string
        required: true

  functionalAnnotationIdentifier:
    attributes:
      id:
        identifier: true
        range: uuid
      functional_identifier:
        range: string
        required: true
      database:
        range: annotationdatabasetype
        required: true


  instrument:
    attributes:
      id:
        identifier: true
        range: uuid
      name:
        range: string
        required: true
      alternative_names:
        range: string # TODO ARRAY
      vendor:
        range: vendorenum
      model:
        range: modelenum
      instrument_parameters:
        range: string # TODO JSON

  metaboliteQuantification:
    attributes:
      id:
        identifier: true
        range: uuid
      description:
        range: string
      alternative_identifiers:
        range: string
      highest_similarity_score:
        range: integer
      metabolite_quantified:
        range: string

  ontologyClass:
    attributes:
      id:
        identifier: true
        range: uuid
      description:
        range: string
      alternative_identifiers:
        range: string
      name:
        range: string

  peptideQuantification:
    attributes:
      id:
        identifier: true
        range: uuid
      description:
        range: string
      all_proteins:
        range: string
      best_protein:
        range: string
      min_q_value:
        range: numeric
      peptide_sequence:
        range: string
      peptide_spectral_count:
        range: integer
      peptide_sum_masic_abundance:
        range: numeric






  zipDownload:
    attributes:
      id:
        identifier: true
        range: uuid
      time:
        range: datetime
        required: true
      user:
        range: string
        required: true
      files:
        range: integer
        required: true
      packages:
        range: string

  containerType:
    attributes:
      id:
        identifier: true
        range: uuid
      description:
        range: string
      was_generated_by:
        range: string
      container_type:
        range: containertypeenum
      container_size_id:
        range: quantityValue

  custodian:
    attributes:
      id:
        identifier: true
        range: uuid
      person_id:
        range: personValue

  instrument_alt_id:
    attributes:
      id:
        identifier: true
        range: alternativeIdentifier
      instrument_alt_id_provider:
        range: instrumentaltidprovider
      instrument_id:
        range: instrument
        required: true

  labDevice:
    attributes:
      id:
        identifier: true
        range: uuid
      description:
        range: string
      device_type:
        range: devicetypeenum
      activity_time_id:
        range: quantityValue
      activity_speed_id:
        range: quantityValue

  sampleProcessing:
    attributes:
      id:
        identifier: true
        range: uuid
      analysis_type:
        range: routemethod
      method_name:
        range: methodname
      processing_steps:
        range: string # TODO JSONB
        required: true
      url:
        range: string
      version:
        range: string

  processingSampleLink:
    attributes:
      id:
        identifier: true
        range: uuid
      sample_base_id:
        identifier: true
        range: sampleBase
        required: true
      processing_id:
        identifier: true
        range: sampleProcessing
        required: true
      step_number:
        identifier: true
        range: integer
        required: true
      role:
        identifier: true
        range: samplerole
        required: true
      version:
        range: string
    unique_keys:
      unique_sample_process_step:
        unique_key_slots:
          - sample_base_id
          - processing_id
          - step_number
          - role

  instrumentCustodian:
    attributes:
      instrument_id:
        range: instrument
        required: true
      custodian_id:
        range: custodian
        required: true


  workflowExecutionFunctionalAnnotation:
    attributes:
      workflow_id:
        range: workflowExecutionActivity
        required: true
      functional_annotation_id:
        range: functionalAnnotationIdentifier
        required: true
      count:
        range: numeric


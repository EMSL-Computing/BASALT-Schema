---
id: https://w3id.org/MONet/analysis-api-schema
name: analysis-api-schema
title: MONet Analysis API Schema
description: |-
  LinkML-based schema for MONet soil analysis data management and metadata enrichment.
  This schema defines the data models for samples, processed samples, site metadata,
  and enrichment providers used in the MONet Analysis API.
license: MIT
see_also:
  - https://MONet.github.io/analysis-api-schema
  - https://github.com/pnnl/analysis-api

prefixes:
  analysis_api_schema: https://w3id.org/MONet/analysis-api-schema/
  # linkml: https://w3id.org/linkml/
  # schema: http://schema.org/
  # qudt: http://qudt.org/schema/qudt/
  # unit: http://qudt.org/vocab/unit/
  # uuid: https://w3id.org/uuid/

default_prefix: analysis_api_schema
default_range: string

imports:
  - linkml:types
  - administration
  - enums
  - mass_spec
  - media_strain_culture_plate
  - metadata
  - metagenomics
  - methods
  - products
  - sample_classes
  - slots
  - study
  - value_tables
  - xrf_xrd
  - zip_download
  # - linkage_cache   # MR2: uncomment when linkage_cache.yaml is added

classes:

  # ---------------------------------------------------------------------------
  # (NEW ABSTRACT CLASS) dataProduct   MR1
  # Abstract base for any data artifact accessible in S3 storage.
  # processedData inherits via is_a. Future sitePhoto and similar file-based
  # products will also inherit here. No direct database table.
  # ---------------------------------------------------------------------------
  dataProduct:
    abstract: true
    description: |-
      Abstract base class for raw or processed data accessible in S3 storage.
      Carries S3-pointer and sample-linkage slots shared across product types.
      processedData and future sitePhoto extend this via is_a.
      No direct database table   subclasses map to tables.
    slots:
      - name
      - description
      - project
      - sampling_set
      - core_section
      - sample_name
      - s3_base_url
      - s3_bucket
      - s3_key
      - filesize
      - md5checksum
    attributes:
      id:
        identifier: true
        range: uuid
        required: true

  replicate: # can we remove this?
    description: A replicate or aliquot of a sample
    attributes:
      id:
        identifier: true
        range: ProcessedSample
      rep:
        description: The replicate (or aliquot) number
        range: integer
        required: true

  # (CHANGED MR1) processedData now inherits from dataProduct via is_a.
  # Inherited slots: name, description, project, sampling_set, core_section, sample_name,
  # s3_base_url, s3_bucket, s3_key, filesize, md5checksum, id.
  # Retained as attributes: type (class-specific product enum range), workflow_id.
  # New slots: summary_metrics, lims_barcode, version.
  processedData:
    is_a: dataProduct
    abstract: true
    description: A data product generated by a workflow execution.
    slots:
      - summary_metrics  # [ADDED] key-value product summary, per-type schema TBD
      - lims_barcode     # [PROMOTED] from inline attribute
      - version          # [PROMOTED] from inline attribute
      - sample_id        # [ADDED] link back to originating sample
    todos:
      - what does version reference?
      - all subclasses need a more specific upstream slot to replace was_generated_by


  instrumentData:
    is_a: dataProduct
    abstract: true
    slots:
      - file_curie
    slot_usage:
      description:
        required: true
    attributes:
      alternative_identifiers:
        range: string
      compression_type:
        range: string
      file_type:
        range: filetype
      version:
        range: string
    todos:
      - all subclasses need a more specific upstream slot to replace was_generated_by
      - add subclasses for non-mass spec data
      - revisit alternative identifiers range - array?
      - what does version reference? is it software? why is it here
      - revisit filetype enum - restrict on subclasses

  sitePhoto:
    is_a: dataProduct
    attributes:
      site_photo_type:
        range: sitephototype
      photo_taken_during:
        range: SamplingActivity

  # dataGenerationActivity is now ABSTRACT.
  # Concrete per-method-type subclasses (e.g. EcoplatedataGenerationActivity,
  # AMP2dataGenerationActivity in companion files) use is_a: dataGenerationActivity and
  # add method-specific slots (including timepoint_label where needed).
  # New slot: sequence_order. version promoted to global slot.
  # NOTE: Will be renamed DataGenerationActivity.
  dataGenerationActivity:
    abstract: true
    slots:
      - sequence_order   # [ADDED] integer ordering within a temporal series
      - version          # [PROMOTED] from inline attribute
      # TODO what is this version number referencing?
    attributes:
      id:
        identifier: true
        range: uuid
      analyte_id:
        range: ProcessedSample
      name:
        range: string
      acquisition_start_time:
        range: datetime
        required: true
      acquisition_end_time:
        range: datetime
        required: true
      instrument_id:
        range: instrument
      protocol_url:
        range: string
      instrument_operator_id:
        range: personValue
    todos:
      - what does version reference? is it software? doesn't make sense here

  RespirationDataGenerationActivity:
    is_a: dataGenerationActivity
    description: |-
      Data generation activity for soil respiration analysis.
      Captures CO2-C efflux measured per gram of soil.
    attributes:
      method_id:
        range: RespirationMethod
        description: Reference to the RespirationMethod used for this run

  # dataProcessingActivity is ABSTRACT.
  # Concrete per-type subclasses (e.g. MetagenomicsdataProcessingActivity in
  # metagenomics.yaml) use is_a: dataProcessingActivity.
  # New slot: parent_workflow_id (chain link). workflow_steps direction updated.
  # version promoted to global slot.

  dataProcessingActivity:
    abstract: true
    description: |-
      Abstract base for any workflow execution activity. Input data should 
      be specified on workflow subclasses.
    slots:
      - parent_workflow_id  # [ADDED] self-referential chain link
      - workflow_steps      # [CHANGED] key-value direction; schema TBD (was # TODO JSONB)
      - version             # [PROMOTED] from inline attribute
      - description
    slot_usage:
      version:
        required: true
    attributes:
      id:
        identifier: true
        range: uuid
      description:
        range: string
      started_at_time:
        range: datetime
        required: true
      ended_at_time:
        range: datetime
      software_url:
        range: string
      software_version:
        range: string
      software_poc:
        range: string
      execution_resource:
        range: executionresourcetype

  alternativeIdentifier:
    attributes:
      id:
        identifier: true
        range: uuid
      alternate_id:
        range: string
        required: true
      alternate_identifier_type:
        range: alternateidentifiertype
        required: true


  ecoregion:
    attributes:
      domain_id:
        identifier: true
        range: integer
      domain_name:
        range: string
        required: true

  functionalAnnotationIdentifier:
    attributes:
      id:
        identifier: true
        range: uuid
      functional_identifier:
        range: string
        required: true
      database:
        range: annotationdatabasetype
        required: true


  instrument:
    attributes:
      id:
        identifier: true
        range: uuid
      name:
        range: string
        required: true
      alternative_names:
        range: string # TODO ARRAY
      vendor:
        range: vendorenum
      model:
        range: modelenum
      instrument_parameters:
        range: string # TODO JSON

  ontologyClass: # table has no data
    attributes:
      id:
        identifier: true
        range: uuid
      description:
        range: string
      alternative_identifiers:
        range: string
      name:
        range: string

  containerType:
    attributes:
      id:
        identifier: true
        range: uuid
      description:
        range: string
      container_type:
        range: containertypeenum
      container_size_id:
        range: quantityValue

  custodian:
    attributes:
      id:
        identifier: true
        range: uuid
      person_id:
        range: personValue

  instrument_alt_id:
    attributes:
      id:
        identifier: true
        range: uuid
      alt_id:
        range: alternativeIdentifier
      instrument_alt_id_provider:
        range: instrumentaltidprovider
      instrument_id:
        range: instrument
        required: true

  labDevice:
    attributes:
      id:
        identifier: true
        range: uuid
      description:
        range: string
      device_type:
        range: devicetypeenum
      activity_time_id:
        range: quantityValue
      activity_speed_id:
        range: quantityValue

  # (CHANGED MR1) sampleProcessing is now ABSTRACT per PI guidance.
  # Concrete protocol-specific subclasses use is_a: sampleProcessing.
  # processing_steps noted TODO JSONB   direction change to key-value is deferred.
  sampleProcessing:
    abstract: true
    attributes:
      id:
        identifier: true
        range: uuid
      analysis_type:
        range: routemethod
      method_name:
        range: methodname
      processing_steps:
        range: string # TODO JSONB   key-value direction deferred; schema TBD
        required: true
      url:
        range: string
      version:
        range: string
    todos:
      - why is version here? should it be lab_protocol_version?

  processingSampleLink:
    attributes:
      id:
        identifier: true
        range: uuid
      sample_base_id:
        identifier: true
        range: Sample
        required: true
      processing_id:
        identifier: true
        range: sampleProcessing
        required: true
      step_number:
        identifier: true
        range: integer
        required: true
      role:
        identifier: true
        range: samplerole
        required: true
      version:
        range: string
    unique_keys:
      unique_sample_process_step:
        unique_key_slots:
          - sample_base_id
          - processing_id
          - step_number
          - role
    todos:
      - why is version here? what is a version of a processed sample?

  instrumentCustodian:
    attributes:
      instrument_id:
        range: instrument
        required: true
      custodian_id:
        range: custodian
        required: true


  workflowExecutionFunctionalAnnotation:
    attributes:
      workflow_id:
        range: dataProcessingActivity
        required: true
      functional_annotation_id:
        range: functionalAnnotationIdentifier
        required: true
      count:
        range: numeric

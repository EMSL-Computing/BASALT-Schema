---
id: https://w3id.org/MONet/analysis-api-schema
name: analysis-api-schema
title: MONet Analysis API Schema
description: |-
  LinkML-based schema for MONet soil analysis data management and metadata enrichment.
  This schema defines the data models for samples, processed samples, site metadata,
  and enrichment providers used in the MONet Analysis API.
license: MIT
see_also:
  - https://MONet.github.io/analysis-api-schema
  - https://github.com/pnnl/analysis-api

prefixes:
  analysis_api_schema: https://w3id.org/MONet/analysis-api-schema/
  # linkml: https://w3id.org/linkml/
  # schema: http://schema.org/
  # qudt: http://qudt.org/schema/qudt/
  # unit: http://qudt.org/vocab/unit/
  # uuid: https://w3id.org/uuid/

default_prefix: analysis_api_schema
default_range: string

imports:
  - linkml:types
  - enums
  - value_tables
  - metagenomics
  - metadata
  - methods
  - products
  - administration
  - campaign
  - study
  - zip_download
  # - enrichment # todo have not reviewed fully

classes:


  sampleBase:
    attributes:
      id:
        identifier: true
        range: uuid
      sample_name: # "60881_1_TOP_1"
        description: The human readable name for the sample
      proposal_id:
        description: The 5 digit project ID assigned to an EMSL user proposal/project
        range: integer
      sampling_set: # "1"
      sample_base_type:
        description: The name of the sample set if the sample is a part of a set of samples processed together
        range: samplebasetype
        required: true

  sample:
    description: A physical sample collected from the environment
    attributes:
      id:
        identifier: true
        range: sampleBase
      sampling_activity_id:
        description: Reference to the sampling activity that collected this sample
        range: samplingActivity
        required: true
      type:
        description: The type of sample (soil, aerosol, etc.)
        range: sampletype
        required: false
      guid_source:
        description: Indicate the source of the GUID that you have provided for your samples
      other_guid_source:
        description: Please specify if other GUID source
  
  soil_sample:
    description: A soil sample with specific soil-related properties
    attributes:
      id:
        range: sample
        identifier: true
      soil_type:
        description: The specific type of soil sample
        range: soiltype
        required: true

  aerosol_sample:
    description: An aerosol sample with specific aerosol-related properties
    attributes:
      id:
        range: sample
        identifier: true
      aerosol_type:
        description: The type or method of aerosol collection
        range: aerosoltype
        required: true

  processedSample:
    description: A sample that has undergone processing or analysis
    attributes:
      id:
        identifier: true
        range: sampleBase
      processed_sample_type:
        description: The type of processed sample
        range: processedsampletype
        required: true

  coreSection:
    description: A section of a core sample (TOP, MID, BTM)
    attributes:
      id:
        identifier: true
        range: processedSample
      core_section:
        description: The section of the core (e.g. TOP, MID, BTM)
        range: coresectionenum
        required: true

  replicate:
    description: A replicate or aliquot of a sample
    attributes:
      id:
        identifier: true
        range: processedSample
      rep:
        description: The replicate (or aliquot) number
        range: integer
        required: true

  dataProduct:
    description: >-
      An abstract class representing raw or processed data 
      that can be accessed in S3 storage.
    attributes:
      id:
        identifier: true
        range: uuid
      name:
        range: string
        required: true
      proposal_id:
        range: integer
      sampling_set:
        range: integer
      core_section:
        range: string
      sample_name:
        range: string
      s3_base_url:
        range: string
      s3_bucket:
        range: string
      s3_key:
        range: string
        required: true
      filesize:
        range: integer
      md5checksum:
        range: string

  sitePhoto:
    is_a: dataProduct
    attributes:
      type:
        range: sitephototype

  processedData:
    is_a: dataProduct
    attributes:
      type:
        range: product
        required: true
      workflow_id:
        range: workflowExecutionActivity
      lims_barcode:
        range: string
      version:
        range: string

  instrumentData:
    is_a: dataProduct
    attributes:
      analysis_activity_id:
        range: analysisActivity
      description:
        range: string
        required: true
      alternative_identifiers:
        range: string # TODO ARRAY
      compression_type:
        range: string
      type:
        range: string
      was_generated_by:
        range: string
      file_type:
        range: filetype
      version:
        range: string

  analysisActivity:
    attributes:
      id:
        identifier: true
        range: uuid
      type:
        range: routemethod
      analyte_id:
        range: processedSample
      name:
        range: string
      acquisition_time:
        range: datetime
        required: true
      instrument_id:
        range: instrument
      protocol_url:
        range: string
      instrument_operator_id:
        range: personValue
      version:
        range: string

  workflowExecutionActivity:
    attributes:
      id:
        identifier: true
        range: uuid
      raw_data_id:
        range: instrumentData
        required: true
      description:
        range: string
      ended_at_time:
        range: datetime
      git_url:
        range: string
        required: true
      name:
        range: string
      started_at_time:
        range: datetime
        required: true
      type:
        range: string
        required: true
      used_id:
        range: softwareControlledTermValue
      execution_resource:
        range: executionresourcetype
      workflow_steps:
        range: string # TODO JSONB
      version:
        range: string

  alternativeIdentifier:
    attributes:
      id:
        identifier: true
        range: uuid
      alternate_id:
        range: string
        required: true
      alternate_identifier_type:
        range: alternateidentifiertype
        required: true


  ecoregion:
    attributes:
      domain_id:
        identifier: true
        range: integer
      domain_name:
        range: string
        required: true

  functionalAnnotationIdentifier:
    attributes:
      id:
        identifier: true
        range: uuid
      functional_identifier:
        range: string
        required: true
      database:
        range: annotationdatabasetype
        required: true


  instrument:
    attributes:
      id:
        identifier: true
        range: uuid
      name:
        range: string
        required: true
      alternative_names:
        range: string # TODO ARRAY
      vendor:
        range: vendorenum
      model:
        range: modelenum
      instrument_parameters:
        range: string # TODO JSON

  metaboliteQuantification:
    attributes:
      id:
        identifier: true
        range: uuid
      description:
        range: string
      alternative_identifiers:
        range: string
      highest_similarity_score:
        range: integer
      metabolite_quantified:
        range: string

  ontologyClass:
    attributes:
      id:
        identifier: true
        range: uuid
      description:
        range: string
      alternative_identifiers:
        range: string
      name:
        range: string

  peptideQuantification:
    attributes:
      id:
        identifier: true
        range: uuid
      description:
        range: string
      all_proteins:
        range: string
      best_protein:
        range: string
      min_q_value:
        range: numeric
      peptide_sequence:
        range: string
      peptide_spectral_count:
        range: integer
      peptide_sum_masic_abundance:
        range: numeric

  containerType:
    attributes:
      id:
        identifier: true
        range: uuid
      description:
        range: string
      was_generated_by:
        range: string
      container_type:
        range: containertypeenum
      container_size_id:
        range: quantityValue

  custodian:
    attributes:
      id:
        identifier: true
        range: uuid
      person_id:
        range: personValue

  instrument_alt_id:
    attributes:
      id:
        identifier: true
        range: alternativeIdentifier
      instrument_alt_id_provider:
        range: instrumentaltidprovider
      instrument_id:
        range: instrument
        required: true

  labDevice:
    attributes:
      id:
        identifier: true
        range: uuid
      description:
        range: string
      device_type:
        range: devicetypeenum
      activity_time_id:
        range: quantityValue
      activity_speed_id:
        range: quantityValue

  sampleProcessing:
    attributes:
      id:
        identifier: true
        range: uuid
      analysis_type:
        range: routemethod
      method_name:
        range: methodname
      processing_steps:
        range: string # TODO JSONB
        required: true
      url:
        range: string
      version:
        range: string

  processingSampleLink:
    attributes:
      id:
        identifier: true
        range: uuid
      sample_base_id:
        identifier: true
        range: sampleBase
        required: true
      processing_id:
        identifier: true
        range: sampleProcessing
        required: true
      step_number:
        identifier: true
        range: integer
        required: true
      role:
        identifier: true
        range: samplerole
        required: true
      version:
        range: string
    unique_keys:
      unique_sample_process_step:
        unique_key_slots:
          - sample_base_id
          - processing_id
          - step_number
          - role

  instrumentCustodian:
    attributes:
      instrument_id:
        range: instrument
        required: true
      custodian_id:
        range: custodian
        required: true


  workflowExecutionFunctionalAnnotation:
    attributes:
      workflow_id:
        range: workflowExecutionActivity
        required: true
      functional_annotation_id:
        range: functionalAnnotationIdentifier
        required: true
      count:
        range: numeric


---
id: https://w3id.org/MONet/analysis-api-schema
name: analysis-api-schema
title: MONet Analysis API Schema
description: |-
  LinkML-based schema for MONet soil analysis data management and metadata enrichment.
  This schema defines the data models for samples, processed samples, site metadata,
  and enrichment providers used in the MONet Analysis API.
license: MIT
see_also:
  - https://MONet.github.io/analysis-api-schema
  - https://github.com/pnnl/analysis-api

prefixes:
  analysis_api_schema: https://w3id.org/MONet/analysis-api-schema/
  # linkml: https://w3id.org/linkml/
  # schema: http://schema.org/
  # qudt: http://qudt.org/schema/qudt/
  # unit: http://qudt.org/vocab/unit/
  # uuid: https://w3id.org/uuid/

default_prefix: analysis_api_schema
default_range: string

# =============================================================================
# GLOBAL SLOTS
# Non-identifier fields that are shared across multiple classes or promoted
# from inline attributes to support the dataProduct inheritance hierarchy.
# UUID identifier fields remain as class-level attributes (identifier: true).
# =============================================================================

slots:

  sampling_set:
    title: sampling set
    description: |-
      Sampling set number for grouping related samples collected together.
      This is a user-defined integer that can be used to link samples collected
      in the same sampling event or campaign.
    range: integer
  soil_type:
    title: soil type
    description: The specific type of soil sample
    range: SoilTypeEnum
    todos: 
      - this is a GSC slot but it's not constrined by an enum, it's a string. where did this come from?
  soil_horizon:
    title: soil horizon
    description: Specific layer in the land area which measures parallel to the soil surface and possesses physical characteristics which differ from the layers above and beneath.
    exact_mappings:
      - MIXS:0001082
    range: SoilHorizonEnum
  aerosol_type:
    description: The type or method of aerosol collection
    range: AerosolTypeEnum
    required: true
  core_section:
    title: core section
    description: The section of the core.
    examples:
      - value: TOP
      - value: MID
      - value: BTM
    range: string
  project:
    title: Project
    alias:
      - study
      - study_id
      - project_id
      - proposal
      - proposal_id
    description: |-
      Identifier for the user project associated with the entity or activity. 
    range: integer
    todos:
      - should this be an ID? CURIE can use the one NMDC has https://bioregistry.io/reference/emsl.project:60141 where emsl.project is the CURIE prefix
  storage_condition:
    title: storage condition
    description: The storage condition of the sample, such as temperature or preservation method.
    range: StorageConditionEnum
    exact_mappings:
      - MIXS:0000327
    aliases:
      - samp_store_cond
      - storage_cond
      - storage_condt
  oxygen_relationship:
    title: oxygen relationship
    description: The relationship of the sample to oxygen, such as aerobic or anaerobic.
    range: OxygenStatusEnum
    exact_mappings:
      - MIXS:0000015
  biotic_relationship:
    title: observed biotic relationship
    description: The biotic relationship of the sample, such as symbiotic or free-living
    range: BioticRelationshipEnum
    exact_mappings:
      - MIXS:0000016
    aliases:
      - samp_biotic_relationship
  air_temp_regm:
    title: air temperature regime
    description: Information about treatment involving an exposure to varying temperatures; should include the temperature, treatment regimen including how many times the treatment was repeated, how long each treatment lasted, and the start and end time of the entire treatment; can include different temperature regimens
    range: string
    exact_mappings:
      - MIXS:0000551
  chem_administration:
    title: chemical administration
    description: List of chemical compounds administered to the host or site where sampling occurred, and when (e.g. Antibiotics, n fertilizer, air filter); can include multiple compounds. For chemical entities of biological interest ontology (chebi) (v 163), http://purl.bioontology.org/ontology/chebi
    range: string
    exact_mappings:
      - MIXS:0000751

  type:
    title: type
    description: Type classifier for an entity or activity
    range: string

  description:
    title: description
    description: Human-readable description for the entity or activity
    range: string

  latitude:
    title: latitude
    description: Latitude coordinate of the sampling site
    range: double

  longitude:
    title: longitude
    description: Longitude coordinate of the sampling site
    range: double

  has_output:
    title: has output
    description: Output entity produced by an activity
    range: string
    todos: I'm not sure we are going to use this, given our plan to only point 'upstream' from dataProduct to the generating activity, and not have activities point to their outputs. Do we need this slot?

  # --- dataProduct base slots (promoted from processedData attributes) ---
  name:
    description: Human-readable name for the entity
    range: string
    required: true

  proposal_id:
    description: 5-digit EMSL user proposal/project ID
    range: integer

  sample_name:
    range: string

  s3_base_url:
    range: string

  s3_bucket:
    range: string

  s3_key:
    description: MinIO/S3 object key; required for all data products
    range: string
    required: true

  filesize:
    range: integer

  md5checksum:
    range: string

  file_curie:
    description: an identifier for a file that resolves to the file's accessible location
    range: string # restrict

  # --- shared utility slots promoted from processedData inline attributes ---
  lims_barcode:
    description: LIMS barcode identifier
    range: string
    required: false

  version:
    description: Version string; shared by processedData, analysisActivity, workflowExecutionActivity
    range: string
    required: true

  # --- workflowExecutionActivity: new chain-link slot ---
  parent_workflow_id:
    description: |-
      Self-referential FK to the preceding workflowExecutionActivity in a chain.
      NULL -> first (or standalone) step.
      Non-null -> this execution directly follows parent_workflow_id.
      Enables single-hop chaining queries; full traversal via linkage_cache.

      DDL: ALTER TABLE "workflowExecutionActivity"
             ADD COLUMN parent_workflow_id UUID
             REFERENCES "workflowExecutionActivity"(id);
    range: uuid
    required: false

  # --- workflowExecutionActivity: JSONB direction change ---
  workflow_steps:
    description: |-
      Per-run workflow parameters. Previously annotated TODO JSONB in schema.
      Direction: structured key-value pairs keyed by workflow type.
      Schema for allowed keys TBD per workflow type before full implementation.
      Interim DB storage: JSONB column retained.
    range: string   # interim placeholder   will reference typed key-value class; schema TBD
    required: false

  # --- analysisActivity: temporal ordering ---
  sequence_order:
    description: |-
      Integer ordering within a temporal series for the same analyte.
      Lower = earlier in series. Use when acquisition_time alone is insufficient.

      DDL: ALTER TABLE "analysisActivity"
             ADD COLUMN sequence_order INTEGER;
    range: integer
    required: false

  # --- processedData: compact queryable summary ---
  summary_metrics:
    description: |-
      Lightweight per-product summary for common queries that avoid full file download.
      Direction: structured key-value pairs; per-type schemas TBD:
        ecoplate:  well-level absorbance summaries (position, timepoint, absorbance)
        xrf:       per-element concentration results + QC flag
        lcms:      feature count, identification count, MSI-2 fraction
      Interim DB storage: JSONB column retained until formal typed class exists.

      DDL: ALTER TABLE "processedData"
             ADD COLUMN summary_metrics JSONB;   -- interim; formal key-value schema TBD
    range: string   # interim placeholder   will reference typed key-value class; schema TBD
    required: false


  sample_id:
    description: Link back to the originating sample
    range: Sample
    required: false

  # --- dataProduct: provenance link ---
  was_generated_by:
    description: |-
      Reference to the activity that generated this data product.
      Range is overridden per subclass via slot_usage:
        processedData   -> workflowExecutionActivity
        instrumentData  -> analysisActivity
    required: false   # nullable   not all products have a tracked generating activity

  replicate:
    description: The replicate number of the sample, if applicable.
    range: integer

imports:
  - linkml:types
  - enums
  - value_tables
  - sample_classes
  - metadata
  - methods
  - products
  - administration
  - study
  - zip_download
  - media_strain_culture_plate
  - metagenomics
  - mass_spec
  # - metaproteomics
  - xrf_xrd
  # - linkage_cache   # MR2: uncomment when linkage_cache.yaml is added
  # - enrichment # todo have not reviewed fully

classes:

  # ---------------------------------------------------------------------------
  # NEW ABSTRACT BASE CLASSES, FOR EVERYTHING
  # Activity and Entity were moved here from metaproteomics.yaml,
  # since we're going to do these anyway it seemed like a good starting point.
  # The whole is_a inheritance hierarchy is NOT built out in this MR,
  # that should be its own branch/MR for clarity.
  # Edit these classes to your heart's content when that work happens.

  Activity: # L7 - links to PROV-O Activity, but with additional attributes relevant to mass spectrometry and chemical processes
    description: Something that happens over time and can use equipment.
    abstract: true
    attributes:
      id:
        identifier: true
        range: uuid
      ended_at_time:
        range: datetime
      processing_institution:
        range: InstitutionEnum
        description: The institution where the activity took place.
      protocol_link:
        range: Protocol 
        description: A link to a protocol that describes the steps and parameters of the activity.
      started_at_time:
        range: datetime
    slots:
    - name
    - description

  Entity:
    description: Base identifiable thing.
    abstract: true
    attributes:
      id:
        identifier: true
        range: uuid
    slots:
    - name
    - description
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # (NEW ABSTRACT CLASS) dataProduct   MR1
  # Abstract base for any data artifact accessible in S3 storage.
  # processedData inherits via is_a. Future sitePhoto and similar file-based
  # products will also inherit here. No direct database table.
  # ---------------------------------------------------------------------------
  dataProduct:
    abstract: true
    description: |-
      Abstract base class for raw or processed data accessible in S3 storage.
      Carries S3-pointer and sample-linkage slots shared across product types.
      processedData and future sitePhoto extend this via is_a.
      No direct database table, subclasses map to tables.
    slots:
      - name
      - description
      - proposal_id
      - sampling_set
      - core_section
      - sample_name
      - s3_base_url
      - s3_bucket
      - s3_key
      - filesize
      - md5checksum
      #- was_generated_by
    attributes:
      id:
        identifier: true
        range: uuid
        required: true

  # (CHANGED MR1) processedData now inherits from dataProduct via is_a.
  # Inherited slots: name, description, proposal_id, sampling_set, core_section, sample_name,
  # s3_base_url, s3_bucket, s3_key, filesize, md5checksum, id.
  # Retained as attributes: type (class-specific product enum range), workflow_id.
  # New slots: summary_metrics, lims_barcode, version.
  processedData:
    is_a: dataProduct
    abstract: true
    description: A data product generated by a workflow execution.
    slots:
      - summary_metrics  # [ADDED] key-value product summary, per-type schema TBD
      - lims_barcode     # [PROMOTED] from inline attribute
      - version          # [PROMOTED] from inline attribute
      - sample_id        # [ADDED] link back to originating sample
    todos:
      - what does version reference?
      - all subclasses need a more specific upstream slot to replace was_generated_by


  instrumentData:
    is_a: dataProduct
    abstract: true
    description: >-
      An abstract parent class for raw data files generated by different kinds 
      of instruments. All subclasses must have a slot pointing upstream that 
      specifies the analysisActivity subclass which created them.
    slots:
      - file_curie
    slot_usage:
      description:
        required: true
    attributes:
      alternative_identifiers:
        range: string
      compression_type:
        range: string
      type:
        range: string
      file_type:
        range: filetype
      version:
        range: string
    todos:
      - all subclasses need a more specific upstream slot to replace was_generated_by
      - add subclasses for non-mass spec data
      - revisit alternative identifiers range - array?
      - what does version reference? is it software? why is it here
      - revisit filetype enum - restrict on subclasses

  sitePhoto:
    is_a: dataProduct
    attributes:
      site_photo_type:
        range: sitephototype
      photo_taken_during:
        range: SamplingActivity

  # analysisActivity is now ABSTRACT.
  # Concrete per-method-type subclasses (e.g. EcoplateAnalysisActivity,
  # AMP2AnalysisActivity in companion files) use is_a: analysisActivity and
  # add method-specific slots (including timepoint_label where needed).
  # New slot: sequence_order. version promoted to global slot.
  # NOTE: Will be renamed DataGenerationActivity.
  analysisActivity:
    abstract: true
    slots:
      - sequence_order   # [ADDED] integer ordering within a temporal series
      - version          # [PROMOTED] from inline attribute
      - name
      - description
    attributes:
      id:
        identifier: true
        range: uuid
      analyte_id:
        range: ProcessedSample
      acquisition_start_time:
        range: datetime
        required: true
      acquisition_end_time:
        range: datetime
        required: true
      instrument_id:
        range: instrument
      protocol:
        range: Protocol
      instrument_operator_id:
        range: personValue
      processing_institution:
        range: InstitutionEnum
    todos:
      - what does version reference? is it software? doesn't make sense here

  # workflowExecutionActivity is ABSTRACT.
  # Concrete per-type subclasses (e.g. MetagenomicsWorkflowExecutionActivity in
  # metagenomics.yaml) use is_a: workflowExecutionActivity.
  # New slot: parent_workflow_id (chain link). workflow_steps direction updated.
  # version promoted to global slot.

  workflowExecutionActivity:
    abstract: true
    description: |-
      Abstract base for any data processing activity. Input data should 
      be specified on workflow subclasses.
    slots:
      - parent_workflow_id  # [ADDED] self-referential chain link
      - workflow_steps      # [CHANGED] key-value direction; schema TBD (was # TODO JSONB)
      - version             # [PROMOTED] from inline attribute
      - description
    slot_usage:
      version:
        required: true
      description: 
        description: >-
          A human-readable description of the data analysis workflow. May 
          include details such as the purpose, output, and/or main steps of 
          the workflow.
    attributes:
      id:
        identifier: true
        range: uuid
      started_at_time:
        range: datetime
        required: true
      ended_at_time:
        range: datetime
      software_url:
        range: string
      software_version:
        range: string
      software_poc:
        range: string
      execution_resource:
        range: ExecutionResourceEnum

  alternativeIdentifier:
    attributes:
      id:
        identifier: true
        range: uuid
      alternate_id:
        range: string
        required: true
      alternate_identifier_type:
        range: alternateidentifiertype
        required: true


  ecoregion:
    attributes:
      domain_id:
        identifier: true
        range: integer
      domain_name:
        range: string
        required: true

  functionalAnnotationIdentifier:
    attributes:
      id:
        identifier: true
        range: uuid
      functional_identifier:
        range: string
        required: true
      database:
        range: annotationdatabasetype
        required: true


  instrument:
    description: |-
      A material entity that is designed to perform a function in a scientific 
      investigation, but is not a reagent. This class models a specific
      instance of an instrument IF identifying information is filled out, 
      otherwise, it is a generic standin for an instrument model.
    attributes:
      id:
        identifier: true
        range: uuid
      name:
        range: string
        required: true
      vendor:
        range: vendorenum
      model:
        range: modelenum
      serial_number:
        range: string
        description: instrument instance specifier
      lims_resource_id:   #ADDED for optional L7 traceability
        range: integer
        description: L7 resource_id for the instrument, if known.
      location:
        range: string
      maintenance:
        range: string
        description: Maintenance notes or directions to a maintenance log.
      alternative_names:
        range: string # TODO ARRAY
      instrument_parameters:
        range: string # TODO JSON
      mass_analyzer_type:
        range: MassAnalyzerEnum
        description: The type of mass analyzer present in the instrument, if applicable (e.g., Orbitrap, Time-of-Flight, Quadrupole).
      other_properties:
        range: string
        description: Other important properties of the instrument that are not captured in other fields.

  ontologyClass: # table has no data
    attributes:
      id:
        identifier: true
        range: uuid
      description:
        range: string
      alternative_identifiers:
        range: string
      name:
        range: string

  containerType:
    attributes:
      id:
        identifier: true
        range: uuid
      description:
        range: string
      was_generated_by:
        range: string
      container_type:
        range: containertypeenum
      container_size_id:
        range: quantityValue
      axes:
        multivalued: true
        range: ContainerAxis
      contains:
        multivalued: true
        range: uriorcurie   
      label_format:
        range: string      
      renderer:
        range: string       
        description: UI renderer to use for this container type (e.g., defaultcontainer.js).
      slot_capacity:
        range: string
    todos:
    - reconcile with enums and in media_strain_culture_plate.yaml

  ContainerAxis: #container_axis.yml - L7
    attributes:
      name:
        range: string     
      values:
        multivalued: true
        range: string
    todos:
    - I'm only including this in case we need it to sync up with L7 in some way

  custodian:
    attributes:
      id:
        identifier: true
        range: uuid
      person_id:
        range: personValue

  instrument_alt_id:
    attributes:
      id:
        identifier: true
        range: uuid
      alt_id:
        range: alternativeIdentifier
      instrument_alt_id_provider:
        range: instrumentaltidprovider
      instrument_id:
        range: instrument
        required: true

  labDevice:
    attributes:
      id:
        identifier: true
        range: uuid
      description:
        range: string
      device_type:
        range: devicetypeenum
      activity_time_id:
        range: quantityValue
      activity_speed_id:
        range: quantityValue

  # (CHANGED MR1) sampleProcessing is now ABSTRACT per PI guidance.
  # Concrete protocol-specific subclasses use is_a: sampleProcessing.
  # processing_steps noted TODO JSONB   direction change to key-value is deferred.
  sampleProcessing:
    abstract: true
    attributes:
      id:
        identifier: true
        range: uuid
      analysis_type:
        range: routemethod
      method_name:
        range: methodname
      processing_steps:
        range: string # TODO JSONB   key-value direction deferred; schema TBD
        required: true
      url:
        range: string
      version:
        range: string
      uses_sample:
        range: Sample
    todos:
      - why is version here? should it be lab_protocol_version?

  processingSampleLink:
    attributes:
      id:
        identifier: true
        range: uuid
      sample_base_id:
        identifier: true
        range: Sample
        required: true
      processing_id:
        identifier: true
        range: sampleProcessing
        required: true
      step_number:
        identifier: true
        range: integer
        required: true
      role:
        identifier: true
        range: samplerole
        required: true
      version:
        range: string
    unique_keys:
      unique_sample_process_step:
        unique_key_slots:
          - sample_base_id
          - processing_id
          - step_number
          - role
    todos:
      - why is version here? what is a version of a processed sample?

  instrumentCustodian:
    attributes:
      instrument_id:
        range: instrument
        required: true
      custodian_id:
        range: custodian
        required: true


  workflowExecutionFunctionalAnnotation:
    attributes:
      workflow_id:
        range: workflowExecutionActivity
        required: true
      functional_annotation_id:
        range: functionalAnnotationIdentifier
        required: true
      count:
        range: numeric

  Protocol:
    description: >-
      A protocol document or standard operating procedure (SOP) used in a 
      process. This class represents a reference to a document, it does NOT 
      represent all of the processes done according to a protocol, processes
      should be modeled using appropriate Activity classes.
    attributes:
      id:
        identifier: true
        range: uuid
      url:
        range: string
        description: URL link to the protocol document or resource.
    slots:
      - name
      - description
id: https://w3id.org/MONet/analysis-api-schema/enums
name: analysis-api-schema-enums
title: MONet Analysis API - Enumerations
description: |-
  Enumerated values used throughout the MONet Analysis API schema
license: MIT

prefixes:
  analysis_api_schema: https://w3id.org/MONet/analysis-api-schema/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
default_prefix: analysis_api_schema

imports:
  - linkml:types

slots:
  analytic:
    range: string
    required: true

  location:
    range: string
    required: true

  method:
    range: string
    # what is this for.

classes:

######## existing "method" classes grouped under abstract parent class
  Method:
    abstract: true
    slots:
      - analytic

  BulkDensityMethod:
    is_a: Method
    slots:
    attributes:

  ElementalAnalysisMethod:
    is_a: Method
    slots:
    attributes:

  EnzymeActivityMethod:
    is_a: Method
    slots:
      - location
    attributes:
      incubation_temp_c:
        range: double
      incubation_time:
        range: string
      wavelength:
        range: double

  GravimetricWaterContentMethod:
    is_a: Method
    slots:
      - location
    attributes:

  HydraulicPropertiesMethod:
    is_a: Method
    slots:
      - location
    attributes:
      fitting_model:
        range: string
        required: true
  
  KuoMethod:
    is_a: Method
    slots:
      - location
      - method
    attributes:
      detection_limit:
        range: string
        required: true
      wavelength:
        range: string

  MicrobialBiomassMethod:
    is_a: Method
    slots:
      - location
    attributes:
      detector:
        range: string
        required: true
      mode:
        range: string
      injection_volume:
        range: string
        required: true
      sample_volume:
        range: string
        required: true
      number_of_injections:
        range: double
        required: true
      check_standard_spacing:
        range: string
        required: true
  
  PH_Method:
    is_a: Method
    slots:
      - location
    attributes:
      calibration:
        range: string
        required: true
  
  RespirationMethod:
    is_a: Method
    slots:
    attributes:
  
  TOC_TN_Method:
    is_a: Method
    slots:
      - location
    attributes:
      column:
        range: string
      mode:
        range: string
      detector:
        range: string
        required: true
      injection_volume:
        range: string
        required: true
      sample_volume:
        range: string
        required: true
      number_of_injections:
        range: double
        required: true
      check_standard_spacing:
        range: string
  
  TextureMethod:
    is_a: Method
    attributes:
    slots:
      - location
      - method
  
  XrayComputedTomographyMethod:
    is_a: Method
    slots:
      - location
    attributes:
      x_ray_power:
        range: string
        required: true
      cu_filter:
        range: string
        required: true
      total_projections_collected:
        range: double
        required: true
      rotation:
        range: string
        required: true
      frames_recording_per_projection:
        range: double
        required: true
      exposure_time_per_frame:
        range: string
        required: true
      image_voxel_size_is:
        range: string
        required: true
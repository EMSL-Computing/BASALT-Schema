---
id: https://w3id.org/MONet/analysis-api-schema/sample-classes
name: analysis-api-schema-sample-classes
title: MONet Analysis API Sample Class Schema
description: |-
  LinkML-based schema for sample classes for Analysis API.
  This schema defines the data models for samples, sample type subclasses, and processed samples.
license: MIT
see_also:
  - https://MONet.github.io/analysis-api-schema
  - https://github.com/pnnl/analysis-api

prefixes:
  analysis_api_schema: https://w3id.org/MONet/analysis-api-schema/
  # linkml: https://w3id.org/linkml/
  # schema: http://schema.org/
  # qudt: http://qudt.org/schema/qudt/
  # unit: http://qudt.org/vocab/unit/
  # uuid: https://w3id.org/uuid/

default_prefix: analysis_api_schema
default_range: string

imports:
  - linkml:types
  - slots

classes:
  Site:
    description: Site-level metadata for a specific location from which a set of samples are collected.
    attributes:
      id:
        identifier: true
        range: uuid
    slots:
      - name
      - description
      - alt
      - annual_precpt
      - annual_temp
      - atmospheric_data
      - crop_rotation # modeled as a bool and a string, but users submit as one column
      - cur_land_use
      - cur_vegetation
      - cur_vegetation_meth
      - drainage_class
      - ecoregion
      - elev
      - env_broad_scale
      - env_local_scale
      - env_medium
      - extreme_event
      - fao_class
      - fire
      - flooding
      - geo_loc_name
      - growth_facil
      - latitude
      - link_climate_info
      - link_class_info
      - local_class
      - local_class_meth
      - longitude
      - neon_domain
      - neon_plot_id # do we need to break this out into neon_site_code and neon_plot_id? users input both in the same column called neon plot id
      - other_growth_facil
      - previous_land_use
      - previous_land_use_meth
      - profile_position
      - season_precpt
      - season_temp
      - slope_aspect
      - slope_gradient
      - tillage
    slot_usage:
      elev:
        required: true
        todos: should this be required for all sample types though? probably not.
      geo_loc_name:
        required: true
      growth_facil:
        required: true
      latitude: 
        required: true
      longitude:
        required: true
    todos: If we only have one Site class, we can't require Site slots based on sample type. We could add this in the submission schema JSON conversion perhaps.

  Sample:
    description: A physical sample collected from an environment. The environment can be ecological, laboratory, or any other context where samples are collected. This class serves as an abstract class to relate subclasses of samples.
    slots:
      - name #should be inherited when Entity class is made
      - description #should be inherited when Entity class is made
      - project
      - emsl_activity
      - storage_condt
      - oxygen_relationship
      - biotic_relationship
      - air_temp_regm
      - chem_administration
      - replicate
      - lims_barcode
      - sampled_during
    slot_usage:
      replicate:
        description: The BIOLOGICAL replicate number of the sample, if applicable.
    todos:
      - add alternate_ids and use inheritance for specific slots
      - where should prposal ID live? probably not here?
      - check all ranges that point to these vlasses sample vs Sample will break
    attributes:
      id:
        identifier: true
        range: uuid
      other_storage_condt:
      sample_link:
        range: Sample
        description: >-
          A reference to another sample that is related to this sample in some 
          way, eg. one is a parent sample, or they were taken from different 
          parts of the same organism.
        todos: 
        - EMSL and NMDC both need better modelling for this
    
  SoilSample:
    description: A soil sample with specific soil-related properties.
    is_a: Sample
    slots:
      - soil_type
      - soil_horizon
    slot_usage:
    attributes:
      id:
        range: Sample
        identifier: true
    
  MonetSoilSample:
    title: MONet Soil Sample
    description: A soil sample with specific soil-related properties that align with the MONet Soil Sample template.
    is_a: SoilSample
    slots:
      - sampling_set
    slot_usage:
      soil_type:
        required: true
      sampling_set:
        required: true
    attributes:
      id:
        range: Sample
        identifier: true

  AerosolSample:
    description: An aerosol sample with specific aerosol-related properties
    is_a: Sample
    slots:
      - aerosol_type
    attributes:
      id:
        range: Sample
        identifier: true

  ProcessedSample:
    title: Processed Sample
    description: |-
       A sample that has undergone processing or analysis. Processed Sample entities are derived from Activitites. Relationships to original sample, other processed samples, and projects is avaialble via following Activity to Entity relationships: has_input, has_output.
    is_a: Sample
    slot_usage:
      replicate:
        description: The TECHNICAL replicate number of the processed sample, if applicable.
      sampled_during:
        range: SampleProcessing
        description: >-
          A reference to the sample processing activity (generally lab work)
          that generated this processed_sample.
    attributes:
      id:
        identifier: true
        range: Sample
      storage_location:
        range: string
        description: The physical or digital location where the processed sample is stored (e.g., freezer location, database ID).
      label:
        range: string
        description: The label on the stored processed sample, if applicable (e.g., "f01").
      concentration_ug_per_uL:
        range: float
        description: Concentration of the processed sample in micrograms per microliter, if applicable.
      total_amount_ug:
        range: float
        description: Total amount of biomolecule in the sample in micrograms, if applicable.
      volume_uL:
        range: float
        description: Volume of the processed sample in microliters, if applicable.
      sampled_portion:
        range: SamplePortionEnum
        description: The portion of the original sample used in creating this processed sample (e.g., "interlayer", "supernatant", "pellet").

  CoreSection:
    description: A section of a core sample (TOP, MID, BTM).
    is_a: ProcessedSample
    slots:
      - core_section
    slot_usage:
      core_section:
        required: true
    attributes:
      id:
        identifier: true
        range: uuid
  
  SamplingActivity:
    description: An activity that involves the collection of a sample. This class serves as an abstract class to relate subclasses of sampling activities. Samples reference their parent sampling activity via the 'sampled_during' slot.
    abstract: true
    attributes:
      id:
        identifier: true
        range: uuid
    slots:
      - name #will be inherited when Activity class is made
      - description
      - project #do we need this here? where do we make the campaign, project, pi, etc associations?
      - emsl_activity
      - collection_date
      - shipped_sample_size
      - sampled_at_site
    todos: is this for individual samples or can it be the activity of collecting multiple samples from one site? would need to change shipped_sample_size and storage_condt if so.

  AerosolArmSamplingActivity:
    attributes:
      id:
        identifier: true
        range: uuid
    description: A sampling activity where aerosol samples were collected by ARM.
    is_a: SamplingActivity
    slot_usage:
      humidity:
        description: Amount of humidity measured in the air the day of sampling. Provided
          by iMet. Provide value and unit, any unit is valid

  AerosolSamplingActivity:
    attributes:
      id:
        identifier: true
        range: uuid
    description: A sampling activity where aerosol samples were collected.
    is_a: SamplingActivity
    slots:
    - collection_time
    - humidity
    - sample_collected
    - sample_collection_dev
    - sampling_duration
    - wind_direction
    - wind_speed

  CommerciallyPurchasedSamplingActivity:
    attributes:
      id:
        identifier: true
        range: uuid
    description: Collection of samples that were purchased by the user.
    is_a: SamplingActivity
    slots:
      - sample_collected
      - sample_collection_dev

  CultureEnvironmentalSamplingActivity:
    attributes:
      id:
        identifier: true
        range: uuid
    description: Collection of samples from a culture of organisms taken from the environment.
    is_a: SamplingActivity
    slots:
      - collection_time
      - sample_collected
      - sample_collection_dev
      - sample_collection_method

  EngineeredStrainSamplingActivity:
    attributes:
      id:
        identifier: true
        range: uuid
    description: Collection of samples from a culture of an engineered organism.
    is_a: SamplingActivity
    slots:

  FieldDeployedTerraformSamplingActivity:
    attributes:
      id:
        identifier: true
        range: uuid
    description: Collection of samples from a field-deployed Terraform device.
    is_a: SamplingActivity
    slots:
      - collection_time
      - sample_collected
      - sample_collection_method

  MixedCultureSamplingActivity:
    attributes:
      id:
        identifier: true
        range: uuid
    description: Collection of samples from a mixed culture.
    is_a: SamplingActivity
    slots:
      - collection_time
      - sample_collected
      - sample_collection_dev
      - sample_collection_method

  MonetSoilSamplingActivity:
    attributes:
      id:
        identifier: true
        range: uuid
    description: Collection of soil cores according to the MONet soil sampling protocol.
    is_a: SamplingActivity
    slot_usage:
      collection_time:
        required: true
      infiltration_1:
        required: true
      infiltration_2:
        required: true
      sample_collection_dev:
        required: true
    slots:
      - collection_time
      - infiltration_1
      - infiltration_2
      - infiltration_notes
      - sample_collection_dev
      - weather

  OtherUndescribedSamplingActivity:
    attributes:
      id:
        identifier: true
        range: uuid
    description: Collection of samples from source that does not fit into any of the other categories.
    is_a: SamplingActivity
    slot_usage:
      humidity:
        description: Amount of humidity measured in the air the day of sampling. Provided
          by iMet. Provide value and unit, any unit is valid
    slots:
      - collection_time
      - humidity
      - sample_collected
      - sample_collection_dev
      - sample_collection_method
      - sampling_duration
      - wind_direction
      - wind_speed

  PlantSamplingActivity:
    attributes:
      id:
        identifier: true
        range: uuid
    description: Collection of samples associated with plants.
    is_a: SamplingActivity
    slots:
      - collection_time
      - sample_collected
      - sample_collection_dev
      - sample_collection_method
      - weather

  PureCultureSamplingActivity:
    attributes:
      id:
        identifier: true
        range: uuid
    description: Collection of samples from a culture containing a single organism.
    is_a: SamplingActivity
    slots:
      - collection_time
      - sample_collected
      - sample_collection_dev
      - sample_collection_method
    
  SedimentSamplingActivity:
    attributes:
      id:
        identifier: true
        range: uuid
    description: Collection of sediment samples from the environment.
    is_a: SamplingActivity
    slot_usage:
    slots:
      - collection_time
      - sample_collected
      - sample_collection_dev
      - sample_collection_method
      - weather
  
  SoilSamplingActivity:
    title: Soil Sampling Activity
    description: Collection of soil samples from the environment.
    is_a: SamplingActivity
    attributes:
      id:
        identifier: true
        range: uuid
    slots:
      - name
      - description
      - collection_time
      - infiltration_1
      - infiltration_2
      - infiltration_notes
      - sample_collected
      - sample_collection_dev
      - sample_collection_method
      - wind_direction
      - weather

SynthesizedMaterialSamplingActivity:
  attributes:
    id:
      identifier: true
      range: uuid
  description: Collection of samples of a synthesized material.
  is_a: SamplingActivity
  slots:
    - sample_collected
    - sample_collection_dev

TerraformSamplingActivity:
  attributes:
    id:
      identifier: true
      range: uuid
  description: Collection of samples from a Terraform device.
  is_a: SamplingActivity
  slots:
    - collection_time
    - sample_collected
    - sample_collection_method

WaterSamplingActivity:
  attributes:
    id:
      identifier: true
      range: uuid
  description: Collection of water samples.
  is_a: SamplingActivity
  slot_usage:
    sample_collection_dev:
      required: true
    sample_collection_method:
      required: true
  slots:
    - collection_time
    - sample_collected
    - sample_collection_dev
    - sample_collection_method
        range: uuid
    slots:
      - name
      - description
      - alt
      - annual_precpt
      - annual_temp
      - atmospheric_data
      - crop_rotation # modeled as a bool and a string, but users submit as one column
      - cur_land_use
      - cur_vegetation
      - cur_vegetation_meth
      - drainage_class
      - elev
      - env_broad_scale
      - env_local_scale
      - env_medium
      - extreme_event
      - fao_class
      - fire
      - flooding
      - geo_loc_name
      - growth_facil
      - latitude
      - link_climate_info
      - link_class_info
      - local_class
      - local_class_meth
      - longitude
      - neon_site_code
      - neon_plot_id 
      - other_growth_facil
      - previous_land_use
      - previous_land_use_meth
      - profile_position
      - season_precpt
      - season_temp
      - slope_aspect
      - slope_gradient
      - tillage
    slot_usage:
      elev:
        required: true
        todos: should this be required for all sample types though? probably not.
      geo_loc_name:
        required: true
      growth_facil:
        required: true
      latitude: 
        required: true
      longitude:
        required: true
    todos: If we only have one Site class, we can't require Site slots based on sample type. We could add this in the submission schema JSON conversion perhaps.


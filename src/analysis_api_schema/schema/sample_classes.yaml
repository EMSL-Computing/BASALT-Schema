  EngineeredStrainSample:
    description: |-
      A sample containing a strain of an organism that has been subjected to genetic engineering.
      
      This class references a biological_entity for strain identity information (organism_name,
      strain_source, modification_method, genotype_segment_*, component_*, phenotype, trait, etc.)
      and carries only sample-instance-specific slots.
        
    is_a: Sample

    slots:
      # Reference to biological identity (required)
      - biological_entity_ref
      
      # Sample-instance-specific slots
      - cbi
      - storage_condition
      - storage_temperature
      - external_identifiers
      
    attributes:
      id:
        identifier: true
        range: uuid

      cbi:
        required: true
        description: |-
          Controlled Biological Information flag (yes/no).
      storage_condition:
        required: true
        description: |-
          Storage condition for this sample (frozen, fresh, etc.).
          Aliases: samp_store_cond, storage_cond, storage_condt
      storage_temperature:

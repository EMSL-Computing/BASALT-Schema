      C4:
        text: C4
        description: A stationary phase consisting of butyl chains (C4) bonded to
          silica particles.
      C2:
        text: C2
        description: A stationary phase consisting of ethyl chains (C2) bonded to
          silica particles.
      C1:
        text: C1
        description: A stationary phase consisting of methyl chains (C1) bonded to
          silica particles.
      C30:
        text: C30
        description: A stationary phase consisting of triacontyl chains (C30) bonded
          to silica particles.
      C60:
        text: C60
        description: A stationary phase consisting of hexatriacontyl chains (C60)
          bonded to silica particles.
      CNT:
        text: CNT
        description: Carbon Nanotube stationary phase.
      CN:
        text: CN
        description: Cyano (CN) bonded stationary phase.
      Diol:
        text: Diol
        description: A stationary phase with diol (1,2-diol) functional groups.
      HILIC:
        text: HILIC
        description: Hydrophilic Interaction Chromatography (HILIC) stationary phase.
      HLB:
        text: HLB
        description: Hydrophilic-Lipophilic-Balance (HLB) stationary phase.
      NH2:

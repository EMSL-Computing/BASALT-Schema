    definition_uri: https://w3id.org/MONet/basalt-schema/PlateSetupActivity
    description: "Abstract base for 96-well plate setup activities.\nCommon plate-level\
      \ metadata shared across AMP2 and Ecoplate workflows.\nSubclasses differ in\
      \ how they handle well-level metadata and media references.\n\nInput:  processedSample\
      \ (experimental culture, soil extract, etc.)\n        via processingSampleLink\
      \ (role: input_sample)\nOutput: processedSample(type='*_plate') via processingSampleLink\n\
      \nv1 origin: plate-general.yaml PlateSetupActivity"

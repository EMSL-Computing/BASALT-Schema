    abstract: true
    mixins:
    - HasIncubationConditions
    slots:
    - protocol_url
    - protocol_version
    - sampleProcessing__id
    - sampleProcessing__analysis_type
    - sampleProcessing__method_name
    - sampleProcessing__processing_steps

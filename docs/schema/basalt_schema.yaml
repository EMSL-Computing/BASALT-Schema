    description: List of project- or study-level identifiers (e.g., GOLD study ID)
      representing this project.
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    is_a: external_identifiers
    domain: Study
    slot_uri: basalt_schema:external_identifiers
    alias: external_identifiers
    owner: Study
    domain_of:
    - Study
    is_usage_slot: true
    usage_slot_name: external_identifiers
    range: uriorcurie
    multivalued: true
classes:
  Activity:
    name: Activity
    definition_uri: https://w3id.org/MONet/basalt-schema/Activity
    description: Something that happens over time and can use equipment.
    from_schema: https://w3id.org/MONet/basalt-schema
    abstract: true
    slots:
    - name
    - description
    - activity__id
    - activity__ended_at_time
    - activity__processing_institution
    - activity__protocol_link
    - activity__started_at_time
    attributes:
      id:
        name: id
        identifier: true
        range: uuid
      ended_at_time:
        name: ended_at_time
        range: datetime
      processing_institution:
        name: processing_institution
        description: The institution where the activity took place.
        range: InstitutionEnum
      protocol_link:
        name: protocol_link

        name: id
        identifier: true
        range: uuid
        required: true
    class_uri: basalt_schema:DataProduct
  ProcessedData:
    name: ProcessedData
    definition_uri: https://w3id.org/MONet/basalt-schema/ProcessedData
    description: A data product generated by a workflow execution.
    todos:
    - all subclasses need a more specific upstream slot to replace was_generated_by
    from_schema: https://w3id.org/MONet/basalt-schema

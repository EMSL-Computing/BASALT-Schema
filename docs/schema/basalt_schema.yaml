  LabDevice:
    name: LabDevice
    definition_uri: https://w3id.org/MONet/basalt-schema/LabDevice
    description: A lab device is a physical instrument or equipment used in a laboratory
      setting for conducting experiments, measurements, or analyses. It can include
      various types of instruments such as microscopes, spectrometers, centrifuges,
      and other specialized equipment. Lab devices are essential for performing scientific
      research and obtaining accurate data.
    from_schema: https://w3id.org/MONet/basalt-schema
    slots:
    - labDevice__id
    - labDevice__description
    - labDevice__device_type
    - labDevice__activity_time_id
    - labDevice__activity_speed_id
    attributes:
      id:
        name: id
        identifier: true
        range: uuid
      description:
        name: description
        range: string
      device_type:
        name: device_type
        range: DeviceTypeEnum
      activity_time_id:
        name: activity_time_id
        range: QuantityValue
      activity_speed_id:
        name: activity_speed_id
        range: QuantityValue
    class_uri: basalt_schema:LabDevice
  SampleProcessing:
    name: SampleProcessing
    definition_uri: https://w3id.org/MONet/basalt-schema/SampleProcessing
    description: "Abstract base for any sample processing activity (physical to physical).\
      \ Input data should \nbe specified on workflow subclasses."
    todos:
    - why does this have both analysis type and method name, as enums, just set the
      range to the class
    from_schema: https://w3id.org/MONet/basalt-schema
    abstract: true
    slots:
    - protocol_url
    - protocol_version
    - sampleProcessing__id
    - sampleProcessing__analysis_type
    - sampleProcessing__method_name
    - sampleProcessing__processing_steps
    - sampleProcessing__uses_sample
    attributes:
      id:
        name: id
        identifier: true
        range: uuid
      analysis_type:
        name: analysis_type
        range: RouteMethodEnum
      method_name:
        name: method_name
        range: MethodNameEnum
      processing_steps:
        name: processing_steps
        range: string
        required: true
      uses_sample:
        name: uses_sample
        range: Sample
    class_uri: basalt_schema:SampleProcessing
  ProcessingSampleLink:
    name: ProcessingSampleLink
    definition_uri: https://w3id.org/MONet/basalt-schema/ProcessingSampleLink
    description: 'A link between a processed sample and the sample processing activity
      that produced it.

      This class captures the relationship between a processed sample and the sample
      processing

      activity that generated it, including the step number and role of the sample
      in the process.'
    from_schema: https://w3id.org/MONet/basalt-schema
    slots:
    - processingSampleLink__id
    - processingSampleLink__sample_base_id
    - processingSampleLink__processing_id
    - processingSampleLink__step_number
    - processingSampleLink__role
    attributes:
      id:
        name: id
        identifier: true
        range: uuid
      sample_base_id:
        name: sample_base_id
        range: Sample
        required: true
      processing_id:
        name: processing_id
        range: SampleProcessing
        required: true
      step_number:
        name: step_number
        range: integer
        required: true
      role:
        name: role
        range: SampleRole
        required: true
    class_uri: basalt_schema:ProcessingSampleLink
    unique_keys:
      unique_sample_process_step:
        unique_key_name: unique_sample_process_step
        unique_key_slots:
        - sample_base_id
        - processing_id
        - step_number
        - role
  InstrumentCustodian:
    name: InstrumentCustodian
    definition_uri: https://w3id.org/MONet/basalt-schema/InstrumentCustodian
    description: 'A link between an instrument and a custodian (person) responsible
      for it.

      This class captures the relationship between an instrument and the person

      who is responsible for its maintenance, calibration, and proper use.'
    from_schema: https://w3id.org/MONet/basalt-schema

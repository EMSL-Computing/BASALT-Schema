  WellMetadata:
    name: WellMetadata
    definition_uri: https://w3id.org/MONet/basalt-schema/WellMetadata
    description: 'Base structure for per-well metadata in plate setup.

      NOT a standalone database table; embedded structured entries under

      PlateSetupActivity.well_metadata.

      Subclasses add type-specific fields.'
    from_schema: https://w3id.org/MONet/basalt-schema/media-strain-culture-plate
    slots:
    - wellMetadata__position
    - wellMetadata__well_type
    - wellMetadata__replicate_group
    attributes:
      position:
        name: position
        description: Well position (e.g. "A01", "H12")
        range: string
        required: true
      well_type:
        name: well_type
        description: Role of this well   "sample", "blank", "uninoculated_control",
          "standard"
        range: string
      replicate_group:
        name: replicate_group
        description: Identifier linking technical replicates (e.g. "rep1", "rep2")
        range: string
    class_uri: basalt_schema:WellMetadata
  AMP2WellMetadata:
    name: AMP2WellMetadata
    definition_uri: https://w3id.org/MONet/basalt-schema/AMP2WellMetadata
    description: 'AMP2-specific per-well metadata.

      Minimal   media composition comes from the Media entity referenced via

      the activity''s media_ref slot.  Per-well data is volumes and replicate info.'
    from_schema: https://w3id.org/MONet/basalt-schema/media-strain-culture-plate
    is_a: WellMetadata
    slots:
    - wellMetadata__position
    - wellMetadata__well_type
    - wellMetadata__replicate_group
    - aMP2WellMetadata__media_ref
    - aMP2WellMetadata__media_volume_ul
    - aMP2WellMetadata__inoculum_volume_ul
    - aMP2WellMetadata__sample_id
    - aMP2WellMetadata__treatments
    attributes:
      media_ref:
        name: media_ref
        description: 'FK to the prepared media processedSample used in this well.

          NULL -> fall back to plate-level AMP2PlateSetupActivity.media_ref.

          Non-null -> this well uses a different media batch.'
        range: ProcessedSample
        required: false
      media_volume_ul:
        name: media_volume_ul
        description: Volume of media added to this well (microlitres)
        range: float
        required: true
      inoculum_volume_ul:
        name: inoculum_volume_ul
        description: Volume of inoculum added (0 for blanks)
        range: float
        required: true
      sample_id:
        name: sample_id
        description: 'Optional FK to the specific sample in this well, if wells contain

          different samples.  NULL if all wells use the same inoculum.'
        range: string
      treatments:
        name: treatments
        description: 'Per-well treatments if applicable (e.g. different mineral concentrations).

          NULL for uniform-treatment plates.'
        range: string
        multivalued: true
    class_uri: basalt_schema:AMP2WellMetadata
  EcoplateWellMetadata:
    name: EcoplateWellMetadata
    definition_uri: https://w3id.org/MONet/basalt-schema/EcoplateWellMetadata
    description: 'Ecoplate-specific per-well metadata.

      Rich   no media entity; carbon source and treatment are per-well

      experimental design variables.


      v1 origin: plate-general.yaml EcoplateWellMetadata'
    from_schema: https://w3id.org/MONet/basalt-schema/media-strain-culture-plate
    is_a: WellMetadata
    slots:
    - wellMetadata__position
    - wellMetadata__well_type
    - wellMetadata__replicate_group
    - ecoplateWellMetadata__media_volume_ul
    - ecoplateWellMetadata__carbon_source
    - ecoplateWellMetadata__treatment
    - ecoplateWellMetadata__treatment_concentration
    attributes:
      media_volume_ul:
        name: media_volume_ul
        description: Volume of inoculum suspension added (microlitres)
        range: float
        required: true
      carbon_source:
        name: carbon_source
        description: Carbon source in this well (e.g. "L-malic acid", "glucose")
        range: string
        required: true
      treatment:
        name: treatment
        description: Experimental treatment (e.g. "control", "nickel_1pct")
        range: string
      treatment_concentration:
        name: treatment_concentration
        description: Treatment concentration with unit (e.g. "1.0 pct", "10 mM")
        range: string
    class_uri: basalt_schema:EcoplateWellMetadata
  WellReading:
    name: WellReading
    definition_uri: https://w3id.org/MONet/basalt-schema/WellReading
    description: 'Per-well measurement data. NOT a standalone database table; embedded
      structured entries under

      PlateProduct.well_readings.'
    todos:
    - add optical_density_method here to flag what value means if we have multiple

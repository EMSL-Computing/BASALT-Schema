  XRayDataProduct:
    name: XRayDataProduct
    definition_uri: https://w3id.org/MONet/basalt-schema/XRayDataProduct
    description: "Abstract base class for X-ray analytical data products.\nInherits\
      \ S3 storage metadata and sample linkage from dataProduct via ProcessedData.\n\
      \nConcrete subclasses:\n  - XRFElementalProduct: elemental concentrations (one\
      \ row per sample)\n  - XRDPhaseProduct: mineral phases (one row per sample)\n\
      \nCommon patterns:\n  - s3_key points to raw spectrum/diffractogram file in\
      \ MinIO\n  - summary_metrics provides lightweight queryable summaries:\n   \
      \   XRF: {\"Ni_mg_kg\":45.3, \"Pb_mg_kg\":8.2, \"As_mg_kg\":12.1}\n      XRD:\
      \ {\"quartz_percent\":42, \"albite_percent\":18, \"kaolinite_percent\":31}\n\
      \  - workflow_id is NULL for direct instrument output (XRF typical)\n  - workflow_id\
      \ links to DataProcessingActivity for computational processing (XRD Rietveld) "

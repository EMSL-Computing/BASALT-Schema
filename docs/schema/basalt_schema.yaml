slots:
  acquisition_strategy:
    name: acquisition_strategy
    definition_uri: https://w3id.org/MONet/basalt-schema/acquisition_strategy
    description: The acquisition strategy used in the mass spectrometry run.
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:acquisition_strategy
    owner: MassSpectrometryConfiguration
    domain_of:
    - MassSpectrometryConfiguration
    range: MassSpectrometryAcquisitionStrategyEnum
  additional_information:
    name: additional_information
    definition_uri: https://w3id.org/MONet/basalt-schema/additional_information
    description: Additional information pertaining to these data, including SP Project
      ID and Taxon OID
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:additional_information
    owner: MetagenomicsProduct
    domain_of:
    - MetagenomicsProduct
    range: string
  aerosol_type:
    name: aerosol_type
    definition_uri: https://w3id.org/MONet/basalt-schema/aerosol_type
    description: The type or method of aerosol collection
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:aerosol_type
    owner: AerosolSample
    domain_of:
    - AerosolArmSample
    - AerosolSample
    range: AerosolTypeEnum
    required: true
  agitation_speed_rpm:
    name: agitation_speed_rpm
    definition_uri: https://w3id.org/MONet/basalt-schema/agitation_speed_rpm
    description: Agitation/shaking speed in RPM (0 for static)
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:agitation_speed_rpm
    owner: HasIncubationConditions
    domain_of:
    - HasIncubationConditions
    range: integer
  agrochem_addition:
    name: agrochem_addition
    definition_uri: https://w3id.org/MONet/basalt-schema/agrochem_addition
    description: Addition of fertilizers, pesticides, etc. - amount and time of applications
    title: agrochemical additions
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:agrochem_addition
    owner: SoilSample
    domain_of:
    - MonetSoilSample
    - OtherUndescribedSample
    - SoilSample
    range: string
  air_temp_regm:
    name: air_temp_regm
    definition_uri: https://w3id.org/MONet/basalt-schema/air_temp_regm
    description: Information about treatment involving an exposure to varying temperatures;
      should include the temperature, treatment regimen including how many times the
      treatment was repeated, how long each treatment lasted, and the start and end
      time of the entire treatment; can include different temperature regimens
    title: air temperature regimen
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    exact_mappings:
    - MIXS:0000551
    slot_uri: basalt_schema:air_temp_regm
    owner: WaterSample
    domain_of:
    - AerosolArmSample
    - AerosolSample
    - CultureEnvironmentalSample
    - FieldDeployedTerraformSample
    - MixedCultureSample
    - OtherUndescribedSample
    - PlantSample
    - PureCultureSample
    - SedimentSample
    - SoilSample
    - TerraformSample
    - WaterSample
    range: string
  al_sat:
    name: al_sat
    definition_uri: https://w3id.org/MONet/basalt-schema/al_sat
    description: Aluminum saturation (esp. For tropical soils)
    title: aluminum saturation
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:al_sat
    owner: SoilSample
    domain_of:
    - OtherUndescribedSample
    - SoilSample
    range: string
  al_sat_meth:
    name: al_sat_meth
    definition_uri: https://w3id.org/MONet/basalt-schema/al_sat_meth
    description: Reference or method used in determining Al saturation
    title: aluminum saturation method
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:al_sat_meth
    owner: SoilSample
    domain_of:
    - OtherUndescribedSample
    - SoilSample
    range: string
  alkalinity:
    name: alkalinity
    definition_uri: https://w3id.org/MONet/basalt-schema/alkalinity
    description: 'The ability of a solution to neutralize acids to the equivalence
      point of carbonate or bicarbonate (Unit: mg/L or meq/L)'
    title: alkalinity
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:alkalinity
    owner: WaterSample
    domain_of:
    - OtherUndescribedSample
    - SedimentSample
    - WaterSample
    range: string
    pattern: ^\d+(\.\d+)?\s*(mg|meq)/L$
  alkalinity_method:
    name: alkalinity_method
    definition_uri: https://w3id.org/MONet/basalt-schema/alkalinity_method
    description: Method used for alkalinity measurement
    title: alkalinity method
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:alkalinity_method
    owner: WaterSample
    domain_of:
    - OtherUndescribedSample
    - SedimentSample
    - WaterSample
    range: string
  alkyl_diethers:
    name: alkyl_diethers
    definition_uri: https://w3id.org/MONet/basalt-schema/alkyl_diethers
    description: Concentration of alkyl diethers. Provide value and unit, any unit
      is valid
    title: alkyl diethers
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:alkyl_diethers
    owner: WaterSample
    domain_of:
    - OtherUndescribedSample
    - SedimentSample
    - WaterSample
    range: string
    pattern: ^\d+(\.\d+)?\s*[\w\s/]+$
  alt:
    name: alt
    definition_uri: https://w3id.org/MONet/basalt-schema/alt
    description: 'Heights of objects such as airplanes, space shuttles, rockets, atmospheric
      balloons and heights of places such as atmospheric layers and clouds. It is
      used to measure the height of an object which is above the earth''s surface.
      In this context, the altitude measurement is the vertical distance between the
      earth''s surface above sea level and the sampled position in the air. For ARM
      this can be a range. (Unit: m)'
    title: altitude
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:alt
    owner: Site
    domain_of:
    - Site
    range: string
    pattern: ^\d+(\.\d+)?m(?:-\d+(\.\d+)?m)?$
  aminopept_act:
    name: aminopept_act
    definition_uri: https://w3id.org/MONet/basalt-schema/aminopept_act
    description: 'Measurement of aminopeptidase activity (Unit: mol/L/h)'
    title: aminopeptidase activity
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:aminopept_act
    owner: WaterSample
    domain_of:
    - OtherUndescribedSample
    - SedimentSample
    - WaterSample
    range: string
    pattern: ^\d+(\.\d+)?\s*mol/L/h$
  ammonium:
    name: ammonium
    definition_uri: https://w3id.org/MONet/basalt-schema/ammonium
    description: 'Concentration of ammonium in the sample. (Units: umol/L or mg/Liter
      or ppm)'
    title: ammonium
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:ammonium
    owner: WaterSample
    domain_of:
    - OtherUndescribedSample
    - SedimentSample

    - name
    - description
    - protocol_url
    - protocol_version
    - dataGenerationActivity__id
    - dataGenerationActivity__analyte_id
    - dataGenerationActivity__acquisition_start_time
    - dataGenerationActivity__acquisition_end_time
    - dataGenerationActivity__instrument_used
    - dataGenerationActivity__instrument_operator_id

    name: MonetSoilSample
    definition_uri: https://w3id.org/MONet/basalt-schema/MonetSoilSample
    description: A soil sample that has been collected according to the MONet soil
      sampling protocol. This sample type has specific slot requirements related to
      the MONet soil sampling method, such as infiltration rates.
    from_schema: https://w3id.org/MONet/basalt-schema/sample-classes
    is_a: Sample
    slots:
    - name
    - description
    - emsl_activity
    - lims_barcode
    - agrochem_addition
    - MonetSoilSample_bulk_elect_conductivity
    - chem_administration
    - core_group
    - MonetSoilSample_depth
    - env_broad_scale
    - env_local_scale
    - env_medium
    - external_identifiers
    - MonetSoilSample_latitude
    - MonetSoilSample_longitude
    - lims_id
    - misc_param
    - other
    - other_samp_store_temp
    - other_storage_condt
    - other_treatment
    - project
    - sample_name
    - samp_store_temp
    - sampled_during
    - MonetSoilSample_sampling_set
    - MonetSoilSample_soil_sample_type
    - MonetSoilSample_soil_type
    - MonetSoilSample_soil_type_meth
    - storage_condition
    - storage_condition_other
    - MonetSoilSample_temp
    - MonetSoilSample_water_content
    - water_content_meth
    - watering_regm
    - monetSoilSample__id
    slot_usage:
      bulk_elect_conductivity:
        name: bulk_elect_conductivity
        description: 'Provide the bulk electrical conductivity readout from the Teros
          ZSC bluetooth sensor. If measurement was started and unsuccessful enter
          ''failed'' if measurement was not attempted enter ''did not collect''. (Unit:
          mS/cm)'
        required: true
        pattern: ^\d+(\.\d+)?\s*mS/cm|did not collect|failed
      depth:
        name: depth
        description: 'The vertical distance below local surface. For sediment or soil
          samples, depth is measured from sediment or soil surface respectively. Depth
          is required to be reported as an interval for subsurface samples. (Units:
          cm or m)'
        required: true
        pattern: ^\d+(\.\d+)?-\d+(\.\d+)?\s*(m|cm)$
      latitude:
        name: latitude
        required: true
      longitude:
        name: longitude
        required: true
      sampling_set:
        name: sampling_set
        required: true
      soil_sample_type:
        name: soil_sample_type
        required: true
      soil_type:
        name: soil_type
        required: true
      soil_type_meth:
        name: soil_type_meth
        required: true
      temp:
        name: temp
        description: 'Temperature of the sample at the time of sampling. If measurement
          was started and unsuccessful enter ''failed'' if measurement was not attempted
          enter ''did not collect''. (Units: C)'
        required: true
        pattern: ^-?\d+(\.\d+)?\s*C|did not collect|failed
      water_content:
        name: water_content
        description: Water content measurement. This will be a readout from the Teros
          ZSC bluetooth sensor and requires a unit of 'm3/m3'. If measurement was
          started and unsuccessful enter 'failed' if measurement was not attempted
          enter 'did not collect'.
        required: true
        pattern: ^\d+(\.\d+)?\s*m3/m3|did not collect|failed
    attributes:
      id:
        name: id
        identifier: true
        range: uuid
    class_uri: basalt_schema:MonetSoilSample

    - study__funding_sources
    slot_usage:
      external_identifiers:
        name: external_identifiers
        description: List of project- or study-level identifiers (e.g., GOLD study
          ID) representing this project.
    attributes:
      id:
        name: id
        identifier: true
        range: uuid
      project_id:
        name: project_id
        range: integer
        required: true
      title:
        name: title
        description: The title of the study/proposal.
        range: string
      name:
        name: name
        description: Short name or code for the study.
        range: string
        required: true
      proposal_abstract:
        name: proposal_abstract
        description: The abstract submitted with the research proposal.
        range: string
      description:
        name: description
        description: study objectives and scope
        range: string
      has_participants:
        name: has_participants
        description: Links to a record of a person and their roles for this study.
        range: ProjectParticipant
        multivalued: true
      principal_investigator:
        name: principal_investigator
        range: PersonValue
        required: true
      collaborating_institution:
        name: collaborating_institution
        range: string
      project_status:
        name: project_status
        range: ProjectStatusEnum
      project_start:
        name: project_start
        range: datetime
      project_end:
        name: project_end
        range: datetime
      associated_dois:
        name: associated_dois
        description: A list of DOIs associated with this study
        range: DOI
        multivalued: true
      funding_sources:
        name: funding_sources
        range: DOI
        multivalued: true
    class_uri: basalt_schema:Study

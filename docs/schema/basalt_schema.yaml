    definition_uri: https://w3id.org/MONet/basalt-schema/root_med_solid
    description: Specification of the solidifying agent in the culture rooting medium.
    title: rooting medium solidifier
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:root_med_solid
    owner: PlantSample
    domain_of:
    - PlantSample
    range: string
  root_med_suppl:
    name: root_med_suppl
    definition_uri: https://w3id.org/MONet/basalt-schema/root_med_suppl
    description: Organic supplements of the culture rooting medium such as vitamins,
      amino acids, organic acids, antibiotics, activated charcoal. Can be multivalued
      separated by ;. e.g. nicotinic acid 0.5 mg/L
    title: rooting medium organic supplement
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:root_med_suppl
    owner: PlantSample
    domain_of:
    - PlantSample
    range: string
  s3_base_url:
    name: s3_base_url
    definition_uri: https://w3id.org/MONet/basalt-schema/s3_base_url
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:s3_base_url
    owner: DataProduct
    domain_of:
    - DataProduct
    range: string
  s3_bucket:
    name: s3_bucket
    definition_uri: https://w3id.org/MONet/basalt-schema/s3_bucket
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:s3_bucket
    owner: DataProduct
    domain_of:
    - DataProduct
    range: string
  s3_key:
    name: s3_key
    definition_uri: https://w3id.org/MONet/basalt-schema/s3_key
    description: MinIO/S3 object key; required for all data products
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:s3_key
    owner: DataProduct
    domain_of:
    - DataProduct
    range: string
    required: true
  salinity:
    name: salinity
    definition_uri: https://w3id.org/MONet/basalt-schema/salinity
    description: 'Salinity is the total concentration of all dissolved salts in a
      sample. While salinity can be measured by a complete chemical analysis, this
      method is difficult and time consuming. More often it is instead derived from
      the conductivity measurement. This is known as practical salinity. These derivations
      compare the specific conductance of the sample to a salinity standard such as
      seawater (Unit: practical salinity unit or percent)'
    title: salinity
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:salinity
    owner: WaterSample
    domain_of:
    - OtherUndescribedSample
    - PlantSample
    - SedimentSample
    - SoilSample
    - WaterSample
    range: string
    pattern: ^\d+(\.\d+)?\s*(practical salinity unit|percent)$
  salinity_method:
    name: salinity_method
    definition_uri: https://w3id.org/MONet/basalt-schema/salinity_method
    description: Method used to determine sample salinity
    title: salinity method
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:salinity_method
    owner: WaterSample
    domain_of:
    - OtherUndescribedSample
    - PlantSample
    - SedimentSample
    - SoilSample
    - WaterSample
    range: string
  salt_regm:
    name: salt_regm
    definition_uri: https://w3id.org/MONet/basalt-schema/salt_regm
    description: Information about treatment involving use of salts as supplement
      to liquid and soil growth media; should include the name of salt, amount administered,
      treatment regimen including how many times the treatment was repeated, how long
      each treatment lasted, and the start and end time of the entire treatment; can
      include multiple salt regimens.
    title: salt regimen
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:salt_regm
    owner: TerraformSample
    domain_of:
    - FieldDeployedTerraformSample
    - OtherUndescribedSample
    - PlantSample
    - TerraformSample
    range: string
  samp_capt_status:
    name: samp_capt_status
    definition_uri: https://w3id.org/MONet/basalt-schema/samp_capt_status
    description: Reason for the sample
    title: sample capture status
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:samp_capt_status
    owner: OtherUndescribedSample
    domain_of:
    - OtherUndescribedSample
    range: string
  samp_dis_stage:
    name: samp_dis_stage
    definition_uri: https://w3id.org/MONet/basalt-schema/samp_dis_stage
    description: Stage of the disease at the time of sample collection e.g. inoculation,
      penetration, infection, growth and reproduction, dissemination of pathogen.
    title: sample disease stage
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:samp_dis_stage
    owner: OtherUndescribedSample
    domain_of:
    - OtherUndescribedSample
    range: string
  samp_store_temp:
    name: samp_store_temp
    definition_uri: https://w3id.org/MONet/basalt-schema/samp_store_temp
    description: The temperature at which your samples should be stored upon arrival.
      This field is NOT multivalued. If selecting other add the `other_samp_store_temp`
      attribute to provide additional detail.
    title: sample storage temperature
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    aliases:
    - sample_storage_temperature
    - storage_temperature
    slot_uri: basalt_schema:samp_store_temp
    owner: WaterSample
    domain_of:
    - AerosolArmSample
    - AerosolSample
    - CommerciallyPurchasedSample
    - CultureEnvironmentalSample
    - FieldDeployedTerraformSample
    - MixedCultureSample
    - MonetSoilSample
    - OtherUndescribedSample
    - PlantSample
    - PureCultureSample
    - SedimentSample
    - SoilSample
    - SynthesizedMaterialSample
    - TerraformSample
    - WaterSample
    range: SampleStoreTempEnum
  sample_collected:
    name: sample_collected
    definition_uri: https://w3id.org/MONet/basalt-schema/sample_collected
    description: This refers to the TOTAL amount of sample collected from the experiment.
      NOT the amount sent to EMSL or collected for a specific analysis. Provide value
      and unit, any unit is valid
    title: sample collected
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:sample_collected
    owner: WaterSamplingActivity
    domain_of:
    - AerosolSamplingActivity
    - CommerciallyPurchasedSamplingActivity
    - CultureEnvironmentalSamplingActivity
    - FieldDeployedTerraformSamplingActivity
    - MixedCultureSamplingActivity
    - OtherUndescribedSamplingActivity
    - PlantSamplingActivity
    - PureCultureSamplingActivity
    - SedimentSamplingActivity
    - SoilSamplingActivity
    - SynthesizedMaterialSamplingActivity
    - TerraformSamplingActivity
    - WaterSamplingActivity
    range: string
    pattern: ^\d+(\.\d+)?\s*[\w\s/]+$
  sample_collection_dev:
    name: sample_collection_dev
    definition_uri: https://w3id.org/MONet/basalt-schema/sample_collection_dev
    description: The device used to collect an environmental sample. Include dimensions
      of device if applicable
    title: sample collection device
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:sample_collection_dev
    owner: WaterSamplingActivity
    domain_of:
    - AerosolSamplingActivity
    - CommerciallyPurchasedSamplingActivity
    - CultureEnvironmentalSamplingActivity
    - MixedCultureSamplingActivity
    - MonetSoilSamplingActivity
    - OtherUndescribedSamplingActivity
    - PlantSamplingActivity
    - PureCultureSamplingActivity
    - SedimentSamplingActivity
    - SoilSamplingActivity
    - SynthesizedMaterialSamplingActivity
    - WaterSamplingActivity
    range: string
  sample_collection_method:
    name: sample_collection_method
    definition_uri: https://w3id.org/MONet/basalt-schema/sample_collection_method
    description: The method used to collect an environmental sample. This can be a
      citation or description.
    title: sample collection method
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:sample_collection_method
    owner: WaterSamplingActivity
    domain_of:
    - CultureEnvironmentalSamplingActivity
    - FieldDeployedTerraformSamplingActivity
    - MixedCultureSamplingActivity
    - OtherUndescribedSamplingActivity
    - PlantSamplingActivity
    - PureCultureSamplingActivity
    - SedimentSamplingActivity
    - SoilSamplingActivity
    - TerraformSamplingActivity
    - WaterSamplingActivity
    range: string
  sample_end_time:
    name: sample_end_time
    definition_uri: https://w3id.org/MONet/basalt-schema/sample_end_time
    description: 'Time of when the sample collection ends. Required format: HH:MM:SS
      in 24-hour time format. Don''t forget the seconds! (Unit: hh:mm:ss or HH:MM:SS)'
    title: sample end time
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:sample_end_time
    range: string
    pattern: ^[12]\d{3}(?:(?:-(?:0[1-9]|1[0-2]))(?:-(?:0[1-9]|[12]\d|3[01]))?)?$
  sample_id:
    name: sample_id
    definition_uri: https://w3id.org/MONet/basalt-schema/sample_id
    description: Link back to the originating sample
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:sample_id
    owner: MetagenomicsProduct
    domain_of:
    - ProcessedData
    - MetagenomicsProduct
    range: Sample
    required: false
  sample_link:
    name: sample_link
    definition_uri: https://w3id.org/MONet/basalt-schema/sample_link
    description: '''A unique identifier to assign parent-child subsample or sibling
      samples. This is relevant when a sample or other material was used to generate
      the new sample. This field allows multiple entries separated by ; (Examples:
      Soil collected from the field will link with the soil used in an incubation.
      The soil a plant was grown in links to the plant sample. An original culture
      sample was transferred to a new vial and generated a new sample)'''
    todos:
    - EMSL and NMDC both need better modelling for this
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:sample_link
    owner: WaterSample
    domain_of:
    - AerosolArmSample
    - AerosolSample
    - CommerciallyPurchasedSample
    - CultureEnvironmentalSample
    - FieldDeployedTerraformSample
    - MixedCultureSample
    - OtherUndescribedSample
    - PlantSample
    - PureCultureSample
    - SedimentSample
    - SoilSample
    - SynthesizedMaterialSample
    - TerraformSample
    - WaterSample
    range: string
  sample_name:
    name: sample_name
    definition_uri: https://w3id.org/MONet/basalt-schema/sample_name
    description: 'The name or label that is present on the shipped sample. This should

      be a human readable name.'
    title: sample name
    notes:
    - This is typically an alias for the inherited 'name' slot on Sample classes.
      Defined separately for compatibility with source data files using 'sample_name'
      column headers.
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    aliases:
    - samp_name
    slot_uri: basalt_schema:sample_name
    owner: WaterSample
    domain_of:
    - DataProduct
    - AerosolArmSample
    - AerosolSample
    - CommerciallyPurchasedSample
    - CultureEnvironmentalSample
    - FieldDeployedTerraformSample
    - MixedCultureSample
    - MonetSoilSample
    - OtherUndescribedSample
    - PlantSample
    - PureCultureSample
    - SedimentSample
    - SoilSample
    - SynthesizedMaterialSample
    - TerraformSample
    - WaterSample
    range: string
  sample_processing:
    name: sample_processing
    definition_uri: https://w3id.org/MONet/basalt-schema/sample_processing
    description: A brief description of any processing applied to the sample during
      or after retrieving the sample from environment or a link to the relevant protocol(s)
      performed.
    title: sample processing
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:sample_processing
    owner: TerraformSample
    domain_of:
    - AerosolArmSample
    - AerosolSample
    - CommerciallyPurchasedSample
    - CultureEnvironmentalSample
    - FieldDeployedTerraformSample
    - MixedCultureSample
    - OtherUndescribedSample
    - PlantSample
    - PureCultureSample
    - SedimentSample
    - SoilSample
    - SynthesizedMaterialSample
    - TerraformSample
    range: string
  sample_start_time:
    name: sample_start_time
    definition_uri: https://w3id.org/MONet/basalt-schema/sample_start_time
    description: 'Time of when the sample collection starts. Required format: HH:MM:SS
      in 24-hour time format. Don''t forget the seconds! (Unit: hh:mm:ss or HH:MM:SS)'
    title: sample start time
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:sample_start_time
    range: string
    pattern: ^(0[0-9]|1[0-9]|2[0-3]):([0-5][0-9]):([0-5][0-9])\s*(hh:mm:ss|HH:MM:SS)$
  sample_type:
    name: sample_type
    definition_uri: https://w3id.org/MONet/basalt-schema/sample_type
    description: 'Requires a standardized ontology term to describe what your sample
      is. Please search for your sample type via Ontology Lookup Sevice at https://www.ebi.ac.uk/ols4/ '
    title: sample type
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:sample_type
    owner: OtherUndescribedSample
    domain_of:
    - OtherUndescribedSample
    range: string
    pattern: ^_*\s*[a-zA-Z\-]+\s\[[a-zA-Z]+:\d+\]$
  sampled_at_site:
    name: sampled_at_site
    definition_uri: https://w3id.org/MONet/basalt-schema/sampled_at_site
    description: Reference to the site where the sample was collected. This is a FK
      to the Site class, which contains detailed metadata about the sampling location.
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:sampled_at_site
    owner: SamplingActivity
    domain_of:
    - SamplingActivity
    range: Site
  sampled_during:
    name: sampled_during
    definition_uri: https://w3id.org/MONet/basalt-schema/sampled_during
    description: Reference to the sampling activity during which this sample was collected.
      This is a FK to the SamplingActivity class, which contains metadata about the
      sampling event, such as date, device, method.
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:sampled_during
    owner: ProcessedSample
    domain_of:
    - AerosolArmSample
    - AerosolSample
    - CommerciallyPurchasedSample
    - CultureEnvironmentalSample
    - FieldDeployedTerraformSample
    - MixedCultureSample
    - MonetSoilSample
    - OtherUndescribedSample
    - PlantSample
    - PureCultureSample
    - SedimentSample
    - SoilSample
    - SynthesizedMaterialSample
    - TerraformSample
    - WaterSample
    - ProcessedSample
    range: SamplingActivity
  sampled_portion:
    name: sampled_portion
    definition_uri: https://w3id.org/MONet/basalt-schema/sampled_portion
    description: The portion of the original sample used in creating this processed
      sample (e.g., "interlayer", "supernatant", "pellet").
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:sampled_portion
    owner: ProcessedSample
    domain_of:
    - ProcessedSample
    range: SamplePortionEnum
  sampling_duration:
    name: sampling_duration
    definition_uri: https://w3id.org/MONet/basalt-schema/sampling_duration
    description: 'The difference between sample start and sample end time in seconds.
      (Unit: s)'
    title: sampling duration
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:sampling_duration
    owner: OtherUndescribedSamplingActivity
    domain_of:
    - AerosolSamplingActivity
    - OtherUndescribedSamplingActivity
    range: string
    pattern: ^\d+(\.\d+)?\s*s$
  sampling_set:
    name: sampling_set
    definition_uri: https://w3id.org/MONet/basalt-schema/sampling_set
    description: 'Sampling set number for grouping related samples collected together.

      This is a user-defined sequential integer that can be used to link samples collected

      in the same sampling event or campaign.'
    title: sampling set
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:sampling_set
    owner: MonetSoilSample
    domain_of:
    - DataProduct
    - MonetSoilSample
    range: integer
  sealing_method:
    name: sealing_method
    definition_uri: https://w3id.org/MONet/basalt-schema/sealing_method
    description: How the plate is sealed (e.g. "BreathEasy_membrane", "adhesive_film")
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:sealing_method
    owner: PlateSetupActivity
    domain_of:
    - PlateSetupActivity
    range: string
  season_environment:
    name: season_environment
    definition_uri: https://w3id.org/MONet/basalt-schema/season_environment
    description: Treatment involving an exposure to a particular season (e.g. Winter,
      summer, rabi, rainy etc.) treatment regimen including how many times the treatment
      was repeated how long each treatment lasted and the start and end time of the
      entire treatment
    title: season environment
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:season_environment
    owner: OtherUndescribedSample
    domain_of:
    - OtherUndescribedSample
    range: string
  season_precpt:
    name: season_precpt
    definition_uri: https://w3id.org/MONet/basalt-schema/season_precpt
    description: 'The average of all seasonal precipitation values known or an estimated
      equivalent value derived by such methods as regional indexes or Isohyetal maps.
      (Unit: mm)'
    title: mean seasonal precipitation
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    aliases:
    - average seasonal precipitation
    slot_uri: basalt_schema:season_precpt
    owner: Site
    domain_of:
    - Site
    range: string
    pattern: ^\d+(\.\d+)?\s*mm$
  season_temp:
    name: season_temp
    definition_uri: https://w3id.org/MONet/basalt-schema/season_temp
    description: 'Mean seasonal temperature (Unit: C)'
    title: mean seasonal temperature
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    aliases:
    - average seasonal precipitation
    slot_uri: basalt_schema:season_temp
    owner: Site
    domain_of:
    - Site
    range: string
    pattern: ^-?\d+(\.\d+)?\s*C$
  second_blh:
    name: second_blh
    definition_uri: https://w3id.org/MONet/basalt-schema/second_blh
    description: 'Second boundary layer height candidate (meters) (Unit: m)'
    title: second boundary layer height
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:second_blh
    owner: AerosolArmSample
    domain_of:
    - AerosolArmSample
    range: float
  second_blh_quality:
    name: second_blh_quality
    definition_uri: https://w3id.org/MONet/basalt-schema/second_blh_quality
    description: Quality index for second boundary layer height candidate (-999 if
      no candidate)
    title: second boundary layer height quality
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:second_blh_quality
    owner: AerosolArmSample
    domain_of:
    - AerosolArmSample
    range: string
  second_cbh:
    name: second_cbh
    definition_uri: https://w3id.org/MONet/basalt-schema/second_cbh
    description: 'Second cloud base (meters) or highest received signal in vertical
      visibility (meters) (-999 if no cloud base or vertical visibility) (Unit: m)'
    title: second cloud base height
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:second_cbh
    owner: AerosolArmSample
    domain_of:
    - AerosolArmSample
    range: float
  secondary_treatment:
    name: secondary_treatment
    definition_uri: https://w3id.org/MONet/basalt-schema/secondary_treatment
    description: the process for substantially degrading the biological content of
      the sewage
    title: secondary treatment
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:secondary_treatment
    owner: OtherUndescribedSample
    domain_of:
    - OtherUndescribedSample
    range: string
  sediment_type:
    name: sediment_type
    definition_uri: https://w3id.org/MONet/basalt-schema/sediment_type
    description: Information about the sediment type based on major constituents
    title: sediment type
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:sediment_type
    owner: SedimentSample
    domain_of:
    - SedimentSample
    range: SedimentTypeEnum
  sequence_order:
    name: sequence_order
    definition_uri: https://w3id.org/MONet/basalt-schema/sequence_order
    description: "Integer ordering within a temporal series for the same analyte.\n\
      Lower = earlier in series. Use when acquisition_time alone is insufficient.\n\
      \nDDL: ALTER TABLE \"DataGenerationActivity\"\n       ADD COLUMN sequence_order\
      \ INTEGER;"
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:sequence_order
    owner: DataGenerationActivity
    domain_of:
    - DataGenerationActivity
    range: integer
    required: false
  setup_date:
    name: setup_date
    definition_uri: https://w3id.org/MONet/basalt-schema/setup_date
    description: When the plate was physically set up
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:setup_date
    owner: PlateSetupActivity
    domain_of:
    - PlateSetupActivity
    range: datetime
    required: true
  setup_instrument:
    name: setup_instrument
    definition_uri: https://w3id.org/MONet/basalt-schema/setup_instrument
    description: Automated liquid handler (e.g. "Hamilton_STAR") or "manual"
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:setup_instrument
    owner: PlateSetupActivity
    domain_of:
    - PlateSetupActivity
    range: string
  setup_operator_id:
    name: setup_operator_id
    definition_uri: https://w3id.org/MONet/basalt-schema/setup_operator_id
    description: Person who set up the plate
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:setup_operator_id
    owner: PlateSetupActivity
    domain_of:
    - PlateSetupActivity
    range: PersonValue
  sewage_type:
    name: sewage_type
    definition_uri: https://w3id.org/MONet/basalt-schema/sewage_type
    description: type of wastewater treatment plant as municipial or industrial
    title: sewage type
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:sewage_type
    owner: OtherUndescribedSample
    domain_of:
    - OtherUndescribedSample
    range: string
  shipped_sample_size:
    name: shipped_sample_size
    definition_uri: https://w3id.org/MONet/basalt-schema/shipped_sample_size
    description: Total amount of sample sent to EMSL. Must include units.
    title: shipped sample size
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:shipped_sample_size
    owner: SamplingActivity
    domain_of:
    - AMP2UserSample
    - SamplingActivity
    range: string
    pattern: ^\d+(\.\d+)?\s*[\w\s/]+$
  sieving:
    name: sieving
    definition_uri: https://w3id.org/MONet/basalt-schema/sieving
    description: Collection design of pooled samples and/or sieve size and amount
      of sample sieved
    title: sieving
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:sieving
    owner: SoilSample
    domain_of:
    - OtherUndescribedSample
    - SedimentSample
    - SoilSample
    range: string
  silicate:
    name: silicate
    definition_uri: https://w3id.org/MONet/basalt-schema/silicate
    description: 'Concentration of silicate (Unit: umol/L)'
    title: silicate
    from_schema: https://w3id.org/MONet/basalt-schema/slots
    slot_uri: basalt_schema:silicate
    owner: WaterSample
    domain_of:
    - OtherUndescribedSample
    - SedimentSample
    - WaterSample
    range: string
    pattern: ^\d+(\.\d+)?\s*umol/L$
  size_frac_low:
    name: size_frac_low
    definition_uri: https://w3id.org/MONet/basalt-schema/size_frac_low

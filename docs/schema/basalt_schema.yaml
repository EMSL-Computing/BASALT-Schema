  Instrument:
    name: Instrument
    definition_uri: https://w3id.org/MONet/basalt-schema/Instrument
    description: "A material entity that is designed to perform a function in a scientific\
      \ \ninvestigation, but is not a reagent. This class models a specific\ninstance\
      \ of an instrument IF identifying information is filled out, \notherwise, it\
      \ is a generic standin for an instrument model."
    from_schema: https://w3id.org/MONet/basalt-schema
    slots:
    - instrument__id
    - instrument__name
    - instrument__vendor
    - instrument__model
    - instrument__serial_number
    - instrument__lims_resource_id
    - instrument__location
    - instrument__maintenance
    - instrument__alternative_names
    - instrument__instrument_parameters
    - instrument__mass_analyzer_type
    - instrument__other_properties
    attributes:
      id:
        name: id
        identifier: true
        range: uuid
      name:
        name: name
        range: string
        required: true
      vendor:
        name: vendor
        range: VendorEnum
      model:
        name: model
        range: ModelEnum
      serial_number:
        name: serial_number
        description: instrument instance specifier
        range: string
      lims_resource_id:
        name: lims_resource_id
        description: L7 resource_id for the instrument, if known.
        range: integer
      location:
        name: location
        range: string
      maintenance:
        name: maintenance
        description: Maintenance notes or directions to a maintenance log.
        range: string
      alternative_names:
        name: alternative_names
        range: string
      instrument_parameters:
        name: instrument_parameters
        range: string
      mass_analyzer_type:
        name: mass_analyzer_type
        description: The type of mass analyzer present in the instrument, if applicable
          (e.g., Orbitrap, Time-of-Flight, Quadrupole).
        range: MassAnalyzerEnum
      other_properties:
        name: other_properties
        description: Other important properties of the instrument that are not captured
          in other fields.
        range: string
    class_uri: basalt_schema:Instrument

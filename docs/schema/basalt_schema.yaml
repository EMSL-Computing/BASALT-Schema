    name: XRFElementalProduct
    definition_uri: https://w3id.org/MONet/basalt-schema/XRFElementalProduct
    description: "X-ray Fluorescence (XRF) elemental concentration data.\nOne row\
      \ per sample with columns for each element measured.\n\nFollows the wide-format\
      \ pattern established by IonsAnalysisProduct.\nElement concentrations in mg/kg\
      \ (parts per million dry weight basis) as float values.\nIndividual QC flags\
      \ for each element using ProcessedDataFlag enum.\n\nRelationship to core tables:\n\
      \  - id: FK -> processedData.id (1:1 linkage)\n  - processedData.type = 'XRFElementalProduct'\n\
      \  - processedData.workflow_id = NULL (direct acquisition; no computational\
      \ WEA)\n  - processedData.summary_metrics = {\"Ni_mg_kg\":45.3, \"Pb_mg_kg\"\
      :8.2, ...}\n  - processedData.s3_key = path to raw spectrum or calibrated CSV\
      \ in MinIO\n\nStandard XRF element panel (27 elements):\n  Trace metals: Cl,\
      \ V, Cr, Ni, Cu, Zn, Ga, As, Se, Br, Rb, Sr, Y, Nb, Mo,\n                Ag,\
      \ Cd, In, Sn, Sb, Cs, Ba, La, Ce, Pb, Th, U\n\nRequired enum additions to enums.yaml:\n\
      \  product:\n    XRFElementalProduct:  # Add to product permissible_values"

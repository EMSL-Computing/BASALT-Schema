    definition_uri: https://w3id.org/MONet/basalt-schema/LabProcessingActivity
    description: "[NEW ABSTRACT CLASS] Higher-level abstract base for any activity\
      \ that\ntransforms or creates physical lab materials.\n\nsampleProcessing inherits\
      \ from this via is_a.  This class provides the\ncommon identity layer, allowing\
      \ future extensions (e.g. non-sample\nconsuming activities) without forcing\
      \ them into the sampleProcessing branch.\n\nNOTE: In the live schema, sampleProcessing\
      \ should gain\n  is_a: labProcessingActivity\nand its existing id attribute\
      \ can be retained or removed (inherited)."

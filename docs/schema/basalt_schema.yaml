  Study:
    name: Study
    definition_uri: https://w3id.org/MONet/basalt-schema/Study
    description: 'A study or research project, typically associated with a proposal
      and a set of experiments.

      A study may have multiple participants, each with different roles, and may be
      associated with

      one or more campaigns. The study may also have associated DOIs and funding sources.'

          smaller than the size threshold are excluded from the sample (Unit: um)'
        required: true
        pattern: ^\d+(\.\d+)?\s*um$
      size_frac_up:
        name: size_frac_up
        description: 'Refers to the mesh/pore size used to pre-filter/pre-sort the
          sample. Materials larger than the size threshold are excluded from the sample
          (Unit: um)'
        required: true
        pattern: ^\d+(\.\d+)?\s*um$
    attributes:
      id:
        name: id
        identifier: true
        range: uuid
    class_uri: basalt_schema:WaterSample

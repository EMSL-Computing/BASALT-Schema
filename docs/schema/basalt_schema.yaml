  organism:
    name: organism
    definition_uri: https://w3id.org/MONet/basalt-schema/Organism
    description: "Reference data representing a biological identity (strain, isolate,\n\
      engineered construct, etc.) that can be instantiated by multiple\nphysical samples.\n\
      \nREPLACES: This class replaces the former Strain class, which was modeled\n\
      as a PurchasedMaterial subclass. That approach did not accommodate strains\n\
      engineered in-house or received from collaborators, nor did it cleanly\nseparate\
      \ biological identity from physical samples. Additionally, the term\n\"strain\"\
      \ implies purity that cannot always be guaranteed; this class\nrepresents the\
      \ *intended* or *characterized* biological identity.\n\nRelationship to samples:\n\
      \  - One organism can have many AMP2UserSample instances\n  - AMP2UserSample.organism_ref\
      \ points here\n  - CultureGrowth activities reference via organism_ref (aliased\
      \ as strain_ref)"
    from_schema: https://w3id.org/MONet/basalt-schema/organism
    slots:
    - organism_organism_name
    - description
    - organism_strain_identifier
    - taxonomy_id
    - host_common_name
    - host_taxid
    - organism_strain_source
    - strain_type
    - organism_modification_method
    - strain_description
    - organism_strain_mutation
    - phenotype
    - trait
    - encoded_traits
    - genotype_segment_category
    - genotype_segment_name
    - component_name
    - construct_component
    - donor_organism
    - component_description
    - organism_trophic_level
    - pathogenicity
    - host_spec_range
    - propagation
    - organism__id
    slot_usage:
      strain_identifier:
        name: strain_identifier
        description: 'Primary human-readable identifier for this organism.

          Examples: "KT2440_pTE314", "PP_0055", "AG5577-pJE2165"'
        required: true
      name:
        name: name
        description: 'Human-readable name for the organism.

          May be same as strain_identifier or more descriptive.'
      organism_name:
        name: organism_name
        description: Scientific name of the organism (e.g., "Pseudomonas putida").
      strain_source:
        name: strain_source
        description: 'Provenance of the organism. Can be an institution

          (e.g., "ATCC", "PNNL"), commercial source, or derivation note

          (e.g., "engineered from KT2440").'
      strain_mutation:

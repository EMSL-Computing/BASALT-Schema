      \ slots shared across AMP2 and Ecoplate products.\n\nv1 origin: plate-general.yaml\
      \ PlateProduct\nv2 change: follows existing satellite-table pattern (id: range:\
      \ processedData)\n           instead of v1's is_a: dataProduct."

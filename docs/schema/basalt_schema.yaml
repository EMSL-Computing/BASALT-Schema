  SoilHorizonEnum:
    name: SoilHorizonEnum
    definition_uri: https://w3id.org/MONet/basalt-schema/SoilHorizonEnum
    description: Soil horizon classifications
    from_schema: https://w3id.org/MONet/basalt-schema/enums
    permissible_values:
      a_horizon:
        text: a_horizon
        description: The surface horizon, also called topsoil. It has a defined soil
          structure, and is mostly made up of humus (decayed organic matter).
        aliases:
        - A_Horizon
      b_horizon:
        text: b_horizon
        description: Also known as the subsoil. It is greatly composed of material
          illuviated (washed in from) layers above it. It is typically denser than
          the A horizon and has a clayey texture.
        aliases:
        - B_Horizon
      c_horizon:
        text: c_horizon
        description: Also known as the substratum is unconsolidated material deepest
          in the pit and closest to the bedrock.
        aliases:
        - C_Horizon
      e_horizon:
        text: e_horizon
        description: Used to refer to subsurface horizons that have undergone a significant
          loss of minerals, also known as Eluviation (or leaching).
        aliases:
        - E_Horizon
      o_horizon:
        text: o_horizon
        description: The organic horizon. Typically at the top of the soil structure
          and is made up of mostly organic matter.
        aliases:
        - O_Horizon
      permafrost:
        text: permafrost
        description: "Soil that continuously remains below 0 \xB0C (32 \xB0F) for\
          \ two years or more."
        aliases:
        - Permafrost
      r_layer:
        text: r_layer
        description: Hard bedrock, which is usually the lowest layer. It is characterized
          by tightly bound and unbreakable materials.
        aliases:
        - R_Layer
      m_horizon:
        text: m_horizon
        description: Mineral horizon
        aliases:
        - M_Horizon

  WorkflowExecutionFunctionalAnnotation:
    name: WorkflowExecutionFunctionalAnnotation
    definition_uri: https://w3id.org/MONet/basalt-schema/WorkflowExecutionFunctionalAnnotation
    description: 'A link between a workflow execution and a functional annotation
      identifier.

      This class captures the relationship between a workflow execution and the

      functional annotation identifier that was used in the analysis.'
    from_schema: https://w3id.org/MONet/basalt-schema
    slots:
    - workflowExecutionFunctionalAnnotation__workflow_id
    - workflowExecutionFunctionalAnnotation__functional_annotation_id
    - workflowExecutionFunctionalAnnotation__count
    attributes:
      workflow_id:
        name: workflow_id
        range: DataProcessingActivity
        required: true
      functional_annotation_id:
        name: functional_annotation_id
        range: FunctionalAnnotationIdentifier
        required: true
      count:
        name: count
        range: double
    class_uri: basalt_schema:WorkflowExecutionFunctionalAnnotation
  XRayDataGenerationActivity:
    name: XRayDataGenerationActivity
    definition_uri: https://w3id.org/MONet/basalt-schema/XRayDataGenerationActivity
    description: "Abstract base class for X-ray analytical methods including XRF (elemental)\n\
      and XRD (mineralogical) analysis. Inherits acquisition_time, instrument_id,\n\
      protocol_url, analyte_id, and other core metadata from DataGenerationActivity.\n\
      \nConcrete subclasses define method-specific measurement parameters.\nFuture\
      \ X-ray methods (e.g., XCT) can extend this class.\n\nShared patterns:\n  -\
      \ Direct instrument output (no computational workflow) is typical for XRF\n\
      \  - XRD may optionally link to DataProcessingActivity for Rietveld refinement\n\
      \  - protocol_url should link to vendor SOP or EMSL internal protocol documentation"
    from_schema: https://w3id.org/MONet/basalt-schema
    is_a: DataGenerationActivity
    abstract: true
    slots:
    - sequence_order
    - name
    - description
    - protocol_url
    - protocol_version
    - dataGenerationActivity__id
    - dataGenerationActivity__analyte_id
    - dataGenerationActivity__acquisition_start_time
    - dataGenerationActivity__acquisition_end_time
    - dataGenerationActivity__instrument_used
    - dataGenerationActivity__instrument_operator_id
    class_uri: basalt_schema:XRayDataGenerationActivity
  XRFDataGenerationActivity:
    name: XRFDataGenerationActivity
    definition_uri: https://w3id.org/MONet/basalt-schema/XRFDataGenerationActivity
    description: "X-ray Fluorescence (XRF) elemental analysis activity.\n\nXRF measures\
      \ elemental composition by detecting characteristic X-ray emissions\nfrom a\
      \ sample bombarded with high-energy X-rays. Typical output: concentrations\n\
      of 10-30 elements per sample (Ni, Pb, As, Cr, Fe, Ca, K, etc.).\n\nData product:\
      \ XRFElementalProduct (one row per element per sample)\n\nWorkflow pattern:\
      \ Direct instrument output (no computational processing step)\n  processedSample\
      \ -> XRFDataGenerationActivity -> XRFElementalProduct (workflow_id = NULL)\n\
      \nProtocol information: Stored externally; link via protocol_url attribute.\n\
      Example protocol parameters (stored in external SOP or DataProcessingActivity\n\
      if computational correction is needed):\n  - Beam voltage (kV), beam current\
      \ (mA)\n  - Measurement duration (seconds)\n  - Matrix correction method (fundamental\
      \ parameters, empirical)\n  - Calibration date\n  - Operator ID\n\nRequired\
      \ enum additions to enums.yaml:\n  routemethod:\n    xrf_analysis:  # Add to\
      \ routemethod permissible_values"
    from_schema: https://w3id.org/MONet/basalt-schema
    is_a: XRayDataGenerationActivity
    slots:
    - sequence_order
    - name
    - description
    - protocol_url
    - protocol_version
    - dataGenerationActivity__id
    - dataGenerationActivity__analyte_id
    - dataGenerationActivity__acquisition_start_time
    - dataGenerationActivity__acquisition_end_time
    - dataGenerationActivity__instrument_used
    - dataGenerationActivity__instrument_operator_id
    class_uri: basalt_schema:XRFDataGenerationActivity
  XRDDataGenerationActivity:
    name: XRDDataGenerationActivity
    definition_uri: https://w3id.org/MONet/basalt-schema/XRDDataGenerationActivity
    description: "X-ray Diffraction (XRD) mineralogical analysis activity.\n\nXRD\
      \ identifies crystalline mineral phases by measuring diffraction patterns.\n\
      Output: mineral phase names and quantitative abundances (weight %).\n\nData\
      \ product: XRDPhaseProduct (one row per mineral phase per sample)\n\nWorkflow\
      \ patterns:\n  1. Direct/semi-quantitative: \n       processedSample -> XRDDataGenerationActivity\
      \ -> XRDPhaseProduct (workflow_id = NULL)\n  2. With Rietveld refinement (computational):\n\
      \       processedSample -> XRDDataGenerationActivity -> \n       DataProcessingActivity(type='xrd_rietveld_refinement')\
      \ -> \n       XRDPhaseProduct (workflow_id = refinement WEA)\n\nProtocol information:\
      \ Stored externally; link via protocol_url attribute.\nExample protocol parameters\
      \ (stored in external SOP or DataProcessingActivity):\n  - Diffractometer geometry\
      \ (Bragg-Brentano, Debye-Scherrer)\n  - X-ray tube type (Cu, Co, Mo)\n  - Scan\
      \ range (2-theta degrees), step size\n  - Refinement software (HighScore Plus,\
      \ GSAS-II, FullProf)\n  - R-factor, GOF (goodness of fit)\n\nRequired enum additions\
      \ to enums.yaml:\n  routemethod:\n    xrd_analysis:  # Add to routemethod permissible_values"
    from_schema: https://w3id.org/MONet/basalt-schema
    is_a: XRayDataGenerationActivity
    slots:
    - sequence_order
    - name
    - description
    - protocol_url
    - protocol_version
    - dataGenerationActivity__id
    - dataGenerationActivity__analyte_id
    - dataGenerationActivity__acquisition_start_time
    - dataGenerationActivity__acquisition_end_time
    - dataGenerationActivity__instrument_used
    - dataGenerationActivity__instrument_operator_id
    class_uri: basalt_schema:XRDDataGenerationActivity

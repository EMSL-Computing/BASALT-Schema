    attributes:
      id:
        name: id
        identifier: true
        range: uuid
        required: true
      name:
        name: name
        description: Human-readable name for the activity
        range: string
      description:
        name: description
        description: Free-text description of the activity
        range: string
    class_uri: basalt_schema:LabProcessingActivity
  MediaPreparation:
    name: MediaPreparation
    definition_uri: https://w3id.org/MONet/basalt-schema/MediaPreparation
    description: "Activity that prepares a batch of growth media.\nReplaces the former\
      \ labPreparationActivity + MediaCreation pattern.\n\nMedia details (recipe,\
      \ formulation, sterilisation, etc.) are carried as\nslots on this activity.\
      \  The physical media batch is represented as a\nprocessedSample(type='prepared_media')\
      \ linked via processingSampleLink\n(role: output_sample).  Downstream CultureGrowth\
      \ and AMP2PlateSetupActivity\nactivities reference that processedSample via\
      \ the media_ref FK slot.\n\nLifecycle:\n  MediaPreparation activity\n    ->\
      \ processingSampleLink(role=output_sample)\n    -> processedSample(type='prepared_media');\
      \ media_ref points here\n    -> CultureGrowth / AMP2PlateSetupActivity.media_ref"

    name: HydraulicPropertiesProduct
    definition_uri: https://w3id.org/MONet/basalt-schema/HydraulicPropertiesProduct
    description: Soil hydraulic parameters derived from HYPROP evaporation-experiment
      data. One row per core section; the four attributes are the four VGM model parameters.  Proposal_ID,
      sampling_set, and core_section are inherited from the parent processedData record.
    from_schema: https://w3id.org/MONet/basalt-schema/products
    is_a: ProcessedData
    slots:
    - name
    - description
    - project
    - sampling_set
    - core_section
    - sample_name
    - s3_base_url
    - s3_bucket
    - s3_key
    - filesize
    - md5checksum
    - dataProduct__id
    - summary_metrics
    - lims_barcode
    - sample_id
    - measure_type
    - hydraulicPropertiesProduct__alpha
    - hydraulicPropertiesProduct__n
    - hydraulicPropertiesProduct__theta_r
    - hydraulicPropertiesProduct__theta_s
    - hydraulicPropertiesProduct__flag
    attributes:
      alpha:
        name: alpha
        description: Van Genuchten shape parameter alpha (1/cm). Controls the inverse
          of the air-entry suction; typically fitted by HYPROP-FIT or similar software.
        range: double
      n:
        name: n
        description: Van Genuchten pore-size distribution index n (dimensionless,
          n > 1). Controls the slope of the water-retention curve.
        range: double
      theta_r:
        name: theta_r
        description: Residual volumetric water content theta_r (cm3 cm). The water
          content at which liquid conductivity approaches zero.
        range: double
      theta_s:
        name: theta_s
        description: Saturated volumetric water content theta_s (cm3 cm e-3). Approximates
          total porosity under saturated conditions.
        range: double
      flag:
        name: flag
        description: QC flag for the entire VGM fit (e.g. missing sample, failed QC).
        range: ProcessedDataFlag
    class_uri: basalt_schema:HydraulicPropertiesProduct

  AMP2UserSample:
    name: AMP2UserSample
    definition_uri: https://w3id.org/MONet/basalt-schema/AMP2UserSample
    description: "A user-submitted microbial sample for AMP2 workflows.\n\nReferences\
      \ an organism for identity (the \"what\") and carries\nphysical/logistical metadata\
      \ for the specific sample instance (the \"this tube\").\n\nRelationship to organism:\n\
      \  - Many AMP2UserSample instances can reference one organism\n  - organism_ref\
      \ is the FK (required)\n  - Example: 1000 samples of strain KT2440_pTE314\n\n\
      Workflow integration:\n  - Enters workflow via SampleReceiving activity\n  -\
      \ Processed through StrainPurity \u2192 StockCulturePreparation \u2192 PreCultureGrowth\
      \ \u2192 ExperimentalCulture\n  - Outputs ProcessedSample instances at each\
      \ stage"
    from_schema: https://w3id.org/MONet/basalt-schema/sample-classes
    is_a: Sample
    slots:
    - description
    - emsl_activity
    - lims_barcode
    - AMP2UserSample_organism_ref
    - AMP2UserSample_collection_date
    - growth_facil
    - isol_growth_condt
    - start_date_inc
    - AMP2UserSample_storage_condition
    - AMP2UserSample_storage_temperature
    - shipped_sample_size
    - guid_source
    - other_guid_source
    - AMP2UserSample_analysis_type
    - cbi
    - aMP2UserSample__id
    - AMP2UserSample_name
    slot_usage:
      organism_ref:
        name: organism_ref
        description: 'FK to organism representing the biological identity this sample
          instantiates.

          Required - every AMP2UserSample must reference an organism.'
        required: true
      storage_condition:
        name: storage_condition
        description: 'Storage condition for this sample (frozen, fresh, etc.).

          Inherited from Sample; required for AMP2UserSample.

          Aliases: samp_store_cond, storage_cond, storage_condt'
        required: true
      storage_temperature:
        name: storage_temperature
        description: 'Storage temperature for this sample (e.g., "-80 C").

          Aliases: samp_store_temp'
      name:
        name: name
        description: 'Sample identifier/name (e.g., "PP_0055").

          May match strain_identifier on organism for 1:1 cases,

          but typically unique per sample instance.

          Aliases: sample_name, samp_name'
      collection_date:
        name: collection_date
        description: The date the sample was collected or received from the user.
        required: false
      analysis_type:
        name: analysis_type
        description: The type(s) of analysis planned for this sample.
        required: false
    attributes:
      id:
        name: id
        identifier: true
        range: uuid
    class_uri: basalt_schema:AMP2UserSample

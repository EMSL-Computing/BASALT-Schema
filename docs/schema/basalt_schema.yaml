  XRDPhaseProduct:
    name: XRDPhaseProduct
    definition_uri: https://w3id.org/MONet/basalt-schema/XRDPhaseProduct
    description: "X-ray Diffraction (XRD) mineral phase identification and quantification\
      \ data.\nOne row per sample with columns for each mineral phase identified.\n\
      \nFollows the wide-format pattern with individual weight percent columns.\n\
      Individual QC flags for each mineral using ProcessedDataFlag enum.\n\nRelationship\
      \ to core tables:\n  - id: FK -> processedData.id (1:1 linkage)\n  - processedData.type\
      \ = 'XRDPhaseProduct'\n  - processedData.workflow_id -> DataProcessingActivity\
      \ if Rietveld refinement\n    is computational; NULL if manual/semi-quantitative\n\
      \  - processedData.summary_metrics = {\"quartz_percent\":42, \"albite_percent\"\
      :18, ...}\n  - processedData.s3_key = diffractogram .xy, .xrdml, or .raw file\
      \ in MinIO\n\nStandard soil mineral panel (10 major phases):\n  Primary minerals:\
      \ quartz, albite, microcline\n  Phyllosilicates: muscovite, kaolinite, chlorite\n\
      \  Amphiboles: hornblende\n  Sulfides and evaporites: pyrite, halite, gypsum\n\
      \nQuantification methods:\n  - Rietveld refinement (computational, most accurate)\n\
      \  - Reference intensity ratio (RIR) method\n  - Semi-quantitative (manual,\
      \ less precise)\n\nComputational processing workflow (if applicable):\n  XRDDataGenerationActivity\
      \ acquires raw diffractogram ->\n  DataProcessingActivity (type='xrd_rietveld_refinement')\
      \ processes with\n  HighScore Plus, GSAS-II, or FullProf ->\n  XRDPhaseProduct\
      \ (workflow_id points to refinement WEA)\n  \n  workflow_steps JSONB example:\n\
      \    {\"software\": \"HighScore_Plus\", \"version\": \"5.1\", \"method\": \"\
      Rietveld\",\n     \"r_factor\": 0.042, \"gof\": 1.8, \"amorphous_content_pct\"\
      : 12}\n\nRequired enum additions to enums.yaml:\n  product:\n    XRDPhaseProduct:\
      \  # Add to product permissible_values"
    from_schema: https://w3id.org/MONet/basalt-schema/products
    is_a: XRayDataProduct
    slots:
    - name
    - description
    - project
    - sampling_set
    - core_section
    - sample_name
    - s3_base_url
    - s3_bucket
    - s3_key
    - filesize
    - md5checksum
    - dataProduct__id
    - summary_metrics
    - lims_barcode
    - sample_id
    - measure_type
    - xRDPhaseProduct__quartz_percent
    - xRDPhaseProduct__albite_percent
    - xRDPhaseProduct__microcline_percent
    - xRDPhaseProduct__muscovite_percent
    - xRDPhaseProduct__kaolinite_percent
    - xRDPhaseProduct__chlorite_percent
    - xRDPhaseProduct__hornblende_percent
    - xRDPhaseProduct__pyrite_percent
    - xRDPhaseProduct__halite_percent
    - xRDPhaseProduct__gypsum_percent
    - xRDPhaseProduct__flag_quartz
    - xRDPhaseProduct__flag_albite
    - xRDPhaseProduct__flag_microcline
    - xRDPhaseProduct__flag_muscovite
    - xRDPhaseProduct__flag_kaolinite
    - xRDPhaseProduct__flag_chlorite
    - xRDPhaseProduct__flag_hornblende
    - xRDPhaseProduct__flag_pyrite
    - xRDPhaseProduct__flag_halite
    - xRDPhaseProduct__flag_gypsum

MixedCultureSamplingActivity:
  attributes:
    id:
      identifier: true
      range: uuid
  description: ''
  is_a: SamplingActivity
  slot_usage:
    collection_time:
      description: The time of sampling either as an instance (single point) or interval.
        Time should be formatted as HH:MM:SS in 24-hour time format
    sample_collected:
      description: This refers to the TOTAL amount of sample collected from the experiment.
        NOT the amount sent to EMSL or collected for a specific analysis.
    sample_collection_method:
      description: The method employed for collecting the sample. This can be a citation
        or description
  slots:
  - collection_time
  - sample_collected
  - sample_collection_dev
  - sample_collection_method
MonetSoilSamplingActivity:
  attributes:
    id:
      identifier: true
      range: uuid
  description: ''
  is_a: SamplingActivity
  slot_usage:
    bulk_elect_conductivity:
      description: 'Provide the bulk electrical conductivity readout from the Teros
        ZSC bluetooth sensor. If measurement was started and unsuccessful enter ''failed''
        if measurement was not attempted enter ''did not collect''. (Unit: mS/cm)'
      pattern: ^\d+(\.\d+)?\s*mS/cm|did not collect|failed
      required: true
    collection_time:
      required: true
    infiltration_1:
      pattern: ^((0[0-9]|[1-5][0-9]):([0-5][0-9])\smm:ss|did not collect|failed)
      required: true
    infiltration_2:
      required: true
    sample_collected:
      description: 'This referes to the TOTAL amount of sample collected from the
        experiment. NOT the amount sent to EMSL or collected for a specific analysis.
        (Unit: cores)'
      pattern: ^\d+(\.\d+)?\s*cores$
    sample_collection_dev:
      required: true
  slots:
  - bulk_elect_conductivity
  - collection_time
  - infiltration_1
  - infiltration_2
  - infiltration_notes
  - sample_collected
  - sample_collection_dev
  - weather
OtherUndescribedSamplingActivity:
  attributes:
    id:
      identifier: true
      range: uuid
  description: ''
  is_a: SamplingActivity
  slot_usage:
    collection_time:
      description: The time of sampling either as an instance (single point) or interval.
        Time should be formatted as HH:MM:SS in 24-hour time format
    humidity:
      description: Amount of humidity measured in the air the day of sampling. Provided
        by iMet
    sample_collection_dev:
      title: sample collection devive
    sample_collection_method:
      description: The method employed for collecting the sample. This can be a citation
        or description
    sampling_duration:
      description: The difference between sample start and sample end time
    wind_direction:
      description: Direction of the wind on the day of sampling. Collected via anemometer.
    wind_speed:
      description: Wind speed describes how fast the air is moving past a certain
        point during sampling time. Collected via anemometer
  slots:
  - bulk_elect_conductivity
  - collection_time
  - humidity
  - sample_collected
  - sample_collection_dev
  - sample_collection_method
  - sampling_duration
  - wind_direction
  - wind_speed

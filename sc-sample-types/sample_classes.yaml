PlantSample:
  attributes:
    id:
      identifier: true
      range: uuid
  description: ''
  is_a: Sample
  slot_usage:
    annual_precpt:
      title: mean annual precipitation
    annual_temp:
      title: mean annual temperature
    host_height:
      description: 'The height of plant. (Unit: cm or mm or m)'
    host_length:
      description: 'The length of the plant. (Unit: cm or mm or m)'
      pattern: ^\d+(\.\d+)?\s*(cm|mm|m)$
    host_life_stage:
      description: Description of life stage of the plant
    non_microb_biomass:
      description: "Amount of biomass; should include the name for the part of biomass\
        \ measured e.g.insect plant total (Unit: \xB5m)"
    plant_growth_med:
      description: Specification of the media for growing the plants or tissue cultured
        samples. Value is required to be a subclass from `plant growth medium exposure
        [PECO:0007147]`
    plant_sex:
      description: Sex of the reproductive parts on the whole plant
      enum: Androdioecious|Androecious|Androgynomonoecious|Androgynous|Andromonoecious|Bisexual|Dichogamous|Diclinous|Dioecious|Gynodioecious|Gynoecious|Gynomonoecious|Hermaphroditic|Imperfect|Monoclinous|Monoecious|Perfect|Polygamodioecious|Polygamomonoecious|Polygamous|Protandrous|Protogynous|Subandroecious|Subdioecious|Subgynoecious|Synoecious|Trimonoecious|Trioecious|Unisexual
    plant_struc:
      description: The plant strucutre that was sampled.
      enum: seed|stem|leaf|root|fine roots|whole plant|rhizodeposits
    root_med_carbon:
      description: Source of organic carbon in the culture rooting medium. Provide
        as {carbon source} {value}{unit}. Can be multivalued separated by ;. Preferred
        unitl mg/L.
    root_med_macronutr:
      description: Measurement of the culture rooting medium macronutrients (NP K
        Ca Mg S). Can be multivalued separated by ;. e.g. KH2PO4 170 mg/L
    root_med_micronutr:
      description: Measurement of the culture rooting medium micronutrients (Fe Mn
        Zn B Cu Mo). Can be multivalued separated by ;. e.g. H3BO3 6.2 mg/L
    salinity:
      description: 'Salinity is the total concentration of all dissolved salts in
        a sample. While salinity can be measured by a complete chemical analysis this
        method is difficult and time consuming. More often it is instead derived from
        the conductivity measurement. This is known as practical salinity. These derivations
        compare the specific conductance of the sample to a salinity standard such
        as seawater (Unit: practical salinity unit or percent)'
      pattern: ^\d+(\.\d+)?\s*(practical salinity unit|percent)$
    season_precpt:
      title: mean seasonal precipitation
    season_temp:
      title: mean seasonal temperature

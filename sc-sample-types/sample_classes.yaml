MonetSoilSample:
  attributes:
    id:
      identifier: true
      range: uuid
  description: ''
  is_a: Sample
  slot_usage:
    agrochem_addition:
      title: agrochemical additions
    bulk_elect_conductivity:
      description: 'Provide the bulk electrical conductivity readout from the Teros
        ZSC bluetooth sensor. If measurement was started and unsuccessful enter ''failed''
        if measurement was not attempted enter ''did not collect''. (Unit: mS/cm)'
      pattern: ^\d+(\.\d+)?\s*mS/cm|did not collect|failed
    depth:
      description: 'The vertical distance below local surface. For sediment or soil
        samples depth is measured from sediment or soil surface respectively. Depth
        is required to be reported as an interval for subsurface samples. (Units:
        cm or m)'
      pattern: ^\d+(\.\d+)?-\d+(\.\d+)?\s*(m|cm)$
    env_broad_scale:
      pattern: ^_*\s*[a-zA-Z\s\-]+\[ENVO:\d+\]$
    env_local_scale:
      pattern: ^_*\s*[a-zA-Z\s\-]+\[ENVO:\d+\]$
    env_medium:
      pattern: ^_*\s*[a-zA-Z\s\-]+\[ENVO:\d+\]$
    fao_class:
      description: Soil classification from the FAO World Reference Database for Soil
        Resources. The list can be found at https://www.isric.org/explore/world-soil-distribution
    infiltration_1:
      pattern: ^((0[0-9]|[1-5][0-9]):([0-5][0-9])\smm:ss|did not collect|failed)
    other:
      description: Other details about your sample that you feel can't be accurately
        represented in the available columns.
    other_storage_condt:
      description: Please specify if 'other'
    sample_collected:
      description: 'This referes to the TOTAL amount of sample collected from the
        experiment. NOT the amount sent to EMSL or collected for a specific analysis.
        (Unit: cores)'
      pattern: ^\d+(\.\d+)?\s*cores$
    sample_name:
      description: ID that is present on the shipped sample. Human readable.
    shipped_sample_size:
      description: Total amount of sample sent to EMSL. Must include unit of 'core'.
      pattern: ^\d+(\.\d+)?\s*core$
    temp:
      description: 'Temperature of the sample at the time of sampling. If measurement
        was started and unsuccessful enter ''failed'' if measurement was not attempted
        enter ''did not collect''. (Units: C)'
      pattern: ^-?\d+(\.\d+)?\s*C|did not collect|failed
    water_content:
      description: Water content measurement. This will be a readout from the Teros
        ZSC bluetooth sensor and requires a unit of 'm3/m3'. If measurement was started
        and unsuccessful enter 'failed' if measurement was not attempted enter 'did
        not collect'.
      pattern: ^\d+(\.\d+)?\s*m3/m3|did not collect|failed
  slots:
  - LIMS_ID
  - agrochem_addition
  - chem_administration
  - lat_lon
  - misc_param
  - other_treatment
  - sampling_set
  - soil_type
  - soil_type_meth
  - water_content
  - water_content_meth
  - watering_regm
OtherUndescribedSample:
  attributes:
    id:
      identifier: true
      range: uuid
  description: ''
  is_a: Sample
  slot_usage:
    alkalinity:
      description: Alkalinity the ability of a solution to neutralize acids to the
        equivalence point of carbonate or bicarbonate
    alkyl_diethers:
      description: Concentration of alkyl diethers
    alt:
      description: Altitude is a term used to identify heights of objects such as
        airplanes space shuttles rockets atmospheric balloons and heights of places
        such as atmospheric layers and clouds. It is used to measure the height of
        an object which is above the earthbs surface. In this context the altitude
        measurement is the vertical distance between the earth's surface above sea
        level and the sampled position in the air
    aminopept_act:
      description: Measurement of aminopeptidase activity
    ammonium:
      description: Concentration of ammonium in the sample
    analysis_type:
      description: The analyses planned for this sample. The analysis types will later
        be mapped to an allocated resource. This field is constrained to contain only
        a set of limited terms. Include all the data types. This field can have multiple
        values separated by a ";".
    annual_temp:
      title: average annual temperate
    bacteria_carb_prod:
      description: Measurement of bacterial carbon production
    bishomohopanol:
      description: Concentration of bishomohopanol
    bromide:
      description: Concentration of bromide
    calcium:
      description: Concentration of calcium in the sample
    carb_dioxide:
      description: Amount of carbon dioxide measured in the air the day of sampling.
        Provided by ARM
    carb_monoxide:
      description: Amount of carbon monoxide measured in the air the day of sampling.
        Provided by ARM
    carb_nitro_ratio:
      description: Ratio of amount or concentrations of carbon to nitrogen
      title: carbon nitrogen ration
    chloride:
      description: Concentration of chloride in the sample
    chlorophyll:
      description: Concentration of chlorophyll
    collection_date:
      description: 'The date of sampling either as an instance (single point) or interval.
        For commercially purchased samples this will be the purchase date. Format:
        YYYY-MM-DD. Also valid if entire collection date is unknown is just year (YYYY)
        or just year and month (YYYY-MM)'
    collection_time:
      description: The time of sampling either as an instance (single point) or interval.
        Time should be formatted as HH:MM:SS in 24-hour time format
    cur_land_use:
      description: Present state of sample site
    density:
      description: Density of the sample which is its mass per unit volume (aka volumetric
        mass density)
    depth:
      description: 'The vertical distance below local surface. For sediment or soil
        samples depth is measured from sediment or soil surface respectively. Depth
        can be reported as an interval for subsurface samples. (Units: m)'
      pattern: ^\d+(\.\d+)?(-\d+(\.\d+)?)?\s*m$
    diether_lipids:
      description: Concentration of diether lipids; can include multiple types of
        diether lipids
    diss_carb_dioxide:
      description: Concentration of dissolved carbon dioxide in the sample or liquid
        portion of the sample
    diss_hydrogen:
      description: Concentration of dissolved hydrogen
    diss_inorg_carb:
      description: Dissolved inorganic carbon concentration in the sample typically
        measured after filtering the sample using a 0.45 micrometer filter
    diss_org_carb:
      description: Concentration of dissolved organic carbon in the sample liquid
        portion of the sample or aqueous phase of the fluid
    diss_org_nitro:
      description: Dissolved organic nitrogen concentration measured as; total dissolved
        nitrogen - NH4 - NO3 - NO2
    diss_oxygen:
      description: Concentration of dissolved oxygen
    env_broad_scale:
      description: 'Report which major environmental system your sample or specimen
        came from. The systems identified should have a coarse spatial grain to provide
        the general environmental context of where the sampling was done (e.g. were
        you in the desert or a rainforest?). We recommend using subclasses of ENVO''s
        biome class: http://purl.obolibrary.org/obo/ENVO_00000428.'
    env_local_scale:
      description: 'Report the entity which are in the sample or specimen''s local
        vicinity and which you believe have significant causal influences on your
        sample or specimen. We recommend using EnvO terms which are of smaller spatial
        grain than your entry for env_broad_scale. Terms such as anatomical sites
        from other OBO Library ontologies which interoperate with EnvO (e.g. UBERON)
        are accepted in this field. EnvO documentation about how to use the field:
        https://github.com/EnvironmentOntology/envo/wiki/Using-ENVO-with-MIxS.'
    env_medium:
      description: 'Report the environmental material immediately surrounding the
        sample or specimen at the time of sampling. We recommend using subclasses
        of ''environmental material'' (http://purl.obolibrary.org/obo/ENVO_00010483).
        EnvO documentation about how to use the field: https://github.com/EnvironmentOntology/envo/wiki/Using-ENVO-with-MIxS
        . Terms from other OBO ontologies are permissible as long as they reference
        mass/volume nouns (e.g. air water blood) and not discrete countable entities
        (e.g. a tree a leaf a table top).'
    extraction_method:
      description: If you the user performed an extraction preparation or processing
        before sending the sample to EMSL what was it? This is only applicable when
        sending an "analytical sample". See README for more details on types of samples.
    extreme_event:
      description: Unusual physical events that may have affected microbial populations
    fire:
      description: Historical and/or physical evidence of fire
    flooding:
      description: Historical and/or physical evidence of flooding
    genetic_mod:
      title: genetic modifications
    geo_loc_name:
      description: The geographical origin of the sample as defined by the country
        or sea name followed by specific region name. Provide the location of where
        the sample originated.
    glucosidase_act:
      description: Measurement of glucosidase activity
    growth_facil:
      description: Type of facility where the sample was collected or grown
    host_age:
      description: Age of host at the time of sampling; relevant scale depends on

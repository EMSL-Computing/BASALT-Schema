SedimentSample:
  attributes:
    id:
      identifier: true
      range: uuid
  description: ''
  is_a: Sample
  slot_usage:
    analysis_type:
      required: true
    depth:
      required: true
      pattern: ^\d+(\.\d+)?-\d+(\.\d+)?\s*m$
    lat_lon:
      required: true
    microbial_biomass:
      description: 'The part of the organic matter in the soil that constitutes living
        microorganisms smaller than 5-10 micrometer. If you keep this you would need
        to have correction factors used for conversion to the final units. (Unit:
        g/kg sediment or ug/g sediment)'
      pattern: ^\d+(\.\d+)?\s*(g/kg sediment|ug/g sediment)$
    non_microb_biomass:
      description: 'Amount of non-microbial biomass measured. Include the name for
        the part of biomass measured, e.g.insect, plant, total. Provide value and unit,
        any unit is valid. (example: insect 5mg; plant 2ug/mL)'
      pattern: ^(\S+\s+\d+\s*\S+)(;\s*\S+\s+\d+\s*\S+)*$
    samp_biotic_relationship:
      description: Description of relationship(s) between the subject organism and
        other organism(s) it is associated with. The target organism is the subject
        of the relationship and the other organism(s) is the object
  slots:
  - air_temp_regm
  - alkalinity
  - alkalinity_method
  - alkyl_diethers
  - aminopept_act
  - ammonium
  - analysis_type
  - bacteria_carb_prod
  - biotic_regm
  - bishomohopanol

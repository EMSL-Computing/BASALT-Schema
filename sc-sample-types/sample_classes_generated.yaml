      pattern: ^\d+(\.\d+)?\s*(ug/L|umol/L)$
    tot_phosp:
      description: 'Total phosphorus concentration in the sample calculated by: total
        phosphorus = total dissolved phosphorus + particulate phosphorus. (Unit: ug/L
        or umol/L)'
      pattern: ^\d+(\.\d+)?\s*(ug/L|umol/L)$
    water_current:

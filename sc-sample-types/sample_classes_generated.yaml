MonetSoilSample:
  attributes:
    id:
      identifier: true
      range: uuid
  description: ''
  is_a: Sample
  slot_usage:
    agrochem_addition:
      title: agrochemical additions
    depth:
      description: 'The vertical distance below local surface. For sediment or soil
        samples depth is measured from sediment or soil surface respectively. Depth
        is required to be reported as an interval for subsurface samples. (Units:
        cm or m)'
      pattern: ^\d+(\.\d+)?-\d+(\.\d+)?\s*(m|cm)$
      required: true
    lat_lon:
      required: true
    other_storage_condt:
      description: Please specify if 'other'
    sampling_set:
      required: true
    soil_type:
      required: true
    soil_type_meth:
      required: true
    temp:
      description: 'Temperature of the sample at the time of sampling. If measurement
        was started and unsuccessful enter ''failed'' if measurement was not attempted
        enter ''did not collect''. (Units: C)'
      pattern: ^-?\d+(\.\d+)?\s*C|did not collect|failed
      required: true
    water_content:
      description: Water content measurement. This will be a readout from the Teros
        ZSC bluetooth sensor and requires a unit of 'm3/m3'. If measurement was started
        and unsuccessful enter 'failed' if measurement was not attempted enter 'did
        not collect'.
      pattern: ^\d+(\.\d+)?\s*m3/m3|did not collect|failed
      required: true
  slots:
  - LIMS_ID
  - agrochem_addition
  - chem_administration
  - depth
  - lat_lon
  - misc_param
  - other_samp_store_temp
  - other_storage_condt
  - other_treatment
  - sampling_set
  - soil_type
  - soil_type_meth
  - temp
  - water_content
  - water_content_meth
  - watering_regm
OtherUndescribedSample:
  attributes:
    id:
      identifier: true
      range: uuid
  description: ''
  is_a: Sample
  slot_usage:
    alkalinity:
      description: Alkalinity the ability of a solution to neutralize acids to the
        equivalence point of carbonate or bicarbonate
    alkyl_diethers:
      description: Concentration of alkyl diethers
    aminopept_act:
      description: Measurement of aminopeptidase activity
    ammonium:
      description: Concentration of ammonium in the sample
    analysis_type:
      description: The analyses planned for this sample. The analysis types will later
        be mapped to an allocated resource. This field is constrained to contain only
        a set of limited terms. Include all the data types. This field can have multiple
        values separated by a ";".
      required: true
    bacteria_carb_prod:
      description: Measurement of bacterial carbon production
    bishomohopanol:
      description: Concentration of bishomohopanol
    bromide:
      description: Concentration of bromide
    calcium:
      description: Concentration of calcium in the sample
    carb_dioxide:
      description: Amount of carbon dioxide measured in the air the day of sampling.
        Provided by ARM
    carb_monoxide:
      description: Amount of carbon monoxide measured in the air the day of sampling.
        Provided by ARM
    carb_nitro_ratio:
      description: Ratio of amount or concentrations of carbon to nitrogen
      title: carbon nitrogen ration
    chloride:
      description: Concentration of chloride in the sample
    chlorophyll:
      description: Concentration of chlorophyll
    density:
      description: Density of the sample which is its mass per unit volume (aka volumetric
        mass density)
    depth:
      description: 'The vertical distance below local surface. For sediment or soil
        samples depth is measured from sediment or soil surface respectively. Depth
        can be reported as an interval for subsurface samples. (Units: m)'
      pattern: ^\d+(\.\d+)?(-\d+(\.\d+)?)?\s*m$
    diether_lipids:
      description: Concentration of diether lipids; can include multiple types of
        diether lipids
    diss_carb_dioxide:
      description: Concentration of dissolved carbon dioxide in the sample or liquid
        portion of the sample
    diss_hydrogen:
      description: Concentration of dissolved hydrogen
    diss_inorg_carb:
      description: Dissolved inorganic carbon concentration in the sample typically
        measured after filtering the sample using a 0.45 micrometer filter
    diss_org_carb:
      description: Concentration of dissolved organic carbon in the sample liquid
        portion of the sample or aqueous phase of the fluid
    diss_org_nitro:
      description: Dissolved organic nitrogen concentration measured as; total dissolved
        nitrogen - NH4 - NO3 - NO2
    diss_oxygen:
      description: Concentration of dissolved oxygen
    extraction_method:
      description: If you the user performed an extraction preparation or processing
        before sending the sample to EMSL what was it? This is only applicable when
        sending an "analytical sample". See README for more details on types of samples.
    genetic_mod:
      title: genetic modifications
    glucosidase_act:
      description: Measurement of glucosidase activity
    host_age:
      description: Age of host at the time of sampling; relevant scale depends on
        species and study e.g. Could be seconds for amoebae or centuries for trees
    host_common_name:
      description: Common name of the host e.g. Human
    host_dry_mass:
      description: Measurement of dry mass
    host_height:
      description: The height of subject
    host_spec_range:
      description: The NCBI taxonomy identifier of the specific host if it is known
      range: integer
    host_taxid:
      description: NCBI taxa ID
    host_tot_mass:
      description: Total mass of the host at collection the unit depends on host
    host_wet_mass:
      description: Measurement of wet mass
    isol_growth_condt:
      title: isolation and growth conditions
    lat_lon:
      description: The geographical origin of the sample as defined by latitude and

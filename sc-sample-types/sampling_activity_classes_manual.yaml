SamplingActivity:
  attributes:
    id:
      identifier: true
      range: uuid
  slots:
  - collection_date
  - shipped_sample_size
  - sampled_at_site

AerosolArmSamplingActivity:
  attributes:
    id:
      identifier: true
      range: uuid
  description: ''
  is_a: SamplingActivity
  slot_usage:
    humidity:
      description: Amount of humidity measured in the air the day of sampling. Provided
        by iMet. Provide value and unit, any unit is valid
  slots:
  - collection_time
  - humidity
  - sample_collected
  - sample_collection_dev
  - sample_end_time
  - sample_start_time
  - sampling_duration
  - wind_direction
  - wind_speed
  - within_17_oz

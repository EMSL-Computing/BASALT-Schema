[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning"]
build-backend = "poetry_dynamic_versioning.backend"

[project]
name = "analysis_api_schema"
description = "linkML transition for analysis-api schemae"
authors = [
  {name = "Maia Kapur", email = "maia.kapur@pnnl.gov"},
]
license = "MIT"
readme = "README.md"
include = ["README.md", "src/analysis_api_schema/schema", "project"]

requires-python = ">=3.9,<4.0"

dynamic = ["version"]

dependencies = [
  "schema-automator (==0.5.4rc1)",
  "quantulum3[classifier] (>=0.9.2,<0.10.0)",
  "psycopg2-binary (>=2.9.10,<3.0.0)",
  "alembic (>=1.16.5,<2.0.0)",
  "flask (>=3.1.2,<4.0.0)",
  "linkml (==1.9.2)",
]

[tool.poetry]
requires-poetry = ">=2.0"
version = "0.0.0"

[tool.poetry.requires-plugins]
poetry-dynamic-versioning = ">=1.5.2"

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "pep440"

[tool.poetry.group.dev.dependencies]
# linkml = ">=1.3.5"
mkdocs-material = ">=8.2.8"
mkdocs-mermaid2-plugin = ">=1.1.1"
schemasheets = ">=0.1.14"
jupyter = ">=1.0.0"
mknotebooks = ">= 0.8.0"

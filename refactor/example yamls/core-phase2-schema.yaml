id: https://w3id.org/MONet/xrf-phase2-example
name: core-phase2-schema
description: |-
  Minimal Phase 2 schema showing the new core elements (EAV & provenance)

imports:
  - linkml:types
  - xrf-xrd-phase2-schema.yaml
  - lcms-phase2-schema.yaml

classes:

  # ============================================================================
  # Existing tables that need to be revisited or updated
  #  SAMPLE TABLE !TODO decide how Campaigns are represented
  # ============================================================================

  Sample:
    description: |-
      Physical sample collected from environment.
      1:1 with Entity via entity_id foreign key.
    attributes:
      entity_id:
        identifier: true
        range: Entity
        required: true
      sample_name:
        range: string
        required: true
      proposal_id:
        range: integer
      collection_date:
        range: date
      site:
        range: string

  Instrument:
    description: |-
      Physical instrument metadata. Maps to NMDC Instrument.
      Instruments are persistent entities, not activities.
      Activities reference via was_associated_with or Used(role=instrument_used).
    attributes:
      entity_id:
        identifier: true
        range: uuid
        required: true
      name:
        description: Human-readable name (e.g., "EMSL QExactive Plus #3")
        range: string
        required: true
        examples:
          - value: "EMSL QExactive Plus #3"
      manufacturer:
        range: string
        examples:
          - value: "Thermo Fisher Scientific"
      model:
        range: string
        examples:
          - value: "Q Exactive Plus Hybrid Quadrupole-Orbitrap"
      serial_number:
        description: Instrument instance specifier
        range: string
      institution:
        range: string
        examples:
          - value: "PNNL-EMSL"

  # ============================================================================
  # PHASE 2 CORE TABLES (Universal Semantic Layer)
  # ============================================================================

  Entity:
    description: |-
      Universal semantic layer - all "things" get an entity_id.
      Samples, products, wells, protocols are all entities.
    attributes:
      entity_id:
        identifier: true
        range: uuid
        required: true

  Activity:
    description: |-
      Unified base for all timestamped actions (sampling, processing, analysis).
      Replaces legacy samplingActivity, analysisActivity, etc.
      No activity subtype tables needed for LC-MS - protocols are separate entities.
      
      Activity types map to NMDC:
      - lcms_acquisition → MassSpectrometry
      - lcms_feature_extraction → MetabolomicsAnalysis (part 1)
      - lcms_compound_identification → MetabolomicsAnalysis (part 2)
      - lcms_workflow_execution → MetabolomicsAnalysis (full)
    attributes:
      activity_id:
        identifier: true
        range: uuid
        required: true
      activity_type:
        description: The type of activity (e.g., 'xrf_analysis', 'sampling', 'ecoplating', lcms_acquisition, lcms_feature_extraction, etc.)
        range: string
        required: true
      name:
        description: Human-readable activity name
        range: string
      started_at_time:
        range: datetime
        required: true
      ended_at_time:
        range: datetime
      entity_id:
        description: Links to Entity for EAV metadata attachment
        range: uuid


  ActivityProtocol:
    description: |-
      Explicit storage for reusable procedure definitions (SOPs, workflows).
      Protocols are entities themselves (can have metadata via EAV).
      
      Example here for XRF: Can store vendor protocol URL or detailed SOP.
    attributes:
      entity_id:
        identifier: true
        range: Entity
        required: true
      protocol_name:
        description: Human-readable protocol name
        range: string
        required: true
        examples:
          - value: "EMSL XRF Standard Operating Procedure v2.1"
      protocol_version:
        description: Version identifier
        range: string
        examples:
          - value: "2.1"
          - value: "2024-03-15"
      protocol_url:
        description: URL to external protocol documentation
        range: string
        examples:
          - value: "https://vendor.com/xrf-protocol-v2.1"
      protocol_type:
        description: Type of protocol (mass_spectrometry_configuration, chromatography_configuration, calibration)
        range: string
        examples:
          - value: "vendor_standard"
          - value: "custom_sop"
          - value: "emsl_method"
      description:
        description: Brief description of the protocol
        range: string



  # ============================================================================
  # PROV-O RELATIONSHIPS (M:N)
  # ============================================================================

  Used:
    description: |-
        M:N relationship tracking which entities an activity consumed as inputs.
        Points FROM entity TO activity (this activity used these entities).
        - Activity --[Used(role=input_sample)]--> Sample
        - Activity --[Used(role=mass_spectrometry_configuration)]--> MassSpecProtocol
        - Activity --[Used(role=chromatography_configuration)]--> ChromatographyProtocol
    attributes:
      entity_id:
        identifier: true
        range: Entity
        required: true
      activity_id:
        identifier: true
        range: Activity
        required: true
        
        
  WasGeneratedBy:
    description: |-
        M:N relationship tracking which entities an activity produced as outputs.
        Points FROM entity TO activity (this entity was generated by this activity).
        - mzML File Entity --[WasGeneratedBy]--> Acquisition Activity
        - Feature Table Entity --[WasGeneratedBy]--> Feature Extraction Activity
        - MetaboliteIdentification Entity --[WasGeneratedBy]--> Annotation Activity
    attributes:
      entity_id:
        identifier: true
        range: Entity
        required: true
      activity_id:
        identifier: true
        range: Activity
        required: true

  # ============================================================================
  # EAV PATTERN (Flexible Metadata)
  # ============================================================================

  Attribute:
    description: |-
      Dictionary of attribute keys for the EAV pattern.
      Examples: 'nickel_concentration_percent', 'instrument_serial_number', 'analyst_notes', 
      'spray_voltage_kv', 'capillary_temp_celsius', 'gnps_task_id'
    attributes:
      attribute_id:
        identifier: true
        range: uuid
        required: true
      key:
        description: The attribute name/key
        range: string
        required: true

  TypedAttributeValue:
    description: |-
      EAV storage for flexible, evolving metadata with typed value columns.
      Exactly one value column must be populated per row.
      
      Used for:
      - Run-specific instrument settings (spray voltage, AGC target)
      - Workflow parameters (software versions, git URLs)
      - Experimental notes and QC annotations
    attributes:
      entity_id:
        identifier: true
        range: Entity
        required: true
      attribute_id:
        identifier: true
        range: Attribute
        required: true
      value:
        description: String-encoded value (application handles typing)
        range: string
        required: true
id: https://w3id.org/MONet/analysis-api-schema/shoehorn-amp2
name: amp2-shoehorn
title: AMP2 Automated Chained Workflows — Shoehorn Integration
description: |-
  Shows how AMP2 (Automated Microbiology Pipeline 2) multi-step workflows
  fit into the EXISTING analysis-api schema using core-shoehorn.yaml additions.

  AMP2 context: Automated lab system that chains instrument steps
  (flow cytometry → cultivation → HPLC → isolation → proteomics).
  Key challenge: same physical culture entity is measured repeatedly and
  passes through multiple processing steps that each generate data products.

  Informed by: Montana's draft amp2-metadata-schema.yaml (Untitled-1) and
  2025-11-19 extension planning doc. Classes from that draft are mapped
  to existing schema tables below rather than introducing new Entity/Activity
  base tables.

  Core insight: the Montana's draft introduces Entity/Activity as new classes.
  In the shoehorn, those roles are already filled:
    Phase 2's Entity       ↔  sampleBase / processedSample (physical things)
    Phase 2's Activity     ↔  sampleProcessing + analysisActivity + workflowExecutionActivity
    parent_workflow_id       ↔  Phase 2's parent_execution_id

  Data flow (Workflow 1 example — Growth Screening):
    Sample(S1, type='mixed_culture', campaign_id='amp2')   [campaign_id ADDED]
      ↓ sampleProcessing("amp2_log_phase_establishment")
    ProcessedSample(PS_logphase, type='log_phase_culture')
      ↓ sampleProcessing("amp2_plate_setup")
          processing_steps: {plate_layout, media_composition, substrate_conc}
    ProcessedSample(PS_plate1, type='amp2_96well_plate')
      ↓ analysisActivity(type='amp2_od_read', timepoint_label='t=0')  [ADDED label]
      → WEA(type='amp2_od_measurement', parent=NULL)
      → processedData (summary_metrics: {well_ODs_at_t0})

      ↓ [incubation — no data, but a sampleProcessing records the event]
      ↓ sampleProcessing("amp2_incubation")
          processing_steps: {temp_celsius:25, duration_hours:24, rpm:200}

      ↓ analysisActivity(type='amp2_od_read', timepoint_label='t=24h') [ADDED label]
      → WEA(type='amp2_od_measurement', parent=WEA_t0)     [ADDED parent link]
      → processedData (summary_metrics: {well_ODs_at_t24})

      ↓ sampleProcessing("amp2_centrifugation") → ProcessedSample(supernatant plate)
      ↓ analysisActivity(type='amp2_hplc_analysis')
      → WEA(type='amp2_hplc', parent=WEA_t24)              [ADDED parent link]
      → processedData LCMSSupernatantProduct

      ↓ sampleProcessing("amp2_pellet_wash") → ProcessedSample(cell_pellet_plate)
      → [handoff to proteomics / multi-omics workflow]

imports:
  - linkml:types

classes:

  # ============================================================================
  # PHYSICAL ENTITY MAPPING (no new tables — uses existing hierarchy)
  # ============================================================================
  # Montana's:   → Existing schema:
  #   Strain         processedSample(type='strain')  or instrument metadata
  #   Media          sampleProcessing.processing_steps JSONB (not a table)
  #   StockCulture   processedSample(type='stock_culture')
  #   Sample         sample (existing)
  #   ProcessedSample processedSample (existing)
  #
  # These are NOT new tables. The existing type/enum columns carry the distinction.
  # Extend processedsampletype enum with: 'log_phase_culture', 'stock_culture',
  #   'amp2_96well_plate', 'cell_pellet', 'supernatant', 'isolation_colony'

  # ============================================================================
  # PRODUCT TABLES (new — no schema changes to existing tables)
  # ============================================================================

  AMP2ODProduct:
    description: |-
      Optical density (OD610) readings from a 96-well plate at one timepoint.
      One row per plate×timepoint. Raw values in summary_metrics JSONB.

      processedData.type          = 'amp2_od'
      processedData.summary_metrics [ADDED]:
        {"timepoint":"t=24h","wavelength_nm":610,
         "well_readings":{"A01":0.82,"A02":0.45,...},
         "blank_mean":0.07}

      analysisActivity.timepoint_label [ADDED]: 't=0' | 't=24h' | 't=48h'
      analysisActivity.sequence_order  [ADDED]: 0 | 1 | 2
      workflowExecutionActivity.parent_workflow_id [ADDED]: chains timepoints
    attributes:
      id:
        identifier: true
        range: uuid        # FK → processedData.id
        required: true
      wavelength_nm:
        description: Measurement wavelength (OD610 for most growth assays)
        range: integer
      plate_reader_model:
        description: Instrument model (e.g., BioTek Epoch2)
        range: string
      blank_mean_abs:
        description: Mean absorbance of blank/uninoculated wells
        range: float

  AMP2FlowCytometryProduct:
    description: |-
      Flow cytometry cell count and viability data from a culture sample.
      processedData.type = 'amp2_flow_cytometry'
      processedData.s3_key = path to FCS file in MinIO
      processedData.summary_metrics [ADDED]:
        {"total_events":50000,"live_cell_count":38200,"dead_cell_count":11800,
         "live_pct":76.4,"gating_strategy":"live_dead_calcein_pi"}

      workflowExecutionActivity.workflow_steps JSONB:
        {"instrument":"BD Accuri C6+","laser_config":"488nm/640nm",
         "threshold_FSC":10000,"gating":"live_dead",
         "sample_volume_ul":50,"flow_rate":"medium"}
    attributes:
      id:
        identifier: true
        range: uuid        # FK → processedData.id
        required: true
      total_events:
        range: integer
      live_cell_count:
        range: integer
      dead_cell_count:
        range: integer
      live_pct:
        range: float
      gating_strategy:
        description: Gating scheme applied (e.g., live_dead_calcein_pi)
        range: string

  AMP2HPLCProduct:
    description: |-
      HPLC organic acid / substrate analysis of culture supernatant.
      processedData.type = 'amp2_hplc_organic_acids'
      processedData.s3_key = raw chromatogram or integrated CSV
      processedData.summary_metrics [ADDED]:
        {"acetate_mM":2.3,"succinate_mM":0.5,"formate_mM":0.1,
         "substrate_remaining_pct":18.2}

      workflowExecutionActivity.workflow_steps JSONB:
        {"column":"Bio-Rad Aminex HPX-87H","mobile_phase":"5mM H2SO4",
         "flow_rate_ml_min":0.6,"temp_celsius":65,
         "runtime_min":35,"detector":"UV_210nm"}

      Chained via parent_workflow_id [ADDED] to the OD or flow cytometry WEA
      that preceded it in the same plate's timeline.
    attributes:
      id:
        identifier: true
        range: uuid        # FK → processedData.id
        required: true
      substrate_id:
        description: Carbon source being tracked (matches plate layout)
        range: string
      substrate_remaining_pct:
        description: Percentage of original substrate remaining
        range: float

  AMP2StrainPurityProduct:
    description: |-
      Purity assessment result for an isolation or stock culture.
      Maps to Montana's StrainPurity activity output.
      processedData.type = 'amp2_strain_purity'
      processedData.summary_metrics [ADDED]:
        {"purity_pct":98.5,"inspection_method":"colony_morphology",
         "contaminants_detected":false,"target_strain":"Pseudomonas_putida_KT2440"}

      workflowExecutionActivity.workflow_steps JSONB:
        {"container_type":"agar_plate","incubation_hours":48,
         "temp_celsius":30,"inspection_method":"colony_morphology",
         "target_strain":"Pseudomonas_putida_KT2440",
         "contaminant_strains":[]}
    attributes:
      id:
        identifier: true
        range: uuid        # FK → processedData.id
        required: true
      purity_pct:
        range: float
      contaminants_detected:
        range: boolean
      target_strain_name:
        range: string

  # ============================================================================
  # WORKFLOW CHAINING — what uses parent_workflow_id [ADDED in core-shoehorn]
  # ============================================================================
  # The following table is documentation-only; it shows example DB records
  # to make the chaining concrete. Not a schema class.
  #
  # workflowExecutionActivity records for an AMP2 Workflow 1 chain:
  #
  # WEA_id         | type                    | parent_workflow_id | workflow_steps (key excerpts)
  # ---------------|-------------------------|--------------------|-------------------------------
  # wea-001        | amp2_plate_setup        | NULL               | {plate_layout, media, substrate_mM}
  # wea-002        | amp2_od_measurement     | wea-001            | {timepoint:'t=0', wavelength:610}
  # wea-003        | amp2_incubation         | wea-002            | {temp_c:25, duration_h:24, rpm:200}
  # wea-004        | amp2_od_measurement     | wea-003            | {timepoint:'t=24h', wavelength:610}
  # wea-005        | amp2_centrifugation     | wea-004            | {speed_g:5000, duration_min:10}
  # wea-006        | amp2_hplc_organic_acids | wea-005            | {column:'Aminex HPX-87H',...}
  # wea-007        | amp2_flow_cytometry     | wea-005            | {instrument:'BD Accuri C6+',...}
  # wea-008        | amp2_pellet_wash        | wea-005            | {wash_buffer:'PBS',repeats:2}
  # wea-009        | amp2_proteomics_handoff | wea-008            | {lab:'EMSL','handoff_date':'...'}
  #
  # Ancestry from wea-009 back to original sample:
  #   WITH RECURSIVE chain AS (
  #     SELECT id, type, parent_workflow_id FROM "workflowExecutionActivity"
  #     WHERE id = 'wea-009'
  #     UNION ALL
  #     SELECT w.id, w.type, w.parent_workflow_id
  #     FROM "workflowExecutionActivity" w JOIN chain c ON w.id = c.parent_workflow_id
  #   )
  #   SELECT * FROM chain;
  #   -- returns wea-009 through wea-001 (8 hops)
  #   -- then join to processingSampleLink to get to the original sample

slots:

  amp2_workflow_steps_plate_setup:
    description: |-
      [Documentation only — stored in workflowExecutionActivity.workflow_steps JSONB]
      Expected keys for amp2_plate_setup WEA:
        plate_type: "96_well_deep"
        inoculum_source_id: "PS_log_phase_001"
        transfer_volume_ul: 5
        media_composition: "R2A + 10mM succinate"
        substrate_concentration_mM: 10
        treatment_variable: "nickel_pct"
        treatments: [0.0, 0.5, 1.0, 2.0]
        replicates_per_treatment: 6
        uninoculated_wells: ["H11", "H12"]
        tempest_protocol_version: "2.3"
    range: string

  amp2_workflow_steps_cultivation:
    description: |-
      [Documentation only — stored in workflowExecutionActivity.workflow_steps JSONB]
      Expected keys for amp2_incubation WEA:
        incubation_temp_celsius: 25
        duration_hours: 24
        agitation_speed_rpm: 200
        atmosphere: "aerobic"
        humidity_pct: 85
    range: string

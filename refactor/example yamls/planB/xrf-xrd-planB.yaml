id: https://w3id.org/MONet/analysis-api-schema/shoehorn-xrf-xrd
name: xrf-xrd-shoehorn
title: XRF / XRD Elemental & Mineralogical Analysis — Shoehorn Integration
description: |-
  Shows how XRF (elemental) and XRD (mineralogical) data fit into the
  EXISTING analysis-api schema with only core-shoehorn.yaml additions.

  These are among the simplest shoehorn cases: each is a single-step
  analysis with no workflow chaining. One analysisActivity → one set of
  processedData records. No parent_workflow_id needed.

  Data flow (XRF):
    processedSample(soil replicate)
      → analysisActivity(type='xrf_elemental_analysis')
          protocol_url: "https://emsl.pnnl.gov/xrf-sop-v2.1"
          instrument_id → instrument(name='Rigaku ZSX Primus IV')
      → [no workflowExecutionActivity — direct instrument output]
      → processedData XRFElementalProduct × N_elements
          summary_metrics: {"Ni_mg_kg":45.3,"Pb_mg_kg":8.2,"qc":"OK"}
          s3_key: "xrf/raw/sample_001_spectrum.csv"

  Data flow (XRD):
    processedSample(soil replicate, ground powder)
      → analysisActivity(type='xrd_mineralogy')
      → processedData XRDPhaseProduct × N_phases
          summary_metrics: {"quartz_pct":42,"feldspar_pct":18,"clay_pct":31}
          s3_key: "xrd/raw/sample_001_diffractogram.xy"

  NOTE: If instrument acquisition produces a raw file that is THEN processed
  computationally (e.g., Rietveld refinement script), add a
  workflowExecutionActivity with type='xrd_rietveld_refinement' and point
  processedData.workflow_id there. XRF typically skips this step.

imports:
  - linkml:types

classes:

  # ============================================================================
  # XRF PRODUCT TABLE
  # ============================================================================

  XRFElementalProduct:
    description: |-
      One row per element per sample per analysis event.
      Queryable without file download for range filters (e.g., Ni > 50 mg/kg).
      1:1 linkage: this table's id = processedData.id FK.

      Relationship to existing tables:
        processedData.type = 'xrf_elemental'
        processedData.workflow_id = NULL (direct acquisition; no computational WEA)
        processedData.summary_metrics = {"Ni_mg_kg":45.3,"Pb_mg_kg":8.2,…}
        processedData.s3_key = path to raw spectrum or calibrated CSV in MinIO
    attributes:
      id:
        identifier: true
        range: uuid        # FK → processedData.id
        required: true
      element_symbol:
        description: IUPAC chemical symbol (Ni, Pb, As, Cr, Fe, …)
        range: string
        required: true
        examples:
          - value: "Ni"
          - value: "Pb"
      concentration_mg_per_kg:
        description: Elemental concentration in mg/kg (ppm dry weight basis)
        range: float
        required: true
      qc_flag:
        description: OK | BELOW_DETECTION_LIMIT | HIGH_UNCERTAINTY | MATRIX_INTERFERENCE
        range: string
      detection_limit_mg_per_kg:
        description: Method detection limit for this element in this matrix
        range: float

  # ============================================================================
  # XRD PRODUCT TABLE
  # ============================================================================

  XRDPhaseProduct:
    description: |-
      One row per identified mineral phase per sample per analysis event.
      1:1 linkage: this table's id = processedData.id FK.

      Relationship to existing tables:
        processedData.type = 'xrd_phase'
        processedData.workflow_id → workflowExecutionActivity(type='xrd_rietveld')
          if refinement is computational; NULL if manual/semi-quantitative
        processedData.summary_metrics = {"quartz_pct":42,"feldspar_pct":18,…}
        processedData.s3_key = diffractogram .xy or .xrdml file in MinIO
    attributes:
      id:
        identifier: true
        range: uuid        # FK → processedData.id
        required: true
      mineral_name:
        description: RRUFF-standard mineral name
        range: string
        required: true
        examples:
          - value: "quartz"
          - value: "kaolinite"
          - value: "montmorillonite"
      weight_percent:
        description: Quantified abundance by weight percent
        range: float
      qc_flag:
        description: OK | TRACE | ESTIMATED | AMORPHOUS_BACKGROUND
        range: string
      rruff_id:
        description: RRUFF database reference ID for phase identification
        range: string
        examples:
          - value: "R040031"

  # ============================================================================
  # EXISTING SLOTS USED (no change)
  # ============================================================================
  # analysisActivity.type        = 'xrf_elemental_analysis' | 'xrd_mineralogy'
  #                                 (new values; extend routemethod enum)
  # analysisActivity.protocol_url = vendor SOP URL or EMSL internal SOP
  # analysisActivity.instrument_id → instrument (Rigaku, Bruker, etc.)
  # analysisActivity.analyte_id  → processedSample (soil replicate)
  #
  # No workflowExecutionActivity needed for XRF direct output.
  # XRD computational refinement: add WEA with type='xrd_rietveld_refinement'
  #   and populate workflow_steps JSONB:
  #   {"software":"HighScore_Plus","version":"5.1","method":"Rietveld",
  #    "r_factor":0.042,"gof":1.8}
  #
  # processedData.summary_metrics [ADDED in core-shoehorn]:
  #   XRF: {"Ni_mg_kg":45.3,"Pb_mg_kg":8.2,"As_mg_kg":12.1,"qc":"OK"}
  #   XRD: {"quartz_pct":42,"feldspar_pct":18,"clay_pct":31,"amorphous_pct":9}

slots:

  xrf_workflow_steps:
    description: |-
      [Documentation only — stored in workflowExecutionActivity.workflow_steps JSONB
       IF a computational processing step exists; otherwise inline on analysisActivity
       or omitted for simple direct-output instruments]
      Expected keys for xrf instrument run:
        instrument: "Rigaku ZSX Primus IV"
        beam_voltage_kv: 50
        measurement_duration_sec: 100
        matrix_correction: "fundamental_parameters"
        calibration_date: "2025-11-01"
        operator_id: "emsl_user_xyz"
    range: string

id: https://w3id.org/MONet/analysis-api-schema/plate-general
name: plate-general
title: 96-Well Plate General Pattern — Harmonized AMP2 + Ecoplate
description: |-
  Unified schema for 96-well plate workflows across AMP2 and Ecoplate.
  
  Where AMP2 and Ecoplate differ:
    AMP2:     Media is a REUSABLE ENTITY (processedSample with stable recipe).
              Wells store: media_id (FK) + well-specific metadata (volume, replicate).
    
    Ecoplate: Media is ON-THE-FLY PER-WELL EXPERIMENTAL DESIGN.
              Wells store: carbon_ or nickel_source, treatment, volumes inline (no media_id).
  
  Harmonization strategy:
    1. Abstract PlateSetupActivity with common slots (plate_type, temp, operator)
    2. AMP2PlateSetupActivity: adds media_id slot + minimal per-well metadata
    3. EcoplatePlateSetupActivity: no media_id + rich per-well experimental design
    4. Key-value pairs ONLY for truly variable/experimental metadata
  
  Data flow (AMP2):
    sample → MediaPrepProcessing → processedSample(prepared_media)
      → AMP2PlateSetupActivity(media_id=prepared_media) → processedSample(amp2_96well_plate)
        → AMP2AnalysisActivity(timepoint, sequence_order) → AMP2ODProduct
  
  Data flow (Ecoplate):
    sample → soil_extract_prep → processedSample(soil_extract)
      → EcoplatePlateSetupActivity(per_well_design) → processedSample(ecoplate_plate)
        → EcoplateAnalysisActivity(timepoint, sequence_order) → EcoplateAbsorbanceProduct

imports:
  - linkml:types

# =============================================================================
# GLOBAL SLOTS — shared across multiple plate-related classes
# =============================================================================

slots:

  # --- PlateSetupActivity common slots ---
  plate_type:
    description: Vendor and model (e.g., "Greiner_96well_flat_bottom")
    range: string
    required: true

  plate_barcode:
    description: Physical barcode on plate (if different from UUID)
    range: string

  setup_date:
    description: When the plate was set up
    range: datetime
    required: true

  setup_operator_id:
    description: Person who set up the plate
    range: personValue

  setup_instrument:
    description: Automated liquid handler (e.g., "Hamilton_STAR") or "manual"
    range: string

  incubation_temp_celsius:
    description: Incubation temperature
    range: float

  incubation_rpm:
    description: Shaking speed (0 for static incubation)
    range: integer

  sealing_method:
    description: How the plate is sealed (e.g., "BreathEasy_membrane", "adhesive_film")
    range: string

  # --- AMP2-specific: reusable media reference ---
  media_id:
    description: |-
      FK to processedSample(type='prepared_media').
      Used by AMP2 workflows where media is a reusable entity.
      Wells on the plate inherit media composition from this batch.
    range: processedSample

  # --- Per-well metadata stored as structured inline data ---
  well_metadata:
    description: |-
      Structured per-well data. Format varies by activity type:
        - AMP2: minimal (position, volumes, replicate_group) — media_id carries composition
        - Ecoplate: rich (position, carbon_source, treatment, volumes) — no media_id
    range: WellMetadata
    multivalued: true  # Array of 96 well objects embedded in the PlateSetupActivity record

  # --- PlateProduct common slots ---
  wavelength_nm:
    description: Measurement wavelength (e.g., 590 for Ecoplate, 610 for AMP2 OD)
    range: integer
    required: true

  timepoint_label:
    description: Human-readable timepoint (e.g., "t=0", "t=24h")
    range: string
    required: true

  plate_average:
    description: Mean measurement across all sample wells (excludes blanks)
    range: float

  blank_mean:
    description: Mean measurement of uninoculated control wells
    range: float

  cv_percent:
    description: Coefficient of variation across technical replicates
    range: float

  # --- Per-well readings stored as structured inline data ---
  well_readings:
    description: |-
      Structured per-well measurement data.
      Lightweight summary for SQL queries without file download.
      Raw data still in MinIO via processedData.s3_key.
    range: WellReading
    multivalued: true  # Array of 96 well reading objects embedded in the PlateProduct record

# =============================================================================
# STRUCTURED INLINE DATA CLASSES
# These are NOT separate database tables — they're embedded within other records.
# Think of them as "value objects" or structured types.
# =============================================================================

classes:

  # ---------------------------------------------------------------------------
  # WellMetadata — embedded in PlateSetupActivity.well_metadata
  # Base class with common fields; subclasses add type-specific fields
  # ---------------------------------------------------------------------------
  WellMetadata:
    description: |-
      Base structure for per-well metadata in plate setup.
      NOT a database table — embedded as structured data in PlateSetupActivity.
      Subclasses add type-specific fields.
    attributes:
      position:
        description: Well position (e.g., "A01", "H12")
        range: string
        required: true
      well_type:
        description: "sample" | "blank" | "uninoculated_control" | "standard"
        range: string
      replicate_group:
        description: Identifier linking technical replicates (e.g., "rep1"), COULD USE BATCH HERE
        range: string

  AMP2WellMetadata:
    is_a: WellMetadata
    description: |-
      AMP2-specific well metadata.
      Minimal — media_id on parent PlateSetupActivity carries composition.
    attributes:
      media_volume_ul:
        description: Volume of media added to this well
        range: float
        required: true
      inoculum_volume_ul:
        description: Volume of inoculum added (0 for blanks)
        range: float
        required: true
      # Optional: for AMP2 variable substrate plates (uncommon)
      variable_additive:
        description: Key-value pairs for per-well experimental variables
        range: string  # e.g., {"substrate": "xylose", "concentration_mM": 5}

  EcoplateWellMetadata:
    is_a: WellMetadata
    description: |-
      Ecoplate-specific well metadata.
      Rich — no media_id; carbon source and treatment are per-well experimental design.
    attributes:
      media_volume_ul:
        description: Volume of inoculum suspension added
        range: float
        required: true
      carbon_source:
        description: Carbon source in this well (e.g., "L-malic acid", "glucose")
        range: string
        required: true
      treatment:
        description: Experimental treatment (e.g., "control", "nickel_1pct")
        range: string
      treatment_concentration:
        description: Treatment concentration with unit (e.g., "1.0 pct", "10 mM")
        range: string

  # ---------------------------------------------------------------------------
  # WellReading — embedded in PlateProduct.well_readings
  # Lightweight per-well measurement summary
  # ---------------------------------------------------------------------------
  WellReading:
    description: |-
      Per-well measurement data.
      NOT a database table — embedded as structured data in PlateProduct.
      Lightweight summary for queries; raw data in MinIO.
    attributes:
      position:
        description: Well position (e.g., "A01")
        range: string
        required: true
      value:
        description: Measured value (absorbance, OD, fluorescence)
        range: float
        required: true
      flag:
        description: QC flag ("ok" | "blank" | "outlier" | "contaminated")
        range: string

# =============================================================================
# ACTIVITY CLASSES — processing activities that create plate entities
# =============================================================================

  MediaPrepProcessing:
    is_a: sampleProcessing
    description: |-
      Media preparation activity (AMP2 only).
      Creates processedSample(type='prepared_media') with stable recipe metadata.
      
      Stores recipe as structured slots (not key-value) in processedSample attributes
      or as key-value pairs in processing_steps ONLY if truly variable per batch.
      
      Linked via processingSampleLink:
        Input:  sample(type='mixed_culture') or processedSample(type='stock_culture')
        Output: processedSample(type='prepared_media')
    slots:
      # Inherits from sampleProcessing: analysis_type, method_name, url, version
      # processing_steps can use key-value pairs for batch-specific experimental metadata
      - recipe_name
      - carbon_source
      - carbon_concentration
      - buffer_system
      - ph_value
      - preparation_date
      - sterility_check

  PlateSetupActivity:
    is_a: sampleProcessing
    abstract: true
    description: |-
      Abstract base for 96-well plate setup activities.
      Common slots for plate-level metadata; subclasses differ in how they handle
      well-level metadata (media_id for AMP2 vs per-well design for Ecoplate).
    slots:
      - plate_type
      - plate_barcode
      - setup_date
      - setup_operator_id
      - setup_instrument
      - incubation_temp_celsius
      - incubation_rpm
      - sealing_method
      - well_metadata      # Format varies by subclass

  AMP2PlateSetupActivity:
    is_a: PlateSetupActivity
    description: |-
      AMP2-specific plate setup.
      Wells reference media_id (FK to prepared_media processedSample).
      well_metadata stores minimal per-well data (position, volumes, replicate).
      
      Linked via processingSampleLink:
        Input:  processedSample(type='prepared_media')  ← media_id references this
        Output: processedSample(type='amp2_96well_plate')
    slots:
      - media_id           # FK to processedSample(type='prepared_media')
      # well_metadata contains AMP2WellMetadata instances (position, volumes, replicate_group)

  EcoplatePlateSetupActivity:
    is_a: PlateSetupActivity
    description: |-
      Ecoplate-specific plate setup.
      No media_id — carbon source and treatment are per-well experimental design.
      well_metadata stores rich per-well data (position, carbon_source, treatment, volumes).
      
      Linked via processingSampleLink:
        Input:  processedSample(type='soil_extract')
        Output: processedSample(type='ecoplate_plate')
    # NO media_id slot
    # well_metadata contains EcoplateWellMetadata instances (position, carbon_source, treatment, volumes)

# =============================================================================
# ANALYSIS ACTIVITY CLASSES — instrument measurements of plates
# =============================================================================

  PlateAnalysisActivity:
    is_a: analysisActivity
    abstract: true
    description: |-
      Abstract base for plate measurement activities.
      Common slots for temporal series tracking; subclasses add type-specific metadata.
    slots:
      - timepoint_label    # "t=0", "t=24h", etc. [ADDED in core-planB]
      - sequence_order     # 0, 1, 2, ... [ADDED in core-planB]
      # Inherits from analysisActivity: type, analyte_id (→ processedSample plate),
      #   acquisition_time, instrument_id, protocol_url, operator_id

  AMP2AnalysisActivity:
    is_a: PlateAnalysisActivity
    description: |-
      AMP2 plate measurement (OD, fluorescence, flow cytometry).
      analyte_id → processedSample(type='amp2_96well_plate')
    slots:
      - measurement_type   # "optical_density" | "fluorescence" | "flow_cytometry"
      - wavelength_nm      # if applicable

  EcoplateAnalysisActivity:
    is_a: PlateAnalysisActivity
    description: |-
      Ecoplate absorbance measurement.
      analyte_id → processedSample(type='ecoplate_plate')
    slots:
      - wavelength_nm      # typically 590 for Biolog Ecoplates

# =============================================================================
# PRODUCT CLASSES — data products from plate measurements
# =============================================================================

  PlateProduct:
    is_a: dataProduct
    abstract: true
    description: |-
      Abstract base for plate measurement data products.
      Common slots for plate-level summary metrics; subclasses add type-specific fields.
    slots:
      - wavelength_nm
      - timepoint_label
      - plate_average
      - blank_mean
      - cv_percent
      - well_readings      # Embedded WellReading structures
      # Inherits from dataProduct: id, name, s3_key, s3_bucket, filesize, md5checksum

  AMP2ODProduct:
    is_a: PlateProduct
    description: |-
      AMP2 optical density measurement product.
      One row per plate × timepoint.
      processedData.type = 'amp2_od'
    slots:
      - plate_reader_model
      # well_readings contain WellReading instances (position, value, flag)

  EcoplateAbsorbanceProduct:
    is_a: PlateProduct
    description: |-
      Ecoplate absorbance measurement product.
      One row per plate × timepoint.
      processedData.type = 'ecoplate_absorbance'
    slots:
      - plate_lot          # Manufacturer lot number for QC
      - uninoculated_mean  # Mean of uninoculated control wells (baseline)
      - average_well_color_development  # AWCD metric
      # well_readings contain WellReading instances (position, value, flag)

# =============================================================================
# ADDITIONAL SLOTS FOR MEDIA/RECIPE METADATA
# Used by MediaPrepProcessing and/or as attributes on prepared_media processedSample
# =============================================================================

  recipe_name:
    description: Standardized recipe identifier (e.g., "M9_minimal_glucose")
    range: string

  carbon_source:
    description: Primary carbon substrate
    range: string

  carbon_concentration:
    description: Carbon substrate concentration with unit
    range: string

  buffer_system:
    description: Buffer type (e.g., "phosphate", "HEPES")
    range: string

  ph_value:
    description: Measured pH value
    range: float

  preparation_date:
    description: Date media was prepared
    range: date

  sterility_check:
    description: QC sterility check result ("pass" | "fail")
    range: string

# =============================================================================
# EXAMPLE USAGE PATTERNS
# =============================================================================
# 
# AMP2 Workflow:
# --------------
# 1. sample(mixed_culture)
#    → MediaPrepProcessing(recipe_name="M9_minimal", carbon_source="glucose", ph=7.0)
#    → processedSample(PS_media, type='prepared_media')
# 
# 2. PS_media
#    → AMP2PlateSetupActivity(media_id=PS_media, plate_type="Greiner_96well",
#                              well_metadata=[
#                                {position:"A01", media_volume_ul:200, inoculum_volume_ul:10, replicate_group:"rep1"},
#                                {position:"A02", media_volume_ul:200, inoculum_volume_ul:10, replicate_group:"rep1"},
#                                ...
#                              ])
#    → processedSample(PS_plate, type='amp2_96well_plate')
# 
# 3. PS_plate
#    → AMP2AnalysisActivity(analyte_id=PS_plate, timepoint_label="t=0", sequence_order=0,
#                           measurement_type="optical_density", wavelength_nm=610)
#    → workflowExecutionActivity(parent_workflow_id=NULL)
#    → AMP2ODProduct(timepoint_label="t=0", plate_average=0.08, blank_mean=0.07,
#                    well_readings=[{position:"A01", value:0.09, flag:"ok"}, ...])
# 
# 4. PS_plate (same entity, repeated measurement)
#    → AMP2AnalysisActivity(analyte_id=PS_plate, timepoint_label="t=24h", sequence_order=1, ...)
#    → workflowExecutionActivity(parent_workflow_id=WEA_t0)  [CHAINS to previous]
#    → AMP2ODProduct(timepoint_label="t=24h", plate_average=0.52, ...)
# 
# 
# Ecoplate Workflow:
# ------------------
# 1. sample(soil_core)
#    → soil_extract_prep → processedSample(PS_extract, type='soil_extract')
# 
# 2. PS_extract
#    → EcoplatePlateSetupActivity(plate_type="Biolog_EcoPlate",
#                                  well_metadata=[
#                                    {position:"A01", media_volume_ul:150, carbon_source:"L-malic acid",
#                                     treatment:"control", treatment_concentration:"0 mM", replicate_group:"rep1"},
#                                    {position:"A02", media_volume_ul:150, carbon_source:"L-malic acid",
#                                     treatment:"nickel_1pct", treatment_concentration:"1.0 pct", replicate_group:"rep1"},
#                                    ...
#                                  ])
#    → processedSample(PS_plate, type='ecoplate_plate')
# 
# 3. PS_plate
#    → EcoplateAnalysisActivity(analyte_id=PS_plate, timepoint_label="t=0", sequence_order=0,
#                               wavelength_nm=590)
#    → workflowExecutionActivity(parent_workflow_id=NULL)
#    → EcoplateAbsorbanceProduct(timepoint_label="t=0", wavelength_nm=590,
#                                plate_average=0.12, uninoculated_mean=0.08,
#                                well_readings=[{position:"A01", value:0.14, flag:"ok"}, ...])
# 
# 4. PS_plate (same entity, repeated measurement)
#    → EcoplateAnalysisActivity(analyte_id=PS_plate, timepoint_label="t=24h", sequence_order=1, ...)
#    → workflowExecutionActivity(parent_workflow_id=WEA_t0)  [CHAINS to previous]
#    → EcoplateAbsorbanceProduct(timepoint_label="t=24h", plate_average=0.42, ...)
# 
# 
# Query Examples:
# ---------------
# 
# Q1: Get media recipe for an AMP2 plate
# SELECT media.* 
# FROM processedSample plate
# JOIN processingSampleLink psl_out ON psl_out.sample_base_id = plate.id AND psl_out.role = 'output'
# JOIN sampleProcessing plate_setup ON plate_setup.id = psl_out.processing_id
# JOIN processingSampleLink psl_in ON psl_in.processing_id = plate_setup.id AND psl_in.role = 'input'
# JOIN processedSample media ON media.id = psl_in.sample_base_id
# WHERE plate.id = 'plate-uuid' AND plate.processed_sample_type = 'amp2_96well_plate';
# 
# Q2: Find all plates from original sample (fast via linkage_cache)
# SELECT ps.*
# FROM linkage_cache lc
# JOIN processedSample ps ON ps.id = lc.descendant_id
# WHERE lc.ancestor_id = 'original-sample-uuid'
#   AND lc.descendant_type = 'processedSample'
#   AND ps.processed_sample_type IN ('amp2_96well_plate', 'ecoplate_plate');
# 
# Q3: Find all products from a plate (multi-timepoint series)
# SELECT pd.*
# FROM linkage_cache lc
# JOIN processedData pd ON pd.id = lc.descendant_id
# WHERE lc.ancestor_id = 'plate-uuid'
#   AND lc.descendant_type = 'processedData'
# ORDER BY pd.name;

HARMONIZED 96-WELL PLATE SCHEMA

┌─────────────────────────────────────────────────────────────────┐
│ ABSTRACT BASE CLASSES (shared patterns)                         │
└─────────────────────────────────────────────────────────────────┘

📋 ACTIVITIES (Processing)
  ├─ MediaPrepProcessing (AMP2 only)
  │    Creates: processedSample(type='prepared_media')
  │
  ├─ PlateSetupActivity (abstract)
  │    ├─ AMP2PlateSetupActivity
  │    │    • Has: media_id (FK to prepared_media)
  │    │    • well_metadata: minimal (volumes, replicate)
  │    │    Creates: processedSample(type='amp2_96well_plate')
  │    │
  │    └─ EcoplatePlateSetupActivity
  │         • No media_id
  │         • well_metadata: rich (carbon_source, treatment, volumes)
  │         Creates: processedSample(type='ecoplate_plate')
  │
  └─ PlateAnalysisActivity (abstract)
       ├─ AMP2AnalysisActivity (OD/fluorescence measurements)
       └─ EcoplateAnalysisActivity (absorbance measurements)

📊 PRODUCTS (Data)
  └─ PlateProduct (abstract)
       ├─ AMP2ODProduct
       └─ EcoplateAbsorbanceProduct

🔬 EMBEDDED WELL METADATA (not separate tables)
  └─ WellMetadata (base: position, well_type, replicate_group)
       ├─ AMP2WellMetadata
       │    Adds: media_volume_ul, inoculum_volume_ul, variable_additive
       │
       └─ EcoplateWellMetadata
            Adds: media_volume_ul, carbon_source, treatment, treatment_concentration

📈 EMBEDDED WELL READINGS (not separate tables)
  └─ WellReading (position, value, flag)

  AMP2 WORKFLOW
═════════════════════════════════════════════════════════════════

Step 1: Media Preparation
┌──────────────────────────────────────────────────────────────┐
│ MediaPrepProcessing                                          │
│   recipe_name: "M9_minimal_glucose"                          │
│   carbon_source: "glucose"                                   │
│   carbon_concentration: "10 mM"                              │
│   ph_value: 7.0                                              │
│   buffer_system: "phosphate"                                 │
│ ────────────────────────────────────────────────────────────│
│ Creates: processedSample(PS_media_001, type='prepared_media')│
└──────────────────────────────────────────────────────────────┘

Step 2: Plate Setup
┌──────────────────────────────────────────────────────────────┐
│ AMP2PlateSetupActivity                                       │
│   media_id: PS_media_001  ← references media entity above    │
│   plate_type: "Greiner_96well_flat_bottom"                   │
│   setup_date: 2026-03-20T14:30:00Z                           │
│   incubation_temp_celsius: 25                               │
│   well_metadata: [                      ← ARRAY OF OBJECTS   │
│     {                                                        │
│       position: "A01",                                       │
│       media_volume_ul: 200,                                  │
│       inoculum_volume_ul: 10,                                │
│       replicate_group: "rep1"                                │
│     },                                                       │
│     {position: "A02", ...},                                  │
│     ...                                                      │
│   ]                                                          │
│ ────────────────────────────────────────────────────────────│
│ Creates: processedSample(PS_plate_001, type='amp2_96well_plate')│
└──────────────────────────────────────────────────────────────┘

Step 3: Measurement (repeated over time)
┌──────────────────────────────────────────────────────────────┐
│ AMP2AnalysisActivity                                         │
│   analyte_id: PS_plate_001  ← same plate, repeated           │
│   timepoint_label: "t=0"                                     │
│   sequence_order: 0                                          │
│   measurement_type: "optical_density"                        │
│   wavelength_nm: 610                                         │
│ ────────────────────────────────────────────────────────────│
│ Creates: AMP2ODProduct                                       │
│   timepoint_label: "t=0"                                     │
│   plate_average: 0.08                                        │
│   blank_mean: 0.07                                           │
│   well_readings: [               ← ARRAY OF OBJECTS          │
│     {position: "A01", value: 0.09, flag: "ok"},             │
│     {position: "A02", value: 0.08, flag: "ok"},             │
│     ...                                                      │
│   ]                                                          │
└──────────────────────────────────────────────────────────────┘


ECOPLATE WORKFLOW
═════════════════════════════════════════════════════════════════

Step 1: Plate Setup (no separate media prep)
┌──────────────────────────────────────────────────────────────┐
│ EcoplatePlateSetupActivity                                   │
│   NO media_id  ← key difference from AMP2!                   │
│   plate_type: "Biolog_EcoPlate"                              │
│   setup_date: 2026-03-20T15:00:00Z                           │
│   well_metadata: [              ← RICH experimental design   │
│     {                                                        │
│       position: "A01",                                       │
│       media_volume_ul: 150,                                  │
│       carbon_source: "L-malic acid",    ← per-well variable  │
│       treatment: "control",                                  │
│       treatment_concentration: "0 mM",                       │
│       replicate_group: "rep1"                                │
│     },                                                       │
│     {                                                        │
│       position: "A02",                                       │
│       carbon_source: "L-malic acid",    ← same carbon        │
│       treatment: "nickel_1pct",         ← different treatment│
│       treatment_concentration: "1.0 pct",                    │
│       ...                                                    │
│     },                                                       │
│     ...                                                      │
│   ]                                                          │
│ ────────────────────────────────────────────────────────────│
│ Creates: processedSample(PS_plate_002, type='ecoplate_plate')│
└──────────────────────────────────────────────────────────────┘

Step 2: Measurement (repeated over time)
┌──────────────────────────────────────────────────────────────┐
│ EcoplateAnalysisActivity                                     │
│   analyte_id: PS_plate_002  ← same plate, repeated           │
│   timepoint_label: "t=0"                                     │
│   sequence_order: 0                                          │
│   wavelength_nm: 590                                         │
│ ────────────────────────────────────────────────────────────│
│ Creates: EcoplateAbsorbanceProduct                           │
│   well_readings: [{position: "A01", value: 0.14, ...}, ...]  │
└──────────────────────────────────────────────────────────────┘


KEY INSIGHT: well_metadata Storage
═════════════════════════════════════════════════════════════════
well_metadata is an ARRAY of structured objects, NOT a string:
  - In AMP2: array of AMP2WellMetadata instances (minimal info)
  - In Ecoplate: array of EcoplateWellMetadata instances (rich info)

These are embedded/nested within the PlateSetupActivity record—
NOT separate database table rows (96 rows would be too many).
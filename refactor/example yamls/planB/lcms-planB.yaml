id: https://w3id.org/MONet/analysis-api-schema/minimal-lcms
name: lcms-minimal
title: LC-MS Metabolomics — Minimal Integration
description: |-
  Shows how LC-MS metabolomics data fits into the EXISTING analysis-api schema
  with only the core-planB.yaml additions. No new provenance tables needed.

  Mapping principle:
    - One analysisActivity per acquisition (instrument run)
    - One workflowExecutionActivity per computational step (feature picking,
      annotation) — chained via parent_workflow_id
    - Typed product tables for each output level (raw, features, annotations)
    - Protocol metadata lives in workflow_steps JSONB on workflowExecutionActivity
      or in a plain VARCHAR protocol_url on analysisActivity (already there)

  Data flow:
    processedSample(DNA extract or metabolite extract)
      → analysisActivity(type='lcms_acquisition')
      → instrumentData(raw mzML pointer via s3_key)
      → workflowExecutionActivity(type='lcms_feature_extraction', parent=NULL)
          workflow_steps: {"tool":"MZmine3","version":"3.4","min_intensity":1e5}
      → processedData LCMSRawDataProduct
      → workflowExecutionActivity(type='lcms_annotation', parent=WEA_feat_id)
          workflow_steps: {"database":"GNPS","msi_level_cutoff":2,"ppm_tolerance":5}
      → processedData LCMSAnnotationProduct

imports:
  - linkml:types

classes:

  # ============================================================================
  # PRODUCT TABLES  (new tables, no schema changes to existing tables)
  # Each is a typed extension of processedData (linked via processedData.id FK).
  # summary_metrics JSONB on processedData carries the compact query-friendly view.
  # ============================================================================

  LCMSRawDataProduct:
    description: |-
      Summary record for a raw LC-MS acquisition file.
      Maps to NMDC DataObject (mzML / vendor raw format).
      1:1 with processedData — processedData.s3_key points to the raw file.
      processedData.summary_metrics carries:
        {"file_format":"mzML","scan_count":18432,"qc_status":"pass",
         "acquisition_duration_sec":900}
    attributes:
      id:
        identifier: true
        range: uuid        # FK → processedData.id
        required: true
      file_format:
        description: mzML, .raw, .d, etc.
        range: string
        required: true
      scan_count:
        range: integer
      acquisition_duration_sec:
        range: integer
      qc_status:
        description: pass / fail / marginal
        range: string
      polarity:
        description: positive / negative / switching
        range: string

  LCMSFeatureProduct:
    description: |-
      Output of feature detection (peak-picking) step.
      Maps to NMDC DataObject (feature table).
      Linked to workflowExecutionActivity(type='lcms_feature_extraction').
      processedData.summary_metrics:
        {"total_features":4821,"mz_range":"50-1200","rt_range_min":"0-15",
         "peak_picking_algorithm":"MZmine3"}
    attributes:
      id:
        identifier: true
        range: uuid        # FK → processedData.id
        required: true
      total_features:
        range: integer
      mz_range_min:
        range: float
      mz_range_max:
        range: float
      rt_range_min_start:
        range: float
      rt_range_min_end:
        range: float
      peak_picking_algorithm:
        description: MZmine3, XCMS, OpenMS, etc.
        range: string

  LCMSAnnotationProduct:
    description: |-
      Output of compound identification step.
      Maps to NMDC DataObject (annotation table).
      Linked to workflowExecutionActivity(type='lcms_annotation',
        parent_workflow_id=LCMSFeatureProduct's WEA).
      processedData.summary_metrics:
        {"total_annotations":312,"msi_level_2_pct":0.24,
         "databases_searched":["GNPS","HMDB"]}
    attributes:
      id:
        identifier: true
        range: uuid        # FK → processedData.id
        required: true
      total_annotations:
        range: integer
      databases_searched:
        description: Comma-separated list of databases used
        range: string
      msi_level_2_count:
        description: Annotations meeting MSI confidence level 2
        range: integer

  # ============================================================================
  # EXISTING SLOTS USED (no change)
  # Shown here to make the integration explicit.
  # ============================================================================
  # analysisActivity.type = 'lcms_acquisition'   (new enum value; extend routemethod)
  # analysisActivity.protocol_url               = LC-MS SOP URL (already exists)
  # analysisActivity.instrument_id              = EMSL QExactive etc.
  # analysisActivity.analyte_id                 = processedSample(type='metabolite_extract')
  #
  # workflowExecutionActivity.type              = 'lcms_feature_extraction' | 'lcms_annotation'
  # workflowExecutionActivity.parent_workflow_id = [ADDED in core-planB] links steps
  # workflowExecutionActivity.workflow_steps    = JSONB with tool + params (already exists)
  #
  # processedData.workflow_id                   → workflowExecutionActivity
  # processedData.summary_metrics               = [ADDED in core-planB] compact blob
  # processedData.type                          = new product enum values (extend product enum)

slots:

  # Protocol metadata handled entirely via workflow_steps JSONB —
  # shown here as documentation of expected JSON keys, not DB columns.

  lcms_workflow_steps_feature_extraction:
    description: |-
      [Documentation only — stored in workflowExecutionActivity.workflow_steps JSONB]
      Expected keys for lcms_feature_extraction step:
        tool: "MZmine3"
        version: "3.4.27"
        min_intensity: 1e5
        min_rt_sec: 5
        mass_tolerance_ppm: 10
        noise_level: 1e4
    range: string

  lcms_workflow_steps_annotation:
    description: |-
      [Documentation only — stored in workflowExecutionActivity.workflow_steps JSONB]
      Expected keys for lcms_annotation step:
        database: "GNPS"
        msi_level_cutoff: 2
        ppm_tolerance: 5
        rt_tolerance_sec: 10
        score_threshold: 0.7
        gnps_job_id: "abc123"
    range: string

id: https://w3id.org/MONet/analysis-api-schema/minimal-core
name: core-planB
title: Core planB Changes — Existing Schema Delta
description: |-
  Shows ONLY the additions/changes needed to the existing analysis-api schema
  to enable chained workflows, temporal series, activity scoping, and
  cached provenance traversal — WITHOUT a full Prov-O redesign.

  Each class below is either:
    (NEW ABSTRACT CLASS) — a new abstract base class (no direct table)
    (EXISTING + CHANGE)  — the table already exists; we are adding slots/columns
    (NEW CLASS)          — a genuinely new class/table
    (REMOVED)            — previously proposed but dropped from this approach

  CONVENTIONS:
    - Slots (not attributes) are used for all non-identifier fields,
      following the pattern established in methods.yaml and products.yaml.
    - UUID identifier fields remain as class-level attributes (identifier: true).
    - JSONB fields are replaced with a structured key-value approach;
      per-type schemas are TBD and will be designed before implementation.

  Existing fields are shown as stub comments for context only.
  Added or changed fields are marked [ADDED] or [CHANGED] in their descriptions.

  Companion data-type files (lcms, xrf-xrd, ecoplate, amp2) import this
  and only define their product tables and method-specific slots.

imports:
  - linkml:types

# =============================================================================
# GLOBAL SLOT DEFINITIONS
# All new and changed slots declared here for reuse across classes.
# Organised by primary use, with notes on cross-class reuse where applicable.
# =============================================================================

slots:

  # ---------------------------------------------------------------------------
  # dataProduct base slots
  # These fields exist today as attributes on processedData.
  # In the full MR they are promoted to global slots so that dataProduct and
  # any future subclass (e.g. sitePhoto) can reference them via is_a + slots.
  # NOTE: 'name' already appears as an inline attribute in several classes;
  # the full MR will need to reconcile those definitions.
  # ---------------------------------------------------------------------------
  name:
    description: Human-readable name for the data product
    range: string
    required: true

  proposal_id:
    description: 5-digit EMSL user proposal/project ID
    range: integer

  sampling_set:
    range: integer

  core_section:
    range: string

  sample_name:
    range: string

  s3_base_url:
    range: string

  s3_bucket:
    range: string

  s3_key:
    description: MinIO/S3 object key; required for all data products
    range: string
    required: true

  filesize:
    range: integer

  md5checksum:
    range: string

  # ---------------------------------------------------------------------------
  # Shared utility slots reused across multiple classes
  # These exist as inline attributes in the living schema; promoting them to
  # global slots in the full MR allows consistent reuse.
  # ---------------------------------------------------------------------------
  lims_barcode:
    description: LIMS barcode identifier; shared by samplingActivity and processedData
    range: string
    required: false

  version:
    description: Version string; shared by processedData, analysisActivity, workflowExecutionActivity
    range: string
    required: false

  # ---------------------------------------------------------------------------
  # workflowExecutionActivity additions
  # ---------------------------------------------------------------------------
  parent_workflow_id:
    description: |-
      [ADDED] Self-referential FK to the preceding workflowExecutionActivity.
      NULL  → first (or standalone) step.
      Non-null → this execution directly follows parent_workflow_id.
      Enables single-hop chaining queries; full traversal via linkage_cache.

      DDL: ALTER TABLE "workflowExecutionActivity"
             ADD COLUMN parent_workflow_id UUID
             REFERENCES "workflowExecutionActivity"(id);
    range: uuid
    required: false

  workflow_steps:
    description: |-
      [CHANGED] Per-run workflow parameters. Previously carried as a raw JSONB
      blob in the living schema (annotated TODO JSONB).
      Direction: structured key-value pairs keyed by workflow type.
      Schema for allowed keys is TBD — will be designed per workflow type
      before full implementation. Interim DB storage remains JSONB.
    range: string        # interim placeholder — will reference a typed key-value class; schema TBD
    required: false

  # ---------------------------------------------------------------------------
  # analysisActivity additions
  # ---------------------------------------------------------------------------
  # timepoint_label: PUT THIS ON NEEDED ACTIVITIES IN THE FULL MR (e.g. ecoplate, AMP2) RATHER THAN ALL ANALYSIS ACTIVITIES
  #   description: |-
  #     [ADDED] Human-readable timepoint label for repeated-measurement series.
  #     Examples: 't=0', 't=24h', 't=48h', 'pre-treatment', 'post-treatment'.
  #     Optional — omit for one-off single analyses.

  #     DDL: ALTER TABLE "analysisActivity"
  #            ADD COLUMN timepoint_label VARCHAR(64);
  #   range: string
  #   required: false

  sequence_order:
    description: |-
      [ADDED] Integer ordering within a temporal series for the same analyte.
      Use when acquisition_time alone is insufficient (e.g., same-day reads
      at different timepoints sharing a timestamp). Lower = earlier in series.

      DDL: ALTER TABLE "analysisActivity"
             ADD COLUMN sequence_order INTEGER;
    range: integer
    required: false

  # ---------------------------------------------------------------------------
  # processedData / dataProduct addition
  # ---------------------------------------------------------------------------
  summary_metrics:
    description: |-
      [ADDED] Lightweight per-product summary for common queries that avoid
      full file download. Previously proposed as a raw JSONB blob.
      Direction: structured key-value pairs; per-type schemas are TBD:
        ecoplate:  well-level absorbance summaries (position, timepoint, absorbance)
        xrf:       per-element concentration results + QC flag
        lcms:      feature count, identification count, MSI-2 fraction
      Schema will be designed per data type before full implementation.
      Interim DB storage: JSONB column retained until formal typed class exists.

      DDL: ALTER TABLE "processedData"
             ADD COLUMN summary_metrics JSONB;   ← interim; formal key-value schema TBD
    range: string        # interim placeholder — will reference a typed key-value class; schema TBD
    required: false

  # ---------------------------------------------------------------------------
  # samplingActivity addition — replaces the campaign FK / dimension-table approach
  # ---------------------------------------------------------------------------
  emsl_activity:
    description: |-
      [ADDED] Nullable string linking a samplingActivity to a named EMSL
      activity or campaign (e.g., 'AMP2', 'MONet_FY26').
      Replaces the previously proposed campaign dimension-table FK approach.
      Managed as a plain validated string to avoid enum-lock and FK constraint
      complexity; consistent with how proposal_id is handled today.
      Optionally validated at the application layer against the existing
      campaign.yaml dimension table for UI dropdown support.

      DDL: ALTER TABLE "samplingActivity"
             ADD COLUMN emsl_activity VARCHAR(128);
    range: string
    required: false

  # ---------------------------------------------------------------------------
  # linkage_cache slots
  # Specific to linkage_cache but declared here per the slots convention.
  # In the full schema MR, consider whether ancestor_type / descendant_type
  # should be shared with other audit or provenance tables.
  # ---------------------------------------------------------------------------
  ancestor_type:
    description: |-
      Class/table name of the ancestor node.
      Expected values: 'sample' | 'processedSample' |
                       'workflowExecutionActivity' | 'processedData'
    range: string

  descendant_type:
    description: Class/table name of the descendant node (same vocabulary as ancestor_type)
    range: string

  depth:
    description: Number of hops between ancestor and descendant (1 = direct parent)
    range: integer
    required: true

  path:
    description: Optional debug string representing the full chain (e.g., 'WEA1→WEA2→WEA3')
    range: string

  computed_at:
    description: Timestamp when this linkage_cache row was last computed by the refresh job
    range: datetime


classes:

  # ============================================================================
  # (NEW ABSTRACT CLASS) dataProduct
  # ============================================================================
  # Abstract base for any data artifact accessible in S3 storage.
  # processedData inherits via is_a: dataProduct.
  # Future sitePhoto (and other file-based products) will also inherit here.
  # Follows the is_a + slots pattern used in products.yaml.
  #
  # In the full MR this class is added to analysis_api_schema.yaml as part of
  # the same change that refactors processedData to use is_a.
  # ============================================================================

  dataProduct:
    abstract: true
    description: |-
      [NEW ABSTRACT CLASS] Base class for raw or processed data accessible
      in S3 storage. Carries all S3-pointer and sample-linkage slots shared
      across product types. processedData and future sitePhoto extend this
      via is_a. No direct database table; subclasses map to tables.
    slots:
      - name            # required; reconcile with existing inline attribute definitions
      - proposal_id
      - sampling_set
      - core_section
      - sample_name
      - s3_base_url
      - s3_bucket
      - s3_key          # required
      - filesize
      - md5checksum
    attributes:
      id:
        identifier: true
        range: uuid
        required: true


  # ============================================================================
  # (EXISTING + CHANGE) workflowExecutionActivity  [NOW ABSTRACT]
  # ============================================================================
  # Adds self-referential parent_workflow_id slot for workflow chaining.
  # workflow_steps moved from inline JSONB comment to defined slot (key-value,
  # schema TBD).
  # Now marked abstract: true per PI guidance — high-level activity classes
  # should be abstract. Concrete per-workflow-type subclasses (e.g.
  # MetagenomicsWorkflow, AMP2FlowCytometryWorkflow) use is_a to inherit.
  # NOTE: Will be renamed DataProcessingActivity in the full Prov-O refactor;
  # keeping current name here to avoid breaking changes.
  # ============================================================================

  workflowExecutionActivity:
    abstract: true
    description: |-
      Computational workflow run. Produces processedData records.
      EXISTING class; now ABSTRACT. Slot additions for chaining and structured
      parameters. Concrete per-type subclasses use is_a: workflowExecutionActivity.
      NOTE: Will be renamed DataProcessingActivity in the full Prov-O refactor.
    slots:
      - parent_workflow_id   # [ADDED] self-referential chain link
      - workflow_steps       # [CHANGED] key-value, schema TBD (was inline JSONB comment)
      - version              # [PROMOTED] existing attribute → global slot
    # --- existing fields (context only — defined in analysis_api_schema.yaml) ---
    # id (uuid, identifier), raw_data_id → instrumentData,
    # type (string, required; e.g. 'metagenomics_assembly', 'amp2_flow_cytometry'),
    # git_url (string, required), started_at_time (datetime, required),
    # ended_at_time (datetime), name (string), description (string),
    # used_id → softwareControlledTermValue, execution_resource (executionresourcetype)


  # ============================================================================
  # (EXISTING + CHANGE) analysisActivity  [NOW ABSTRACT]
  # ============================================================================
  # Adds sequence_order slot for temporal ordering within a series.
  # timepoint_label dropped from this base class — will be added on concrete
  # per-project subclasses (e.g. EcoplateAnalysisActivity, AMP2AnalysisActivity)
  # that actually need it, rather than on all analysis activities.
  # Now marked abstract: true per PI guidance — high-level activity classes
  # should be abstract. Concrete per-method-type subclasses use is_a to inherit.
  # NOTE: Will be renamed DataGenerationActivity in the full Prov-O refactor.
  # ============================================================================

  analysisActivity:
    abstract: true
    description: |-
      Acquisition event linking an instrument run to a processedSample.
      EXISTING class; now ABSTRACT. Concrete per-method-type subclasses
      (e.g. EcoplateAnalysisActivity, AMP2AnalysisActivity) use
      is_a: analysisActivity and add method-specific slots (including
      timepoint_label where needed).
      NOTE: dropped timepoint_label from base class — lives on concrete subclasses.
      NOTE: Will be renamed DataGenerationActivity in the full Prov-O refactor.
    slots:
      - sequence_order       # [ADDED] integer ordering within series
      - version              # [PROMOTED] existing attribute → global slot
    # --- existing fields (context only — defined in analysis_api_schema.yaml) ---
    # id (uuid, identifier), type → routemethod, analyte_id → processedSample,
    # name, acquisition_time (datetime, required), instrument_id → instrument,
    # protocol_url, instrument_operator_id → personValue


  # ============================================================================
  # (EXISTING + CHANGE) processedData
  # ============================================================================
  # Now inherits S3/file fields from dataProduct via is_a.
  # Adds summary_metrics (structured key-value, schema TBD).
  # REMOVED: campaign_id FK — activity scoping now via samplingActivity.emsl_activity.
  # ============================================================================

  processedData:
    is_a: dataProduct
    description: |-
      A data product generated by a workflow execution.
      EXISTING class; now inherits S3/file slots from dataProduct (is_a).
      CHANGE: campaign_id slot dropped (replaced by samplingActivity.emsl_activity).
      CHANGE: summary_metrics slot added (structured key-value, schema TBD).
    slots:
      - summary_metrics      # [ADDED] key-value product summary, per-type schema TBD
      - lims_barcode         # [PROMOTED] existing attribute → global slot
      - version              # [PROMOTED] existing attribute → global slot
    attributes:
      # id inherited from dataProduct
      type:
        # NOTE: 'type' stays as an attribute because it has a class-specific range
        # (product enum here; routemethod in analysisActivity). Cannot be a single
        # global slot without range polymorphism support.
        range: product
        required: true
      workflow_id:
        range: workflowExecutionActivity
    # NOTE: campaign_id slot REMOVED from processedData.
    # Activity/campaign scoping is now handled via samplingActivity.emsl_activity.
    # NOTE: name, proposal_id, sampling_set, core_section, sample_name, s3_base_url,
    # s3_bucket, s3_key, filesize, md5checksum all inherited from dataProduct.


  # ============================================================================
  # (EXISTING + CHANGE) samplingActivity  [NOW ABSTRACT]
  # ============================================================================
  # Adds emsl_activity nullable slot to replace the campaign FK approach.
  # Now marked abstract: true per PI guidance — high-level activity classes
  # should be abstract. Concrete subclasses (e.g. soil, aerosol; see metadata.yaml
  # where soil is_a samplingActivity) use is_a to inherit.
  # Only the added slot is shown; all existing attributes are unchanged.
  # See metadata.yaml for the full existing field list.
  # ============================================================================

  samplingActivity:
    abstract: true
    description: |-
      Sampling event. EXISTING class; now ABSTRACT. Concrete subclasses
      (e.g. soil, aerosol in metadata.yaml) use is_a: samplingActivity.
      One nullable slot added for activity scoping.
    slots:
      - emsl_activity        # [ADDED] replaces planned campaign FK
    # --- existing fields (context only — defined in metadata.yaml) ---
    # id (uuid, identifier), study_id → study, type → samplingactivitytype,
    # sample_name (required), lims_barcode, alt_id, elev_id, lat_lon_id,
    # collection_date, collection_time, ph, salinity, … (see metadata.yaml)


  # ============================================================================
  # (EXISTING) sample
  # ============================================================================
  # CHANGE vs. v1 of this delta: campaign_id slot is DROPPED.
  # Activity scoping moves upstream to samplingActivity.emsl_activity, which is
  # a cleaner attachment point (samples are collected within an activity).
  # No other changes to sample; full definition in analysis_api_schema.yaml.
  # ============================================================================

  sample:
    description: |-
      Physical sample. EXISTING class; no slot additions in this revision.
      CHANGE vs. v1 delta: campaign_id slot previously proposed here is DROPPED.
      All other attributes unchanged — see analysis_api_schema.yaml.
    # No slot additions.


  # ============================================================================
  # (EXISTING + CHANGE) sampleProcessing  [NOW ABSTRACT]
  # ============================================================================
  # No slot additions in this delta. Marked abstract: true per PI guidance.
  # Concrete subclasses (one per processing protocol) use is_a: sampleProcessing
  # and carry protocol-specific slots.
  # Full existing definition in analysis_api_schema.yaml.
  # ============================================================================

  sampleProcessing:
    abstract: true
    description: |-
      Sample processing protocol record. EXISTING class; now ABSTRACT.
      Concrete protocol-specific subclasses use is_a: sampleProcessing.
      No slot additions in this delta — see analysis_api_schema.yaml for
      existing fields (analysis_type, method_name, processing_steps, url, version).
    # No slot additions in this delta.


  # ============================================================================
  # (REMOVED) campaign dimension table with FK constraints
  # ============================================================================
  # The standalone campaign class with FK relationships (campaign_id on
  # processedData and sample) is NOT being implemented in this shoehorn plan.
  #
  # Rationale: a nullable emsl_activity string on samplingActivity is simpler,
  # avoids new FK constraints, and is consistent with how proposal_id is handled.
  #
  # The existing campaign.yaml dimension table remains available as a UI
  # reference / dropdown source, but carries no FK constraints in this approach.
  #
  # campaign: REMOVED FROM DELTA — replaced by samplingActivity.emsl_activity
  # ============================================================================


  # ============================================================================
  # (NEW CLASS) linkage_cache
  # ============================================================================
  # Closure table pre-computing all ancestor/descendant pairs in the workflow
  # chain. Avoids live recursive CTE traversal at query time.
  #
  # Population: nightly refresh job using recursive CTE across:
  #   - processingSampleLink (sample → processed sample chains)
  #   - workflowExecutionActivity.parent_workflow_id (workflow chains)
  #   - analysisActivity (processed sample → workflow link)
  #   - processedData.workflow_id (workflow → product link)
  #
  # Primary queries enabled:
  #   "All products from sample X"  → WHERE ancestor_id = X
  #   "Original sample for product Y" → WHERE descendant_id = Y AND ancestor_type = 'sample'
  # ============================================================================

  linkage_cache:
    description: |-
      [NEW CLASS] Pre-computed provenance closure table.
      Stores every (ancestor, descendant) pair across all chain types with depth.
      Refreshed on a schedule; not real-time (acceptable for daily batch cadence).

      DDL:
        CREATE TABLE linkage_cache (
          ancestor_id      UUID NOT NULL,
          descendant_id    UUID NOT NULL,
          ancestor_type    VARCHAR(64),    -- 'sample' | 'processedSample' |
                                          --  'workflowExecutionActivity' | 'processedData'
          descendant_type  VARCHAR(64),
          depth            INTEGER NOT NULL,  -- 1 = direct parent
          path             TEXT,           -- optional: debug chain string
          computed_at      TIMESTAMP DEFAULT now(),
          PRIMARY KEY (ancestor_id, descendant_id)
        );
        CREATE INDEX ON linkage_cache (descendant_id);  -- reverse lookup

      Example query — all products from sample S1:
        SELECT pd.*
        FROM linkage_cache lc
        JOIN "processedData" pd ON pd.id = lc.descendant_id
        WHERE lc.ancestor_id = 'S1-uuid'
          AND lc.descendant_type = 'processedData';
    slots:
      - ancestor_type    # class/table name of ancestor node
      - descendant_type  # class/table name of descendant node
      - depth            # required; 1 = direct parent
      - path             # optional debug chain string
      - computed_at      # refresh timestamp
    attributes:
      ancestor_id:
        range: uuid
        required: true
      descendant_id:
        range: uuid
        required: true
    # NOTE: ancestor_id + descendant_id form a composite primary key in the DDL.
    # LinkML does not natively express composite PKs; use unique_keys if needed
    # in the full schema MR.

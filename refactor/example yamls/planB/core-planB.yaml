id: https://w3id.org/MONet/analysis-api-schema/shoehorn-core
name: core-shoehorn
title: Core Shoehorn Changes — Existing Schema Delta
description: |-
  Shows ONLY the additions/changes needed to the existing analysis-api schema
  to enable chained workflows, temporal series, campaign membership, and
  cached provenance traversal — WITHOUT a full Prov-O redesign.

  Each class below is either:
    (EXISTING + CHANGE) — the table already exists; we are adding columns
    (NEW TABLE)         — a genuinely new table

  Existing fields are shown as stubs (commented) for context only.
  Added or changed fields are marked [ADDED] or [CHANGED] in their comments.

  Companion data-type files (lcms, xrf-xrd, ecoplate, amp2) import this
  and only define their product tables and method-specific slots.

imports:
  - linkml:types

classes:

  # ============================================================================
  # (EXISTING + CHANGE) workflowExecutionActivity
  # ============================================================================
  # The single most important structural change. The existing table handles
  # computational workflows (metagenomics assembly, annotation, etc.) and
  # already carries workflow_steps JSONB for flexible per-run metadata.
  #
  # Missing: a way to chain executions. One FK enables recursive CTE traversal.
  # ============================================================================

  workflowExecutionActivity:
    description: |-
      Computational workflow run. Produces processedData records.
      EXISTING table; two columns added to enable chaining.
      NOTE WE WILL RENAME THIS TO DATAPROCESSINGACTIVITY IN THE FULL REFACTOR, BUT KEEPING NAME FOR NOW TO AVOID BREAKING CHANGES.

    attributes:

      # --- existing fields (context only) ---
      id:
        identifier: true
        range: uuid
        required: true
      raw_data_id:
        description: Input instrumentData record
        range: uuid        # FK → instrumentData
      type:
        range: string      # e.g. 'metagenomics_assembly', 'amp2_flow_cytometry'
      git_url:
        range: string
      started_at_time:
        range: datetime
      ended_at_time:
        range: datetime
      workflow_steps:
        description: |-
          JSONB blob for per-run parameters. Already in schema.
          Used as EAV-substitute — no separate attribute table needed.
        range: string      # stored as JSONB

      # --- [ADDED] self-referential chain link ---
      parent_workflow_id:
        description: |-
          [ADDED] FK to the preceding workflowExecutionActivity in a chain.
          NULL  → first (or standalone) step.
          Non-null → this execution directly follows parent_workflow_id.

          Enables single-hop chaining queries. For full ancestor/descendant
          traversal use the linkage_cache table (see below).

          DDL: ALTER TABLE "workflowExecutionActivity"
                 ADD COLUMN parent_workflow_id UUID
                 REFERENCES "workflowExecutionActivity"(id);
        range: uuid        # FK → workflowExecutionActivity.id (self)
        required: false



  # ============================================================================
  # (EXISTING + CHANGE) analysisActivity
  # ============================================================================
  # Links a processedSample (analyte) to an acquisition event.
  # Already supports multiple rows per processedSample (repeated measurements).
  # Adds two nullable columns for explicit temporal ordering — useful for
  # ecoplates (t=0, t=24h, t=48h) and AMP2 grow-curve timepoints.
  # ============================================================================

  analysisActivity:
    description: |-
      Acquisition event linking an instrument run to a processedSample.
      EXISTING table; two nullable columns added for temporal series.
      NOTE WE WILL RENAME THIS TO DATAGENERATIONACTIVITY IN THE FULL REFACTOR, BUT KEEPING NAME FOR NOW TO AVOID BREAKING CHANGES.
    attributes:

      # --- existing fields (context only) ---
      id:
        identifier: true
        range: uuid
      type:
        range: string      # routemethod enum; extend with new method types
      analyte_id:
        range: uuid        # FK → processedSample
      name:
        range: string
      acquisition_time:
        range: datetime
        required: true
      instrument_id:
        range: uuid        # FK → instrument
      protocol_url:
        range: string
      version:
        range: string

      # --- [ADDED] temporal series metadata ---
      timepoint_label:
        description: |-
          [ADDED] Human-readable timepoint label for repeated-measurement series.
          Examples: 't=0', 't=24h', 't=48h', 'pre-treatment', 'post-treatment'.
          Optional — omit for one-off analyses.

          DDL: ALTER TABLE "analysisActivity"
                 ADD COLUMN timepoint_label VARCHAR(64);
        range: string
        required: false

      sequence_order:
        description: |-
          [ADDED] Integer ordering within a temporal series for the same analyte.
          Use when acquisition_time alone is insufficient (e.g., same-day reads
          at different timepoints that share a timestamp).
          Lower = earlier in series.

          DDL: ALTER TABLE "analysisActivity"
                 ADD COLUMN sequence_order INTEGER;
        range: integer
        required: false


  # ============================================================================
  # (EXISTING + CHANGE) processedData
  # ============================================================================
  # Terminal data product node. Already has s3_key (MinIO pointer) and
  # workflow_id (FK → workflowExecutionActivity).
  # Adds: campaign_id FK and a summary_metrics JSONB for compact queryable
  # summaries without requiring full file download.
  # ============================================================================

  processedData:
    description: |-
      A data product generated by a workflow execution.
      EXISTING table; two columns added.
    attributes:

      # --- existing fields (context only) ---
      id:
        identifier: true
        range: uuid
      type:
        range: string      # product enum; extend with new product types
      name:
        range: string
      s3_key:
        range: string
        required: true
      s3_bucket:
        range: string
      workflow_id:
        range: uuid        # FK → workflowExecutionActivity
      proposal_id:
        range: string
      sample_name:
        range: string

      # --- [ADDED] campaign membership ---
      campaign_id:
        description: |-
          [ADDED] FK to campaign dimension table.
          Optional — MONet core data is not campaign-scoped; AMP2 and
          campaign-specific protocols use this to scope products to a campaign.

          DDL: ALTER TABLE "processedData"
                 ADD COLUMN campaign_id UUID REFERENCES campaign(id);
        range: uuid        # FK → campaign.id
        required: false

      # --- [ADDED] compact queryable summary ---
      summary_metrics:
        description: |-
          [ADDED] JSONB blob for lightweight per-product summaries that avoid
          file download for common queries.

          Examples by data type:
            ecoplate:  {"well_summaries": [{"pos":"A01","t24_abs":0.45}, ...]}
            xrf:       {"Ni_mg_kg":45.3, "Pb_mg_kg":8.2, "qc":"OK"}
            lcms:      {"total_features":4821, "identified":312, "msi2_pct":0.24}

          DDL: ALTER TABLE "processedData"
                 ADD COLUMN summary_metrics JSONB;
        range: string      # stored as JSONB
        required: false


  # ============================================================================
  # (EXISTING + CHANGE) sample
  # ============================================================================
  # Only one column added: campaign_id.
  # Everything else about the sample hierarchy (sampleBase, processedSample,
  # processingSampleLink) remains unchanged.
  # ============================================================================

  sample:
    description: |-
      Physical sample collected from the environment.
      EXISTING table; one column added.
    attributes:

      # --- existing fields (context only) ---
      id:
        identifier: true
        range: uuid
      sampling_activity_id:
        range: uuid        # FK → samplingActivity
      type:
        range: string      # sampletype enum

      # --- [ADDED] campaign membership ---
      campaign_id:
        description: |-
          [ADDED] FK to campaign dimension table.
          Links a collected sample to the campaign it was gathered under.
          Optional for samples predating campaign tracking.

          DDL: ALTER TABLE sample
                 ADD COLUMN campaign_id UUID REFERENCES campaign(id);
        range: uuid        # FK → campaign.id
        required: false


  # ============================================================================
  # (NEW TABLE) campaign
  # ============================================================================
  # Dimension table for named research campaigns.
  # Avoids hard-coding campaign values as enums (which require code deploys).
  # Already planned in Nov 2025 extension planning.
  # ============================================================================

  campaign:
    description: |-
      [NEW TABLE] Named research campaign dimension.
      Campaigns group samples and products collected under a shared programme.
      Managed as data (not enum) so new campaigns don't require schema changes.

      DDL:
        CREATE TABLE campaign (
          id           UUID PRIMARY KEY DEFAULT gen_random_uuid(),
          name         VARCHAR(128) NOT NULL,
          display_name VARCHAR(256),
          year         INTEGER,
          description  TEXT,
          start_date   DATE,
          end_date     DATE,
          status       VARCHAR(32) DEFAULT 'active'
        );
    attributes:
      id:
        identifier: true
        range: uuid
        required: true
      name:
        description: Short machine-readable key (e.g., 'amp2', 'monet_2024')
        range: string
        required: true
      display_name:
        description: Human-readable label for UI display
        range: string
      year:
        range: integer
      description:
        range: string
      start_date:
        range: date
      end_date:
        range: date
      status:
        description: One of planned / active / completed
        range: string


  # ============================================================================
  # (NEW TABLE) linkage_cache
  # ============================================================================
  # Closure table that pre-computes all ancestor/descendant pairs in the
  # workflow chain. Avoids live recursive CTE traversal at query time.
  #
  # Population: nightly refresh job using recursive CTE on:
  #   - processingSampleLink (sample → processed sample chains)
  #   - workflowExecutionActivity.parent_workflow_id (workflow chains)
  #   - analysisActivity (processed sample → workflow link)
  #   - processedData.workflow_id (workflow → product link)
  #
  # Primary queries enabled:
  #   "All products from sample X"  → WHERE ancestor_id = X
  #   "Original sample for product Y" → WHERE descendant_id = Y AND ancestor_type = 'sample'
  # ============================================================================

  linkage_cache:
    description: |-
      [NEW TABLE] Pre-computed provenance closure table.
      Stores every (ancestor, descendant) pair across all chain types with depth.
      Refreshed on a schedule; not updated in real-time (acceptable for daily batches).

      DDL:
        CREATE TABLE linkage_cache (
          ancestor_id      UUID NOT NULL,
          descendant_id    UUID NOT NULL,
          ancestor_type    VARCHAR(64),    -- 'sample' | 'processedSample' |
                                          --  'workflowExecutionActivity' | 'processedData'
          descendant_type  VARCHAR(64),
          depth            INTEGER NOT NULL,  -- 1 = direct parent
          path             TEXT,           -- optional: debug chain string
          computed_at      TIMESTAMP DEFAULT now(),
          PRIMARY KEY (ancestor_id, descendant_id)
        );
        CREATE INDEX ON linkage_cache (descendant_id);  -- reverse lookup

      Example query — all products from sample S1:
        SELECT pd.*
        FROM linkage_cache pc
        JOIN "processedData" pd ON pd.id = pc.descendant_id
        WHERE pc.ancestor_id = 'S1-uuid'
          AND pc.descendant_type = 'processedData';
    attributes:
      ancestor_id:
        range: uuid
        required: true
      descendant_id:
        range: uuid
        required: true
      ancestor_type:
        description: Table/class name of the ancestor node
        range: string
      descendant_type:
        description: Table/class name of the descendant node
        range: string
      depth:
        description: Number of hops between ancestor and descendant (1 = direct parent)
        range: integer
        required: true
      path:
        description: Optional debug string showing the chain (e.g., 'WEA1→WEA2→WEA3')
        range: string
      computed_at:
        range: datetime

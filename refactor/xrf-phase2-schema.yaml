---
# XRF Integration Example - Phase 2 Architecture
# Demonstrates how XRF elemental analysis fits into the unified Entity-Activity-PROV-O model
# This is a minimal extract showing only XRF-relevant tables

id: https://w3id.org/MONet/xrf-phase2-example
name: xrf-phase2-example
description: |-
  Minimal Phase 2 schema showing XRF elemental analysis integration.
  Demonstrates Entity-Activity-PROV-O provenance with typed product tables
  and activity subtypes for experimental settings.

prefixes:
  xrf_example: https://w3id.org/MONet/xrf-phase2-example/
  linkml: https://w3id.org/linkml/

default_prefix: xrf_example
default_range: string

imports:
  - linkml:types

classes:

  # ============================================================================
  # PHASE 2 CORE TABLES (Universal Semantic Layer)
  # ============================================================================

  Entity:
    description: |-
      Universal semantic layer - all "things" get an entity_id.
      Samples, products, wells, protocols are all entities.
    attributes:
      entity_id:
        identifier: true
        range: uuid
        required: true

  Activity:
    description: |-
      Unified base for all timestamped actions (sampling, processing, analysis).
      Replaces legacy samplingActivity, analysisActivity, etc.
    attributes:
      activity_id:
        identifier: true
        range: uuid
        required: true
      activity_type:
        description: The type of activity (e.g., 'xrf_analysis', 'sampling', 'ecoplating')
        range: string
        required: true
      started_at:
        range: datetime
        required: true
      ended_at:
        range: datetime
      protocol_url:
        description: Optional direct URL to protocol/SOP
        range: string

  # ============================================================================
  # PROV-O RELATIONSHIPS (M:N)
  # ============================================================================

  Used:
    description: |-
      M:N relationship tracking which entities an activity consumed as inputs.
      Points FROM entity TO activity (this activity used these entities).
    attributes:
      entity_id:
        identifier: true
        range: uuid
        required: true
      activity_id:
        identifier: true
        range: uuid
        required: true

  WasGeneratedBy:
    description: |-
      M:N relationship tracking which entities an activity produced as outputs.
      Points FROM entity TO activity (this entity was generated by this activity).
    attributes:
      entity_id:
        identifier: true
        range: uuid
        required: true
      activity_id:
        identifier: true
        range: uuid
        required: true

  # ============================================================================
  # EAV PATTERN (Flexible Metadata)
  # ============================================================================

  Attribute:
    description: |-
      Dictionary of attribute keys for the EAV pattern.
      Examples: 'nickel_concentration_percent', 'instrument_serial_number', 'analyst_notes'
    attributes:
      attribute_id:
        identifier: true
        range: uuid
        required: true
      key:
        description: The attribute name/key
        range: string
        required: true

  TypedAttributeValue:
    description: |-
      EAV storage for flexible, evolving metadata.
      Values stored as strings; application handles type conversion.
    attributes:
      entity_id:
        identifier: true
        range: uuid
        required: true
      attribute_id:
        identifier: true
        range: uuid
        required: true
      value:
        description: String-encoded value (application handles typing)
        range: string
        required: true

  # ============================================================================
  # XRF-SPECIFIC TABLES
  # ============================================================================

  Sample:
    description: |-
      Physical sample collected from environment.
      1:1 with Entity via entity_id foreign key.
    attributes:
      entity_id:
        identifier: true
        range: uuid
        required: true
      sample_name:
        description: Human readable name (e.g., "60881_1_TOP_1")
        range: string
        required: true
      proposal_id:
        description: 5-digit EMSL project ID
        range: integer
      sampling_set:
        description: Batch identifier if part of a sample set
        range: string
      core_section:
        description: Section of core (TOP, MID, BTM)
        range: string

  XRFAnalysisActivity:
    description: |-
      Activity subtype for XRF elemental analysis.
      Stores typed experimental settings IF necessary (otherwise siimply provide URL in EAV).
      1:1 with Activity via activity_id foreign key.
    attributes:
      activity_id:
        identifier: true
        range: uuid
        required: true
      instrument_id:
        description: Reference to instrument used
        range: uuid
      instrument_name:
        description: Human-readable instrument identifier
        range: string
      beam_voltage_kv:
        description: X-ray beam voltage in kilovolts
        range: float
      measurement_duration_sec:
        description: Measurement duration in seconds
        range: integer
      matrix_correction_method:
        description: Method used for matrix effect correction
        range: string
        examples:
          - value: "fundamental_parameters"
          - value: "empirical_calibration"
      operator_id:
        description: Person who ran the analysis
        range: uuid

  XRFElementalProduct:
    description: |-
      Product table for XRF elemental analysis results.
      Each row represents one element's measurement from one sample.
      1:1 with Entity via entity_id foreign key.
      
      Example data flow:
      Sample (Soil_001) --[Used]--> XRF Activity --[WasGeneratedBy]--> 
        27 XRFElementalProduct entities (one per element: Cl, V, Cr, Ni, Cu, Zn, ...)
    attributes:
      entity_id:
        identifier: true
        range: uuid
        required: true
      element_symbol:
        description: Chemical element symbol (Cl, V, Cr, Ni, Cu, Zn, etc.)
        range: string
        required: true
        examples:
          - value: "Ni"
          - value: "Pb"
          - value: "As"
      concentration_mg_per_kg:
        description: Elemental concentration in mg/kg (ppm)
        range: float
        required: true
        examples:
          - value: 45.3
          - value: 120.7
          - value: 8.2
      qc_flag:
        description: Quality control flag for this measurement
        range: string
        examples:
          - value: "OK"
          - value: "BELOW_DETECTION_LIMIT"
          - value: "HIGH_UNCERTAINTY"
          - value: "MATRIX_INTERFERENCE"
      detection_limit_mg_per_kg:
        description: Method detection limit for this element
        range: float

  ActivityProtocol:
    description: |-
      Explicit storage for reusable procedure definitions (SOPs, workflows).
      Protocols are entities themselves (can have metadata via EAV).
      
      For XRF: Can store vendor protocol URL or detailed SOP.
    attributes:
      entity_id:
        identifier: true
        range: uuid
        required: true
      protocol_name:
        description: Human-readable protocol name
        range: string
        required: true
        examples:
          - value: "EMSL XRF Standard Operating Procedure v2.1"
      protocol_version:
        description: Version identifier
        range: string
        examples:
          - value: "2.1"
          - value: "2024-03-15"
      protocol_url:
        description: URL to external protocol documentation
        range: string
        examples:
          - value: "https://vendor.com/xrf-protocol-v2.1"
      protocol_type:
        description: Type of protocol
        range: string
        examples:
          - value: "vendor_standard"
          - value: "custom_sop"
          - value: "emsl_method"
      description:
        description: Brief description of the protocol
        range: string

# ============================================================================
# EXAMPLE USAGE SCENARIO
# ============================================================================
# 
# 1. SAMPLE ENTRY:
#    Entity (entity_id: e1) → Sample (entity_id: e1, sample_name: "60881_1_TOP_1")
#
# 2. PROTOCOL DEFINITION:
#    Entity (entity_id: e_protocol) → ActivityProtocol (
#      entity_id: e_protocol,
#      protocol_name: "EMSL XRF SOP v2.1",
#      protocol_url: "https://vendor.com/xrf-protocol"
#    )
#
# 3. XRF ANALYSIS:
#    Activity (activity_id: a1, activity_type: "xrf_analysis", started_at: "2026-01-20 14:30:00")
#    → XRFAnalysisActivity (activity_id: a1, instrument_name: "XRF-001", beam_voltage_kv: 50)
#
#    Link protocol via EAV:
#    TypedAttributeValue (entity_id: a1, attribute: "protocol_id", value: "e_protocol")
#
# 4. PROVENANCE (Input):
#    Used (entity_id: e1, activity_id: a1)  # Sample e1 was used by activity a1
#
# 5. PRODUCTS (27 elements measured):
#    For each element (Cl, V, Cr, Ni, Cu, Zn, Ga, As, Se, Br, Rb, Sr, Y, Nb, Mo, Ag, Cd, In, Sn, Sb, Cs, Ba, La, Ce, Pb, Th, U):
#      Entity (entity_id: e_Ni) → XRFElementalProduct (
#        entity_id: e_Ni,
#        element_symbol: "Ni",
#        concentration_mg_per_kg: 45.3,
#        qc_flag: "OK"
#      )
#      WasGeneratedBy (entity_id: e_Ni, activity_id: a1)
#
# 6. QUERY: "Find all Ni concentrations for samples from proposal 60881"
#    SELECT xrf.concentration_mg_per_kg, s.sample_name
#    FROM XRFElementalProduct xrf
#    JOIN WasGeneratedBy wgb ON xrf.entity_id = wgb.entity_id
#    JOIN Used u ON wgb.activity_id = u.activity_id
#    JOIN Sample s ON u.entity_id = s.entity_id
#    WHERE xrf.element_symbol = 'Ni' AND s.proposal_id = 60881
#
# 7. QUERY: "Trace provenance from product back to sample"
#    Product (e_Ni) --[WasGeneratedBy]--> Activity (a1) --[Used]--> Sample (e1)
#
# ============================================================================

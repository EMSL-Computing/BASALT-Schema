# Example of a AMP2 process and samples. This is not a full example.
proposal_set:
  - entity_id: uuid:00000
    name: My Best Proposal
    description: The best proposal ever for doing the best science.
    type: Proposal
    title: My Best Proposal

media_set:
  - entity_id: uuid:1
    name: my best of the best strain purity media
    description: the media used in my strain purity check
    type: Media
    media_type: strain_purity
    volume_ml: 5000
    media_recipe: M9 media with 1% Glucose
    media_formulation: manual mix
    ph_adjustment: false
    storage_temperature: 4 C
     exposure_sensitivity: light sensitive
  - entity_id: uuid:2
    name: my best of the best stock culture media
    description: the media used in my stock culture preparation
    type: Media
    media_type: stock_culture
    volume_ml: 1000
    media_recipe: rich media with 10% LB and 90% glycerol
    media_formulation: manual mix
    ph_adjustment: false
    exposure_sensitivity: light sensitive
    storage_temperature: 20 C
  - entity_id: uuid:13
    name: my best of the best pre-culture media
    description: the media used in my pre-culture growth before experimental culture
    type: Media
    media_type: pre_culture
    volume_ml: 500
    media_recipe: M9 media with 1% Glucose
    media_formulation: manual mix
    ph_adjustment: true
    ph_target: 7.0
  - entity_id: uuid:14
    name: my best of the best rich media for experimental culture
    description: the media used in my experimental culture growth
    type: Media
    media_type: rich_media 
    volume_ml: 500
    media_recipe: rich media with 10% LB and 90% glycerol
    media_formulation: manual mix
    sterilization_method: autoclave
    ph_adjustment: false

